read: [
{ id:"es-r1", cat:"env", lvl:"B1", src:"สิ่งแวดล้อม", title:["El agua que no vemos","The water we don't see","น้ำที่เรามองไม่เห็น"],
  p:[[["Cuando pensamos en ahorrar agua, normalmente imaginamos duchas más cortas o grifos cerrados.","When we think about saving water, we usually imagine shorter showers or turned-off taps.","เมื่อคิดถึงการประหยัดน้ำ เรามักนึกถึงการอาบน้ำให้สั้นลงหรือการปิดก๊อก"],
      ["Sin embargo, la mayor parte del agua que consumimos es invisible.","However, most of the water we consume is invisible.","อย่างไรก็ตาม น้ำส่วนใหญ่ที่เราใช้นั้นมองไม่เห็น"],
      ["Se llama «agua virtual» y es la que se necesita para producir lo que comemos, vestimos y compramos.","It's called 'virtual water' and it's what is needed to produce what we eat, wear and buy.","เรียกว่า “น้ำเสมือน” คือน้ำที่ใช้ในการผลิตสิ่งที่เรากิน สวมใส่ และซื้อ"]],
     [["Por ejemplo, para fabricar una camiseta de algodón hacen falta unos dos mil quinientos litros.","For example, to make a cotton T-shirt, about two thousand five hundred litres are needed.","ตัวอย่างเช่น การผลิตเสื้อยืดผ้าฝ้ายหนึ่งตัวต้องใช้น้ำราวสองพันห้าร้อยลิตร"],
      ["Un kilo de carne de vaca puede necesitar más de quince mil, sobre todo por el agua que consume el pienso de los animales.","A kilo of beef can require more than fifteen thousand, mainly because of the water consumed by the animals' feed.","เนื้อวัวหนึ่งกิโลกรัมอาจต้องใช้มากกว่าหนึ่งหมื่นห้าพันลิตร ส่วนใหญ่เป็นน้ำที่ใช้ปลูกอาหารสัตว์"],
      ["En comparación, una ducha de cinco minutos gasta unos sesenta litros.","In comparison, a five-minute shower uses about sixty litres.","เมื่อเปรียบเทียบ การอาบน้ำห้านาทีใช้น้ำประมาณหกสิบลิตร"]],
     [["Esto no significa que cerrar el grifo sea inútil, pero sí que nuestras decisiones de compra tienen un impacto mucho mayor.","This doesn't mean that turning off the tap is useless, but it does mean our purchasing decisions have a much bigger impact.","นี่ไม่ได้หมายความว่าการปิดก๊อกไร้ประโยชน์ แต่หมายความว่าการตัดสินใจซื้อของเรามีผลกระทบมากกว่ามาก"],
      ["Además, muchos países ricos importan productos de regiones donde el agua escasea, de modo que, sin saberlo, contribuyen a la sequía de otros.","Moreover, many rich countries import products from regions where water is scarce, so that, without knowing it, they contribute to others' drought.","นอกจากนี้ ประเทศร่ำรวยหลายแห่งนำเข้าสินค้าจากภูมิภาคที่ขาดแคลนน้ำ จึงมีส่วนทำให้ที่อื่นแห้งแล้งโดยไม่รู้ตัว"],
      ["Comprar menos ropa, aprovechar la comida y reducir el consumo de carne son gestos sencillos con un efecto real.","Buying fewer clothes, not wasting food and reducing meat consumption are simple gestures with a real effect.","ซื้อเสื้อผ้าให้น้อยลง ใช้อาหารให้คุ้ม และลดการกินเนื้อ เป็นการกระทำง่ายๆ ที่ได้ผลจริง"]]],
  v:{"ahorrar":"A2|v|to save|ประหยัด","imaginamos":"B1|v|we imagine|เรานึกภาพ|imaginar","duchas":"A2|n|showers|การอาบน้ำฝักบัว|ducha","cortas":"A1|adj|short|สั้น|corto","grifos":"B1|n|taps|ก๊อกน้ำ|grifo","grifo":"B1|n|tap|ก๊อกน้ำ","sin embargo":"B1|expr|however|อย่างไรก็ตาม","mayor parte":"B1|expr|most, the majority|ส่วนใหญ่","consumimos":"B1|v|we consume|เราบริโภค|consumir","invisible":"B1|adj|invisible|มองไม่เห็น","virtual":"B2|adj|virtual|เสมือน","producir":"B1|v|to produce|ผลิต","vestimos":"B1|v|we wear|เราสวมใส่|vestir","fabricar":"B1|v|to manufacture|ผลิต","camiseta":"A1|n|T-shirt|เสื้อยืด","algodón":"B1|n|cotton|ผ้าฝ้าย","hacen falta":"B1|expr|are needed|จำเป็นต้องใช้|hacer falta","litros":"A2|n|litres|ลิตร|litro","carne de vaca":"A2|n|beef|เนื้อวัว","pienso":"C1|n|animal feed|อาหารสัตว์","comparación":"B1|n|comparison|การเปรียบเทียบ","gasta":"B1|v|uses, spends|ใช้, สิ้นเปลือง|gastar","inútil":"B1|adj|useless|ไร้ประโยชน์","impacto":"B2|n|impact|ผลกระทบ","importan":"B2|v|import|นำเข้า|importar","escasea":"C1|v|is scarce|ขาดแคลน|escasear","de modo que":"B2|expr|so that|ดังนั้น","contribuyen":"B2|v|contribute|มีส่วน|contribuir","sequía":"B2|n|drought|ความแห้งแล้ง","aprovechar":"B2|v|to make the most of|ใช้ให้คุ้มค่า","reducir":"B1|v|to reduce|ลด","consumo":"B2|n|consumption|การบริโภค","gestos":"B2|n|gestures|การกระทำ, ท่าที|gesto","sencillos":"A2|adj|simple|ง่าย|sencillo"},
  q:[{t:"main",q:["¿Cuál es la idea principal del texto?","ใจความสำคัญของบทความคืออะไร"],o:["Ducharse menos es la mejor forma de ahorrar agua.","Gran parte del agua que gastamos está oculta en los productos que consumimos.","Los países ricos tienen más agua que los pobres.","La carne de vaca es mala para la salud."],a:1,x:"ทั้งบทความอธิบายแนวคิด “น้ำเสมือน” ที่ซ่อนอยู่ในสินค้า ข้อ A ถูกผู้เขียนลดความสำคัญลง ส่วนข้อ D ไม่ได้พูดเรื่องสุขภาพ"},
     {t:"detail",q:["Según el texto, ¿por qué la carne de vaca necesita tanta agua?","ตามบทความ ทำไมเนื้อวัวจึงใช้น้ำมาก"],o:["Porque las vacas beben mucho.","Porque hay que lavar la carne.","Sobre todo por el agua que se usa para producir su alimento.","Porque se transporta en barco."],a:2,x:"“sobre todo por el agua que consume el pienso de los animales” — น้ำส่วนใหญ่ใช้ปลูกอาหารสัตว์ ไม่ใช่น้ำที่วัวดื่ม (กับดักข้อ A)"},
     {t:"not",q:["¿Qué afirmación NO se corresponde con el texto?","ข้อใดไม่สอดคล้องกับบทความ"],o:["Una camiseta de algodón necesita miles de litros de agua.","Cerrar el grifo no sirve para nada.","Algunos países contribuyen a la sequía de otros sin saberlo.","Reducir el consumo de carne tiene un efecto real."],a:1,x:"ผู้เขียนบอกชัดว่า “Esto no significa que cerrar el grifo sea inútil” ข้อ B จึงขัดแย้ง"},
     {t:"vocab",q:["En el texto, «escasea» significa que el agua…","ในบทความ คำว่า “escasea” หมายความว่าน้ำ…"],o:["es abundante.","es cara.","hay poca.","está contaminada."],a:2,x:"escasear = มีไม่เพียงพอ/ขาดแคลน ซึ่งสอดคล้องกับคำว่า sequía (ความแห้งแล้ง) ในประโยคเดียวกัน"},
     {t:"purpose",q:["¿Para qué menciona el autor la ducha de cinco minutos?","ผู้เขียนกล่าวถึงการอาบน้ำห้านาทีเพื่ออะไร"],o:["Para recomendar duchas más largas.","Para mostrar, por contraste, lo pequeño que es ese gasto frente al agua virtual.","Para explicar cómo funciona un grifo.","Para criticar a los países ricos."],a:1,x:"ใช้เป็นตัวเปรียบเทียบ (En comparación) 60 ลิตร กับ 2,500 และ 15,000 ลิตร เพื่อให้เห็นว่าน้ำเสมือนมีขนาดใหญ่กว่ามาก"}]},
{ id:"es-r2", cat:"science", lvl:"B2", src:"วิทยาศาสตร์", title:["El cerebro bilingüe","The bilingual brain","สมองสองภาษา"],
  p:[[["Durante décadas se creyó que criar a un niño en dos idiomas podía confundirlo y retrasar su desarrollo.","For decades it was believed that raising a child in two languages could confuse them and delay their development.","หลายทศวรรษที่ผ่านมา ผู้คนเชื่อว่าการเลี้ยงเด็กด้วยสองภาษาอาจทำให้เด็กสับสนและพัฒนาการช้า"],
      ["Hoy, la investigación apunta en la dirección contraria.","Today, research points in the opposite direction.","ปัจจุบัน งานวิจัยชี้ไปในทิศทางตรงกันข้าม"]],
     [["Las personas bilingües mantienen ambos idiomas activos al mismo tiempo, incluso cuando solo utilizan uno.","Bilingual people keep both languages active at the same time, even when they only use one.","คนที่พูดได้สองภาษาจะเปิดใช้ทั้งสองภาษาพร้อมกัน แม้ในขณะที่ใช้เพียงภาษาเดียว"],
      ["Para no mezclarlos, el cerebro debe inhibir constantemente la lengua que no necesita, un esfuerzo que entrena las llamadas funciones ejecutivas: la atención, la memoria de trabajo y la capacidad de cambiar de tarea.","To avoid mixing them, the brain must constantly inhibit the language it doesn't need, an effort that trains the so-called executive functions: attention, working memory and the ability to switch tasks.","เพื่อไม่ให้ปนกัน สมองต้องยับยั้งภาษาที่ไม่ได้ใช้อยู่ตลอดเวลา ความพยายามนี้ช่วยฝึกสิ่งที่เรียกว่าการทำงานของสมองด้านบริหาร ได้แก่ ความใส่ใจ ความจำขณะทำงาน และความสามารถในการสลับงาน"]],
     [["Algunos estudios sugieren incluso que el bilingüismo podría retrasar entre cuatro y cinco años la aparición de los síntomas de la demencia.","Some studies even suggest that bilingualism could delay the appearance of dementia symptoms by four to five years.","งานวิจัยบางชิ้นถึงกับเสนอว่าการรู้สองภาษาอาจชะลอการเกิดอาการสมองเสื่อมได้สี่ถึงห้าปี"],
      ["No obstante, los científicos piden prudencia: los resultados varían según el nivel de dominio, la edad de aprendizaje y el uso cotidiano de cada lengua.","Nevertheless, scientists urge caution: results vary according to the level of proficiency, the age of learning and the daily use of each language.","อย่างไรก็ดี นักวิทยาศาสตร์ขอให้ระมัดระวัง เพราะผลลัพธ์แตกต่างกันไปตามระดับความเชี่ยวชาญ อายุที่เริ่มเรียน และการใช้แต่ละภาษาในชีวิตประจำวัน"],
      ["Lo que sí parece claro es que nunca es tarde para aprender: el cerebro adulto conserva una plasticidad mucho mayor de lo que se pensaba.","What does seem clear is that it's never too late to learn: the adult brain retains much greater plasticity than was thought.","สิ่งที่ดูชัดเจนคือไม่มีคำว่าสายเกินไปที่จะเรียน สมองผู้ใหญ่ยังคงความยืดหยุ่นได้มากกว่าที่เคยคิดไว้มาก"]]],
  v:{"décadas":"B1|n|decades|ทศวรรษ|década","creyó":"B1|v|was believed|เชื่อ (อดีต)|creer","criar":"B2|v|to raise (a child)|เลี้ยงดู","idiomas":"A2|n|languages|ภาษา|idioma","confundirlo":"B1|v|to confuse him|ทำให้เขาสับสน|confundir","retrasar":"B2|v|to delay|ทำให้ล่าช้า","desarrollo":"B1|n|development|พัฒนาการ","investigación":"B1|n|research|การวิจัย","apunta":"B2|v|points|ชี้|apuntar","contraria":"B1|adj|opposite|ตรงกันข้าม|contrario","bilingües":"B1|adj|bilingual|สองภาษา|bilingüe","mantienen":"B1|v|maintain, keep|รักษาไว้|mantener","ambos":"B1|det|both|ทั้งสอง","activos":"B1|adj|active|ทำงานอยู่|activo","utilizan":"B1|v|use|ใช้|utilizar","mezclarlos":"B1|v|to mix them|ผสมพวกมัน|mezclar","inhibir":"C1|v|to inhibit|ยับยั้ง","constantemente":"B2|adv|constantly|อย่างต่อเนื่อง","lengua":"B1|n|language, tongue|ภาษา, ลิ้น","esfuerzo":"B1|n|effort|ความพยายาม","entrena":"B1|v|trains|ฝึก|entrenar","funciones ejecutivas":"C1|n|executive functions|การทำงานของสมองด้านบริหารจัดการ","atención":"A2|n|attention|ความใส่ใจ","memoria de trabajo":"C1|n|working memory|ความจำขณะทำงาน","capacidad":"B2|n|ability, capacity|ความสามารถ","tarea":"A2|n|task|งาน, ภารกิจ","sugieren":"B2|v|suggest|เสนอแนะ|sugerir","bilingüismo":"C1|n|bilingualism|การรู้สองภาษา","aparición":"B2|n|appearance, onset|การปรากฏ","síntomas":"B1|n|symptoms|อาการ|síntoma","demencia":"C1|n|dementia|ภาวะสมองเสื่อม","no obstante":"B2|expr|nevertheless|อย่างไรก็ตาม","prudencia":"C1|n|caution|ความระมัดระวัง","varían":"B2|v|vary|แตกต่างกัน|variar","según":"B1|prep|according to|ตาม","dominio":"B2|n|mastery, proficiency|ความเชี่ยวชาญ","aprendizaje":"B2|n|learning|การเรียนรู้","cotidiano":"B2|adj|daily|ในชีวิตประจำวัน","tarde":"A1|adv|late|สาย","conserva":"B2|v|retains|คงไว้|conservar","plasticidad":"C2|n|plasticity|ความยืดหยุ่น (สมอง)"},
  q:[{t:"main",q:["¿Qué idea resume mejor el texto?","ข้อใดสรุปบทความได้ดีที่สุด"],o:["El bilingüismo confunde a los niños pequeños.","Hablar dos idiomas parece aportar beneficios cognitivos, aunque con matices.","Solo los niños pueden aprender idiomas.","El bilingüismo cura la demencia."],a:1,x:"บทความเสนอประโยชน์ทางสมอง แต่มีย่อหน้าที่ขอให้ “ระมัดระวัง” (prudencia) ข้อ B จึงครบที่สุด ข้อ D เกินจริง: บทความบอกแค่ “อาจชะลอ” ไม่ใช่ “รักษา”"},
     {t:"detail",q:["¿Por qué el cerebro bilingüe se «entrena» constantemente?","ทำไมสมองสองภาษาจึงได้ “ฝึก” อยู่ตลอดเวลา"],o:["Porque traduce todo lo que oye.","Porque tiene que bloquear el idioma que no está usando.","Porque duerme menos.","Porque olvida un idioma cada día."],a:1,x:"“el cerebro debe inhibir constantemente la lengua que no necesita” — inhibir = ยับยั้ง/บล็อก"},
     {t:"not",q:["Según el texto, ¿cuál de estas afirmaciones es FALSA?","ตามบทความ ข้อใดผิด"],o:["Antes se pensaba que el bilingüismo podía retrasar el desarrollo.","Los bilingües activan solo un idioma a la vez.","Los efectos dependen, entre otras cosas, de la edad de aprendizaje.","El cerebro adulto es más flexible de lo que se creía."],a:1,x:"บทความบอกว่า “mantienen ambos idiomas activos al mismo tiempo” ข้อ B จึงผิด"},
     {t:"tone",q:["¿Qué actitud muestran los científicos mencionados en el tercer párrafo?","นักวิทยาศาสตร์ในย่อหน้าที่สามมีทัศนคติอย่างไร"],o:["Entusiasmo sin reservas.","Rechazo total de los estudios.","Cautela ante resultados que no son uniformes.","Indiferencia."],a:2,x:"“piden prudencia: los resultados varían…” แสดงความระมัดระวังเพราะผลไม่สม่ำเสมอ ไม่ได้ปฏิเสธงานวิจัยทั้งหมด"},
     {t:"infer",q:["¿Qué se puede deducir de la última frase?","อนุมานจากประโยคสุดท้ายได้ว่าอย่างไร"],o:["Un adulto de cuarenta años todavía puede aprender un idioma con éxito.","Los adultos aprenden mejor que los niños.","Es inútil estudiar idiomas después de los veinte años.","La plasticidad cerebral desaparece en la infancia."],a:0,x:"“nunca es tarde para aprender” และสมองผู้ใหญ่ยังยืดหยุ่น จึงอนุมานว่าผู้ใหญ่ยังเรียนภาษาได้สำเร็จ ข้อ B เกินกว่าที่บทความบอก"}]},
{ id:"es-r3", cat:"economy", lvl:"C1", src:"เศรษฐกิจ/สังคม", title:["La trampa de la comodidad: cuando todo llega a casa","The comfort trap: when everything is delivered home","กับดักความสะดวก: เมื่อทุกอย่างมาส่งถึงบ้าน"],
  p:[[["En apenas una década, la entrega a domicilio ha pasado de ser un lujo ocasional a convertirse en un hábito cotidiano para millones de personas.","In barely a decade, home delivery has gone from being an occasional luxury to becoming a daily habit for millions of people.","ในเวลาเพียงทศวรรษเดียว บริการส่งถึงบ้านเปลี่ยนจากความหรูหรานานๆ ครั้ง กลายเป็นนิสัยประจำวันของคนนับล้าน"],
      ["Basta con un par de toques en la pantalla para que la cena, un libro o un cargador aparezcan en la puerta en menos de una hora.","A couple of taps on the screen are enough for dinner, a book or a charger to appear at the door in less than an hour.","แค่แตะหน้าจอสองสามครั้ง อาหารเย็น หนังสือ หรือที่ชาร์จก็มาถึงหน้าประตูภายในไม่ถึงชั่วโมง"]],
     [["Esta comodidad, sin embargo, tiene costes que rara vez figuran en el recibo.","This convenience, however, has costs that rarely appear on the receipt.","อย่างไรก็ตาม ความสะดวกนี้มีต้นทุนที่แทบไม่เคยปรากฏในใบเสร็จ"],
      ["Detrás de cada pedido urgente hay repartidores que, en muchos casos, trabajan como autónomos sin protección social y cuyos ingresos dependen de la rapidez con que pedaleen.","Behind every urgent order there are couriers who, in many cases, work as self-employed without social protection and whose income depends on how fast they pedal.","เบื้องหลังทุกคำสั่งซื้อด่วนคือคนส่งของที่หลายกรณีทำงานเป็นฟรีแลนซ์โดยไม่มีสวัสดิการสังคม และรายได้ขึ้นกับว่าปั่นจักรยานได้เร็วแค่ไหน"],
      ["A ello se suma el impacto urbano: furgonetas en doble fila, embalajes que se tiran tras un solo uso y pequeños comercios que no pueden competir con plazos tan cortos.","Added to this is the urban impact: vans double-parked, packaging thrown away after a single use and small shops that cannot compete with such short delivery times.","ยังมีผลกระทบต่อเมืองอีก เช่น รถตู้จอดซ้อนคัน บรรจุภัณฑ์ที่ใช้ครั้งเดียวทิ้ง และร้านค้าเล็กๆ ที่แข่งขันกับระยะเวลาส่งที่สั้นขนาดนี้ไม่ได้"]],
     [["Sería injusto, no obstante, demonizar a los consumidores, que a menudo recurren a estos servicios por falta de tiempo más que por capricho.","It would be unfair, however, to demonise consumers, who often turn to these services out of lack of time rather than whim.","อย่างไรก็ดี คงไม่ยุติธรรมหากจะโทษผู้บริโภค ซึ่งมักใช้บริการเหล่านี้เพราะไม่มีเวลามากกว่าเพราะเอาแต่ใจ"],
      ["El debate de fondo no es si debemos renunciar a la comodidad, sino quién paga realmente por ella y si estamos dispuestos a aceptar unas reglas que repartan esa carga de forma más equitativa.","The underlying debate is not whether we should give up convenience, but who really pays for it and whether we are willing to accept rules that distribute that burden more fairly.","ประเด็นถกเถียงที่แท้จริงไม่ใช่ว่าเราควรละทิ้งความสะดวกหรือไม่ แต่คือใครกันแน่ที่จ่ายราคาของมัน และเราพร้อมยอมรับกฎที่กระจายภาระนั้นอย่างเป็นธรรมกว่านี้หรือเปล่า"]]],
  v:{"trampa":"B2|n|trap|กับดัก","comodidad":"B2|n|comfort, convenience|ความสะดวกสบาย","apenas":"B2|adv|barely, hardly|แทบจะไม่, เพียง","entrega a domicilio":"B2|n|home delivery|บริการส่งถึงบ้าน","entrega":"B1|n|delivery|การส่ง","domicilio":"B2|n|home, residence|ที่อยู่อาศัย","lujo":"B2|n|luxury|ความหรูหรา","ocasional":"B2|adj|occasional|นานๆ ครั้ง","convertirse":"B1|v|to become|กลายเป็น","hábito":"B1|n|habit|นิสัย","basta":"B2|v|it's enough|ก็พอแล้ว|bastar","toques":"B1|n|taps, touches|การแตะ|toque","pantalla":"A2|n|screen|หน้าจอ","cargador":"B1|n|charger|ที่ชาร์จ","aparezcan":"B2|v|appear (subjunctive)|ปรากฏ|aparecer","costes":"B2|n|costs|ต้นทุน|coste","rara vez":"B2|expr|rarely|แทบไม่เคย","figuran":"C1|v|appear, are listed|ปรากฏ (ในรายการ)|figurar","recibo":"B1|n|receipt|ใบเสร็จ","pedido":"B1|n|order|คำสั่งซื้อ","urgente":"B1|adj|urgent|เร่งด่วน","repartidores":"B2|n|delivery riders|คนส่งของ|repartidor","autónomos":"B2|n|self-employed|ผู้ประกอบอาชีพอิสระ|autónomo","protección social":"C1|n|social protection|การคุ้มครองทางสังคม","cuyos":"C1|det|whose|ซึ่ง…ของเขา|cuyo","ingresos":"B2|n|income|รายได้|ingreso","dependen":"B1|v|depend|ขึ้นอยู่กับ|depender","rapidez":"B2|n|speed|ความเร็ว","pedaleen":"C1|v|pedal (subjunctive)|ปั่น (จักรยาน)|pedalear","se suma":"C1|v|is added|เพิ่มเข้ามา|sumarse","furgonetas":"B2|n|vans|รถตู้|furgoneta","doble fila":"C1|expr|double-parked|จอดซ้อนคัน","embalajes":"C1|n|packaging|บรรจุภัณฑ์|embalaje","tiran":"B1|v|throw away|ทิ้ง|tirar","comercios":"B2|n|shops, businesses|ร้านค้า|comercio","competir":"B2|v|to compete|แข่งขัน","plazos":"C1|n|deadlines, time frames|กำหนดเวลา|plazo","injusto":"B1|adj|unfair|ไม่ยุติธรรม","demonizar":"C2|v|to demonise|ป้ายสีว่าเป็นผู้ร้าย","consumidores":"B2|n|consumers|ผู้บริโภค|consumidor","a menudo":"B2|expr|often|บ่อยครั้ง","recurren":"C1|v|resort to|หันไปพึ่ง|recurrir","falta":"B1|n|lack|การขาด","capricho":"C1|n|whim|ความเอาแต่ใจ","de fondo":"C1|expr|underlying|ที่อยู่เบื้องลึก","renunciar":"B2|v|to give up|สละ, ละทิ้ง","dispuestos":"B2|adj|willing|พร้อมที่จะ|dispuesto","reglas":"B1|n|rules|กฎ|regla","repartan":"C1|v|distribute (subjunctive)|กระจาย|repartir","carga":"B2|n|burden, load|ภาระ","equitativa":"C2|adj|equitable, fair|เป็นธรรม|equitativo"},
  q:[{t:"main",q:["¿Cuál es la tesis del autor?","ข้อเสนอหลักของผู้เขียนคืออะไร"],o:["Hay que prohibir la entrega a domicilio.","Los consumidores son culpables de la precariedad de los repartidores.","La comodidad de la entrega rápida tiene costes ocultos y plantea la cuestión de cómo repartirlos de forma justa.","Los pequeños comercios son más rápidos que las plataformas."],a:2,x:"ประโยคสุดท้ายคือหัวใจ: ไม่ใช่เลิกความสะดวก แต่ “ใครจ่าย” และจะกระจายภาระให้เป็นธรรมอย่างไร ข้อ A และ B ผู้เขียนปฏิเสธโดยตรง"},
     {t:"vocab",q:["La expresión «costes que rara vez figuran en el recibo» se refiere a…","สำนวน “ต้นทุนที่แทบไม่ปรากฏในใบเสร็จ” หมายถึงอะไร"],o:["errores en la factura.","consecuencias sociales y ambientales que el cliente no paga directamente.","impuestos ocultos.","propinas para el repartidor."],a:1,x:"ย่อหน้าเดียวกันอธิบายต่อว่าคือภาระของคนส่งของ และผลกระทบต่อเมือง/สิ่งแวดล้อม ซึ่งลูกค้าไม่ได้จ่ายตรง"},
     {t:"not",q:["¿Qué afirmación NO puede extraerse del texto?","ข้อใดสรุปจากบทความไม่ได้"],o:["Muchos repartidores carecen de protección social.","Los embalajes generan residuos.","Los consumidores usan estos servicios principalmente por capricho.","A los pequeños comercios les cuesta competir."],a:2,x:"ผู้เขียนบอกว่าผู้บริโภคใช้บริการ “por falta de tiempo más que por capricho” ข้อ C จึงกลับด้าน"},
     {t:"purpose",q:["¿Qué función cumple el tercer párrafo en la argumentación?","ย่อหน้าที่สามมีบทบาทอย่างไรในการให้เหตุผล"],o:["Introduce un contraargumento para matizar la crítica y reorientar el debate.","Repite la crítica del párrafo anterior.","Presenta datos estadísticos.","Concluye que no hay ningún problema."],a:0,x:"เริ่มด้วย “Sería injusto, no obstante…” เป็นการยอมรับมุมฝั่งผู้บริโภค เพื่อลดความแรงของคำวิจารณ์ แล้วพาไปสู่คำถามเชิงโครงสร้างว่าใครควรรับภาระ"},
     {t:"infer",q:["¿Qué tipo de solución parece preferir el autor?","ผู้เขียนน่าจะชอบแนวทางแก้ไขแบบใด"],o:["Una solución individual: que cada uno deje de pedir comida.","Una solución colectiva basada en normas que distribuyan mejor los costes.","Ninguna, porque el problema no existe.","Aumentar la velocidad de las entregas."],a:1,x:"คำว่า “aceptar unas reglas que repartan esa carga” ชี้ไปที่กฎกติการ่วมกัน (ระดับสังคม) ไม่ใช่โยนให้ปัจเจก"}]}

novel: [
{ id:"es-n1", genre:"horror", lvl:"B2", title:["La niña del pozo","The girl in the well","เด็กหญิงในบ่อน้ำ"], blurb:"บ้านไร่ที่เพิ่งซื้อมามีบ่อน้ำเก่าที่ไม่ควรมีใครตอบเสียงเรียก",
  p:[[["Compramos la casa en septiembre, cuando el pueblo ya se había vaciado de veraneantes y las tardes empezaban a oler a leña.","We bought the house in September, when the village had already emptied of summer visitors and the afternoons were beginning to smell of firewood.","เราซื้อบ้านหลังนั้นในเดือนกันยายน ตอนที่นักท่องเที่ยวหน้าร้อนกลับไปหมดแล้ว และยามบ่ายเริ่มมีกลิ่นฟืน"],
      ["El agente inmobiliario no mencionó el pozo.","The estate agent didn't mention the well.","นายหน้าขายบ้านไม่ได้พูดถึงบ่อน้ำเลย"],
      ["Lo encontró mi hija Alba, escondido bajo una maraña de zarzas al fondo del huerto, con una tapa de madera tan podrida que se deshacía al tocarla.","My daughter Alba found it, hidden under a tangle of brambles at the back of the vegetable garden, with a wooden lid so rotten that it crumbled when touched.","อัลบา ลูกสาวของฉันเป็นคนเจอมัน ซ่อนอยู่ใต้พงหนามท้ายสวนผัก ฝาไม้ผุจนแตกร่วนเมื่อสัมผัส"]],
     [["—Mamá, ahí abajo hay alguien —me dijo aquella noche, mientras le apagaba la luz.","'Mum, there's someone down there,' she told me that night, while I was turning off her light.","“แม่ ข้างล่างนั่นมีคนอยู่” เธอบอกฉันคืนนั้น ขณะที่ฉันกำลังปิดไฟให้"],
      ["Sonreí, como se sonríe ante las fantasías de una niña de siete años, y le di un beso en la frente.","I smiled, the way one smiles at the fantasies of a seven-year-old girl, and kissed her on the forehead.","ฉันยิ้ม อย่างที่คนเราจะยิ้มให้จินตนาการของเด็กเจ็ดขวบ แล้วจูบหน้าผากเธอ"],
      ["—Me ha preguntado cómo me llamo —añadió, ya medio dormida—. Le he dicho que mañana se lo digo.","'She asked me what my name is,' she added, already half asleep. 'I told her I'll tell her tomorrow.'","“เขาถามหนูว่าหนูชื่ออะไร” เธอพูดต่อทั้งที่ครึ่งหลับ “หนูบอกว่าพรุ่งนี้จะบอก”"]],
     [["Al día siguiente, la vecina más anciana del pueblo se detuvo frente a nuestra verja.","The next day, the oldest neighbour in the village stopped in front of our gate.","วันรุ่งขึ้น หญิงชราที่อายุมากที่สุดในหมู่บ้านหยุดยืนหน้ารั้วบ้านเรา"],
      ["Miró el huerto durante un largo rato, santiguándose despacio, y luego me hizo una sola pregunta.","She looked at the garden for a long while, slowly crossing herself, and then asked me a single question.","นางจ้องมองสวนอยู่นาน ค่อยๆ ทำเครื่องหมายกางเขน แล้วถามฉันเพียงคำถามเดียว"],
      ["—¿La niña ya le ha dicho su nombre?","'Has the girl told her her name yet?'","“เด็กคนนั้นบอกชื่อให้มันรู้หรือยัง?”"]],
     [["Le expliqué, con una risa nerviosa, que Alba tenía mucha imaginación.","I explained, with a nervous laugh, that Alba had a lot of imagination.","ฉันอธิบายพร้อมหัวเราะอย่างประหม่าว่าอัลบาเป็นเด็กช่างจินตนาการ"],
      ["La anciana negó con la cabeza.","The old woman shook her head.","หญิงชราส่ายหน้า"],
      ["—En 1952 se cayó una cría a ese pozo y nadie la sacó a tiempo —murmuró—. Desde entonces pregunta nombres. Y a quien se lo dice, se lo queda.","'In 1952 a little girl fell into that well and nobody got her out in time,' she murmured. 'Since then she asks for names. And whoever tells her, she keeps.'","“ปี 1952 มีเด็กหญิงคนหนึ่งตกลงไปในบ่อนั้น ไม่มีใครช่วยขึ้นมาทัน” นางพึมพำ “ตั้งแต่นั้นมันก็ถามชื่อ และใครที่บอกชื่อให้มัน มันจะเอาตัวไป”"]],
     "* * *",

{ id:"es-n2", genre:"comedy", lvl:"B1", title:["El loro de mi suegra","My mother-in-law's parrot","นกแก้วของแม่ยาย"], blurb:"รับฝากนกแก้วแค่สุดสัปดาห์เดียว แต่มันพูดมากเกินกว่าที่ใครควรได้ยิน",
  p:[[["Cuando mi suegra se fue de crucero, nos dejó a cargo de Paco, su loro, con una lista de instrucciones de cuatro páginas.","When my mother-in-law went on a cruise, she left us in charge of Paco, her parrot, with a four-page list of instructions.","ตอนแม่ยายไปล่องเรือสำราญ ท่านฝากพาโก นกแก้วของท่าน ไว้กับเรา พร้อมรายการคำสั่งยาวสี่หน้า"],
      ["La primera decía, en mayúsculas: «NO HABLÉIS DE POLÍTICA DELANTE DE ÉL».","The first one said, in capital letters: 'DO NOT TALK ABOUT POLITICS IN FRONT OF HIM'.","ข้อแรกเขียนตัวใหญ่ว่า “ห้ามคุยเรื่องการเมืองต่อหน้ามัน”"],
      ["Nos pareció una broma.","We thought it was a joke.","เราคิดว่าเป็นเรื่องตลก"],
      ["No lo era.","It wasn't.","แต่มันไม่ใช่"]],
     [["Paco sabía unas trescientas palabras y las usaba con una precisión inquietante.","Paco knew about three hundred words and used them with unsettling precision.","พาโกรู้คำศัพท์ราวสามร้อยคำ และใช้มันอย่างแม่นยำจนน่าขนลุก"],
      ["Cuando mi marido abrió la nevera a medianoche, Paco gritó: «¡Otra vez, Manolo! ¡Otra vez!».","When my husband opened the fridge at midnight, Paco shouted: 'Again, Manolo! Again!'","พอสามีฉันเปิดตู้เย็นตอนเที่ยงคืน พาโกก็ตะโกนว่า “อีกแล้วนะ มาโนโล! อีกแล้ว!”"],
      ["Manolo es el nombre de mi suegro, que lleva quince años a dieta sin perder un solo kilo.","Manolo is my father-in-law's name, who has been on a diet for fifteen years without losing a single kilo.","มาโนโลคือชื่อพ่อตา ผู้ซึ่งลดน้ำหนักมาสิบห้าปีโดยไม่ลดลงเลยสักกิโล"]],
     [["El sábado vinieron a cenar nuestros vecinos, una pareja encantadora y muy formal.","On Saturday our neighbours came for dinner, a charming and very proper couple.","วันเสาร์ เพื่อนบ้านมาทานข้าวเย็นด้วย เป็นคู่รักที่น่ารักและเรียบร้อยมาก"],
      ["Todo iba de maravilla hasta que, en pleno postre, Paco carraspeó como un presentador de televisión y anunció con la voz exacta de mi suegra: «Esa vecina se ha operado la nariz».","Everything was going wonderfully until, in the middle of dessert, Paco cleared his throat like a TV presenter and announced in exactly my mother-in-law's voice: 'That neighbour has had a nose job.'","ทุกอย่างราบรื่นดี จนกระทั่งระหว่างกินของหวาน พาโกกระแอมเหมือนพิธีกรรายการทีวี แล้วประกาศด้วยเสียงเหมือนแม่ยายเป๊ะว่า “ยัยเพื่อนบ้านนั่นไปทำจมูกมา”"]],
     [["Se hizo un silencio tan espeso que se podía cortar con cuchillo.","A silence fell so thick you could cut it with a knife.","ความเงียบเกิดขึ้นหนาทึบจนเอามีดตัดได้"],
      ["La vecina se llevó la mano a la cara.","The neighbour put her hand to her face.","คุณเพื่อนบ้านยกมือขึ้นแตะหน้า"],
      ["Mi marido, en un intento desesperado por salvar la noche, tosió muy fuerte y dijo: «¡Qué loro tan gracioso! Repite cualquier tontería que oye en la tele».","My husband, in a desperate attempt to save the evening, coughed very loudly and said: 'What a funny parrot! He repeats any nonsense he hears on TV.'","สามีฉันพยายามกู้สถานการณ์อย่างสิ้นหวัง ไอเสียงดังแล้วพูดว่า “นกแก้วตลกจัง! มันชอบพูดตามเรื่องไร้สาระที่ได้ยินในทีวี”"],
      ["Paco lo miró con lástima, ladeó la cabeza y respondió: «Mentiroso, como tu padre».","Paco looked at him with pity, tilted his head and replied: 'Liar, just like your father.'","พาโกมองเขาอย่างสมเพช เอียงคอ แล้วตอบว่า “ขี้โกหก เหมือนพ่อแกเลย”"]],
     "* * *",
     [["Cuando mi suegra volvió, morena y feliz, le preguntamos si Paco había dado mucha guerra.","When my mother-in-law came back, tanned and happy, she asked us if Paco had given us much trouble.","พอแม่ยายกลับมา ผิวแทนและอารมณ์ดี ท่านถามว่าพาโกสร้างปัญหาเยอะไหม"],

     ["Los técnicos forestales nos explicaron que muchas especies mediterráneas están adaptadas al fuego: el alcornoque, por ejemplo, rebrota gracias a su corteza gruesa.","Forestry experts explained to us that many Mediterranean species are adapted to fire: the cork oak, for example, resprouts thanks to its thick bark.","เจ้าหน้าที่ป่าไม้อธิบายว่าพืชเมดิเตอร์เรเนียนหลายชนิดปรับตัวให้อยู่กับไฟได้ เช่น ต้นโอ๊กคอร์กที่แตกยอดใหม่ได้เพราะเปลือกหนา"],

{ id:"es-f12", cat:"culture", lvl:"B2", user:"Rocío Montoya", handle:"rocio_baila", time:"5 วัน", likes:980,

     ["Mucha gente cree que el flamenco es solo baile y faldas de lunares, pero en realidad nació del cante, de la pena y de la mezcla de culturas en Andalucía.","Many people think flamenco is just dancing and polka-dot skirts, but in reality it was born from song, from sorrow and from the mix of cultures in Andalusia.","หลายคนคิดว่าฟลาเมงโกคือการเต้นและกระโปรงลายจุด แต่จริงๆ แล้วมันเกิดจากการร้องเพลง ความเศร้าโศก และการผสมผสานวัฒนธรรมในแคว้นอันดาลูเซีย"],

{ id:"es-r4", cat:"health", lvl:"A2", src:"สุขภาพ", title:["¿De verdad hay que beber ocho vasos de agua al día?","Do you really have to drink eight glasses of water a day?","ต้องดื่มน้ำวันละแปดแก้วจริงหรือ?"],
  p:[[["Seguro que has oído muchas veces que hay que beber ocho vasos de agua al día.","Surely you've heard many times that you have to drink eight glasses of water a day.","คุณคงเคยได้ยินบ่อยๆ ว่าต้องดื่มน้ำวันละแปดแก้ว"],
      ["Sin embargo, esta regla no tiene una base científica clara.","However, this rule doesn't have a clear scientific basis.","แต่กฎข้อนี้ไม่มีหลักฐานทางวิทยาศาสตร์ที่ชัดเจน"]],
     [["Nuestro cuerpo recibe agua de muchas formas: del café, de la sopa, de la fruta y de las verduras.","Our body receives water in many ways: from coffee, soup, fruit and vegetables.","ร่างกายได้รับน้ำหลายทาง ทั้งจากกาแฟ ซุป ผลไม้ และผัก"],
      ["Una sandía, por ejemplo, tiene más de un noventa por ciento de agua.","A watermelon, for example, is more than ninety per cent water.","ตัวอย่างเช่น แตงโมมีน้ำมากกว่าเก้าสิบเปอร์เซ็นต์"],
      ["Además, la cantidad necesaria depende del clima, de la edad y de la actividad física.","Also, the amount needed depends on the climate, age and physical activity.","นอกจากนี้ ปริมาณที่ต้องการขึ้นอยู่กับสภาพอากาศ อายุ และการออกกำลังกาย"]],
     [["Para la mayoría de las personas sanas, la mejor guía es muy sencilla: beber cuando tienes sed.","For most healthy people, the best guide is very simple: drink when you're thirsty.","สำหรับคนสุขภาพดีส่วนใหญ่ หลักที่ดีที่สุดง่ายมาก คือดื่มเมื่อกระหายน้ำ"],
      ["Otra pista útil es el color de la orina: si es amarilla clara, todo va bien.","Another useful clue is the colour of your urine: if it's pale yellow, all is well.","อีกเบาะแสที่มีประโยชน์คือสีของปัสสาวะ ถ้าเป็นสีเหลืองอ่อน แปลว่าทุกอย่างปกติดี"],
      ["Pero cuidado: las personas mayores sienten menos la sed, así que deben beber un poco más a menudo.","But be careful: older people feel thirst less, so they should drink a little more often.","แต่ต้องระวัง ผู้สูงอายุรู้สึกกระหายน้ำน้อยลง จึงควรดื่มบ่อยขึ้นสักหน่อย"]]],
  v:{"de verdad":"A2|expr|really|จริงๆ","vasos":"A1|n|glasses|แก้ว|vaso","seguro":"A2|adv|surely|แน่นอน","oído":"A2|v|heard|ได้ยิน|oír","regla":"B1|n|rule|กฎ","base":"B1|n|basis|พื้นฐาน","científica":"B1|adj|scientific|ทางวิทยาศาสตร์|científico","clara":"A2|adj|clear; pale|ชัดเจน; อ่อน (สี)|claro","recibe":"A2|v|receives|ได้รับ|recibir","formas":"A2|n|ways, forms|วิธี, รูปแบบ|forma","sopa":"A1|n|soup|ซุป","verduras":"A1|n|vegetables|ผัก|verdura","sandía":"A2|n|watermelon|แตงโม","por ciento":"A2|expr|per cent|เปอร์เซ็นต์","además":"A2|adv|also, besides|นอกจากนี้","cantidad":"B1|n|amount|ปริมาณ","necesaria":"B1|adj|necessary|จำเป็น|necesario","depende":"B1|v|depends|ขึ้นอยู่กับ|depender","clima":"B1|n|climate|สภาพอากาศ","edad":"A2|n|age|อายุ","actividad física":"B1|n|physical activity|การออกกำลังกาย","mayoría":"B1|n|majority|ส่วนใหญ่","sanas":"A2|adj|healthy|สุขภาพดี|sano","guía":"B1|n|guide|แนวทาง","sed":"A2|n|thirst|ความกระหาย","pista":"B1|n|clue|เบาะแส","útil":"A2|adj|useful|มีประโยชน์","orina":"B2|n|urine|ปัสสาวะ","amarilla":"A1|adj|yellow|เหลือง|amarillo","mayores":"A2|adj|older, elderly|สูงอายุ|mayor","a menudo":"B1|expr|often|บ่อย"},
  q:[{t:"main",q:["¿Cuál es la idea principal del texto?","ใจความสำคัญของบทความคืออะไร"],o:["Hay que beber exactamente ocho vasos al día.","La regla de los ocho vasos no es exacta; la cantidad depende de cada persona y la sed es una buena guía.","El café es malo para la salud.","Las personas mayores no deben beber agua."],a:1,x:"บทความโต้แย้งกฎแปดแก้ว แล้วเสนอว่าปริมาณขึ้นกับแต่ละคน และให้ฟังความกระหายของร่างกาย"},
     {t:"detail",q:["Según el texto, ¿de dónde recibe agua el cuerpo?","ตามบทความ ร่างกายได้รับน้ำจากที่ไหน"],o:["Solo del agua que bebemos.","También de otros alimentos y bebidas, como la sopa o la fruta.","Solo de la fruta.","Del aire."],a:1,x:"“del café, de la sopa, de la fruta y de las verduras”"},
     {t:"not",q:["¿Qué información NO aparece en el texto?","ข้อมูลใดไม่ปรากฏในบทความ"],o:["La sandía tiene mucha agua.","El color de la orina puede indicar si bebemos bastante.","Beber demasiada agua es siempre peligroso.","Las personas mayores sienten menos la sed."],a:2,x:"บทความไม่ได้พูดถึงอันตรายของการดื่มน้ำมากเกินไป"},
     {t:"vocab",q:["En el texto, «pista» significa…","ในบทความ คำว่า “pista” หมายถึง…"],o:["una pista de tenis","una señal o indicación","una regla obligatoria","una bebida"],a:1,x:"pista มีหลายความหมาย (สนาม, ร่องรอย) ในบริบทนี้หมายถึงเบาะแสหรือสัญญาณ เพราะสีปัสสาวะช่วยบอกว่าดื่มน้ำพอหรือไม่"},
     {t:"infer",q:["¿Por qué las personas mayores deben beber más a menudo?","ทำไมผู้สูงอายุควรดื่มน้ำบ่อยขึ้น"],o:["Porque necesitan diez vasos al día.","Porque su sensación de sed es más débil y no pueden fiarse solo de ella.","Porque hace más calor para ellos.","Porque beben mucho café."],a:1,x:"ถ้าความกระหายเป็นสัญญาณหลัก แต่ผู้สูงอายุรู้สึกกระหายน้อยลง พวกเขาจึงพึ่งสัญญาณนี้อย่างเดียวไม่ได้"}]},
{ id:"es-r5", cat:"history", lvl:"B1", src:"ประวัติศาสตร์", title:["La Alhambra: un palacio que cuenta una historia","The Alhambra: a palace that tells a story","อัลอัมบรา: พระราชวังที่เล่าเรื่องราว"],
  p:[[["En lo alto de una colina de Granada se levanta la Alhambra, uno de los monumentos más visitados de España.","On top of a hill in Granada stands the Alhambra, one of the most visited monuments in Spain.","บนยอดเนินเขาในเมืองกรานาดา มีอัลอัมบราตั้งตระหง่าน ซึ่งเป็นหนึ่งในโบราณสถานที่มีคนมาเยือนมากที่สุดในสเปน"],
      ["Su nombre viene del árabe y significa «la roja», probablemente por el color de sus muros al atardecer.","Its name comes from Arabic and means 'the red one', probably because of the colour of its walls at sunset.","ชื่อของมันมาจากภาษาอาหรับ แปลว่า “สีแดง” อาจเป็นเพราะสีของกำแพงยามพระอาทิตย์ตก"]],
     [["La mayor parte de los palacios que vemos hoy fue construida en los siglos XIII y XIV por la dinastía nazarí, el último reino musulmán de la península.","Most of the palaces we see today were built in the 13th and 14th centuries by the Nasrid dynasty, the last Muslim kingdom of the peninsula.","พระราชวังส่วนใหญ่ที่เห็นในวันนี้สร้างขึ้นในศตวรรษที่ 13 และ 14 โดยราชวงศ์นาสริด อาณาจักรมุสลิมแห่งสุดท้ายบนคาบสมุทร"],
      ["Sus arquitectos usaban materiales sencillos, como el yeso y la madera, pero los cubrían de decoraciones increíblemente detalladas.","Its architects used simple materials, such as plaster and wood, but covered them with incredibly detailed decorations.","สถาปนิกใช้วัสดุธรรมดาอย่างปูนปลาสเตอร์และไม้ แต่ปกคลุมด้วยลวดลายที่ละเอียดอย่างไม่น่าเชื่อ"],
      ["En las paredes hay poemas escritos en árabe, y el agua de fuentes y estanques crea un ambiente de calma y frescor.","On the walls there are poems written in Arabic, and the water of fountains and pools creates an atmosphere of calm and coolness.","บนผนังมีบทกวีที่เขียนเป็นภาษาอาหรับ และน้ำจากน้ำพุกับสระสร้างบรรยากาศสงบเย็นสบาย"]],
     [["En 1492, los Reyes Católicos conquistaron Granada y la Alhambra pasó a manos cristianas.","In 1492, the Catholic Monarchs conquered Granada and the Alhambra passed into Christian hands.","ในปี 1492 กษัตริย์คาทอลิกพิชิตกรานาดาได้ และอัลอัมบราตกอยู่ในมือของชาวคริสต์"],
      ["Más tarde, el emperador Carlos V mandó construir allí un palacio renacentista, muy diferente del resto.","Later, Emperor Charles V had a Renaissance palace built there, very different from the rest.","ต่อมา จักรพรรดิชาร์ลส์ที่ 5 สั่งให้สร้างพระราชวังแบบเรอเนซองส์ขึ้นที่นั่น ซึ่งแตกต่างจากส่วนอื่นมาก"],
      ["Por eso, pasear por la Alhambra es como leer, en piedra, varios capítulos de la historia de España.","That's why walking around the Alhambra is like reading, in stone, several chapters of Spain's history.","ด้วยเหตุนี้ การเดินชมอัลอัมบราจึงเหมือนได้อ่านประวัติศาสตร์สเปนหลายบทที่จารึกไว้บนหิน"]]],
  v:{"palacio":"B1|n|palace|พระราชวัง","en lo alto":"B1|expr|on top|บนยอด","colina":"B1|n|hill|เนินเขา","se levanta":"B2|v|stands, rises|ตั้งตระหง่าน|levantarse","monumentos":"B1|n|monuments|อนุสาวรีย์, โบราณสถาน|monumento","visitados":"A2|adj|visited|ถูกเยี่ยมชม|visitado","árabe":"A2|n|Arabic|ภาษาอาหรับ","significa":"A2|v|means|หมายถึง|significar","roja":"A1|adj|red|สีแดง|rojo","probablemente":"B1|adv|probably|อาจจะ","muros":"B1|n|walls (outer)|กำแพง|muro","atardecer":"B1|n|sunset|ยามพระอาทิตย์ตก","construida":"B1|adj|built|ถูกสร้าง|construir","siglos":"B1|n|centuries|ศตวรรษ|siglo","dinastía":"B2|n|dynasty|ราชวงศ์","nazarí":"C1|adj|Nasrid|แห่งราชวงศ์นาสริด","reino":"B1|n|kingdom|อาณาจักร","musulmán":"B1|adj|Muslim|มุสลิม","península":"B1|n|peninsula|คาบสมุทร","arquitectos":"B1|n|architects|สถาปนิก|arquitecto","materiales":"B1|n|materials|วัสดุ|material","yeso":"C1|n|plaster|ปูนปลาสเตอร์","cubrían":"B1|v|covered|ปกคลุม|cubrir","decoraciones":"B1|n|decorations|การตกแต่ง|decoración","detalladas":"B2|adj|detailed|ละเอียด|detallado","fuentes":"B1|n|fountains|น้ำพุ|fuente","estanques":"B2|n|ponds, pools|สระน้ำ|estanque","ambiente":"B1|n|atmosphere|บรรยากาศ","frescor":"C1|n|coolness|ความเย็นสบาย","reyes católicos":"B2|n|Catholic Monarchs|กษัตริย์คาทอลิก (อิซาเบลกับเฟร์นันโด)","conquistaron":"B2|v|conquered|พิชิต|conquistar","pasó a manos":"C1|expr|passed into the hands of|ตกอยู่ในมือของ|pasar a manos","cristianas":"B1|adj|Christian|คริสเตียน|cristiano","emperador":"B1|n|emperor|จักรพรรดิ","mandó construir":"B2|expr|had built|สั่งให้สร้าง|mandar construir","renacentista":"C1|adj|Renaissance|แบบเรอเนซองส์","pasear":"A2|v|to stroll|เดินเล่น","piedra":"A2|n|stone|หิน","capítulos":"B1|n|chapters|บท|capítulo"},
  q:[{t:"main",q:["¿Qué idea expresa mejor la última frase del texto?","ประโยคสุดท้ายสื่อความคิดใด"],o:["La Alhambra está hecha solo de piedra.","La Alhambra refleja diferentes épocas y culturas de la historia de España.","Hay que leer libros antes de visitar la Alhambra.","La Alhambra es una biblioteca."],a:1,x:"“leer, en piedra, varios capítulos de la historia” เป็นอุปมาว่าตัวอาคารสะท้อนหลายยุคหลายวัฒนธรรม ทั้งนาสริดและคริสเตียนเรอเนซองส์"},
     {t:"detail",q:["¿Quién construyó la mayor parte de los palacios actuales?","ใครสร้างพระราชวังส่วนใหญ่ที่เห็นในปัจจุบัน"],o:["Los Reyes Católicos.","El emperador Carlos V.","La dinastía nazarí.","Los romanos."],a:2,x:"“fue construida en los siglos XIII y XIV por la dinastía nazarí”"},
     {t:"vocab",q:["¿Qué significa «la Alhambra pasó a manos cristianas»?","“la Alhambra pasó a manos cristianas” หมายถึงอะไร"],o:["Que los cristianos la destruyeron.","Que los cristianos se convirtieron en sus nuevos dueños.","Que los cristianos la construyeron.","Que se vendió a un particular."],a:1,x:"pasar a manos de = ตกเป็นของ/ถูกครอบครองโดย"},
     {t:"not",q:["¿Qué afirmación es FALSA según el texto?","ข้อใดผิดตามบทความ"],o:["El nombre «Alhambra» viene del árabe.","Los nazaríes usaban materiales muy caros, como el oro y el mármol.","Hay poemas en las paredes.","Carlos V construyó un palacio de estilo diferente."],a:1,x:"บทความบอกว่าใช้วัสดุธรรมดา (yeso, madera) ไม่ใช่ทองหรือหินอ่อน"},
     {t:"infer",q:["¿Por qué el palacio de Carlos V parece «muy diferente del resto»?","ทำไมพระราชวังของชาร์ลส์ที่ 5 จึงดู “แตกต่างจากส่วนอื่นมาก”"],o:["Porque es de otra época y de otro estilo artístico.","Porque está en otra ciudad.","Porque es más pequeño.","Porque no tiene paredes."],a:0,x:"สร้างในยุคหลัง (หลัง 1492) และเป็นแบบเรอเนซองส์ ขณะที่ส่วนอื่นเป็นศิลปะนาสริด"}]},
{ id:"es-r6", cat:"society", lvl:"B2", src:"สังคม", title:["España vive con la hora equivocada","Spain lives on the wrong time","สเปนใช้ชีวิตผิดเวลา"],
  p:[[["Si miras un mapa, verás que España está casi en el mismo meridiano que el Reino Unido y Portugal.","If you look at a map, you'll see that Spain is at almost the same longitude as the United Kingdom and Portugal.","ถ้าดูแผนที่ จะเห็นว่าสเปนอยู่ในแนวเส้นแวงเกือบเดียวกับสหราชอาณาจักรและโปรตุเกส"],
      ["Sin embargo, sus relojes marcan la misma hora que los de Berlín o Varsovia.","However, its clocks show the same time as those of Berlin or Warsaw.","แต่นาฬิกาในสเปนกลับบอกเวลาเดียวกับเบอร์ลินหรือวอร์ซอ"]],
     [["La razón es histórica: en 1940, el régimen de Franco adelantó los relojes una hora para alinearse con la Alemania de la época, y el cambio nunca se revirtió.","The reason is historical: in 1940, Franco's regime moved the clocks forward one hour to align with the Germany of the time, and the change was never reversed.","เหตุผลมาจากประวัติศาสตร์ ในปี 1940 รัฐบาลฟรังโกปรับนาฬิกาเร็วขึ้นหนึ่งชั่วโมงเพื่อให้ตรงกับเยอรมนีในยุคนั้น และไม่เคยเปลี่ยนกลับ"],
      ["Como consecuencia, el sol sale y se pone más tarde de lo que le correspondería, lo que explica en parte por qué los españoles cenan a las diez y se acuestan tarde.","As a consequence, the sun rises and sets later than it should, which partly explains why Spaniards have dinner at ten and go to bed late.","ผลที่ตามมาคือดวงอาทิตย์ขึ้นและตกช้ากว่าที่ควรจะเป็น ซึ่งอธิบายได้ส่วนหนึ่งว่าทำไมคนสเปนกินข้าวเย็นตอนสี่ทุ่มและเข้านอนดึก"]],
     [["Varios expertos sostienen que este desfase reduce las horas de sueño y dificulta conciliar la vida laboral y familiar.","Several experts maintain that this mismatch reduces hours of sleep and makes it harder to balance work and family life.","ผู้เชี่ยวชาญหลายคนยืนยันว่าความคลาดเคลื่อนนี้ลดชั่วโมงการนอน และทำให้การสร้างสมดุลระหว่างงานกับครอบครัวยากขึ้น"],
      ["Otros advierten que cambiar la hora oficial no bastaría por sí solo: los horarios españoles, con largas pausas al mediodía, son también una cuestión cultural.","Others warn that changing the official time would not be enough on its own: Spanish schedules, with long midday breaks, are also a cultural matter.","อีกฝ่ายเตือนว่าการเปลี่ยนเวลามาตรฐานอย่างเดียวไม่พอ เพราะตารางชีวิตแบบสเปนที่พักกลางวันนาน เป็นเรื่องของวัฒนธรรมด้วย"],
      ["El debate reaparece cada pocos años, pero hasta ahora ningún gobierno se ha atrevido a mover las agujas.","The debate resurfaces every few years, but so far no government has dared to move the hands of the clock.","ข้อถกเถียงนี้กลับมาทุกสองสามปี แต่จนถึงตอนนี้ยังไม่มีรัฐบาลไหนกล้าขยับเข็มนาฬิกา"]]],

  q:[{t:"main",q:["¿Cuál es el tema central del texto?","ประเด็นหลักของบทความคืออะไร"],o:["La historia de la Segunda Guerra Mundial.","El huso horario de España, su origen y el debate sobre sus efectos.","Por qué los españoles duermen la siesta.","Las diferencias entre España y Portugal."],a:1,x:"บทความอธิบายว่าสเปนใช้เวลาผิดจากตำแหน่งภูมิศาสตร์ ที่มาในปี 1940 และข้อถกเถียงเรื่องผลกระทบ"},

{ id:"es-r7", cat:"economy", lvl:"C1", src:"เศรษฐกิจ/สิ่งแวดล้อม", title:["El triángulo del litio: riqueza bajo el salar","The lithium triangle: wealth beneath the salt flat","สามเหลี่ยมลิเธียม: ความมั่งคั่งใต้ทุ่งเกลือ"],
  p:[[["Entre Chile, Argentina y Bolivia se extiende una región de desiertos y salares que concentra más de la mitad de los recursos de litio conocidos del planeta.","Between Chile, Argentina and Bolivia lies a region of deserts and salt flats that holds more than half of the planet's known lithium resources.","ระหว่างชิลี อาร์เจนตินา และโบลิเวีย มีพื้นที่ทะเลทรายและทุ่งเกลือที่รวมทรัพยากรลิเธียมที่รู้จักกว่าครึ่งของโลก"],
      ["Este metal ligero, imprescindible para las baterías de los coches eléctricos y de los teléfonos, se ha convertido en un recurso estratégico de la transición energética.","This light metal, essential for the batteries of electric cars and phones, has become a strategic resource of the energy transition.","โลหะน้ำหนักเบานี้ซึ่งขาดไม่ได้สำหรับแบตเตอรี่รถยนต์ไฟฟ้าและโทรศัพท์ ได้กลายเป็นทรัพยากรเชิงยุทธศาสตร์ของการเปลี่ยนผ่านด้านพลังงาน"]],
     [["En los salares, el litio se obtiene bombeando salmuera del subsuelo y dejándola evaporar al sol durante meses en enormes piscinas.","In the salt flats, lithium is obtained by pumping brine from underground and leaving it to evaporate in the sun for months in huge pools.","ในทุ่งเกลือ ลิเธียมได้มาจากการสูบน้ำเกลือจากใต้ดินขึ้นมา แล้วปล่อยให้ระเหยกลางแดดเป็นเวลาหลายเดือนในบ่อขนาดใหญ่"],
      ["El método es relativamente barato, pero consume cantidades ingentes de agua en uno de los lugares más áridos del mundo.","The method is relatively cheap, but it consumes enormous amounts of water in one of the most arid places in the world.","วิธีนี้ค่อนข้างถูก แต่ใช้น้ำปริมาณมหาศาลในพื้นที่ที่แห้งแล้งที่สุดแห่งหนึ่งของโลก"],
      ["Las comunidades indígenas, que dependen de esos escasos recursos hídricos para el pastoreo y la agricultura, denuncian que rara vez se las consulta.","Indigenous communities, which depend on those scarce water resources for herding and farming, complain that they are rarely consulted.","ชุมชนชนพื้นเมืองซึ่งพึ่งพาแหล่งน้ำที่มีอยู่น้อยนิดเพื่อเลี้ยงสัตว์และเพาะปลูก ร้องเรียนว่าแทบไม่เคยถูกขอความเห็น"]],
     [["Así se plantea una paradoja incómoda: la tecnología llamada a frenar el cambio climático podría agravar problemas ambientales y sociales a escala local.","Thus an uncomfortable paradox arises: the technology meant to curb climate change could worsen environmental and social problems at a local scale.","จึงเกิดความย้อนแย้งที่น่าอึดอัด คือเทคโนโลยีที่ควรช่วยชะลอการเปลี่ยนแปลงสภาพภูมิอากาศ อาจทำให้ปัญหาสิ่งแวดล้อมและสังคมในระดับท้องถิ่นแย่ลง"],
      ["Los gobiernos de la región, por su parte, intentan no repetir la historia de otras materias primas, de las que exportaron la riqueza y heredaron la contaminación.","The region's governments, for their part, are trying not to repeat the history of other raw materials, from which they exported the wealth and inherited the pollution.","ส่วนรัฐบาลในภูมิภาคพยายามไม่ให้ประวัติศาสตร์ของวัตถุดิบอื่นๆ ซ้ำรอย ซึ่งเคยส่งออกความมั่งคั่งไปแต่ได้รับมลพิษตกทอดไว้"],
      ["Que lo consigan dependerá de algo más que de los precios internacionales: de su capacidad para negociar, regular y escuchar.","Whether they succeed will depend on more than international prices: on their ability to negotiate, regulate and listen.","จะทำสำเร็จหรือไม่ ไม่ได้ขึ้นอยู่กับราคาตลาดโลกเท่านั้น แต่ขึ้นอยู่กับความสามารถในการเจรจา กำกับดูแล และรับฟัง"]]],

     {t:"infer",q:["¿A qué se refiere el autor con «la historia de otras materias primas»?","ผู้เขียนหมายถึงอะไรเมื่อพูดถึง “ประวัติศาสตร์ของวัตถุดิบอื่นๆ”"],o:["A casos en que los beneficios se fueron al extranjero y los daños quedaron en el país.","A la invención de las baterías.","A que el litio siempre fue barato.","A la historia de los coches eléctricos."],a:0,x:"ประโยคเดียวกันขยายว่า ‘exportaron la riqueza y heredaron la contaminación’ คือความมั่งคั่งไหลออก แต่มลพิษตกค้างในประเทศ"},

{ id:"es-n3", genre:"mystery", lvl:"B2", title:["El último pasajero del tranvía","The last passenger on the tram","ผู้โดยสารคนสุดท้ายบนรถราง"], blurb:"คนขับรถรางสายสุดท้ายของลิสบอนเจอกระเป๋าหนังที่ถูกลืมไว้ ข้างในมีรูปถ่ายของตัวเขาเองเมื่อสามสิบปีก่อน",
  p:[[["Joaquim llevaba veintidós años conduciendo el tranvía 28, y sabía distinguir a los turistas de los vecinos solo por la forma en que se agarraban a la barra.","Joaquim had been driving tram 28 for twenty-two years, and could tell tourists from locals just by the way they held on to the bar.","โฆอากิงขับรถรางสาย 28 มายี่สิบสองปี และแยกนักท่องเที่ยวออกจากคนท้องถิ่นได้แค่ดูจากท่าจับราว"],

     [["Eran sus iniciales.","They were his initials.","มันคืออักษรย่อชื่อของเขาเอง"],

  p:[[["Durante el confinamiento, Clara descubrió que la ventana de enfrente estaba a solo seis metros de la suya.","During lockdown, Clara discovered that the window opposite was only six metres from hers.","ช่วงล็อกดาวน์ คลาราเพิ่งรู้ว่าหน้าต่างฝั่งตรงข้ามห่างจากหน้าต่างของเธอแค่หกเมตร"],
      ["Detrás vivía un chico que regaba sus plantas cada mañana con una seriedad casi ridícula, como si cada una fuera una paciente en cuidados intensivos.","Behind it lived a guy who watered his plants every morning with almost ridiculous seriousness, as if each one were a patient in intensive care.","หลังหน้าต่างนั้นมีชายหนุ่มคนหนึ่งรดน้ำต้นไม้ทุกเช้าด้วยท่าทีจริงจังจนเกือบน่าขำ ราวกับต้นไม้แต่ละต้นเป็นผู้ป่วยในห้องไอซียู"]],
     [["Un día, aburrida, Clara escribió en un folio con rotulador grueso: «¿CÓMO SE LLAMA EL CACTUS?».","One day, bored, Clara wrote on a sheet of paper with a thick marker: 'WHAT'S THE CACTUS CALLED?'","วันหนึ่ง คลาราเบื่อๆ เลยเขียนด้วยปากกาเมจิกหัวโตลงบนกระดาษว่า “ต้นกระบองเพชรชื่ออะไร?”"],
      ["Lo pegó en el cristal y esperó.","She stuck it on the glass and waited.","เธอแปะมันไว้ที่กระจกแล้วรอ"],
      ["Media hora después apareció la respuesta: «SE LLAMA PEDRO. ES TÍMIDO».","Half an hour later the answer appeared: 'HIS NAME IS PEDRO. HE'S SHY.'","ครึ่งชั่วโมงต่อมา คำตอบก็ปรากฏ: “ชื่อเปโดร เขาขี้อาย”"]],
     [["Así empezaron las cartas.","That's how the letters began.","จดหมายจึงเริ่มต้นขึ้นอย่างนั้น"],
      ["Él se llamaba Mateo, era profesor de música y no sabía cocinar.","His name was Mateo, he was a music teacher and couldn't cook.","เขาชื่อมาเตโอ เป็นครูสอนดนตรีและทำอาหารไม่เป็น"],
      ["Ella le enseñaba recetas en mayúsculas; él le tocaba el violín a las ocho, cuando todo el barrio salía a aplaudir.","She taught him recipes in capital letters; he played the violin for her at eight, when the whole neighbourhood came out to applaud.","เธอสอนสูตรอาหารด้วยตัวอักษรตัวใหญ่ ส่วนเขาสีไวโอลินให้เธอฟังตอนสองทุ่ม เวลาที่ทั้งย่านออกมาปรบมือ"],
      ["Con el tiempo, los folios se volvieron más pequeños y las letras, más difíciles de leer, porque ya no hablaban de cactus.","Over time, the sheets became smaller and the letters harder to read, because they were no longer about cacti.","นานวันเข้า กระดาษเล็กลงและตัวหนังสืออ่านยากขึ้น เพราะเรื่องที่คุยไม่ใช่เรื่องต้นกระบองเพชรอีกต่อไป"]],

  q:[{t:"main",q:["Waar gaat de tekst vooral over?","บทความนี้พูดถึงอะไรเป็นหลัก"],o:["Over fietsen die gestolen worden.","Over de redenen waarom fietsen in Nederland zo populair is.","Over de geschiedenis van de auto.","Over de markt in Amsterdam."],a:1,x:"บทความอธิบายเหตุผลหลายข้อ (พื้นที่ราบ, การประท้วงในยุค 70, ทางจักรยาน) ว่าทำไมคนดัตช์ปั่นจักรยานมาก"},
     {t:"detail",q:["Wat gebeurde er in de jaren zeventig?","เกิดอะไรขึ้นในทศวรรษ 1970"],o:["Er kwamen meer fietsen dan mensen.","Veel kinderen stierven in het verkeer en ouders protesteerden.","De overheid verbood auto's.","Het land werd vlak."],a:1,x:"“veel kinderen kwamen om het leven. Ouders gingen de straat op en protesteerden.” — om het leven komen = เสียชีวิต"},
     {t:"not",q:["Wat staat NIET in de tekst?","ข้อใดไม่มีในบทความ"],o:["Nederland heeft ongeveer 23 miljoen fietsen.","Fietsen is in de stad vaak sneller dan de auto.","Auto's zijn in Nederland verboden.","Het land is vlak."],a:2,x:"บทความไม่ได้พูดว่ารถยนต์ถูกห้าม แค่บอกว่าจักรยานมักเร็วกว่ารถในเมือง"},
     {t:"infer",q:["Wat bedoelt de schrijver met 'Maar dat is niet de enige reden'?","ผู้เขียนหมายถึงอะไรเมื่อเขียนว่า ‘แต่นั่นไม่ใช่เหตุผลเดียว’"],o:["Dat het land eigenlijk niet vlak is.","Dat er ook politieke en historische redenen zijn.","Dat fietsen duur is.","Dat niemand meer fietst."],a:1,x:"ประโยคนี้เป็นตัวเชื่อมไปสู่เหตุผลทางประวัติศาสตร์/การเมือง คือการประท้วงและการลงทุนของรัฐ"},
     {t:"title",q:["Welke titel past ook goed bij de tekst?","ชื่อเรื่องใดเหมาะกับบทความนี้ด้วย"],o:["Van protest naar fietspad","De beste auto's van Europa","Een dag op de markt","Waarom Nederlanders niet sporten"],a:0,x:"บทความเล่าว่าการประท้วงนำไปสู่การสร้างทางจักรยาน “จากการประท้วงสู่ทางจักรยาน” จึงสรุปแก่นได้ดี"}]},
{ id:"nl-r2", cat:"env", lvl:"B2", src:"สิ่งแวดล้อม", title:["Leven onder de zeespiegel","Living below sea level","ใช้ชีวิตใต้ระดับน้ำทะเล"],
  p:[[["Ongeveer een kwart van Nederland ligt onder de zeespiegel, en zonder dijken, duinen en gemalen zou ruim de helft van het land regelmatig onderlopen.","About a quarter of the Netherlands lies below sea level, and without dikes, dunes and pumping stations well over half the country would regularly flood.","ราวหนึ่งในสี่ของเนเธอร์แลนด์อยู่ต่ำกว่าระดับน้ำทะเล และหากไม่มีเขื่อน เนินทราย และสถานีสูบน้ำ ประเทศกว่าครึ่งจะถูกน้ำท่วมเป็นประจำ"],
      ["De strijd tegen het water is daardoor diep verankerd in de nationale identiteit.","The struggle against water is therefore deeply anchored in the national identity.","การต่อสู้กับน้ำจึงฝังรากลึกในอัตลักษณ์ของชาติ"]],
     [["Na de watersnoodramp van 1953, waarbij meer dan achttienhonderd mensen omkwamen, begon het land aan de Deltawerken: een reeks dammen en stormvloedkeringen die tot de grootste waterbouwkundige projecten ter wereld behoren.","After the flood disaster of 1953, in which more than eighteen hundred people died, the country began the Delta Works: a series of dams and storm surge barriers that rank among the largest hydraulic engineering projects in the world.","หลังมหาอุทกภัยปี 1953 ซึ่งมีผู้เสียชีวิตกว่าหนึ่งพันแปดร้อยคน ประเทศได้เริ่มโครงการเดลตาเวิร์กส์ ซึ่งเป็นชุดเขื่อนและประตูกั้นคลื่นพายุที่จัดอยู่ในกลุ่มโครงการวิศวกรรมชลศาสตร์ที่ใหญ่ที่สุดในโลก"],
      ["Lange tijd was de filosofie eenvoudig: hoger en sterker bouwen.","For a long time the philosophy was simple: build higher and stronger.","เป็นเวลานานที่หลักคิดนั้นเรียบง่าย คือสร้างให้สูงขึ้นและแข็งแรงขึ้น"]],
     [["Sinds de jaren negentig is die aanpak echter gekanteld.","Since the nineties, however, that approach has shifted.","อย่างไรก็ตาม ตั้งแต่ทศวรรษ 1990 แนวทางนั้นได้พลิกเปลี่ยนไป"],
      ["Onder het motto 'Ruimte voor de Rivier' werden dijken op sommige plekken juist landinwaarts verlegd, zodat rivieren bij hoogwater veilig kunnen uitstromen over weilanden in plaats van door woonwijken.","Under the motto 'Room for the River', dikes were in some places actually moved inland, so that rivers can safely overflow onto meadows instead of through residential areas during high water.","ภายใต้คำขวัญ ‘พื้นที่ให้แม่น้ำ’ เขื่อนบางแห่งกลับถูกย้ายถอยเข้าไปในแผ่นดิน เพื่อให้แม่น้ำล้นออกไปยังทุ่งหญ้าอย่างปลอดภัยเมื่อน้ำขึ้นสูง แทนที่จะไหลผ่านย่านที่อยู่อาศัย"],
      ["Het idee is niet langer het water te bevechten, maar het een plek te geven.","The idea is no longer to fight the water, but to give it a place.","แนวคิดไม่ใช่การต่อสู้กับน้ำอีกต่อไป แต่คือการให้พื้นที่แก่มัน"]],
     [["Met een stijgende zeespiegel en heviger regenval staat dat model opnieuw onder druk.","With a rising sea level and heavier rainfall, that model is once again under pressure.","เมื่อระดับน้ำทะเลสูงขึ้นและฝนตกหนักขึ้น โมเดลนี้ก็ถูกกดดันอีกครั้ง"],
      ["Sommige experts pleiten al voor drijvende wijken, andere waarschuwen dat ook Nederlands vernuft grenzen kent.","Some experts are already advocating floating neighbourhoods, others warn that Dutch ingenuity also has its limits.","ผู้เชี่ยวชาญบางคนเริ่มเสนอให้สร้างชุมชนลอยน้ำ ขณะที่บางคนเตือนว่าความเฉลียวฉลาดของชาวดัตช์ก็มีขีดจำกัดเช่นกัน"]]],
  v:{"kwart":"B1|n|quarter|หนึ่งในสี่","ligt":"A2|v|lies|ตั้งอยู่|liggen","zeespiegel":"B2|n|sea level|ระดับน้ำทะเล","dijken":"B2|n|dikes|เขื่อน, คันกั้นน้ำ|dijk","gemalen":"C1|n|pumping stations|สถานีสูบน้ำ|gemaal","ruim":"B2|adv|well over|มากกว่า…พอสมควร","helft":"B1|n|half|ครึ่ง","regelmatig":"B1|adv|regularly|เป็นประจำ","onderlopen":"C1|v|to flood|ถูกน้ำท่วม","strijd":"B2|n|struggle, fight|การต่อสู้","daardoor":"B1|adv|because of that|ด้วยเหตุนั้น","verankerd":"C1|adj|anchored|ฝังราก|verankeren","nationale":"B1|adj|national|แห่งชาติ|nationaal","identiteit":"B2|n|identity|อัตลักษณ์","watersnoodramp":"C1|n|flood disaster|มหาอุทกภัย","waarbij":"B2|adv|in which|ซึ่งในนั้น","omkwamen":"B2|v|died, perished|เสียชีวิต|omkomen","deltawerken":"C1|n|Delta Works|โครงการเดลตาเวิร์กส์","reeks":"B2|n|series|ชุด, ลำดับ","dammen":"B1|n|dams|เขื่อน|dam","stormvloedkeringen":"C2|n|storm surge barriers|ประตูกั้นคลื่นพายุ|stormvloedkering","waterbouwkundige":"C2|adj|hydraulic engineering|ด้านวิศวกรรมชลศาสตร์|waterbouwkundig","behoren":"B2|v|to belong, rank among|จัดอยู่ใน","filosofie":"B2|n|philosophy|ปรัชญา, หลักคิด","eenvoudig":"B1|adj|simple|เรียบง่าย","aanpak":"B2|n|approach|แนวทาง","echter":"B2|adv|however|อย่างไรก็ตาม","gekanteld":"C1|v|tilted, shifted|พลิก, เปลี่ยน|kantelen","ruimte":"B1|n|space, room|พื้นที่","rivier":"A2|n|river|แม่น้ำ","plekken":"B1|n|places|สถานที่|plek","landinwaarts":"C1|adv|inland|เข้าไปในแผ่นดิน","verlegd":"C1|v|moved, relocated|ย้าย|verleggen","zodat":"B1|conj|so that|เพื่อที่จะ","hoogwater":"B2|n|high water|น้ำขึ้นสูง","uitstromen":"C1|v|to flow out|ไหลออก","weilanden":"B2|n|meadows|ทุ่งหญ้า|weiland","in plaats van":"B1|expr|instead of|แทนที่จะ","woonwijken":"B2|n|residential areas|ย่านที่อยู่อาศัย|woonwijk","niet langer":"B2|expr|no longer|ไม่…อีกต่อไป","bevechten":"C1|v|to fight against|ต่อสู้กับ","stijgende":"B2|adj|rising|ที่สูงขึ้น|stijgen","heviger":"B2|adj|heavier, more intense|รุนแรงกว่า|hevig","regenval":"B2|n|rainfall|ปริมาณฝน","onder druk":"B2|expr|under pressure|อยู่ภายใต้แรงกดดัน","pleiten":"C1|v|to advocate|สนับสนุน, เรียกร้อง","drijvende":"B2|adj|floating|ลอยน้ำ|drijven","wijken":"B1|n|neighbourhoods|ย่าน|wijk","waarschuwen":"B1|v|to warn|เตือน","vernuft":"C2|n|ingenuity|ความเฉลียวฉลาด","grenzen":"B1|n|limits, borders|ขีดจำกัด, พรมแดน|grens"},
  q:[{t:"main",q:["Wat is de kern van de tekst?","แก่นของบทความคืออะไร"],o:["Nederland heeft het water definitief overwonnen.","De Nederlandse omgang met water is geëvolueerd van bevechten naar ruimte geven, en staat opnieuw voor uitdagingen.","Drijvende wijken zijn de enige oplossing.","De ramp van 1953 had weinig gevolgen."],a:1,x:"โครงเรื่อง: ต่อสู้กับน้ำ → 1953 และเดลตาเวิร์กส์ → เปลี่ยนเป็น ‘ให้พื้นที่แม่น้ำ’ → แรงกดดันใหม่ ข้อ B ครอบคลุมทั้งหมด"},
     {t:"detail",q:["Wat houdt 'Ruimte voor de Rivier' in?","‘Ruimte voor de Rivier’ หมายถึงอะไร"],o:["Hogere dijken langs alle rivieren.","Rivieren de mogelijkheid geven om veilig buiten hun bedding te treden, bijvoorbeeld over weilanden.","Woonwijken bouwen in rivieren.","Rivieren laten opdrogen."],a:1,x:"เขื่อนถูกย้ายเข้าไปในแผ่นดินเพื่อให้น้ำล้นไปที่ทุ่งหญ้าแทนย่านที่อยู่อาศัย"},
     {t:"vocab",q:["'Die aanpak is gekanteld' betekent in deze context dat…","‘Die aanpak is gekanteld’ ในบริบทนี้หมายความว่า…"],o:["de aanpak is mislukt.","de aanpak fundamenteel is veranderd.","de aanpak hetzelfde is gebleven.","de dijken zijn omgevallen."],a:1,x:"kantelen แปลตรงตัวว่า ‘พลิก/เอียง’ ใช้เชิงเปรียบเทียบว่าแนวคิดเปลี่ยนไปอย่างมีนัยสำคัญ ประโยคถัดมาให้ตัวอย่างการเปลี่ยน"},
     {t:"not",q:["Welke bewering is in strijd met de tekst?","ข้อใดขัดแย้งกับบทความ"],o:["Zonder bescherming zou meer dan de helft van het land regelmatig overstromen.","Bij de ramp van 1953 kwamen ruim 1800 mensen om.","Alle experts zijn het eens dat drijvende wijken de toekomst zijn.","Klimaatverandering zet het huidige model onder druk."],a:2,x:"บทความบอกว่า ‘sommige experts… andere waarschuwen’ แปลว่าผู้เชี่ยวชาญเห็นไม่ตรงกัน ข้อ C จึงขัดแย้ง"},
     {t:"tone",q:["Welke houding neemt de auteur aan in de laatste alinea?","ผู้เขียนมีท่าทีอย่างไรในย่อหน้าสุดท้าย"],o:["Triomfantelijk.","Genuanceerd: hij presenteert verschillende standpunten zonder een definitief oordeel.","Volledig pessimistisch.","Spottend."],a:1,x:"ผู้เขียนเสนอทั้งฝ่ายที่สนับสนุนชุมชนลอยน้ำและฝ่ายที่เตือน โดยไม่ตัดสินเอง จึงเป็นท่าทีที่ชั่งน้ำหนัก"}]},
{ id:"nl-r3", cat:"health", lvl:"B1", src:"สุขภาพ/สังคม", title:["Eenzaamheid: niet alleen een probleem van ouderen","Loneliness: not just a problem of the elderly","ความเหงา: ไม่ใช่ปัญหาของผู้สูงอายุเท่านั้น"],
  p:[[["Als we aan eenzaamheid denken, zien we vaak een oudere vrouw die alleen thuis zit.","When we think of loneliness, we often picture an older woman sitting alone at home.","เมื่อนึกถึงความเหงา เรามักนึกภาพหญิงสูงอายุนั่งอยู่บ้านคนเดียว"],
      ["Toch blijkt uit onderzoek dat jongeren tussen de achttien en vijfentwintig zich minstens zo vaak eenzaam voelen.","Yet research shows that young people between eighteen and twenty-five feel lonely at least as often.","แต่ผลวิจัยชี้ว่าคนหนุ่มสาวอายุสิบแปดถึงยี่สิบห้าปีรู้สึกเหงาบ่อยไม่แพ้กัน"]],
     [["Dat lijkt vreemd, want jongeren hebben vaak honderden contacten op sociale media.","That seems strange, because young people often have hundreds of contacts on social media.","ดูแปลก เพราะคนหนุ่มสาวมักมีคนติดต่อในโซเชียลมีเดียเป็นร้อยๆ"],
      ["Maar eenzaamheid gaat niet over het aantal mensen om je heen; het gaat over het gevoel dat niemand je echt begrijpt.","But loneliness isn't about the number of people around you; it's about the feeling that nobody really understands you.","แต่ความเหงาไม่ได้เกี่ยวกับจำนวนคนรอบตัว มันเกี่ยวกับความรู้สึกว่าไม่มีใครเข้าใจเราจริงๆ"],
      ["Je kunt je dus eenzaam voelen in een volle collegezaal.","So you can feel lonely in a full lecture hall.","เราจึงรู้สึกเหงาได้แม้ในห้องบรรยายที่เต็มไปด้วยผู้คน"]],
     [["Langdurige eenzaamheid is slecht voor de gezondheid: het verhoogt het risico op depressie, slaapproblemen en zelfs hartziekten.","Long-term loneliness is bad for health: it increases the risk of depression, sleep problems and even heart disease.","ความเหงาเรื้อรังไม่ดีต่อสุขภาพ เพิ่มความเสี่ยงต่อภาวะซึมเศร้า ปัญหาการนอน และแม้แต่โรคหัวใจ"],
      ["Psychologen raden aan om klein te beginnen: een vast moment per week met één vriend, of vrijwilligerswerk, waarbij je samen iets doet in plaats van alleen te praten.","Psychologists recommend starting small: a fixed moment each week with one friend, or volunteer work, where you do something together instead of only talking.","นักจิตวิทยาแนะนำให้เริ่มจากสิ่งเล็กๆ เช่น นัดเพื่อนหนึ่งคนเป็นประจำทุกสัปดาห์ หรือทำงานอาสาสมัครที่ได้ทำอะไรด้วยกัน แทนที่จะแค่คุยกัน"]]],

  q:[{t:"main",q:["Wat is de belangrijkste boodschap van de tekst?","สารสำคัญที่สุดของบทความคืออะไร"],o:["Sociale media maken iedereen eenzaam.","Eenzaamheid komt in alle leeftijden voor en hangt af van de kwaliteit van contact, niet van het aantal.","Ouderen zijn nooit eenzaam.","Je moet meer vrienden op sociale media zoeken."],a:1,x:"บทความชี้ว่าเด็กหนุ่มสาวก็เหงา และ ‘ความเหงาไม่ใช่เรื่องจำนวนคน แต่เป็นความรู้สึกว่าไม่มีใครเข้าใจ’ ข้อ A เกินจริงจากที่บทความกล่าว"},
     {t:"detail",q:["Welke leeftijdsgroep voelt zich volgens onderzoek minstens zo vaak eenzaam als ouderen?","ตามผลวิจัย กลุ่มอายุใดรู้สึกเหงาบ่อยไม่แพ้ผู้สูงอายุ"],o:["Kinderen onder de twaalf.","Jongeren tussen 18 en 25.","Mensen van 40 tot 50.","Gepensioneerden."],a:1,x:"“jongeren tussen de achttien en vijfentwintig zich minstens zo vaak eenzaam voelen”"},
     {t:"infer",q:["Waarom noemt de schrijver 'een volle collegezaal'?","ทำไมผู้เขียนยกตัวอย่าง ‘ห้องบรรยายที่เต็มไปด้วยคน’"],o:["Om te laten zien dat studeren saai is.","Om te illustreren dat je tussen veel mensen toch eenzaam kunt zijn.","Omdat collegezalen te klein zijn.","Om studenten te bekritiseren."],a:1,x:"เป็นตัวอย่างสนับสนุนประโยคก่อนหน้าว่าความเหงาไม่ขึ้นกับจำนวนคนรอบตัว"},
     {t:"not",q:["Wat noemt de tekst NIET als gevolg van langdurige eenzaamheid?","ข้อใดบทความไม่ได้กล่าวว่าเป็นผลของความเหงาเรื้อรัง"],o:["Depressie.","Slaapproblemen.","Hartziekten.","Overgewicht."],a:3,x:"บทความระบุ depressie, slaapproblemen, hartziekten แต่ไม่ได้พูดถึงน้ำหนักเกิน (overgewicht)"},
     {t:"detail",q:["Wat raden psychologen aan?","นักจิตวิทยาแนะนำอะไร"],o:["Meteen veel nieuwe mensen ontmoeten.","Klein beginnen, bijvoorbeeld met een vaste afspraak of samen iets doen.","Sociale media volledig stoppen.","Alleen praten over problemen."],a:1,x:"“klein te beginnen: een vast moment per week… of vrijwilligerswerk, waarbij je samen iets doet in plaats van alleen te praten” ข้อ D กลับด้านกับคำแนะนำ"}]}

novel: [
{ id:"nl-n1", genre:"fantasy", lvl:"B2", title:["De kaartenmaker van Drijfstad","The mapmaker of Drijfstad","ช่างทำแผนที่แห่งเมืองลอยน้ำ"], blurb:"ในเมืองที่ลอยไปตามกระแสน้ำ แผนที่ไม่ได้บอกว่าเราอยู่ที่ไหน แต่บอกว่าเราจะไปอยู่ที่ไหน",
  p:[[["In Drijfstad lag niets ooit twee nachten op dezelfde plek.","In Drijfstad nothing ever lay in the same place for two nights.","ในเมืองดไรฟ์สตัด ไม่มีสิ่งใดอยู่ที่เดิมได้นานถึงสองคืน"],
      ["De huizen rustten op reusachtige vlotten van zwart eikenhout, en elke nacht verschoof de stroming de straten een beetje, zodat de bakker soms naast de haven wakker werd en de burgemeester naast de vismarkt.","The houses rested on gigantic rafts of black oak, and every night the current shifted the streets a little, so that the baker sometimes woke up next to the harbour and the mayor next to the fish market.","บ้านเรือนตั้งอยู่บนแพยักษ์ทำจากไม้โอ๊กสีดำ และทุกคืนกระแสน้ำจะเลื่อนถนนไปเล็กน้อย บางครั้งคนทำขนมปังตื่นมาพบว่าอยู่ข้างท่าเรือ และนายกเทศมนตรีอยู่ข้างตลาดปลา"],
      ["Daarom was Mira de Wit de belangrijkste persoon van de stad, hoewel bijna niemand haar naam kende.","That is why Mira de Wit was the most important person in the city, although almost nobody knew her name.","ด้วยเหตุนี้ มีรา เดอ วิตจึงเป็นบุคคลสำคัญที่สุดของเมือง แม้แทบไม่มีใครรู้จักชื่อเธอ"]],
     [["Mira tekende kaarten.","Mira drew maps.","มีราวาดแผนที่"],
      ["Niet van hoe de stad eruitzag, want dat had geen zin, maar van hoe de stad er morgen uit zou zien.","Not of what the city looked like, because that was pointless, but of what the city would look like tomorrow.","ไม่ใช่แผนที่ว่าเมืองหน้าตาเป็นอย่างไร เพราะไร้ประโยชน์ แต่เป็นแผนที่ว่าพรุ่งนี้เมืองจะเป็นอย่างไร"],
      ["Ze luisterde 's avonds naar het kraken van de touwen, voelde met haar blote voeten de richting van het water en liet haar pen het werk doen.","In the evening she listened to the creaking of the ropes, felt the direction of the water with her bare feet and let her pen do the work.","ยามเย็นเธอฟังเสียงเชือกเอี๊ยดอ๊าด ใช้เท้าเปล่าสัมผัสทิศทางของน้ำ แล้วปล่อยให้ปากกาทำงานเอง"],
      ["Haar kaarten hadden zich in veertig jaar nooit vergist.","In forty years, her maps had never been wrong.","ตลอดสี่สิบปี แผนที่ของเธอไม่เคยผิดพลาดเลย"]],
     [["Tot die ene dinsdag.","Until that one Tuesday.","จนกระทั่งวันอังคารวันนั้น"],
      ["Toen ze de inkt liet drogen, zag Mira dat er op haar kaart een straat stond die niet bestond: een smalle steeg, helemaal aan de rand, die eindigde in het open water.","As she let the ink dry, Mira saw that on her map there was a street that didn't exist: a narrow alley, right at the edge, that ended in open water.","ขณะปล่อยให้หมึกแห้ง มีราเห็นว่าบนแผนที่มีถนนสายหนึ่งที่ไม่มีอยู่จริง เป็นตรอกแคบๆ ที่ขอบสุดของเมือง ซึ่งไปสิ้นสุดที่น้ำเปิด"],
      ["Boven de steeg had haar hand, zonder dat ze het merkte, één woord geschreven: Thuis.","Above the alley her hand had, without her noticing, written a single word: Home.","เหนือตรอกนั้น มือของเธอเขียนคำหนึ่งไว้โดยไม่รู้ตัว: บ้าน"]],
     "* * *",
     [["De volgende ochtend was de steeg er.","The next morning, the alley was there.","เช้าวันต่อมา ตรอกนั้นก็ปรากฏขึ้นจริง"],
      ["Mira liep erheen in haar ochtendjas, terwijl de mist nog als natte wol tussen de huizen hing.","Mira walked there in her dressing gown, while the mist still hung like wet wool between the houses.","มีราเดินไปที่นั่นในชุดคลุมนอน ขณะที่หมอกยังลอยอยู่ระหว่างบ้านเรือนราวกับขนแกะเปียก"],
      ["Aan het einde, waar het vlot ophield, lag een klein bootje, en in het bootje zat een meisje met inkt aan haar vingers.","At the end, where the raft stopped, lay a small boat, and in the boat sat a girl with ink on her fingers.","ที่ปลายตรอกซึ่งแพสิ้นสุด มีเรือลำเล็กลอยอยู่ และในเรือมีเด็กหญิงคนหนึ่งนั่งอยู่ นิ้วมือเปื้อนหมึก"],
      ["'Ik heb de stad gisteren getekend,' zei het meisje verlegen, 'en ik wist niet waar ik anders heen moest.'","'I drew the city yesterday,' the girl said shyly, 'and I didn't know where else to go.'","“หนูวาดเมืองนี้เมื่อวาน” เด็กหญิงพูดอย่างเขินอาย “แล้วหนูก็ไม่รู้ว่าจะไปที่ไหนอีก”"]],
     [["Mira keek naar de kleine, trillende handen, en voor het eerst in veertig jaar begreep ze waarom haar kaarten nooit over haarzelf gingen.","Mira looked at the small, trembling hands, and for the first time in forty years she understood why her maps had never been about herself.","มีรามองมือเล็กๆ ที่สั่นเทา และเป็นครั้งแรกในรอบสี่สิบปีที่เธอเข้าใจว่าทำไมแผนที่ของเธอไม่เคยมีตัวเธอเองอยู่เลย"],
      ["Een kaartenmaker tekent de weg voor anderen, tot er iemand komt die de weg naar haar tekent.","A mapmaker draws the way for others, until someone comes who draws the way to her.","ช่างทำแผนที่วาดทางให้คนอื่น จนกว่าจะมีใครสักคนมาวาดทางกลับไปหาเธอ"]]],
  v:{"lag":"B1|v|lay|ตั้งอยู่, นอนอยู่|liggen","dezelfde":"A2|det|the same|เดียวกัน","plek":"B1|n|place|สถานที่","rustten":"B2|v|rested|วางอยู่, พัก|rusten","reusachtige":"C1|adj|gigantic|มหึมา|reusachtig","vlotten":"B2|n|rafts|แพ|vlot","eikenhout":"C1|n|oak wood|ไม้โอ๊ก","verschoof":"C1|v|shifted|เลื่อน|verschuiven","stroming":"B2|n|current|กระแสน้ำ","beetje":"A2|n|bit|นิดหน่อย","bakker":"A2|n|baker|คนทำขนมปัง","naast":"A2|prep|next to|ข้างๆ","haven":"B1|n|harbour|ท่าเรือ","wakker":"A2|adj|awake|ตื่น","burgemeester":"B1|n|mayor|นายกเทศมนตรี","vismarkt":"B1|n|fish market|ตลาดปลา","daarom":"A2|adv|therefore|ด้วยเหตุนั้น","belangrijkste":"B1|adj|most important|สำคัญที่สุด|belangrijk","hoewel":"B1|conj|although|แม้ว่า","kende":"A2|v|knew|รู้จัก|kennen","tekende":"B1|v|drew|วาด|tekenen","kaarten":"A2|n|maps; cards|แผนที่; การ์ด|kaart","eruitzag":"B2|v|looked like|มีหน้าตา|eruitzien","geen zin":"B2|expr|no point|ไม่มีประโยชน์","luisterde":"A2|v|listened|ฟัง|luisteren","kraken":"C1|n|creaking|เสียงเอี๊ยดอ๊าด","touwen":"B2|n|ropes|เชือก|touw","blote":"B2|adj|bare|เปลือย|bloot","voeten":"A1|n|feet|เท้า|voet","richting":"B1|n|direction|ทิศทาง","pen":"A1|n|pen|ปากกา","vergist":"B2|v|been mistaken|ผิดพลาด|zich vergissen","inkt":"B1|n|ink|หมึก","drogen":"B1|v|to dry|ทำให้แห้ง","bestond":"B1|v|existed|มีอยู่|bestaan","smalle":"B1|adj|narrow|แคบ|smal","steeg":"C1|n|alley|ตรอก","rand":"B2|n|edge|ขอบ","eindigde":"B1|v|ended|สิ้นสุด|eindigen","merkte":"B1|v|noticed|สังเกต|merken","ochtendjas":"C1|n|dressing gown|ชุดคลุมนอน","mist":"B1|n|mist, fog|หมอก","wol":"B2|n|wool|ขนแกะ","hing":"B1|v|hung|แขวน, ลอย|hangen","ophield":"B2|v|stopped, ended|หยุด, สิ้นสุด|ophouden","bootje":"A2|n|little boat|เรือเล็ก|boot","vingers":"A2|n|fingers|นิ้ว|vinger","verlegen":"B2|adj|shy|เขินอาย","trillende":"B2|adj|trembling|สั่นเทา|trillen","begreep":"B1|v|understood|เข้าใจ|begrijpen","haarzelf":"B2|pron|herself|ตัวเธอเอง"}},
{ id:"nl-n2", genre:"mystery", lvl:"B1", title:["Het zevende kopje","The seventh cup","ถ้วยใบที่เจ็ด"], blurb:"งานเลี้ยงวันเกิดหกคน แต่มีถ้วยชาเจ็ดใบบนโต๊ะ และไม่มีใครยอมรับว่าเป็นของตัวเอง",
  p:[[["Tante Wil werd negentig, en zoals elk jaar dronken we thee in haar donkere kamer aan de gracht.","Aunt Wil turned ninety, and as every year we drank tea in her dark room by the canal.","ป้าวิลอายุครบเก้าสิบปี และเหมือนทุกปี เราดื่มชากันในห้องมืดๆ ของป้าริมคลอง"],
      ["We waren met zes: tante Wil, mijn moeder, mijn twee neven, de buurvrouw en ik.","There were six of us: Aunt Wil, my mother, my two cousins, the neighbour and me.","เรามีกันหกคน: ป้าวิล แม่ของฉัน ลูกพี่ลูกน้องสองคน หญิงเพื่อนบ้าน และฉัน"],
      ["Toch stonden er zeven kopjes op tafel.","Yet there were seven cups on the table.","แต่บนโต๊ะกลับมีถ้วยชาเจ็ดใบ"]],
     [["Het zevende kopje stond bij de lege stoel bij het raam.","The seventh cup stood by the empty chair near the window.","ถ้วยใบที่เจ็ดวางอยู่ตรงเก้าอี้ว่างข้างหน้าต่าง"],
      ["Er zat thee in, nog warm, en op de rand zat een vage afdruk van rode lippenstift.","There was tea in it, still warm, and on the rim was a faint print of red lipstick.","ในถ้วยมีชาที่ยังอุ่นอยู่ และที่ขอบถ้วยมีรอยลิปสติกสีแดงจางๆ"],
      ["Niemand van ons droeg rode lippenstift.","None of us wore red lipstick.","ไม่มีใครในพวกเราทาลิปสติกสีแดง"]],
     [["'Dat is voor Hendrika,' zei tante Wil kalm, terwijl ze een koekje in haar thee doopte.","'That's for Hendrika,' Aunt Wil said calmly, while she dunked a biscuit in her tea.","“ถ้วยนั้นของเฮนดริกา” ป้าวิลพูดอย่างใจเย็น ขณะจุ่มคุกกี้ลงในชา"],
      ["Mijn moeder werd bleek.","My mother turned pale.","แม่ของฉันหน้าซีด"],
      ["Hendrika was tante Wils zus, en ze was in 1962 verdwenen, op de dag van haar eigen verjaardagsfeest.","Hendrika was Aunt Wil's sister, and she had disappeared in 1962, on the day of her own birthday party.","เฮนดริกาเป็นน้องสาวของป้าวิล และเธอหายตัวไปในปี 1962 ในวันงานเลี้ยงวันเกิดของตัวเอง"]],
     [["Ik besloot het raadsel op te lossen.","I decided to solve the mystery.","ฉันตัดสินใจไขปริศนานี้"],
      ["Terwijl de anderen over het weer praatten, bekeek ik de kamer zoals een detective dat zou doen.","While the others talked about the weather, I examined the room the way a detective would.","ระหว่างที่คนอื่นคุยเรื่องอากาศ ฉันสำรวจห้องอย่างที่นักสืบจะทำ"],
      ["Onder de lege stoel lag een oude sleutel, en achter het gordijn hing een jas die naar lavendel rook.","Under the empty chair lay an old key, and behind the curtain hung a coat that smelled of lavender.","ใต้เก้าอี้ว่างมีกุญแจเก่าวางอยู่ และหลังผ้าม่านมีเสื้อโค้ตที่มีกลิ่นลาเวนเดอร์แขวนอยู่"]],
     "* * *",
     [["Pas toen iedereen weg was, vertelde tante Wil me de waarheid.","Only when everyone had gone did Aunt Wil tell me the truth.","จนกระทั่งทุกคนกลับไปแล้ว ป้าวิลจึงเล่าความจริงให้ฉันฟัง"],
      ["Hendrika was niet verdwenen; ze was gevlucht, met een man die de familie niet goedkeurde.","Hendrika had not disappeared; she had run away, with a man the family did not approve of.","เฮนดริกาไม่ได้หายตัวไป แต่หนีไปกับผู้ชายที่ครอบครัวไม่ยอมรับ"],
      ["Elk jaar, op haar verjaardag, kwam ze terug via de achterdeur, dronk één kopje thee bij het raam en vertrok weer voordat iemand het merkte.","Every year, on her birthday, she came back through the back door, drank one cup of tea by the window and left again before anyone noticed.","ทุกปีในวันเกิดของเธอ เธอจะกลับมาทางประตูหลัง ดื่มชาหนึ่งถ้วยข้างหน้าต่าง แล้วจากไปก่อนที่ใครจะสังเกต"],

     ["Ik werk zelf vier dagen en geniet van mijn vrije woensdag, maar ik merk ook de keerzijde.","I work four days myself and enjoy my free Wednesday, but I also notice the downside.","ตัวฉันเองทำงานสี่วัน และมีความสุขกับวันพุธที่ได้หยุด แต่ก็เห็นด้านลบด้วย"],
     ["Vooral vrouwen werken in deeltijd, wat gevolgen heeft voor hun carrière en pensioen, terwijl ziekenhuizen en scholen schreeuwen om personeel.","It is mostly women who work part-time, which has consequences for their career and pension, while hospitals and schools are crying out for staff.","คนที่ทำงานพาร์ตไทม์ส่วนใหญ่เป็นผู้หญิง ซึ่งส่งผลต่อหน้าที่การงานและเงินบำนาญ ขณะที่โรงพยาบาลและโรงเรียนขาดแคลนบุคลากรอย่างหนัก"],
     ["Is deeltijd een verworvenheid of een valkuil?","Is part-time work an achievement or a trap?","การทำงานพาร์ตไทม์เป็นความก้าวหน้าหรือกับดักกันแน่?"]],

  c:[{u:"Bas", s:[["Het hangt ervan af of het een vrije keuze is of dat er geen betaalbare kinderopvang is.","It depends on whether it's a free choice or whether there's no affordable childcare.","ขึ้นอยู่กับว่าเป็นทางเลือกโดยสมัครใจ หรือเพราะไม่มีที่รับเลี้ยงเด็กในราคาที่จ่ายไหว"]]}],

{ id:"nl-f13", cat:"life", lvl:"C1", user:"Annelies Groen", handle:"annelies_direct", time:"3 สัปดาห์", likes:1876,
  s:[["Een Japanse collega vroeg me laatst voorzichtig waarom Nederlanders 'zo bot' zijn.","A Japanese colleague recently asked me cautiously why Dutch people are 'so blunt'.","เพื่อนร่วมงานชาวญี่ปุ่นถามฉันอย่างระมัดระวังเมื่อเร็วๆ นี้ว่าทำไมคนดัตช์ถึง ‘ทื่อ’ นัก"],
     ["Mijn eerste reflex was me te verdedigen: wij noemen het eerlijkheid, efficiëntie, respect voor iemands tijd.","My first reflex was to defend myself: we call it honesty, efficiency, respect for someone's time.","ปฏิกิริยาแรกของฉันคือแก้ตัว เราเรียกมันว่าความซื่อตรง ความมีประสิทธิภาพ และการเคารพเวลาของผู้อื่น"],
     ["Maar toen ze uitlegde hoe gekwetst ze zich had gevoeld door een 'eerlijke' opmerking over haar presentatie, besefte ik dat directheid alleen een deugd is als de ander de code kent.","But when she explained how hurt she had felt by an 'honest' remark about her presentation, I realised that directness is only a virtue if the other person knows the code.","แต่เมื่อเธออธิบายว่ารู้สึกเจ็บแค่ไหนกับคำวิจารณ์ ‘ตรงไปตรงมา’ เรื่องการนำเสนอของเธอ ฉันจึงตระหนักว่าความตรงจะเป็นคุณธรรมก็ต่อเมื่ออีกฝ่ายเข้าใจรหัสเดียวกัน"],
     ["Anders is het gewoon onbeleefdheid met een goed geweten.","Otherwise it's just rudeness with a clear conscience.","ไม่อย่างนั้นมันก็เป็นแค่ความหยาบคายที่ทำโดยไม่รู้สึกผิด"]],
  v:{"japanse":"A2|adj|Japanese|ญี่ปุ่น|Japans","collega":"A2|n|colleague|เพื่อนร่วมงาน","laatst":"B1|adv|recently|เมื่อเร็วๆ นี้","voorzichtig":"B1|adv|cautiously|อย่างระมัดระวัง","bot":"C1|adj|blunt|ทื่อ, ห้วน","reflex":"B2|n|reflex|ปฏิกิริยาอัตโนมัติ","verdedigen":"B2|v|to defend|ปกป้อง, แก้ตัว","eerlijkheid":"B2|n|honesty|ความซื่อสัตย์","efficiëntie":"B2|n|efficiency|ประสิทธิภาพ","respect":"B1|n|respect|ความเคารพ","uitlegde":"B1|v|explained|อธิบาย|uitleggen","gekwetst":"C1|adj|hurt (emotionally)|เจ็บใจ|kwetsen","opmerking":"B1|n|remark|คำพูด, ข้อสังเกต","presentatie":"B1|n|presentation|การนำเสนอ","besefte":"C1|v|realised|ตระหนัก|beseffen","directheid":"C1|n|directness|ความตรงไปตรงมา","deugd":"C1|n|virtue|คุณธรรม","code":"B2|n|code|รหัส","anders":"B1|adv|otherwise|ไม่อย่างนั้น","onbeleefdheid":"C1|n|rudeness|ความหยาบคาย","geweten":"C1|n|conscience|มโนธรรม"},
  c:[{u:"Ricardo", s:[["Als Braziliaan in Utrecht heb ik leren onderscheiden tussen 'bot' en 'duidelijk'. Het verschil zit vaak in een glimlach.","As a Brazilian in Utrecht I've learned to tell 'blunt' from 'clear'. The difference is often in a smile.","ในฐานะคนบราซิลในอูเทรกต์ ผมเรียนรู้ที่จะแยก ‘ทื่อ’ กับ ‘ชัดเจน’ ความต่างมักอยู่ที่รอยยิ้ม"]]}],
  vv:{"onderscheiden":"C1|v|to distinguish|แยกแยะ","duidelijk":"B1|adj|clear|ชัดเจน","verschil":"B1|n|difference|ความแตกต่าง","glimlach":"B1|n|smile|รอยยิ้ม"} },

  s:[["Vandaag ben ik met mijn oma naar de bollenvelden gefietst.","Today I cycled to the bulb fields with my grandma.","วันนี้ฉันปั่นจักรยานไปทุ่งดอกทิวลิปกับคุณยาย"],
     ["Rood, geel, roze, paars: de tulpen staan in lange rechte rijen tot aan de horizon.","Red, yellow, pink, purple: the tulips stand in long straight rows up to the horizon.","แดง เหลือง ชมพู ม่วง ทิวลิปเรียงเป็นแถวตรงยาวไปจนถึงขอบฟ้า"],
