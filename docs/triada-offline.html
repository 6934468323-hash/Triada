{ id:"nl-r4", cat:"history", lvl:"A2", src:"ศิลปะ/ประวัติศาสตร์", title:["De Nachtwacht is eigenlijk geen nachtscène","The Night Watch isn't really a night scene","ภาพยามราตรีที่จริงไม่ใช่ฉากกลางคืน"],
  p:[[["In het Rijksmuseum in Amsterdam hangt het beroemdste schilderij van Nederland: De Nachtwacht van Rembrandt.","In the Rijksmuseum in Amsterdam hangs the most famous painting in the Netherlands: The Night Watch by Rembrandt.","ในพิพิธภัณฑ์ไรก์สในอัมสเตอร์ดัม มีภาพวาดที่มีชื่อเสียงที่สุดของเนเธอร์แลนด์แขวนอยู่ คือภาพยามราตรีของแร็มบรันต์"],
      ["Rembrandt schilderde het in 1642.","Rembrandt painted it in 1642.","แร็มบรันต์วาดภาพนี้ในปี 1642"],
      ["Het is enorm: bijna vier meter hoog en meer dan vier meter breed.","It's enormous: almost four metres high and more than four metres wide.","ภาพใหญ่มาก สูงเกือบสี่เมตร และกว้างกว่าสี่เมตร"]],
     [["Op het schilderij zie je een groep mannen met wapens en vlaggen.","In the painting you see a group of men with weapons and flags.","ในภาพจะเห็นกลุ่มผู้ชายถืออาวุธและธง"],
      ["Het zijn geen soldaten, maar rijke burgers die samen de stad bewaakten.","They aren't soldiers, but rich citizens who guarded the city together.","พวกเขาไม่ใช่ทหาร แต่เป็นพลเมืองร่ำรวยที่ร่วมกันเฝ้ารักษาเมือง"],
      ["Ze betaalden Rembrandt om een groepsportret te maken.","They paid Rembrandt to make a group portrait.","พวกเขาจ้างแร็มบรันต์ให้วาดภาพหมู่"]],
     [["Waarom heet het dan 'De Nachtwacht'?","Why is it called 'The Night Watch', then?","แล้วทำไมถึงเรียกว่า ‘ภาพยามราตรี’?"],
      ["Door oude vernis werd het schilderij in de loop van de tijd steeds donkerder.","Because of old varnish, the painting became darker and darker over time.","เพราะน้ำมันเคลือบเงาเก่า ภาพจึงมืดลงเรื่อยๆ ตามกาลเวลา"],
      ["Mensen dachten later dat het 's nachts speelde, maar eigenlijk is het een scène overdag.","People later thought it took place at night, but it's actually a daytime scene.","คนรุ่นหลังจึงคิดว่าเป็นฉากกลางคืน แต่ที่จริงเป็นฉากกลางวัน"]]],
  v:{"nachtwacht":"B1|n|night watch|ยามกลางคืน","nachtscène":"B1|n|night scene|ฉากกลางคืน","rijksmuseum":"A2|n|Rijksmuseum (national museum)|พิพิธภัณฑ์แห่งชาติไรก์ส","hangt":"A2|v|hangs|แขวน|hangen","beroemdste":"B1|adj|most famous|มีชื่อเสียงที่สุด|beroemd","schilderij":"A2|n|painting|ภาพวาด","schilderde":"A2|v|painted|วาด|schilderen","enorm":"B1|adj|enormous|ใหญ่โต","hoog":"A1|adj|high|สูง","breed":"A2|adj|wide|กว้าง","groep":"A2|n|group|กลุ่ม","wapens":"B1|n|weapons|อาวุธ|wapen","vlaggen":"A2|n|flags|ธง|vlag","soldaten":"B1|n|soldiers|ทหาร|soldaat","rijke":"A2|adj|rich|ร่ำรวย|rijk","burgers":"B1|n|citizens|พลเมือง|burger","bewaakten":"B2|v|guarded|เฝ้ารักษา|bewaken","betaalden":"A2|v|paid|จ่าย|betalen","groepsportret":"B2|n|group portrait|ภาพเหมือนหมู่","vernis":"C1|n|varnish|น้ำมันเคลือบเงา","in de loop van de tijd":"B2|expr|over time|เมื่อเวลาผ่านไป","donkerder":"A2|adj|darker|มืดกว่า|donker","dachten":"A2|v|thought|คิด|denken","'s nachts":"A2|adv|at night|ตอนกลางคืน","speelde":"B1|v|took place, played|เกิดขึ้น, เล่น|spelen","overdag":"A2|adv|during the day|ตอนกลางวัน"},
  q:[{t:"main",q:["Wat is de belangrijkste informatie in de tekst?","ข้อมูลสำคัญที่สุดในบทความคืออะไร"],o:["Rembrandt woonde in Amsterdam.","De Nachtwacht is een groot groepsportret dat door oude vernis donker werd en daardoor een verkeerde naam kreeg.","Het Rijksmuseum is groot.","De mannen op het schilderij zijn soldaten."],a:1,x:"บทความอธิบายว่าภาพคืออะไร ใครอยู่ในภาพ และทำไมชื่อจึงผิดความจริง ข้อ B ครอบคลุมที่สุด"},
     {t:"detail",q:["Wie staan er op het schilderij?","ใครอยู่ในภาพ"],o:["Soldaten van het leger.","Rijke burgers die de stad bewaakten.","De familie van Rembrandt.","Koningen en koninginnen."],a:1,x:"“Het zijn geen soldaten, maar rijke burgers die samen de stad bewaakten.”"},
     {t:"not",q:["Wat is NIET waar volgens de tekst?","ข้อใดไม่จริงตามบทความ"],o:["Het schilderij is bijna vier meter hoog.","Rembrandt schilderde het in 1642.","Rembrandt wilde een nachtscène schilderen.","De mannen betaalden Rembrandt."],a:2,x:"บทความบอกว่า ‘eigenlijk is het een scène overdag’ แร็มบรันต์ไม่ได้ตั้งใจวาดฉากกลางคืน"},
     {t:"vocab",q:["Wat betekent 'overdag'?","‘overdag’ หมายถึงอะไร"],o:["'s nachts","tijdens de dag","heel vroeg","gisteren"],a:1,x:"overdag = ช่วงกลางวัน ตรงข้ามกับ ’s nachts ในประโยคเดียวกัน"},
     {t:"infer",q:["Waarom is de naam 'De Nachtwacht' een beetje vreemd?","ทำไมชื่อ ‘ภาพยามราตรี’ จึงดูแปลกนิดหน่อย"],o:["Omdat het schilderij te klein is.","Omdat de scène eigenlijk overdag plaatsvindt.","Omdat er geen mensen op staan.","Omdat Rembrandt geen Nederlander was."],a:1,x:"ชื่อมาจากความเข้าใจผิดเพราะภาพมืดลง ที่จริงเป็นฉากกลางวัน"}]},
{ id:"nl-r5", cat:"science", lvl:"B1", src:"วิทยาศาสตร์", title:["Waarom zijn Nederlanders zo lang?","Why are the Dutch so tall?","ทำไมคนดัตช์ถึงตัวสูงนัก?"],
  p:[[["Nederlanders behoren tot de langste mensen ter wereld: mannen zijn gemiddeld ongeveer een meter drieëntachtig.","The Dutch are among the tallest people in the world: men are on average about one metre eighty-three.","คนดัตช์อยู่ในกลุ่มคนที่สูงที่สุดในโลก ผู้ชายสูงเฉลี่ยราวหนึ่งเมตรแปดสิบสาม"],
      ["Dat was niet altijd zo.","That wasn't always the case.","แต่ไม่ได้เป็นแบบนี้มาตลอด"],
      ["Rond 1850 waren ze juist relatief klein, kleiner dan bijvoorbeeld Amerikanen.","Around 1850 they were actually relatively short, shorter than Americans, for example.","ราวปี 1850 พวกเขากลับค่อนข้างเตี้ย เตี้ยกว่าคนอเมริกันเสียอีก"]],
     [["Een deel van de verklaring is welvaart: betere voeding, schoon drinkwater en goede gezondheidszorg.","Part of the explanation is prosperity: better nutrition, clean drinking water and good healthcare.","ส่วนหนึ่งของคำอธิบายคือความมั่งคั่ง ทั้งโภชนาการที่ดีขึ้น น้ำดื่มสะอาด และระบบสาธารณสุขที่ดี"],
      ["Ook eten Nederlanders traditioneel veel zuivel, zoals melk en kaas.","The Dutch also traditionally eat a lot of dairy, such as milk and cheese.","นอกจากนี้ คนดัตช์กินผลิตภัณฑ์นมเยอะมาแต่ดั้งเดิม เช่น นมและชีส"],
      ["Maar dat verklaart niet alles, want andere rijke landen groeiden minder snel.","But that doesn't explain everything, because other rich countries grew less quickly.","แต่นั่นอธิบายได้ไม่หมด เพราะประเทศร่ำรวยอื่นๆ ไม่ได้สูงขึ้นเร็วเท่า"]],
     [["Onderzoekers ontdekten iets opvallends: in Nederland kregen lange mannen gemiddeld meer kinderen dan korte mannen.","Researchers discovered something striking: in the Netherlands, tall men had more children on average than short men.","นักวิจัยค้นพบสิ่งที่น่าสนใจ ในเนเธอร์แลนด์ ผู้ชายตัวสูงมีลูกมากกว่าผู้ชายตัวเตี้ยโดยเฉลี่ย"],
      ["Zo werd de bevolking, generatie na generatie, een klein beetje langer.","So the population became, generation after generation, a little bit taller.","ประชากรจึงสูงขึ้นทีละนิดในแต่ละรุ่น"],
      ["Er is dus waarschijnlijk niet één oorzaak, maar een combinatie van voeding, welvaart en evolutie.","So there probably isn't one cause, but a combination of nutrition, prosperity and evolution.","จึงอาจไม่ได้มีสาเหตุเดียว แต่เป็นผลรวมของโภชนาการ ความมั่งคั่ง และวิวัฒนาการ"]]],
  v:{"lang":"A1|adj|tall, long|สูง, ยาว","behoren tot":"B2|expr|belong to, be among|อยู่ในกลุ่ม|behoren","langste":"A2|adj|tallest|สูงที่สุด|lang","ter wereld":"B1|expr|in the world|ในโลก","gemiddeld":"B1|adv|on average|โดยเฉลี่ย","relatief":"B2|adv|relatively|ค่อนข้าง","verklaring":"B1|n|explanation|คำอธิบาย","welvaart":"B2|n|prosperity|ความมั่งคั่ง","voeding":"B1|n|nutrition, food|โภชนาการ","schoon":"A2|adj|clean|สะอาด","drinkwater":"A2|n|drinking water|น้ำดื่ม","gezondheidszorg":"B2|n|healthcare|ระบบสาธารณสุข","traditioneel":"B1|adv|traditionally|ตามประเพณี","zuivel":"B2|n|dairy|ผลิตภัณฑ์นม","kaas":"A1|n|cheese|ชีส","verklaart":"B1|v|explains|อธิบาย|verklaren","groeiden":"A2|v|grew|เติบโต|groeien","onderzoekers":"B1|n|researchers|นักวิจัย|onderzoeker","ontdekten":"B1|v|discovered|ค้นพบ|ontdekken","opvallends":"B2|adj|striking (something)|ที่น่าสังเกต|opvallend","kregen":"A2|v|got, had (children)|ได้รับ, มี (ลูก)|krijgen","bevolking":"B1|n|population|ประชากร","generatie":"B1|n|generation|รุ่น","waarschijnlijk":"B1|adv|probably|อาจจะ","oorzaak":"B1|n|cause|สาเหตุ","combinatie":"B1|n|combination|การผสมผสาน","evolutie":"B2|n|evolution|วิวัฒนาการ"},
  q:[{t:"main",q:["Wat is de conclusie van de tekst?","บทสรุปของบทความคืออะไร"],o:["Nederlanders zijn lang omdat ze veel kaas eten.","De lengte van Nederlanders heeft waarschijnlijk meerdere oorzaken samen.","Nederlanders waren altijd de langste mensen.","Lange mannen zijn gezonder."],a:1,x:"ประโยคสุดท้าย: ‘niet één oorzaak, maar een combinatie…’ ข้อ A เป็นเพียงปัจจัยหนึ่ง"},
     {t:"detail",q:["Hoe was de situatie rond 1850?","สถานการณ์ราวปี 1850 เป็นอย่างไร"],o:["Nederlanders waren toen al de langsten.","Nederlanders waren relatief klein.","Er waren geen Amerikanen.","Iedereen at veel zuivel."],a:1,x:"“Rond 1850 waren ze juist relatief klein” — juist ในที่นี้เน้นว่ากลับตรงกันข้ามกับปัจจุบัน"},
     {t:"infer",q:["Waarom noemt de schrijver 'andere rijke landen'?","ทำไมผู้เขียนพูดถึง ‘ประเทศร่ำรวยอื่นๆ’"],o:["Om te laten zien dat welvaart alleen de lengte niet volledig verklaart.","Om andere landen te bekritiseren.","Om te zeggen dat Nederland arm is.","Om over toerisme te praten."],a:0,x:"ถ้าความมั่งคั่งอธิบายได้ทั้งหมด ประเทศร่ำรวยอื่นก็ควรสูงขึ้นเร็วเท่ากัน การยกตัวอย่างนี้จึงชี้ว่ายังมีปัจจัยอื่น"},
     {t:"not",q:["Welke factor wordt NIET genoemd?","ปัจจัยใดไม่ได้ถูกกล่าวถึง"],o:["Schoon drinkwater.","Gezondheidszorg.","Sport op school.","Natuurlijke selectie via het aantal kinderen."],a:2,x:"บทความไม่ได้พูดถึงกีฬาในโรงเรียน ส่วนข้ออื่นมีทั้งหมด (การที่คนสูงมีลูกมากกว่า = การคัดเลือกตามธรรมชาติ)"},
     {t:"vocab",q:["Wat betekent 'welvaart'?","‘welvaart’ หมายถึงอะไร"],o:["armoede","rijkdom en een goed leven","snelheid","weer"],a:1,x:"welvaart = ความมั่งคั่ง/ความเป็นอยู่ดี ประโยคเดียวกันให้ตัวอย่าง: อาหารดี น้ำสะอาด สาธารณสุขดี"}]},
{ id:"nl-r6", cat:"tech", lvl:"B2", src:"เทคโนโลยี/เศรษฐกิจ", title:["Het Nederlandse bedrijf waar de hele chipindustrie van afhangt","The Dutch company the whole chip industry depends on","บริษัทดัตช์ที่ทั้งอุตสาหกรรมชิปต้องพึ่งพา"],
  p:[[["Weinig mensen buiten de technologiewereld kennen ASML, een bedrijf uit het Brabantse Veldhoven.","Few people outside the tech world know ASML, a company from Veldhoven in Brabant.","คนนอกวงการเทคโนโลยีน้อยคนจะรู้จัก ASML บริษัทจากเมืองเฟลด์โฮเฟนในจังหวัดบราบันต์"],
      ["Toch zit er in vrijwel elke smartphone een chip die met een machine van ASML is gemaakt.","Yet in virtually every smartphone there's a chip made with an ASML machine.","แต่สมาร์ทโฟนแทบทุกเครื่องมีชิปที่ผลิตด้วยเครื่องจักรของ ASML"]],
     [["Het bedrijf maakt lithografiemachines: apparaten die met licht ontzettend kleine patronen op siliciumschijven 'printen'.","The company makes lithography machines: devices that use light to 'print' incredibly small patterns onto silicon wafers.","บริษัทผลิตเครื่องลิโทกราฟี เครื่องที่ใช้แสง ‘พิมพ์’ ลวดลายขนาดจิ๋วลงบนแผ่นซิลิคอน"],
      ["Voor de meest geavanceerde chips is extreem ultraviolet licht nodig, en ASML is wereldwijd de enige leverancier van zulke machines.","The most advanced chips require extreme ultraviolet light, and ASML is the only supplier of such machines worldwide.","ชิปที่ทันสมัยที่สุดต้องใช้แสงอัลตราไวโอเลตแบบสุดขั้ว และ ASML เป็นผู้ผลิตเครื่องแบบนี้เพียงรายเดียวในโลก"],
      ["Eén machine is zo groot als een bus, kost honderden miljoenen euro's en wordt in onderdelen per vliegtuig vervoerd.","One machine is as big as a bus, costs hundreds of millions of euros and is transported in parts by plane.","เครื่องหนึ่งใหญ่เท่ารถบัส ราคาหลายร้อยล้านยูโร และถูกแยกชิ้นส่วนขนส่งทางเครื่องบิน"]],
     [["Die unieke positie maakt van een Nederlands bedrijf een speler in de geopolitiek.","That unique position turns a Dutch company into a player in geopolitics.","สถานะพิเศษนี้ทำให้บริษัทดัตช์กลายเป็นผู้เล่นในเวทีภูมิรัฐศาสตร์"],
      ["Onder druk van de Verenigde Staten beperkte de Nederlandse regering de export van de meest geavanceerde machines naar China.","Under pressure from the United States, the Dutch government restricted the export of the most advanced machines to China.","ภายใต้แรงกดดันจากสหรัฐฯ รัฐบาลเนเธอร์แลนด์จำกัดการส่งออกเครื่องที่ทันสมัยที่สุดไปยังจีน"],
      ["Critici vrezen dat zulke maatregelen op termijn vooral de concurrentie aanwakkeren, terwijl voorstanders wijzen op de veiligheidsrisico's.","Critics fear that such measures will in the long run mainly spur competition, while supporters point to the security risks.","ฝ่ายวิจารณ์กังวลว่ามาตรการเช่นนี้ในระยะยาวจะยิ่งกระตุ้นให้คู่แข่งเกิดขึ้น ส่วนฝ่ายสนับสนุนชี้ถึงความเสี่ยงด้านความมั่นคง"]]],
  v:{"chipindustrie":"B2|n|chip industry|อุตสาหกรรมชิป","afhangt":"B2|v|depends|ขึ้นอยู่กับ|afhangen","technologiewereld":"B2|n|tech world|วงการเทคโนโลยี","brabantse":"B2|adj|from Brabant|ของจังหวัดบราบันต์|Brabants","vrijwel":"B2|adv|virtually|แทบจะ","chip":"B1|n|chip|ชิป","machine":"A2|n|machine|เครื่องจักร","lithografiemachines":"C1|n|lithography machines|เครื่องลิโทกราฟี|lithografiemachine","apparaten":"B1|n|devices|อุปกรณ์|apparaat","ontzettend":"B2|adv|incredibly|อย่างมาก","patronen":"B2|n|patterns|ลวดลาย|patroon","siliciumschijven":"C2|n|silicon wafers|แผ่นเวเฟอร์ซิลิคอน|siliciumschijf","geavanceerde":"B2|adj|advanced|ทันสมัย|geavanceerd","extreem":"B2|adj|extreme|สุดขั้ว","ultraviolet":"B2|adj|ultraviolet|อัลตราไวโอเลต","nodig":"A2|adj|necessary|จำเป็น","wereldwijd":"B1|adv|worldwide|ทั่วโลก","leverancier":"B2|n|supplier|ผู้จัดหา, ซัพพลายเออร์","zulke":"B1|det|such|เช่นนั้น|zulk","onderdelen":"B2|n|parts|ชิ้นส่วน|onderdeel","vliegtuig":"A1|n|plane|เครื่องบิน","vervoerd":"B2|v|transported|ขนส่ง|vervoeren","unieke":"B1|adj|unique|เป็นเอกลักษณ์|uniek","positie":"B1|n|position|สถานะ, ตำแหน่ง","speler":"A2|n|player|ผู้เล่น","geopolitiek":"C1|n|geopolitics|ภูมิรัฐศาสตร์","onder druk":"B2|expr|under pressure|ภายใต้แรงกดดัน","verenigde staten":"A2|n|United States|สหรัฐอเมริกา","beperkte":"B2|v|restricted|จำกัด|beperken","regering":"B1|n|government|รัฐบาล","export":"B1|n|export|การส่งออก","critici":"B2|n|critics|ผู้วิจารณ์|criticus","vrezen":"B2|v|fear|กลัว, กังวล","maatregelen":"B2|n|measures|มาตรการ|maatregel","op termijn":"C1|expr|in the long run|ในระยะยาว","concurrentie":"B2|n|competition|การแข่งขัน","aanwakkeren":"C2|v|to fan, stoke|กระตุ้น, โหมให้แรงขึ้น","voorstanders":"C1|n|supporters, advocates|ผู้สนับสนุน|voorstander","wijzen op":"B2|v|point to|ชี้ไปที่","veiligheidsrisico's":"C1|n|security risks|ความเสี่ยงด้านความมั่นคง|veiligheidsrisico"},
  q:[{t:"main",q:["Wat is de kern van de tekst?","แก่นของบทความคืออะไร"],o:["ASML maakt smartphones.","Een weinig bekend Nederlands bedrijf heeft een sleutelpositie in de chipindustrie, met technologische én politieke gevolgen.","China maakt de beste chips.","Lithografie is een oude kunstvorm."],a:1,x:"ย่อหน้า 1–2 อธิบายบทบาทสำคัญของ ASML ส่วนย่อหน้า 3 พูดถึงผลทางการเมือง ข้อ A ผิดเพราะ ASML ผลิตเครื่องจักร ไม่ได้ผลิตสมาร์ทโฟน"},
     {t:"detail",q:["Wat maakt ASML uniek?","อะไรทำให้ ASML ไม่เหมือนใคร"],o:["Het is het grootste bedrijf van Europa.","Het is de enige leverancier van machines met extreem ultraviolet licht.","Het maakt de goedkoopste chips.","Het heeft fabrieken in China."],a:1,x:"“ASML is wereldwijd de enige leverancier van zulke machines”"},
     {t:"vocab",q:["'Op termijn' betekent hier…","‘Op termijn’ ในที่นี้หมายถึง…"],o:["meteen","op de lange duur","nooit","per maand"],a:1,x:"op termijn = ในระยะยาว (op de lange duur) ไม่ใช่ทันที"},
     {t:"not",q:["Welke bewering klopt NIET?","ข้อใดไม่ถูกต้อง"],o:["Een ASML-machine wordt in onderdelen vervoerd.","De Nederlandse regering beperkte de export naar China.","Alle experts steunen de exportbeperkingen.","ASML zit in Veldhoven."],a:2,x:"บทความกล่าวถึงทั้ง ‘critici’ ที่กังวล และ ‘voorstanders’ ผู้เชี่ยวชาญจึงไม่ได้สนับสนุนทั้งหมด"},
     {t:"infer",q:["Waarom 'vrezen critici' dat de maatregelen de concurrentie aanwakkeren?","ทำไมฝ่ายวิจารณ์จึงกลัวว่ามาตรการจะกระตุ้นการแข่งขัน"],o:["Omdat China dan zelf zulke machines kan gaan ontwikkelen.","Omdat ASML dan failliet gaat.","Omdat de VS ook machines verkopen.","Omdat chips goedkoper worden."],a:0,x:"ถ้าซื้อจากเนเธอร์แลนด์ไม่ได้ จีนอาจหันไปพัฒนาเทคโนโลยีเอง จนเกิดคู่แข่งของ ASML ในระยะยาว"}]},
{ id:"nl-r7", cat:"env", lvl:"C1", src:"สิ่งแวดล้อม/การเมือง", title:["De stikstofcrisis: wanneer natuur en landbouw botsen","The nitrogen crisis: when nature and farming collide","วิกฤตไนโตรเจน: เมื่อธรรมชาติปะทะเกษตรกรรม"],
  p:[[["In 2019 oordeelde de Raad van State, de hoogste bestuursrechter van Nederland, dat de overheid de uitstoot van stikstof onvoldoende beperkte om kwetsbare natuurgebieden te beschermen.","In 2019 the Council of State, the highest administrative court in the Netherlands, ruled that the government was not limiting nitrogen emissions enough to protect vulnerable nature areas.","ในปี 2019 สภาแห่งรัฐ ซึ่งเป็นศาลปกครองสูงสุดของเนเธอร์แลนด์ ตัดสินว่ารัฐบาลจำกัดการปล่อยไนโตรเจนไม่เพียงพอที่จะปกป้องพื้นที่ธรรมชาติที่เปราะบาง"],
      ["Van de ene dag op de andere lagen duizenden bouwprojecten stil, van woonwijken tot snelwegen.","From one day to the next, thousands of construction projects came to a standstill, from housing estates to motorways.","ชั่วข้ามคืน โครงการก่อสร้างนับพันต้องหยุดชะงัก ตั้งแต่โครงการบ้านจัดสรรไปจนถึงทางด่วน"]],
     [["Stikstofverbindingen komen onder meer uit verkeer en industrie, maar de grootste bron is de intensieve veehouderij, die het land tot een van 's werelds grootste landbouwexporteurs heeft gemaakt.","Nitrogen compounds come, among other things, from traffic and industry, but the largest source is intensive livestock farming, which has made the country one of the world's largest agricultural exporters.","สารประกอบไนโตรเจนมาจากการจราจรและอุตสาหกรรม แต่แหล่งใหญ่ที่สุดคือปศุสัตว์แบบเข้มข้น ซึ่งทำให้ประเทศนี้เป็นหนึ่งในผู้ส่งออกสินค้าเกษตรรายใหญ่ที่สุดของโลก"],
      ["Neergeslagen in de natuur werkt stikstof als een overdosis kunstmest: snelgroeiende planten als brandnetels en grassen verdringen zeldzame soorten, en daarmee ook de insecten die ervan afhankelijk zijn.","Once deposited in nature, nitrogen acts like an overdose of fertiliser: fast-growing plants such as nettles and grasses crowd out rare species, and with them the insects that depend on them.","เมื่อตกลงสู่ธรรมชาติ ไนโตรเจนทำหน้าที่เหมือนปุ๋ยเกินขนาด พืชที่โตเร็วอย่างต้นตำแยและหญ้าจะเบียดพืชหายาก รวมถึงแมลงที่ต้องพึ่งพาพืชเหล่านั้น"]],
     [["De voorgestelde halvering van de uitstoot leidde tot massale boerenprotesten, met trekkers op de snelweg en omgekeerde vlaggen als symbool van verzet.","The proposed halving of emissions led to massive farmers' protests, with tractors on the motorway and upside-down flags as a symbol of resistance.","ข้อเสนอให้ลดการปล่อยลงครึ่งหนึ่ง นำไปสู่การประท้วงครั้งใหญ่ของเกษตรกร มีรถแทรกเตอร์บนทางด่วน และธงชาติกลับหัวเป็นสัญลักษณ์ของการต่อต้าน"],
      ["Voor veel boeren gaat het niet alleen om inkomen, maar om identiteit: hun familie bewerkt het land soms al generaties lang.","For many farmers it's not just about income, but about identity: their family has sometimes worked the land for generations.","สำหรับเกษตรกรหลายคน เรื่องนี้ไม่ได้เป็นแค่เรื่องรายได้ แต่เป็นเรื่องอัตลักษณ์ เพราะบางครอบครัวทำกินบนผืนดินนี้มาหลายชั่วอายุคน"],
      ["Tegelijkertijd wijzen ecologen erop dat uitstel de rekening alleen maar verhoogt.","At the same time, ecologists point out that delay only increases the bill.","ในขณะเดียวกัน นักนิเวศวิทยาชี้ว่าการผัดวันประกันพรุ่งยิ่งทำให้ค่าใช้จ่ายสูงขึ้น"]],
     [["De crisis legt een dieper dilemma bloot: hoeveel economische activiteit kan een klein, dichtbevolkt land zich veroorloven zonder zijn eigen natuur uit te putten?","The crisis exposes a deeper dilemma: how much economic activity can a small, densely populated country afford without exhausting its own nature?","วิกฤตนี้เผยให้เห็นภาวะกลืนไม่เข้าคายไม่ออกที่ลึกกว่านั้น ประเทศเล็กๆ ที่ประชากรหนาแน่นจะมีกิจกรรมทางเศรษฐกิจได้มากแค่ไหน โดยไม่ทำให้ธรรมชาติของตัวเองเสื่อมโทรม?"]]],

async function onlineLookup(lang, word) {
  const res = { defs: [], th: '', en: '' };
  const tasks = [
    fetch(`https://en.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(word.toLowerCase())}`).then(r => r.ok ? r.json() : null).then(j => {
      (j && j[lang] || []).slice(0, 3).forEach(p => res.defs.push({ pos: p.partOfSpeech, d: (p.definitions || []).slice(0, 3).map(d => d.definition.replace(/<[^>]+>/g, '')).filter(Boolean) }));
    }).catch(() => { }),
    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=${lang}|th`).then(r => r.json()).then(j => { res.th = j && j.responseData && j.responseData.translatedText || ''; }).catch(() => { }),
    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=${lang}|en`).then(r => r.json()).then(j => { res.en = j && j.responseData && j.responseData.translatedText || ''; }).catch(() => { })
  ];
  await Promise.all(tasks);
  return res;
}

}

function addCard(lang, e, raw, sentenceArr, item, auto) {
  const hw = headword(e, raw), k = cardKey(lang, hw);
  if (S.cards[k]) return false;
  const on = sheetState && sheetState.onlineRes;
  S.cards[k] = {
    upd: Date.now(),
    k, lang, word: hw, form: raw, lvl: e ? e.lvl : '', pos: e ? e.pos : '',
    th: e ? e.th : (on && on.th) || '', en: e ? e.en : (on && on.en) || '',
    ex: sentenceArr ? sentText(sentenceArr) : '', exT: sentenceArr ? (sentenceArr[2] || '') : '', exE: sentenceArr ? (sentenceArr[1] || '') : '',
    src: item ? titleOf(item) : '', added: Date.now(), due: Date.now(), int: 0, ease: 2.5, reps: 0, lapses: 0, auto: !!auto
  };
  save(); return true;
}
function titleOf(item) {
  if (item.title) return sentText(item.title);
  if (item.kind === 'feed') return 'โพสต์ของ ' + item.user;
  return item.id;
}
function autoSaveHard(item) {
  if (!st().autoSave) return [];
  const thr = hardThreshold(item); const got = [];
  const sents = allSentences(item);
  for (const w in (item.v || {})) {
    const e = { w, ...parseEntry(item.v[w]) };
    if (rank(e.lvl) < thr) continue;
    const re = new RegExp('(^|[^\\p{L}])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\p{L}])', 'iu');
    const ex = sents.find(s => re.test(sentText(s)));
    if (addCard(item.lang, e, w, ex, item, true)) got.push(headword(e, w));
  }
  return got;
}
function finishItem(item, silent) {
  const first = !S.read[item.id];
  S.read[item.id] = Date.now();
  const got = autoSaveHard(item);
  save(); updateBadge();
  if (!silent && got.length) toast(`บันทึกคำยาก ${got.length} คำ: ${got.slice(0, 4).join(', ')}${got.length > 4 ? '…' : ''}`);
  else if (!silent && first && item.kind !== 'feed') toast('บันทึกว่าอ่านจบแล้ว');
  return got;
}
function dueCards(lang) { const now = Date.now(); return Object.values(S.cards).filter(c => (!lang || c.lang === lang) && c.due <= now); }
function grade(c, q) {
  const now = Date.now();
  c.upd = now;
  if (q === 0) { c.reps = 0; c.lapses++; c.int = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.due = now + 10 * 60e3; }
  else {
    c.reps++;
    if (c.reps === 1) c.int = q === 1 ? 1 : q === 2 ? 1 : 3;
    else if (c.reps === 2) c.int = q === 1 ? 3 : q === 2 ? 6 : 8;
    else c.int = Math.max(1, Math.round(c.int * (q === 1 ? 1.2 : q === 2 ? c.ease : c.ease * 1.3)));
    c.ease = Math.max(1.3, c.ease + (q === 1 ? -0.15 : q === 3 ? 0.15 : 0));
    c.due = now + c.int * 864e5 - 3600e3;
  }

}
const fmtInt = d => isEN() ? (d < 1 ? '10 min' : d === 1 ? '1 day' : d < 30 ? d + ' days' : Math.round(d / 30) + ' mo') : (d < 1 ? '10 นาที' : d === 1 ? '1 วัน' : d < 30 ? d + ' วัน' : Math.round(d / 30) + ' เดือน');

const I18N = window.TRIADA_I18N || {};
const I18N_RE = new RegExp(Object.keys(I18N).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
const CONTENT = '.rt,.c,.sh-mean,.sh-mean2:not(.ui),.sh-sent .o,.sh-sent .t,.sh-phrase div,.entry .m,.exs,.wd>div,.fc .mean,.fc .ex,.qth,.xq,.cover p,textarea,input';

function trUI(str) { return /[\u0E00-\u0E7F]/.test(str) ? str.replace(I18N_RE, m => I18N[m]) : str; }
function localizeText(node) {
  const el = node.parentElement; if (!el || el.closest(CONTENT)) return;
  const v = trUI(node.nodeValue); if (v !== node.nodeValue) node.nodeValue = v;
}
function localize(root) {
  if (!isEN() || !root) return;

  if (root.nodeType !== 1) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n; const list = [];
  while ((n = w.nextNode())) list.push(n);
  list.forEach(localizeText);
  [root, ...root.querySelectorAll('[placeholder],[aria-label],[title]')].forEach(e => {
    for (const a of ['placeholder', 'aria-label', 'title']) { const v = e.getAttribute && e.getAttribute(a); if (v && /[\u0E00-\u0E7F]/.test(v)) e.setAttribute(a, trUI(v)); }

}
let i18nObs = null;
function startI18n() {

let dictQ = '', dictAll = false;
function dictSearch(q, lang) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const langs = dictAll ? Object.keys(DICT) : [lang];
  const out = [];
  const deacc = s => s.normalize('NFD').replace(/\p{M}/gu, '');
  const qd = deacc(q);
  for (const l of langs) {
    const cands = new Set(candidates(l, q));
    for (const [k, e] of DICT[l]) {
      let sc = 0; const kd = deacc(k);
      if (k === q) sc = 100; else if (cands.has(k)) sc = 90; else if (kd === qd) sc = 85; else if (kd.startsWith(qd)) sc = 60 - Math.min(20, k.length - q.length);
      else if ((e.th || '').split(/[,،]\s*/).some(x => x.trim() === q)) sc = 70; else if ((e.th || '').includes(q)) sc = 50; else if ((' ' + (e.en || '').toLowerCase() + ' ').match(new RegExp('[^a-z]' + q.replace(/[^a-z ]/g, '') + '[^a-z]')) && /[a-z]/.test(q)) sc = 45;
      else if (q.length > 2 && kd.includes(qd)) sc = 25;
      if (sc) out.push({ l, e, sc });
    }
  }
  return out.sort((a, b) => b.sc - a.sc || a.e.w.length - b.e.w.length).slice(0, 30);
}
function examplesFor(lang, e) {
  const out = []; const word = e.w;
  const re = new RegExp('(^|[^\\p{L}])' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\p{L}])', 'iu');
  const items = (e.src && e.src.length ? e.src.map(id => BYID[id]) : [...DB[lang].feed, ...DB[lang].read, ...DB[lang].novel]).filter(Boolean);
  for (const it of items) { for (const s of allSentences(it)) { if (re.test(sentText(s))) { out.push({ s, it }); break; } } if (out.length >= 3) break; }
  return out;
}

/* ---------- account & cross-device sync (Firebase Auth + Firestore) ----------
   Spliced into app.js at build time (shares its scope). Login is optional: without it the app stays fully local.
   One Firestore document per user (users/{uid}) holds the whole progress as JSON; devices merge field by field. */
const FB_CFG = window.TRIADA_FIREBASE && window.TRIADA_FIREBASE.apiKey ? window.TRIADA_FIREBASE : null;
const FB_VER = '10.12.2';
const CLIENT_ID = (() => { try { let c = localStorage.getItem('triada.client'); if (!c) { c = Math.random().toString(36).slice(2, 10); localStorage.setItem('triada.client', c); } return c; } catch (e) { return 'x' + Math.random().toString(36).slice(2, 8); } })();
const SYNC_KEYS = ['cards', 'read', 'quiz', 'likes', 'history', 'novelPos', 'web', 'deleted', 'settings', 'settingsAt'];
const sync = { fb: null, user: null, unsub: null, status: 'off', last: 0, err: '', pushT: null, applying: false, loading: null };

function stableJSON(o) { return JSON.stringify(o, (k, v) => v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((r, x) => (r[x] = v[x], r), {}) : v); }
const pick = (x, y, tx, ty) => tx !== ty ? (tx > ty ? x : y) : (stableJSON(x) >= stableJSON(y) ? x : y);
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('โหลด ' + src + ' ไม่สำเร็จ')); document.head.appendChild(s); }); }
function fbInit(silent) {
  if (!FB_CFG || FRAMED) return Promise.resolve(null);
  if (sync.fb) return Promise.resolve(sync.fb);
  if (sync.loading) return sync.loading;
  sync.loading = (async () => {
    if (!window.firebase) for (const m of ['app', 'auth', 'firestore']) await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`);
    if (!firebase.apps.length) firebase.initializeApp(FB_CFG);
    sync.fb = { auth: firebase.auth(), db: firebase.firestore() };
    sync.fb.auth.onAuthStateChanged(u => { sync.user = u; if (u) startSync(); else stopSync(); accountChanged(); });
    sync.fb.auth.getRedirectResult().catch(e => { sync.err = e.code || e.message; accountChanged(); });
    return sync.fb;
  })().catch(e => { sync.loading = null; if (!silent) { sync.err = e.message; accountChanged(); } return null; });
  return sync.loading;
}
async function signIn() {
  const fb = await fbInit(); if (!fb) { toast(navigator.onLine ? 'เชื่อมต่อระบบบัญชีไม่สำเร็จ' : 'ต้องใช้อินเทอร์เน็ตเพื่อเข้าสู่ระบบ'); return; }
  const prov = new firebase.auth.GoogleAuthProvider();
  try { await fb.auth.signInWithPopup(prov); }
  catch (e) {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) { try { await fb.auth.signInWithRedirect(prov); return; } catch (e2) { e = e2; } }
    if (e.code !== 'auth/popup-closed-by-user') { sync.err = e.code || e.message; toast('เข้าสู่ระบบไม่สำเร็จ'); accountChanged(); }
  }
}
async function signOut() { if (sync.fb) { await sync.fb.auth.signOut(); toast('ออกจากระบบแล้ว ข้อมูลในเครื่องนี้ยังอยู่ครบ'); } }

function userDoc() { return sync.fb.db.collection('users').doc(sync.user.uid); }
function cloudPayload() { const o = {}; for (const k of SYNC_KEYS) o[k] = S[k]; return o; }
function startSync() {
  stopSync(); sync.status = 'syncing'; sync.err = '';
  sync.unsub = userDoc().onSnapshot(snap => {
    if (snap.metadata && snap.metadata.hasPendingWrites) return;
    const d = snap.exists ? snap.data() : null;
    let remote = null; try { remote = d && d.data ? JSON.parse(d.data) : null; } catch (e) { remote = null; }
    if (remote) sync.cloud = stableJSON(remote);
    if (remote && d.client !== CLIENT_ID) {
      const before = stableJSON(cloudPayload());
      Object.assign(S, mergeState(cloudPayload(), remote));
      lastSettingsJSON = JSON.stringify(S.settings);
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
      if (stableJSON(cloudPayload()) !== before) remoteApplied();
      schedulePush(500);
    } else if (!remote) schedulePush(0);
    sync.status = 'ok'; sync.last = Date.now(); accountChanged();
  }, e => { sync.status = 'error'; sync.err = e.code || e.message; accountChanged(); });
}
function stopSync() { if (sync.unsub) { sync.unsub(); sync.unsub = null; } clearTimeout(sync.pushT); sync.status = 'off'; }
function schedulePush(ms) {
  if (!sync.user) return;
  clearTimeout(sync.pushT);
  sync.pushT = setTimeout(pushNow, ms == null ? 4000 : ms);
}
async function pushNow() {
  if (!sync.user) return;
  sync.status = 'syncing'; accountChanged();
  try {
    let json = stableJSON(cloudPayload());
    if (json.length > 900000) { const p = cloudPayload(); p.web = {}; json = stableJSON(p); } // Firestore documents max out at 1 MB
    if (json === sync.cloud) { sync.status = 'ok'; sync.last = Date.now(); accountChanged(); return; }
    sync.cloud = json;
    await userDoc().set({ data: json, client: CLIENT_ID, updatedAt: Date.now() });
    sync.status = 'ok'; sync.last = Date.now(); sync.err = '';
  } catch (e) { sync.status = 'error'; sync.err = e.code || e.message; }
  accountChanged();
}

/* merge two progress snapshots; newest edit wins per item, deletions are tombstones */
function mergeState(a, b) {
  const t = c => (c && (c.upd || c.added)) || 0;
  const del = { ...(b.deleted || {}) };
  for (const k in (a.deleted || {})) del[k] = Math.max(del[k] || 0, a.deleted[k]);
  const cutoff = Date.now() - 120 * 864e5; for (const k in del) if (del[k] < cutoff) delete del[k];
  const cards = {};
  for (const src of [b.cards || {}, a.cards || {}]) for (const k in src) cards[k] = cards[k] ? pick(src[k], cards[k], t(src[k]), t(cards[k])) : src[k];
  for (const k in cards) if ((del['card:' + k] || 0) >= t(cards[k])) delete cards[k];
  const web = { ...(b.web || {}) }; for (const k in (a.web || {})) web[k] = web[k] ? pick(a.web[k], web[k], a.web[k].t || 0, web[k].t || 0) : a.web[k];
  for (const k in web) if ((del['web:' + k] || 0) >= (web[k].t || 0)) delete web[k];
  const read = { ...(b.read || {}) }; for (const k in (a.read || {})) read[k] = Math.max(read[k] || 0, a.read[k]);
  const quiz = { ...(b.quiz || {}) };
  for (const k in (a.quiz || {})) { const x = a.quiz[k], y = quiz[k]; quiz[k] = !y ? x : { score: Math.max(x.score, y.score), total: x.total, last: (x.t || 0) > (y.t || 0) ? x.last : (y.t || 0) > (x.t || 0) ? y.last : Math.max(x.last || 0, y.last || 0), t: Math.max(x.t || 0, y.t || 0) }; }
  const novelPos = { ...(b.novelPos || {}) }; for (const k in (a.novelPos || {})) novelPos[k] = Math.max(novelPos[k] || 0, a.novelPos[k]);
  const seen = new Set(), history = [];
  for (const h of [...(a.history || []), ...(b.history || [])].sort((x, y) => y.t - x.t || (x.lang + x.w < y.lang + y.w ? -1 : 1))) { const k = h.lang + h.w; if (!seen.has(k)) { seen.add(k); history.push(h); } }
  const sa = a.settings || {}, sb = b.settings || {};
  const settings = pick(sa, sb, a.settingsAt || 0, b.settingsAt || 0);
  return { cards, web, read, quiz, novelPos, history: history.slice(0, 40), likes: Object.fromEntries([...new Set([...Object.keys(a.likes || {}), ...Object.keys(b.likes || {})])].map(k => [k, !!((a.likes || {})[k] || (b.likes || {})[k])])), deleted: del,
    settings: { ...DEFAULTS, ...settings }, settingsAt: Math.max(a.settingsAt || 0, b.settingsAt || 0) };
}
function remoteApplied() {
  for (const it of Object.values(S.web || {})) BYID[it.id] = it;
  applyLook(); updateBadge();
  if (['cards', 'prefs', 'live', 'read', 'novel'].includes(view.name)) { const y = scrollY; render(); scrollTo(0, y); }
}
function accountChanged() { const box = document.getElementById('acctBox'); if (box) box.innerHTML = accountHTML(); }
function accountHTML() {
  if (FRAMED) return `<div class="row"><label>บัญชีและการซิงก์<small>หน้าตัวอย่างบน claude.ai เข้าสู่ระบบไม่ได้ ใช้แอปเวอร์ชัน GitHub Pages</small></label></div>`;
  if (!FB_CFG) return `<div class="row"><label>ยังไม่ได้เปิดใช้การซิงก์<small>ต้องตั้งค่า Firebase ในไฟล์ src/firebase-config.js ก่อน (ดู README)</small></label></div>`;
  const err = sync.err ? `<div class="row"><label><small style="color:var(--bad)">ข้อผิดพลาด: ${esc(sync.err)}</small></label></div>` : '';
  if (!sync.user) return `<div class="row"><label>เข้าสู่ระบบเพื่อซิงก์ข้ามเครื่อง<small>การ์ด ความคืบหน้า การตั้งค่า และข่าวที่บันทึกไว้จะตรงกันทุกเครื่อง · ไม่เข้าสู่ระบบก็ใช้งานได้ตามปกติ</small></label>
      <button class="tbtn primary" data-act="signin">${ic('globe')}เข้าสู่ระบบด้วย Google</button></div>` + err;
  const u = sync.user;
  const st = sync.status === 'syncing' ? 'กำลังซิงก์…' : sync.status === 'error' ? 'ซิงก์ไม่สำเร็จ' : sync.last ? 'ซิงก์ล่าสุด ' + new Date(sync.last).toLocaleTimeString(isEN() ? 'en-GB' : 'th-TH', { hour: '2-digit', minute: '2-digit' }) : 'เชื่อมต่อแล้ว';
  return `<div class="row"><label><span class="c">${esc(u.displayName || u.email || 'Google')}</span><small><span class="c">${esc(u.email || '')}</span> · ${st}</small></label>
      <div class="tools"><button class="tbtn" data-act="syncnow">${ic('refresh')}ซิงก์ตอนนี้</button><button class="tbtn" data-act="signout">ออกจากระบบ</button></div></div>` + err;
}


/* ================= events ================= */
function onClick(e) {
  const w = e.target.closest('.w');
  if (w && !e.target.closest('[data-act]')) { openWord(w); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, s = st();
  switch (a) {
    case 'tab': go(b.dataset.tab); break;
    case 'go': go(b.dataset.v); break;
    case 'lang': s.lang = b.dataset.lang; save(); applyLook(); if (['article', 'story', 'review', 'live'].includes(view.name)) view = { name: S.tab }; render(); break;
    case 'prefs': go('prefs'); break;
    case 'fcat': { const v = b.dataset.v; s.feedCats = !v ? [] : s.feedCats.includes(v) ? s.feedCats.filter(x => x !== v) : [...s.feedCats, v]; save(); render(); break; }
    case 'flvl': { const v = b.dataset.v; s.feedLvls = !v ? [] : s.feedLvls.includes(v) ? s.feedLvls.filter(x => x !== v) : [...s.feedLvls, v]; save(); render(); break; }
    case 'rcat': s.readCat = b.dataset.v; save(); render(); break;
    case 'rlvl': { const v = b.dataset.v; s.readLvls = !v ? [] : s.readLvls.includes(v) ? s.readLvls.filter(x => x !== v) : [...s.readLvls, v]; save(); render(); break; }
    case 'like': { const id = b.dataset.id; S.likes[id] = !S.likes[id]; save(); const p = BYID[id]; b.classList.toggle('liked', !!S.likes[id]); b.innerHTML = ic('heart') + ((p.likes || 0) + (S.likes[id] ? 1 : 0)); break; }
    case 'cmts': { const c = $('.comments', b.closest('.post')); c.hidden = !c.hidden; b.setAttribute('aria-pressed', !c.hidden); break; }
    case 'trpost': { const post = b.closest('.post'); const on = b.getAttribute('aria-pressed') !== 'true'; $$('.rt', post).forEach(r => r.classList.toggle('showtr', on)); b.setAttribute('aria-pressed', on); break; }
    case 'trall': { const on = b.getAttribute('aria-pressed') !== 'true'; const it = BYID[view.id];
      $$('#main .rt').forEach(r => r.classList.toggle('showtr', on)); b.setAttribute('aria-pressed', on);
      if (on && it && it.kind === 'web' && allSentences(it).some(x => !x[st().trLang === 'en' ? 1 : 2])) mtAll(b, it).then(() => b.setAttribute('aria-pressed', 'true'));
      break; }
    case 'trlang': s.trLang = s.trLang === 'th' ? 'en' : 'th'; save(); { const y = scrollY; const open = $$('#main .rt.showtr').length > 0; render(); if (open) { $$('#main .rt').forEach(r => r.classList.add('showtr')); const t = $('[data-act="trall"]'); t && t.setAttribute('aria-pressed', 'true'); } scrollTo(0, y); } break;
    case 'readall': { const root = b.closest('.post') || $('#artBody'); readAll(root, view.name === 'feed' ? BYID[$('.post-end', root).dataset.id].lang : st().lang, b); break; }
    case 'mtall': mtAll(b, BYID[view.id]); break;
    case 'open': go('article', b.dataset.id); break;
    case 'finishweb': { const it = BYID[view.id]; const got = finishItem(it, true); toast(got.length ? `บันทึกคำยาก ${got.length} คำ` : 'บันทึกว่าอ่านจบแล้ว'); break; }
    case 'next-art': { const l = DB[s.lang].read; const i = l.indexOf(BYID[view.id]); const nx = l.find((x, j) => j > i && !S.quiz[x.id]) || l.find(x => !S.quiz[x.id]) || l[(i + 1) % l.length]; go('article', nx.id); break; }
    case 'ans': answer(+b.dataset.qi, +b.dataset.oi); break;
    case 'live': go('live'); break;
    case 'liveopen': openWeb(b.dataset.host, b.dataset.title, b.dataset.src, b); break;
    case 'livetab': liveTab = b.dataset.v; render(); break;
    case 'liverefresh': delete liveCache[s.lang + ':' + liveTab]; render(); break;
    case 'delweb': if (b.dataset.sure) { tomb('web:' + b.dataset.id); delete S.web[b.dataset.id]; delete BYID[b.dataset.id]; save(); render(); toast('ลบแล้ว'); } else { b.dataset.sure = 1; b.style.color = 'var(--bad)'; toast('แตะถังขยะอีกครั้งเพื่อลบ'); } break;
    case 'pastego': {
      const raw = ($('#pasteText').value || '').trim(); const title = ($('#pasteTitle').value || '').trim();
      const paras = raw.split(/\n\s*\n|\r?\n/).map(x => x.trim()).filter(x => /\p{L}{2}/u.test(x));
      if (!paras.length || raw.length < 40) { toast('วางเนื้อหาอย่างน้อยหนึ่งย่อหน้า'); break; }
      const t = title || splitSentences(paras[0])[0].slice(0, 80);
      const item = buildWebItem({ lang: s.lang, title: t, paras: title ? paras : paras, src: 'ข้อความของฉัน', id: 'web:own' + hashStr(raw.slice(0, 500) + Date.now()) });
      storeWeb(item); go('article', item.id); break; }
    case 'story': go('story', b.dataset.id); break;
    case 'say': speak(b.dataset.say, sheetState.item.lang, { rate: Math.min(st().rate, 0.85) }); break;
    case 'sayw': speak(b.dataset.say, b.dataset.lang); break;
    case 'saysent': speak(sheetState.sentence.o, sheetState.item.lang); break;
    case 'togglesent': sheetState.sentEl.classList.toggle('open'); closeSheet(); break;
    case 'mtsent': (async () => { const t = $('#shTr'); t.hidden = false; t.textContent = 'กำลังแปล…'; const r = await machineTranslate(sheetState.sentence.o, sheetState.item.lang, st().trLang); t.textContent = r || 'แปลไม่สำเร็จ (ต้องใช้อินเทอร์เน็ต)'; if (r) { $('.tr', sheetState.sentEl).textContent = r; } })(); break;
    case 'closesheet': closeSheet(); break;
    case 'savecard': { const { item, raw, e: en, sentence } = sheetState; const hw = headword(en, raw); const k = cardKey(item.lang, hw); if (S.cards[k]) { delete S.cards[k]; tomb('card:' + k); save(); toast('นำออกจากการ์ดแล้ว'); } else { addCard(item.lang, en, raw, sentence.arr, item, false); toast('บันทึก “' + hw + '” แล้ว'); } renderSheet(!!sheetState.onlineRes); refreshMarks(); updateBadge(); if (sheetState.onlineRes) $('#onlineBox').innerHTML = onlineHTML(sheetState.onlineRes); break; }
    case 'savephrase': { const { item, sentence } = sheetState; const k = b.dataset.p; const pe = { w: k, ...parseEntry(item.v[k]) }; if (addCard(item.lang, pe, k, sentence.arr, item, false)) toast('บันทึกสำนวน “' + k + '” แล้ว'); renderSheet(); updateBadge(); break; }
    case 'todict': dictQ = b.dataset.q; dictAll = false; go('dict'); break;
    case 'online': runOnline(); break;
    case 'review': startReview(); break;
    case 'flip': if (rv) { rv.flipped = !rv.flipped; render(); if (rv.flipped) { const c = rv.list[rv.i]; if (st().cardDir !== 'word') speak(c.word, c.lang); } } break;
    case 'grade': { const c = rv.list[rv.i]; const q = +b.dataset.q; grade(S.cards[c.k] || c, q); rv.done++; if (q === 0) { rv.again++; } rv.i++; rv.flipped = false; render(); break; }
    case 'signin': signIn(); break;
    case 'signout': signOut(); break;
    case 'syncnow': if (sync.unsub) { stopSync(); startSync(); } pushNow(); break;
    case 'delcard': tomb('card:' + b.dataset.k); delete S.cards[b.dataset.k]; save(); render(); toast('ลบการ์ดแล้ว'); break;
    case 'dictq': dictQ = b.dataset.q; if (b.dataset.l && b.dataset.l !== s.lang && dictAll) { } $('#dictInput') ? ($('#dictInput').value = dictQ, dictResults(true)) : go('dict'); scrollTo(0, 0); break;
    case 'dictall': dictAll = !dictAll; b.setAttribute('aria-pressed', dictAll); dictResults(); break;
    case 'dictsave': { const l = b.dataset.lang; const e = DICT[l].get(b.dataset.w.toLowerCase()); const hw = e.lemma || e.w; const k = cardKey(l, hw); if (S.cards[k]) { delete S.cards[k]; tomb('card:' + k); toast('นำออกจากการ์ดแล้ว'); } else { const ex = examplesFor(l, e)[0]; addCard(l, e, e.w, ex && ex.s, ex && ex.it, false); toast('บันทึก “' + hw + '” แล้ว'); } save(); dictResults(); updateBadge(); break; }
    case 'dictsaveonline': if (dictOnline) { const { q, r } = dictOnline; sheetState = { onlineRes: r }; addCard(s.lang, null, q, null, null, false); sheetState = null; toast('บันทึก “' + q + '” แล้ว'); updateBadge(); } break;
    case 'set': { const k = b.dataset.k; let v = b.dataset.v; if (k === 'sessionSize') v = +v; s[k] = v; save(); if (k === 'uiLang') { shell(); startI18n(); } applyLook(); render(); break; }
    case 'testvoice': speak({ fr: 'Bonjour ! Bienvenue dans votre bibliothèque.', es: '¡Hola! Bienvenido a tu biblioteca.', nl: 'Hallo! Welkom in je bibliotheek.' }[s.lang], s.lang); break;
    case 'export': { const row = $('#ioRow'); row.hidden = false; const json = JSON.stringify({ app: 'triada', v: 1, ...S }, null, 1); $('#ioText').value = json; try { const url = URL.createObjectURL(new Blob([json], { type: 'application/json' })); const dl = $('#dlLink'); dl.href = url; dl.download = 'triada-backup.json'; dl.hidden = window.self !== window.top; } catch (er) { } break; }
    case 'import': $('#ioRow').hidden = false; $('#ioText').value = ''; $('#ioText').placeholder = 'วางข้อมูล JSON ที่ส่งออกไว้ตรงนี้'; $('#ioText').focus(); break;
    case 'copyio': { const t = $('#ioText'); navigator.clipboard ? navigator.clipboard.writeText(t.value).then(() => toast('คัดลอกแล้ว'), () => { t.select(); toast('เลือกข้อความแล้ว กดคัดลอกได้เลย'); }) : t.select(); break; }
    case 'doimport': try { const d = JSON.parse($('#ioText').value); if (d.app !== 'triada') throw 0; delete d.app; delete d.v; S = { ...S, ...d, settings: { ...DEFAULTS, ...(d.settings || {}) } }; save(); shell(); startI18n(); applyLook(); toast('นำเข้าข้อมูลแล้ว'); render(); } catch (er) { toast('ข้อมูลไม่ถูกต้อง ต้องเป็น JSON ที่ส่งออกจากแอปนี้'); } break;
    case 'reset': if (b.dataset.sure) { try { localStorage.removeItem(KEY); } catch (er) { } S = { settings: { ...DEFAULTS }, cards: {}, read: {}, quiz: {}, likes: {}, history: [], novelPos: {}, web: {}, tab: 'feed' }; shell(); startI18n(); applyLook(); toast('ล้างข้อมูลแล้ว'); render(); } else { b.dataset.sure = 1; b.innerHTML = 'แตะอีกครั้งเพื่อยืนยัน'; setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.innerHTML = ic('trash') + 'ล้างข้อมูล'; } }, 4000); } break;
  }
}
function refreshMarks() {
  if (!st().markSaved) return;
  $$('#main [data-ctx]').forEach(block => {
    const item = CTX.get(block.dataset.ctx); if (!item) return;
    $$('.w', block).forEach(w => { const e = lookup(item.lang, w.dataset.w, item.v); w.classList.toggle('saved', !!S.cards[cardKey(item.lang, headword(e, w.dataset.w))]); });
  });
}
function onInput(e) {
  const t = e.target, s = st();
  if (t.dataset.act === 'range') { const k = t.dataset.k; s[k] = parseFloat(t.value); save(); applyLook(); const lab = { fontSize: ['#fsv', 'px'], lineHeight: ['#lhv', ''], rate: ['#ratev', '×'] }[k]; $(lab[0]).textContent = s[k] + lab[1]; }
}
function onChange(e) {
  const t = e.target, s = st();
  if (t.dataset.act === 'setb') { s[t.dataset.k] = t.checked; save(); }
  if (t.dataset.act === 'voice') { s.voices[t.dataset.l] = t.value; save(); speak({ fr: 'Bonjour', es: 'Hola', nl: 'Hallo' }[t.dataset.l], t.dataset.l); }
}

/* ================= boot ================= */
function shell() {
  document.getElementById('app').innerHTML = `
  <header class="top"><div class="top-in">
    <div class="brand">Tríada<small>อ่านฝรั่งเศส · สเปน · ดัตช์</small></div>
    <div class="langs" role="group" aria-label="ภาษาที่เรียน">${Object.keys(LANGS).map(l => `<button data-act="lang" data-lang="${l}" title="${LANGS[l].name}">${l.toUpperCase()}</button>`).join('')}</div>
    <button class="iconbtn" data-act="prefs" aria-label="ตั้งค่า">${ic('gear')}</button>
  </div></header>
  <main id="main"></main>
  <nav class="tabs" aria-label="เมนูหลัก"><div class="tabs-in">
    ${[['feed', 'feed', 'ฟีด'], ['read', 'quiz', 'ความรู้'], ['novel', 'book', 'นิยาย'], ['cards', 'cards', 'การ์ด'], ['dict', 'dict', 'พจนานุกรม']].map(([t, i, l]) => `<button data-act="tab" data-tab="${t}">${ic(i)}<span>${l}</span>${t === 'cards' ? '<span class="dot" id="dueDot" hidden></span>' : ''}</button>`).join('')}
  </div></nav>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="ความหมายคำ"><div class="sheet-in"></div></div>
  <div class="toast" id="toast" role="status"></div>`;
  $('#scrim').addEventListener('click', closeSheet);
}
function boot() {
  load(); ingest(); S.web = S.web || {}; for (const it of Object.values(S.web)) BYID[it.id] = it; shell(); applyLook();
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('fc')) { e.preventDefault(); e.target.click(); } });
  startI18n();
  lastSettingsJSON = JSON.stringify(S.settings);
  if (typeof fbInit === 'function' && FB_CFG && navigator.onLine) fbInit(true);
  addEventListener('online', () => { if (typeof fbInit === 'function' && FB_CFG) fbInit(true); });
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('online', () => view.name === 'dict' || view.name === 'prefs' ? render() : 0);
  addEventListener('offline', () => view.name === 'dict' || view.name === 'prefs' ? render() : 0);
  view = { name: S.tab || 'feed' };
  render();
}
window.TriadaApp = { DB, DICT, lookup, estimateLevel, buildWebItem, splitSentences, voiceScore, state: () => S };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
