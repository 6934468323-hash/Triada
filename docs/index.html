<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#18202D"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Tríada Reader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,600&display=swap">
<style>/* Layout: one reading column (max 720px) between a sticky language bar and a fixed bottom tab bar.
   The accent follows the language being studied: French blue, Spanish red, Dutch orange. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EBEEF3; --ink:#18202D; --muted:#5B6476; --line:#DCE1E9;
  --fr:#2D47D2; --es:#C7351F; --nl:#D9620C; --accent:var(--fr); --accent-ink:#FFFFFF;
  --accent-soft:color-mix(in srgb, var(--accent) 12%, transparent);
  --good:#17845A; --bad:#C0392B; --warn:#B7791F; --hard:color-mix(in srgb, var(--accent) 70%, var(--ink));
  --saved-bg:color-mix(in srgb, var(--warn) 18%, transparent);
  --speak-bg:color-mix(in srgb, var(--accent) 16%, transparent);
  --shadow:0 10px 30px rgba(20,28,45,.12);
  --f-read:"Literata", "Iowan Old Style", Georgia, "IBM Plex Sans Thai", serif;
  --f-ui:"IBM Plex Sans Thai", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-display:"Bricolage Grotesque", "IBM Plex Sans Thai", system-ui, sans-serif;
  --read-size:19px; --read-lh:1.75;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not([data-skin="sepia"]){
  --bg:#0F1218; --surface:#171B24; --surface-2:#202533; --ink:#E6E9F0; --muted:#98A1B3; --line:#2A3040;
  --fr:#8197FF; --es:#FF7C60; --nl:#FF9C4F; --accent-ink:#0F1218;
  --good:#4CC38A; --bad:#FF7A6B; --warn:#E3B04B; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]:not([data-skin="sepia"]){
  --bg:#0F1218; --surface:#171B24; --surface-2:#202533; --ink:#E6E9F0; --muted:#98A1B3; --line:#2A3040;
  --fr:#8197FF; --es:#FF7C60; --nl:#FF9C4F; --accent-ink:#0F1218;
  --good:#4CC38A; --bad:#FF7A6B; --warn:#E3B04B; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }
:root[data-skin="sepia"]{
  --bg:#EFE6D2; --surface:#F8F1E1; --surface-2:#E6DBC3; --ink:#3A2E1F; --muted:#76664F; --line:#D8CAAE;
  --fr:#2D47A8; --es:#A8321E; --nl:#B2550F; --accent-ink:#FFF8EA; color-scheme:light }
:root[data-lang="es"]{--accent:var(--es)} :root[data-lang="nl"]{--accent:var(--nl)}
:root[data-accent="teal"]{--accent:#0F8C84} :root[data-accent="violet"]{--accent:#7446D6} :root[data-accent="green"]{--accent:#2E8540} :root[data-accent="pink"]{--accent:#C2367A}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px;margin-right:auto;min-width:0}
.brand small{font-family:var(--f-ui);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langs{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.langs button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.04em}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{border:0;background:transparent;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}

/* ---------- main column ---------- */
main{max-width:760px;margin:0 auto;padding-block:14px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 12px;flex-wrap:wrap}
.view-head h1{font-size:26px;letter-spacing:-.02em}
.view-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* chips / filters */
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chiprow::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.lv{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;letter-spacing:.04em;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.lvl{background:var(--accent-soft);color:var(--accent)}
.badge.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}

/* ---------- reading text ---------- */
.rt{font-family:var(--f-read);font-size:var(--read-size);line-height:var(--read-lh);overflow-wrap:break-word}
.rt.sans{font-family:var(--f-ui)}
.rt p{margin:0 0 .9em}
.sent{border-radius:4px;transition:background .2s}
.sent.speaking{background:var(--speak-bg)}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:var(--accent-soft)}
.w.hard{text-decoration:underline dotted var(--hard);text-decoration-thickness:1.5px;text-underline-offset:4px}
.w.saved{background:var(--saved-bg)}
.w.sel{background:var(--accent);color:var(--accent-ink)}
.tr{display:none;font-family:var(--f-ui);font-size:.78em;line-height:1.55;color:var(--muted);margin:.15em 0 .6em;padding-left:10px;border-left:2px solid var(--line)}
.showtr .sent{display:block;margin-bottom:.1em}
.showtr .tr{display:block}
.sent.open .tr{display:block}
.sent.open{display:block}

/* toolbar */
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;font-size:13.5px;color:var(--ink)}
.tbtn:hover{border-color:var(--accent)}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tbtn.ghost{border-color:transparent;background:transparent}
.tbtn svg.i{width:17px;height:17px}

/* ---------- feed posts ---------- */
.post{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.post-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;flex:none;font-family:var(--f-display)}
.who{min-width:0;flex:1}
.who b{display:block;font-size:14.5px}
.who span{font-size:12.5px;color:var(--muted)}
.post .rt{font-size:calc(var(--read-size) - 1px)}
.post-f{display:flex;gap:4px;align-items:center;border-top:1px solid var(--line);margin-top:8px;padding-top:8px;flex-wrap:wrap}
.post-f .tbtn{border:0;background:transparent;padding:6px 8px;color:var(--muted)}
.post-f .tbtn[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.liked{color:var(--bad)!important}
.liked svg{fill:currentColor}
.comments{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.cmt{display:flex;gap:9px}
.cmt .av{width:30px;height:30px;font-size:12px}
.cmt-b{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:8px 12px;min-width:0;flex:1}
.cmt-b b{font-size:13px}
.cmt-b .rt{font-size:calc(var(--read-size) - 3px);line-height:1.6}
.feed-end{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:6px 0 18px}
.feed-end::before,.feed-end::after{content:"";flex:1;height:1px;background:var(--line)}
.readmark{font-size:12px;color:var(--good);display:inline-flex;gap:4px;align-items:center}

/* ---------- article list ---------- */
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
button.card:hover{border-color:var(--accent)}
.card h3{font-size:17.5px;font-family:var(--f-read);font-weight:600;letter-spacing:-.005em}
.card .sub{font-size:13px;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.live{border-style:dashed}

/* article page */
.art-head{margin:6px 0 14px}
.art-head h1{font-family:var(--f-read);font-size:28px;font-weight:600;letter-spacing:-.01em;margin:8px 0 4px}
.art-head .tsub{color:var(--muted);font-size:14px}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);padding:4px 0;font-size:14px}
.stickytools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);z-index:10;background:var(--bg);padding:8px 0;margin-bottom:8px;border-bottom:1px solid var(--line)}
#artBody .rt p:first-child::first-letter{font-size:3.1em;float:left;line-height:.9;margin:.06em .08em 0 0;font-weight:600;color:var(--accent)}
.endbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:20px}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.q .qtype{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700}
.q .qt{font-family:var(--f-read);font-size:17px;font-weight:600;margin:6px 0 2px}
.q .qth{color:var(--muted);font-size:13.5px;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px;color:var(--ink)}
.opt .k{font-weight:700;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--surface-2);font-size:12.5px;flex:none}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt[disabled]{cursor:default}
.expl{margin-top:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.score{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}

/* novel */
.genre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cover{position:relative;border-radius:16px;padding:18px 16px 16px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;text-align:left;border:1px solid var(--line);color:var(--ink);background:var(--surface);overflow:hidden}
.cover::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--g)}
.cover .gname{position:absolute;top:16px;left:16px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--g)}
.cover h3{font-family:var(--f-read);font-size:20px;font-weight:600;font-style:italic}
.cover p{margin:0;font-size:13px;color:var(--muted)}
.novel .rt{font-size:calc(var(--read-size) + 1px)}
.novel .rt p{text-indent:1.4em;margin-bottom:.5em}
.novel .rt p:first-child{text-indent:0}
.novel .rt p.scene{text-indent:0;text-align:center;letter-spacing:.6em;color:var(--muted)}
.progress{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}

/* flashcards */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.flash{perspective:1200px;margin:6px 0 14px}
.fc{position:relative;min-height:290px;border-radius:20px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc-side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;overflow:auto}
.fc-back{transform:rotateY(180deg)}
.fc .big{font-family:var(--f-read);font-size:36px;font-weight:600;overflow-wrap:anywhere}
.fc .mean{font-size:20px;font-weight:600}
.fc .ex{font-family:var(--f-read);font-size:15px;color:var(--muted);max-width:52ch}
.fc .hint{font-size:12px;color:var(--muted);position:absolute;bottom:12px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:center;color:var(--ink)}
.grades button small{font-weight:400;color:var(--muted);font-size:11.5px}
.grades .g0{color:var(--bad)} .grades .g3{color:var(--good)}
.wordrow{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.wordrow .wd{flex:1;min-width:0}
.wordrow .wd b{font-family:var(--f-read);font-size:16.5px}
.wordrow .wd div{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* dictionary */
.search{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 12px;margin-bottom:12px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;border:0;background:transparent;padding:9px 0;outline:none;min-width:0;font-size:16px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.entry h2{font-family:var(--f-read);font-size:24px;font-weight:600}
.entry .m{margin:6px 0 0;font-size:15.5px}
.entry .m.en{color:var(--muted)}
.exs{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.exs blockquote{margin:0;border-left:3px solid var(--accent);padding:2px 0 2px 10px;font-family:var(--f-read);font-size:15px}
.exs blockquote small{display:block;font-family:var(--f-ui);color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* settings */
.set-group{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.set-group h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 16px 4px;font-family:var(--f-ui)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.set-group h2+.row{border-top:0}
.row label{flex:1;min-width:150px}
.row label small{display:block;color:var(--muted);font-size:12.5px}
.row select,.row input[type="text"],textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s;pointer-events:none}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{left:21px}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
input[type="range"]{accent-color:var(--accent);width:170px;max-width:100%}
.swatches{display:flex;gap:8px}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar-h)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs .dot{position:absolute;top:8px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;font-weight:700}

/* ---------- word sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.sheet.on{transform:none;pointer-events:auto}
.sheet-in{max-width:640px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:78vh;overflow:auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sh-word{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sh-word h2{font-family:var(--f-read);font-size:30px;font-weight:600}
.sh-mean{font-size:18px;font-weight:600;margin:8px 0 0}
.sh-mean2{color:var(--muted);margin:2px 0 0}
.sh-sent{margin-top:14px;background:var(--bg);border-radius:12px;padding:12px 14px}
.sh-sent .o{font-family:var(--f-read);font-size:16px;line-height:1.6}
.sh-sent .o mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px}
.sh-sent .t{margin-top:8px;font-size:14.5px;color:var(--muted)}
.sh-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sh-phrase{margin-top:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line)}
.sh-phrase b{font-family:var(--f-read);font-size:16px}
.online{margin-top:12px;font-size:14px;border-top:1px dashed var(--line);padding-top:10px}
.online ol{margin:4px 0;padding-left:20px}

.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:50;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);transition:.25s;pointer-events:none;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.offline-pill{font-size:11px;font-weight:600;color:var(--warn);border:1px solid currentColor;border-radius:99px;padding:1px 8px}

@media (max-width:420px){
  .brand small{display:none}
  .view-head h1{font-size:23px}
  .art-head h1{font-size:24px}
  .stats b{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

{ id:"fr-r1", cat:"health", lvl:"A2", src:"สุขภาพ", title:["Pourquoi dormir est si important","Why sleeping is so important","ทำไมการนอนจึงสำคัญนัก"],
  p:[[["Chaque nuit, notre corps travaille pendant que nous dormons.","Every night, our body works while we sleep.","ทุกคืน ร่างกายของเราทำงานในขณะที่เรานอนหลับ"],
      ["Le cerveau classe les informations de la journée et garde les plus importantes.","The brain sorts the day's information and keeps the most important.","สมองจัดระเบียบข้อมูลของวันและเก็บส่วนที่สำคัญที่สุดไว้"],
      ["Les muscles se réparent et le système immunitaire devient plus fort.","Muscles repair themselves and the immune system becomes stronger.","กล้ามเนื้อซ่อมแซมตัวเองและระบบภูมิคุ้มกันแข็งแรงขึ้น"]],
     [["Un adulte a besoin de sept à neuf heures de sommeil.","An adult needs seven to nine hours of sleep.","ผู้ใหญ่ต้องการการนอนหลับเจ็ดถึงเก้าชั่วโมง"],
      ["Pourtant, beaucoup de personnes dorment moins de six heures, surtout à cause des écrans.","Yet many people sleep less than six hours, especially because of screens.","อย่างไรก็ตาม หลายคนนอนน้อยกว่าหกชั่วโมง ส่วนใหญ่เป็นเพราะหน้าจอ"],
      ["La lumière bleue des téléphones dit au cerveau qu'il fait encore jour.","The blue light of phones tells the brain that it is still daytime.","แสงสีฟ้าจากโทรศัพท์บอกสมองว่ายังเป็นเวลากลางวันอยู่"]],
     [["Quand on dort mal, on est fatigué, on mange plus de sucre et on se concentre difficilement.","When you sleep badly, you are tired, you eat more sugar and you concentrate with difficulty.","เมื่อนอนไม่ดี เราจะเหนื่อย กินน้ำตาลมากขึ้น และมีสมาธิได้ยาก"],
      ["Les médecins conseillent donc de se coucher à la même heure et d'éteindre les écrans une heure avant.","Doctors therefore advise going to bed at the same time and turning off screens an hour before.","แพทย์จึงแนะนำให้เข้านอนเวลาเดิมทุกวันและปิดหน้าจอก่อนนอนหนึ่งชั่วโมง"],
      ["Dormir n'est pas une perte de temps : c'est un investissement pour la santé.","Sleeping is not a waste of time: it's an investment in health.","การนอนไม่ใช่การเสียเวลา แต่เป็นการลงทุนเพื่อสุขภาพ"]]],
  v:{"corps":"A2|n|body|ร่างกาย","cerveau":"A2|n|brain|สมอง","classe":"B1|v|sorts, classifies|จัดหมวดหมู่|classer","informations":"A2|n|information|ข้อมูล|information","muscles":"A2|n|muscles|กล้ามเนื้อ|muscle","réparent":"B1|v|repair|ซ่อมแซม|réparer","système immunitaire":"B1|n|immune system|ระบบภูมิคุ้มกัน","immunitaire":"B1|adj|immune|เกี่ยวกับภูมิคุ้มกัน","besoin":"A2|n|need|ความต้องการ","sommeil":"A2|n|sleep|การนอนหลับ","écrans":"A2|n|screens|หน้าจอ|écran","lumière":"A2|n|light|แสง","fatigué":"A1|adj|tired|เหนื่อย","sucre":"A1|n|sugar|น้ำตาล","concentre":"B1|v|concentrates|มีสมาธิ|concentrer","difficilement":"B1|adv|with difficulty|อย่างยากลำบาก","médecins":"A2|n|doctors|แพทย์|médecin","conseillent":"B1|v|advise|แนะนำ|conseiller","coucher":"A2|v|to go to bed (se coucher)|เข้านอน","éteindre":"B1|v|to turn off|ปิด (ไฟ/เครื่อง)","perte":"B1|n|loss, waste|การสูญเสีย","investissement":"B2|n|investment|การลงทุน","santé":"A2|n|health|สุขภาพ"},
  q:[{t:"main",q:["Quelle est l'idée principale du texte ?","ใจความสำคัญของบทความคืออะไร"],o:["Les écrans sont dangereux pour les enfants.","Le sommeil est essentiel au bon fonctionnement du corps et du cerveau.","Les adultes dorment trop.","Il faut manger moins de sucre le soir."],a:1,x:"ทั้งบทความอธิบายว่าระหว่างนอน สมองและร่างกายทำงานอย่างไร และปิดท้ายว่าการนอนคือ “การลงทุนเพื่อสุขภาพ” ข้อ A และ D เป็นเพียงรายละเอียดย่อย"},
     {t:"detail",q:["Selon le texte, que fait le cerveau pendant la nuit ?","ตามบทความ สมองทำอะไรในตอนกลางคืน"],o:["Il se repose complètement.","Il produit de la lumière bleue.","Il trie les informations et garde les plus importantes.","Il répare les muscles."],a:2,x:"ประโยค “Le cerveau classe les informations… et garde les plus importantes” ส่วนการซ่อมกล้ามเนื้อเป็นหน้าที่ของร่างกาย ไม่ใช่สมองโดยตรง"},
     {t:"not",q:["Laquelle de ces affirmations N'EST PAS conforme au texte ?","ข้อใดไม่สอดคล้องกับบทความ"],o:["Un adulte a besoin d'au moins sept heures de sommeil.","La lumière des écrans perturbe le rythme du cerveau.","Mal dormir donne envie de manger sucré.","Les médecins conseillent de dormir avec le téléphone allumé."],a:3,x:"บทความบอกให้ “ปิดหน้าจอก่อนนอนหนึ่งชั่วโมง” ดังนั้นข้อ D ขัดแย้งกับเนื้อหา"},
     {t:"vocab",q:["Dans le texte, le mot « investissement » signifie que dormir…","คำว่า “investissement” ในบทความสื่อว่าการนอน…"],o:["coûte cher.","apporte des bénéfices plus tard.","prend trop de temps.","est une obligation légale."],a:1,x:"การลงทุน = ใส่บางอย่างลงไปตอนนี้เพื่อได้ผลตอบแทนภายหลัง ผู้เขียนใช้เปรียบเทียบตรงข้ามกับ “perte de temps” (การเสียเวลา)"},
     {t:"infer",q:["Que peut-on déduire du texte ?","อนุมานจากบทความได้ว่าอย่างไร"],o:["Regarder son téléphone au lit peut retarder l'endormissement.","Dormir neuf heures est mauvais pour la santé.","Les muscles ne travaillent que le jour.","Le sucre aide à mieux dormir."],a:0,x:"บทความบอกว่าแสงสีฟ้า “บอกสมองว่ายังเป็นกลางวัน” จึงอนุมานได้ว่าการดูมือถือบนเตียงทำให้หลับช้าลง แม้ไม่ได้เขียนไว้ตรงๆ"}]},
{ id:"fr-r2", cat:"science", lvl:"B2", src:"วิทยาศาสตร์", title:["La pieuvre, une intelligence venue d'ailleurs","The octopus, an intelligence from elsewhere","ปลาหมึกยักษ์ ความฉลาดที่มาจากอีกโลก"],
  p:[[["Parmi les invertébrés, la pieuvre fait figure d'exception.","Among invertebrates, the octopus stands out as an exception.","ในบรรดาสัตว์ไม่มีกระดูกสันหลัง ปลาหมึกยักษ์ถือเป็นข้อยกเว้น"],
      ["Elle est capable d'ouvrir un bocal, de reconnaître des visages humains et même de s'échapper de son aquarium pour aller chasser dans un bassin voisin.","It is able to open a jar, recognise human faces and even escape from its aquarium to go hunting in a neighbouring tank.","มันเปิดขวดโหลได้ จำใบหน้ามนุษย์ได้ และถึงขั้นหนีออกจากตู้ไปล่าเหยื่อในบ่อข้างๆ"]],
     [["Ce qui fascine les chercheurs, c'est surtout l'organisation de son système nerveux.","What fascinates researchers above all is the organisation of its nervous system.","สิ่งที่ทำให้นักวิจัยทึ่งที่สุดคือการจัดระบบประสาทของมัน"],
      ["Sur ses quelque cinq cents millions de neurones, environ deux tiers se trouvent non pas dans le cerveau, mais dans les bras.","Of its roughly five hundred million neurons, about two thirds are located not in the brain, but in the arms.","จากเซลล์ประสาทราวห้าร้อยล้านเซลล์ ประมาณสองในสามไม่ได้อยู่ในสมอง แต่อยู่ในหนวด"],
      ["Chaque bras peut ainsi goûter, toucher et prendre des décisions simples de manière relativement autonome.","Each arm can thus taste, touch and make simple decisions relatively autonomously.","หนวดแต่ละเส้นจึงรับรส สัมผัส และตัดสินใจง่ายๆ ได้ค่อนข้างเป็นอิสระ"]],
     [["Cette intelligence est d'autant plus surprenante que la pieuvre vit rarement plus de deux ans et ne connaît pas ses parents.","This intelligence is all the more surprising as the octopus rarely lives more than two years and does not know its parents.","ความฉลาดนี้ยิ่งน่าประหลาดใจ เพราะปลาหมึกยักษ์มักมีชีวิตไม่เกินสองปีและไม่รู้จักพ่อแม่ของตัวเอง"],
      ["Elle n'apprend donc rien de ses aînés : tout ce qu'elle sait, elle le découvre seule.","So it learns nothing from its elders: everything it knows, it discovers alone.","มันจึงไม่ได้เรียนรู้อะไรจากรุ่นก่อนเลย ทุกสิ่งที่รู้ มันค้นพบเองทั้งหมด"],
      ["Pour certains biologistes, elle constitue la preuve que l'intelligence complexe est apparue plusieurs fois au cours de l'évolution, par des chemins très différents.","For some biologists, it is proof that complex intelligence appeared several times during evolution, by very different paths.","สำหรับนักชีววิทยาบางคน มันคือหลักฐานว่าความฉลาดที่ซับซ้อนเกิดขึ้นหลายครั้งในวิวัฒนาการ ผ่านเส้นทางที่ต่างกันมาก"]],
     [["Ces découvertes soulèvent aussi des questions éthiques.","These discoveries also raise ethical questions.","การค้นพบเหล่านี้ยังจุดประเด็นคำถามเชิงจริยธรรมด้วย"],
      ["Plusieurs pays ont récemment reconnu que les céphalopodes peuvent ressentir la douleur, ce qui remet en cause les projets d'élevage industriel de pieuvres.","Several countries have recently recognised that cephalopods can feel pain, which calls into question plans for industrial octopus farming.","หลายประเทศเพิ่งยอมรับว่าสัตว์จำพวกหมึกรู้สึกเจ็บปวดได้ ทำให้โครงการฟาร์มเลี้ยงปลาหมึกยักษ์แบบอุตสาหกรรมถูกตั้งคำถาม"]]],

  q:[{t:"main",q:["Quel est le sujet principal de ce texte ?","หัวข้อหลักของบทความนี้คืออะไร"],o:["Les techniques d'élevage des pieuvres.","Les caractéristiques étonnantes de l'intelligence de la pieuvre et leurs implications.","La comparaison entre le cerveau humain et celui de la pieuvre.","La durée de vie des invertébrés marins."],a:1,x:"บทความพูดถึงความฉลาด → โครงสร้างประสาท → ความน่าทึ่งที่มันเรียนรู้เอง → ผลทางจริยธรรม ข้อ B ครอบคลุมทุกย่อหน้า ส่วนข้ออื่นแคบเกินไปหรือไม่ได้กล่าวถึง"},
     {t:"detail",q:["Où se trouve la majorité des neurones de la pieuvre ?","เซลล์ประสาทส่วนใหญ่ของปลาหมึกยักษ์อยู่ที่ใด"],o:["Dans son cerveau.","Dans ses yeux.","Dans ses bras.","Répartie également dans tout le corps."],a:2,x:"“environ deux tiers se trouvent non pas dans le cerveau, mais dans les bras” สองในสามคือส่วนใหญ่"},
     {t:"not",q:["Quelle affirmation est CONTRAIRE au texte ?","ข้อใดขัดแย้งกับบทความ"],o:["La pieuvre peut identifier certains humains.","La pieuvre apprend en observant ses parents.","Les bras de la pieuvre peuvent agir de façon assez indépendante.","Certains pays reconnaissent que les céphalopodes souffrent."],a:1,x:"บทความบอกว่ามัน “ไม่รู้จักพ่อแม่” และ “ไม่ได้เรียนรู้อะไรจากรุ่นก่อน” ข้อ B จึงขัดกับเนื้อหา"},
     {t:"infer",q:["Pourquoi l'auteur dit-il que l'intelligence de la pieuvre est « d'autant plus surprenante » ?","ทำไมผู้เขียนจึงบอกว่าความฉลาดของปลาหมึกยักษ์ “ยิ่งน่าประหลาดใจ”"],o:["Parce qu'elle a très peu de neurones.","Parce qu'elle l'acquiert sans transmission et en très peu de temps.","Parce qu'elle vit dans des aquariums.","Parce qu'elle est un mammifère."],a:1,x:"ประโยคถัดมาอธิบายว่ามันอายุสั้น (ไม่เกิน 2 ปี) และไม่ได้เรียนจากรุ่นก่อน ความฉลาดจึงได้มาเองในเวลาสั้นๆ ข้อ A ผิดเพราะ 500 ล้านเซลล์ไม่ใช่น้อย"},
     {t:"purpose",q:["Quelle est la fonction du dernier paragraphe ?","ย่อหน้าสุดท้ายมีหน้าที่อะไร"],o:["Résumer les expériences scientifiques citées.","Montrer les conséquences concrètes de ces découvertes sur la manière de traiter l'animal.","Contredire les biologistes.","Présenter une recette de cuisine."],a:1,x:"ย่อหน้าสุดท้ายเชื่อมความรู้ทางวิทยาศาสตร์ไปสู่ผลในโลกจริง คือกฎหมายและข้อถกเถียงเรื่องฟาร์มปลาหมึก ไม่ได้สรุปหรือโต้แย้งนักชีววิทยา"}]},
{ id:"fr-r3", cat:"env", lvl:"C1", src:"สิ่งแวดล้อม/สังคม", title:["Îlots de chaleur : la ville face à ses propres excès","Heat islands: the city facing its own excesses","เกาะความร้อน: เมืองที่ต้องเผชิญความล้นเกินของตัวเอง"],
  p:[[["Lors des canicules, il n'est pas rare que le centre d'une grande ville affiche plusieurs degrés de plus que la campagne environnante.","During heatwaves, it is not unusual for the centre of a big city to show several degrees more than the surrounding countryside.","ช่วงคลื่นความร้อน ไม่ใช่เรื่องแปลกที่ใจกลางเมืองใหญ่จะร้อนกว่าชนบทรอบๆ หลายองศา"],
      ["Ce phénomène, baptisé « îlot de chaleur urbain », tient moins au climat qu'à la façon dont nous avons bâti nos villes.","This phenomenon, called the 'urban heat island', is due less to the climate than to the way we have built our cities.","ปรากฏการณ์นี้ที่เรียกว่า “เกาะความร้อนในเมือง” เกิดจากวิธีที่เราสร้างเมืองมากกว่าจากสภาพภูมิอากาศ"]],
     [["L'asphalte et le béton absorbent le rayonnement solaire pendant la journée, puis le restituent la nuit, empêchant l'air de se rafraîchir.","Asphalt and concrete absorb solar radiation during the day, then release it at night, preventing the air from cooling.","ยางมะตอยและคอนกรีตดูดซับรังสีดวงอาทิตย์ตอนกลางวัน แล้วคายออกมาตอนกลางคืน ทำให้อากาศไม่เย็นลง"],
      ["À cela s'ajoutent la chaleur dégagée par les climatiseurs et la circulation, ainsi que la rareté de la végétation, qui, par l'évaporation, joue pourtant le rôle d'un climatiseur naturel.","Added to this are the heat given off by air conditioners and traffic, as well as the scarcity of vegetation, which, through evaporation, nevertheless acts as a natural air conditioner.","นอกจากนี้ยังมีความร้อนจากเครื่องปรับอากาศและการจราจร รวมถึงการขาดแคลนพืชพรรณ ซึ่งที่จริงแล้วทำหน้าที่เป็นเครื่องปรับอากาศธรรมชาติผ่านการระเหยของน้ำ"],
      ["Le paradoxe est cruel : plus il fait chaud, plus on climatise, et plus on réchauffe la rue.","The paradox is cruel: the hotter it is, the more we air-condition, and the more we heat up the street.","ความย้อนแย้งนี้โหดร้าย ยิ่งร้อนก็ยิ่งเปิดแอร์ และยิ่งทำให้ถนนร้อนขึ้น"]],
     [["Les conséquences ne sont pas seulement inconfortables ; elles sont sanitaires et sociales.","The consequences are not only uncomfortable; they are health-related and social.","ผลกระทบไม่ได้แค่ทำให้ไม่สบายตัว แต่ยังเกี่ยวกับสุขภาพและสังคมด้วย"],
      ["Les personnes âgées et les habitants de logements mal isolés, souvent les plus modestes, sont les premiers exposés.","Elderly people and residents of poorly insulated housing, often the poorest, are the first exposed.","ผู้สูงอายุและผู้อยู่อาศัยในบ้านที่กันความร้อนได้ไม่ดี ซึ่งมักเป็นผู้มีรายได้น้อย เป็นกลุ่มแรกที่ได้รับผลกระทบ"]],
     [["Face à ce constat, plusieurs métropoles misent sur des solutions dites « fondées sur la nature » : cours d'école végétalisées, toitures blanches, rues ombragées.","Faced with this observation, several cities are betting on so-called 'nature-based' solutions: greened schoolyards, white roofs, shaded streets.","เมื่อเห็นเช่นนี้ หลายมหานครจึงหันมาใช้ “แนวทางที่อิงธรรมชาติ” เช่น ลานโรงเรียนที่ปลูกต้นไม้ หลังคาสีขาว และถนนที่มีร่มเงา"],
      ["Ces mesures, si elles ne suffiront pas à elles seules à compenser le réchauffement global, rappellent qu'une partie de la solution se trouve sous nos pieds.","These measures, while they will not on their own be enough to offset global warming, remind us that part of the solution lies beneath our feet.","มาตรการเหล่านี้แม้ลำพังจะไม่พอชดเชยภาวะโลกร้อน แต่ก็เตือนให้รู้ว่าทางออกส่วนหนึ่งอยู่ใต้เท้าเรานี่เอง"]]],
  v:{"îlots":"C1|n|islands (small)|เกาะเล็ก|îlot","îlot":"C1|n|small island|เกาะเล็ก","chaleur":"B1|n|heat|ความร้อน","canicules":"B2|n|heatwaves|คลื่นความร้อน|canicule","rare":"B1|adj|rare|หายาก, ไม่บ่อย","affiche":"B2|v|displays, shows|แสดง|afficher","environnante":"C1|adj|surrounding|โดยรอบ|environnant","phénomène":"B2|n|phenomenon|ปรากฏการณ์","baptisé":"C1|adj|named, dubbed|ได้รับการขนานนาม|baptiser","urbain":"B2|adj|urban|ในเมือง","tient":"C1|v|is due to (tenir à)|เกิดจาก|tenir","bâti":"B2|v|built|สร้าง|bâtir","asphalte":"C1|n|asphalt|ยางมะตอย","béton":"B2|n|concrete|คอนกรีต","absorbent":"B2|v|absorb|ดูดซับ|absorber","rayonnement":"C1|n|radiation|การแผ่รังสี","solaire":"B1|adj|solar|เกี่ยวกับดวงอาทิตย์","restituent":"C1|v|give back, release|คืน, ปล่อยออกมา|restituer","empêchant":"B2|v|preventing|ขัดขวาง|empêcher","rafraîchir":"B2|v|to cool down|ทำให้เย็นลง","dégagée":"C1|adj|given off, released|ที่ปล่อยออกมา|dégager","climatiseurs":"B2|n|air conditioners|เครื่องปรับอากาศ|climatiseur","circulation":"B1|n|traffic|การจราจร","rareté":"C1|n|scarcity|ความขาดแคลน","végétation":"B2|n|vegetation|พืชพรรณ","évaporation":"C1|n|evaporation|การระเหย","paradoxe":"C1|n|paradox|ความย้อนแย้ง","cruel":"B2|adj|cruel|โหดร้าย","climatise":"C1|v|air-conditions|เปิดแอร์|climatiser","réchauffe":"B2|v|heats up|ทำให้ร้อนขึ้น|réchauffer","inconfortables":"B2|adj|uncomfortable|ไม่สบาย|inconfortable","sanitaires":"C1|adj|health-related|ด้านสุขอนามัย|sanitaire","âgées":"B1|adj|elderly|สูงอายุ|âgé","logements":"B1|n|housing, dwellings|ที่อยู่อาศัย|logement","isolés":"B2|adj|insulated|ที่มีฉนวน|isolé","modestes":"C1|adj|modest, low-income|มีรายได้น้อย|modeste","exposés":"B2|adj|exposed|เผชิญ, สัมผัส|exposé","constat":"C1|n|observation, finding|ข้อสังเกต, ข้อเท็จจริงที่พบ","métropoles":"C1|n|metropolises|มหานคร|métropole","misent":"C1|v|bet on (miser sur)|เดิมพัน, ทุ่มให้|miser","fondées":"C1|adj|based|ที่ตั้งอยู่บน|fondé","végétalisées":"C2|adj|planted with greenery|ที่ปลูกพืชคลุม|végétaliser","toitures":"C1|n|roofs|หลังคา|toiture","ombragées":"C1|adj|shaded|มีร่มเงา|ombragé","mesures":"B2|n|measures|มาตรการ|mesure","suffiront":"B2|v|will suffice|จะเพียงพอ|suffire","compenser":"C1|v|to offset, compensate|ชดเชย","réchauffement":"B2|n|warming|ภาวะร้อนขึ้น","rappellent":"B1|v|remind|เตือนให้นึกถึง|rappeler","pieds":"A1|n|feet|เท้า|pied"},
  q:[{t:"main",q:["Quelle est la thèse centrale du texte ?","ข้อเสนอหลักของบทความคืออะไร"],o:["Le réchauffement climatique est la seule cause de la chaleur en ville.","Les îlots de chaleur résultent largement de choix d'urbanisme, sur lesquels on peut agir.","La climatisation est la meilleure réponse aux canicules.","La campagne souffre davantage des canicules que la ville."],a:1,x:"ประโยค “tient moins au climat qu'à la façon dont nous avons bâti nos villes” และย่อหน้าสุดท้าย (“ทางออกอยู่ใต้เท้าเรา”) ยืนยันว่าเป็นผลจากการออกแบบเมืองที่แก้ไขได้ ข้อ A ขัดตรงๆ"},
     {t:"detail",q:["Selon l'auteur, pourquoi l'air urbain se rafraîchit-il mal la nuit ?","ตามผู้เขียน ทำไมอากาศในเมืองจึงเย็นลงยากในตอนกลางคืน"],o:["Parce que le vent est plus fort en ville.","Parce que les matériaux urbains relâchent la chaleur stockée le jour.","Parce que les arbres produisent de la chaleur.","Parce que le soleil se couche plus tard en ville."],a:1,x:"“L'asphalte et le béton absorbent… puis le restituent la nuit” วัสดุเก็บความร้อนตอนกลางวันแล้วคายออกตอนกลางคืน"},
     {t:"vocab",q:["Que signifie « Le paradoxe est cruel » dans le contexte ?","“Le paradoxe est cruel” ในบริบทนี้หมายความว่าอะไร"],o:["La solution adoptée par les habitants aggrave le problème qu'elle cherche à résoudre.","Les canicules sont de plus en plus rares.","La végétation coûte trop cher.","Les climatiseurs sont interdits."],a:0,x:"ความย้อนแย้งคือ การเปิดแอร์ (วิธีแก้ร้อน) ปล่อยความร้อนออกสู่ถนน ทำให้ปัญหาแย่ลง — “plus on climatise, plus on réchauffe la rue”"},
     {t:"not",q:["Laquelle de ces idées N'APPARAÎT PAS dans le texte ?","ข้อใดไม่ปรากฏในบทความ"],o:["Les populations modestes sont plus vulnérables.","La végétation rafraîchit l'air par évaporation.","Les toitures blanches font partie des solutions envisagées.","Les solutions naturelles suffiront à stopper le réchauffement global."],a:3,x:"ผู้เขียนบอกตรงกันข้ามว่ามาตรการเหล่านี้ “ne suffiront pas à elles seules” (ลำพังไม่พอ) ข้อ D จึงไม่สอดคล้อง ข้อนี้ต้องอ่านโครงสร้าง si…ne…pas ให้แม่น"},
     {t:"tone",q:["Quelle attitude l'auteur adopte-t-il dans la conclusion ?","ในบทสรุป ผู้เขียนมีทัศนคติอย่างไร"],o:["Un optimisme naïf : le problème sera bientôt réglé.","Un pessimisme total : rien ne peut être fait.","Un réalisme mesuré : ces mesures sont utiles mais limitées.","Une indifférence complète."],a:2,x:"ผู้เขียนยอมรับข้อจำกัด (ไม่พอชดเชยโลกร้อน) แต่ยังเห็นประโยชน์ (เป็นส่วนหนึ่งของทางออก) จึงเป็นความสมจริงแบบชั่งน้ำหนัก ไม่ใช่มองโลกแง่ดีหรือร้ายสุดขั้ว"}]}

{ id:"es-f6", cat:"culture", lvl:"C1", user:"Ignacio Ruiz", handle:"nacho_lee", time:"3 สัปดาห์", likes:743,
  s:[["Acabo de terminar «Cien años de soledad» por tercera vez y sigo sin saber si es una novela sobre una familia o sobre la condena de repetir la historia.","I've just finished 'One Hundred Years of Solitude' for the third time and I still don't know whether it's a novel about a family or about the curse of repeating history.","ผมเพิ่งอ่าน “หนึ่งร้อยปีแห่งความโดดเดี่ยว” จบเป็นรอบที่สาม และยังไม่แน่ใจว่ามันเป็นนิยายเกี่ยวกับครอบครัว หรือเกี่ยวกับคำสาปของการซ้ำรอยประวัติศาสตร์"],
     ["Lo que en la primera lectura me pareció un caos de nombres idénticos, ahora se me revela como un mecanismo deliberado.","What on the first reading seemed to me a chaos of identical names now reveals itself to me as a deliberate mechanism.","สิ่งที่ตอนอ่านรอบแรกดูเหมือนความวุ่นวายของชื่อซ้ำกัน ตอนนี้กลับเผยให้เห็นว่าเป็นกลไกที่ตั้งใจวางไว้"],
     ["García Márquez no se limita a narrar: obliga al lector a extraviarse, a sentir en carne propia ese tiempo circular del que los Buendía no logran escapar.","García Márquez doesn't merely narrate: he forces the reader to get lost, to feel first-hand that circular time from which the Buendías cannot escape.","การ์เซีย มาร์เกซไม่ได้แค่เล่าเรื่อง แต่บังคับให้ผู้อ่านหลงทาง ให้รู้สึกด้วยตัวเองถึงเวลาที่วนเป็นวงกลมซึ่งตระกูลบวนเดียหนีไม่พ้น"]],
  v:{"soledad":"B2|n|solitude, loneliness|ความโดดเดี่ยว","tercera":"A2|adj|third|ที่สาม|tercero","sigo sin":"C1|expr|I still don't|ยังคงไม่|seguir sin","novela":"B1|n|novel|นิยาย","condena":"C1|n|curse, sentence|คำสาป, การลงโทษ","repetir":"B1|v|to repeat|ทำซ้ำ","lectura":"B1|n|reading|การอ่าน","pareció":"B1|v|seemed|ดูเหมือน|parecer","caos":"B2|n|chaos|ความโกลาหล","idénticos":"B2|adj|identical|เหมือนกันทุกประการ|idéntico","revela":"C1|v|reveals|เผยให้เห็น|revelar","mecanismo":"C1|n|mechanism|กลไก","deliberado":"C1|adj|deliberate|โดยเจตนา","se limita":"C1|v|limits himself|จำกัดตัวเอง|limitarse","narrar":"C1|v|to narrate|เล่าเรื่อง","obliga":"B2|v|forces|บังคับ|obligar","lector":"B1|n|reader|ผู้อ่าน","extraviarse":"C2|v|to get lost|หลงทาง","en carne propia":"C2|expr|first-hand|ด้วยตัวเอง","circular":"B2|adj|circular|เป็นวงกลม","logran":"B2|v|manage to|สามารถ (ทำสำเร็จ)|lograr","escapar":"B1|v|to escape|หนี"},
  c:[{u:"Beatriz C.", s:[["Yo me hice un árbol genealógico en la segunda página y aun así me perdí.","I drew a family tree on the second page and even so I got lost.","ฉันวาดแผนผังตระกูลไว้ตั้งแต่หน้าสอง แต่ก็ยังหลงอยู่ดี"]]},
     {u:"Ignacio Ruiz", s:[["Precisamente: perderse forma parte de la experiencia.","Precisely: getting lost is part of the experience.","นั่นแหละ การหลงทางก็เป็นส่วนหนึ่งของประสบการณ์"]]}],

read: [
{ id:"es-r1", cat:"env", lvl:"B1", src:"สิ่งแวดล้อม", title:["El agua que no vemos","The water we don't see","น้ำที่เรามองไม่เห็น"],
  p:[[["Cuando pensamos en ahorrar agua, normalmente imaginamos duchas más cortas o grifos cerrados.","When we think about saving water, we usually imagine shorter showers or turned-off taps.","เมื่อคิดถึงการประหยัดน้ำ เรามักนึกถึงการอาบน้ำให้สั้นลงหรือการปิดก๊อก"],
      ["Sin embargo, la mayor parte del agua que consumimos es invisible.","However, most of the water we consume is invisible.","อย่างไรก็ตาม น้ำส่วนใหญ่ที่เราใช้นั้นมองไม่เห็น"],
      ["Se llama «agua virtual» y es la que se necesita para producir lo que comemos, vestimos y compramos.","It's called 'virtual water' and it's what is needed to produce what we eat, wear and buy.","เรียกว่า “น้ำเสมือน” คือน้ำที่ใช้ในการผลิตสิ่งที่เรากิน สวมใส่ และซื้อ"]],
     [["Por ejemplo, para fabricar una camiseta de algodón hacen falta unos dos mil quinientos litros.","For example, to make a cotton T-shirt, about two thousand five hundred litres are needed.","ตัวอย่างเช่น การผลิตเสื้อยืดผ้าฝ้ายหนึ่งตัวต้องใช้น้ำราวสองพันห้าร้อยลิตร"],
      ["Un kilo de carne de vaca puede necesitar más de quince mil, sobre todo por el agua que consume el pienso de los animales.","A kilo of beef can require more than fifteen thousand, mainly because of the water consumed by the animals' feed.","เนื้อวัวหนึ่งกิโลกรัมอาจต้องใช้มากกว่าหนึ่งหมื่นห้าพันลิตร ส่วนใหญ่เป็นน้ำที่ใช้ปลูกอาหารสัตว์"],
      ["En comparación, una ducha de cinco minutos gasta unos sesenta litros.","In comparison, a five-minute shower uses about sixty litres.","เมื่อเปรียบเทียบ การอาบน้ำห้านาทีใช้น้ำประมาณหกสิบลิตร"]],
     [["Esto no significa que cerrar el grifo sea inútil, pero sí que nuestras decisiones de compra tienen un impacto mucho mayor.","This doesn't mean that turning off the tap is useless, but it does mean our purchasing decisions have a much bigger impact.","นี่ไม่ได้หมายความว่าการปิดก๊อกไร้ประโยชน์ แต่หมายความว่าการตัดสินใจซื้อของเรามีผลกระทบมากกว่ามาก"],
      ["Además, muchos países ricos importan productos de regiones donde el agua escasea, de modo que, sin saberlo, contribuyen a la sequía de otros.","Moreover, many rich countries import products from regions where water is scarce, so that, without knowing it, they contribute to others' drought.","นอกจากนี้ ประเทศร่ำรวยหลายแห่งนำเข้าสินค้าจากภูมิภาคที่ขาดแคลนน้ำ จึงมีส่วนทำให้ที่อื่นแห้งแล้งโดยไม่รู้ตัว"],
      ["Comprar menos ropa, aprovechar la comida y reducir el consumo de carne son gestos sencillos con un efecto real.","Buying fewer clothes, not wasting food and reducing meat consumption are simple gestures with a real effect.","ซื้อเสื้อผ้าให้น้อยลง ใช้อาหารให้คุ้ม และลดการกินเนื้อ เป็นการกระทำง่ายๆ ที่ได้ผลจริง"]]],
  v:{"ahorrar":"A2|v|to save|ประหยัด","imaginamos":"B1|v|we imagine|เรานึกภาพ|imaginar","duchas":"A2|n|showers|การอาบน้ำฝักบัว|ducha","cortas":"A1|adj|short|สั้น|corto","grifos":"B1|n|taps|ก๊อกน้ำ|grifo","grifo":"B1|n|tap|ก๊อกน้ำ","sin embargo":"B1|expr|however|อย่างไรก็ตาม","mayor parte":"B1|expr|most, the majority|ส่วนใหญ่","consumimos":"B1|v|we consume|เราบริโภค|consumir","invisible":"B1|adj|invisible|มองไม่เห็น","virtual":"B2|adj|virtual|เสมือน","producir":"B1|v|to produce|ผลิต","vestimos":"B1|v|we wear|เราสวมใส่|vestir","fabricar":"B1|v|to manufacture|ผลิต","camiseta":"A1|n|T-shirt|เสื้อยืด","algodón":"B1|n|cotton|ผ้าฝ้าย","hacen falta":"B1|expr|are needed|จำเป็นต้องใช้|hacer falta","litros":"A2|n|litres|ลิตร|litro","carne de vaca":"A2|n|beef|เนื้อวัว","pienso":"C1|n|animal feed|อาหารสัตว์","comparación":"B1|n|comparison|การเปรียบเทียบ","gasta":"B1|v|uses, spends|ใช้, สิ้นเปลือง|gastar","inútil":"B1|adj|useless|ไร้ประโยชน์","impacto":"B2|n|impact|ผลกระทบ","importan":"B2|v|import|นำเข้า|importar","escasea":"C1|v|is scarce|ขาดแคลน|escasear","de modo que":"B2|expr|so that|ดังนั้น","contribuyen":"B2|v|contribute|มีส่วน|contribuir","sequía":"B2|n|drought|ความแห้งแล้ง","aprovechar":"B2|v|to make the most of|ใช้ให้คุ้มค่า","reducir":"B1|v|to reduce|ลด","consumo":"B2|n|consumption|การบริโภค","gestos":"B2|n|gestures|การกระทำ, ท่าที|gesto","sencillos":"A2|adj|simple|ง่าย|sencillo"},
  q:[{t:"main",q:["¿Cuál es la idea principal del texto?","ใจความสำคัญของบทความคืออะไร"],o:["Ducharse menos es la mejor forma de ahorrar agua.","Gran parte del agua que gastamos está oculta en los productos que consumimos.","Los países ricos tienen más agua que los pobres.","La carne de vaca es mala para la salud."],a:1,x:"ทั้งบทความอธิบายแนวคิด “น้ำเสมือน” ที่ซ่อนอยู่ในสินค้า ข้อ A ถูกผู้เขียนลดความสำคัญลง ส่วนข้อ D ไม่ได้พูดเรื่องสุขภาพ"},
     {t:"detail",q:["Según el texto, ¿por qué la carne de vaca necesita tanta agua?","ตามบทความ ทำไมเนื้อวัวจึงใช้น้ำมาก"],o:["Porque las vacas beben mucho.","Porque hay que lavar la carne.","Sobre todo por el agua que se usa para producir su alimento.","Porque se transporta en barco."],a:2,x:"“sobre todo por el agua que consume el pienso de los animales” — น้ำส่วนใหญ่ใช้ปลูกอาหารสัตว์ ไม่ใช่น้ำที่วัวดื่ม (กับดักข้อ A)"},
     {t:"not",q:["¿Qué afirmación NO se corresponde con el texto?","ข้อใดไม่สอดคล้องกับบทความ"],o:["Una camiseta de algodón necesita miles de litros de agua.","Cerrar el grifo no sirve para nada.","Algunos países contribuyen a la sequía de otros sin saberlo.","Reducir el consumo de carne tiene un efecto real."],a:1,x:"ผู้เขียนบอกชัดว่า “Esto no significa que cerrar el grifo sea inútil” ข้อ B จึงขัดแย้ง"},
     {t:"vocab",q:["En el texto, «escasea» significa que el agua…","ในบทความ คำว่า “escasea” หมายความว่าน้ำ…"],o:["es abundante.","es cara.","hay poca.","está contaminada."],a:2,x:"escasear = มีไม่เพียงพอ/ขาดแคลน ซึ่งสอดคล้องกับคำว่า sequía (ความแห้งแล้ง) ในประโยคเดียวกัน"},
     {t:"purpose",q:["¿Para qué menciona el autor la ducha de cinco minutos?","ผู้เขียนกล่าวถึงการอาบน้ำห้านาทีเพื่ออะไร"],o:["Para recomendar duchas más largas.","Para mostrar, por contraste, lo pequeño que es ese gasto frente al agua virtual.","Para explicar cómo funciona un grifo.","Para criticar a los países ricos."],a:1,x:"ใช้เป็นตัวเปรียบเทียบ (En comparación) 60 ลิตร กับ 2,500 และ 15,000 ลิตร เพื่อให้เห็นว่าน้ำเสมือนมีขนาดใหญ่กว่ามาก"}]},
{ id:"es-r2", cat:"science", lvl:"B2", src:"วิทยาศาสตร์", title:["El cerebro bilingüe","The bilingual brain","สมองสองภาษา"],
  p:[[["Durante décadas se creyó que criar a un niño en dos idiomas podía confundirlo y retrasar su desarrollo.","For decades it was believed that raising a child in two languages could confuse them and delay their development.","หลายทศวรรษที่ผ่านมา ผู้คนเชื่อว่าการเลี้ยงเด็กด้วยสองภาษาอาจทำให้เด็กสับสนและพัฒนาการช้า"],
      ["Hoy, la investigación apunta en la dirección contraria.","Today, research points in the opposite direction.","ปัจจุบัน งานวิจัยชี้ไปในทิศทางตรงกันข้าม"]],
     [["Las personas bilingües mantienen ambos idiomas activos al mismo tiempo, incluso cuando solo utilizan uno.","Bilingual people keep both languages active at the same time, even when they only use one.","คนที่พูดได้สองภาษาจะเปิดใช้ทั้งสองภาษาพร้อมกัน แม้ในขณะที่ใช้เพียงภาษาเดียว"],
      ["Para no mezclarlos, el cerebro debe inhibir constantemente la lengua que no necesita, un esfuerzo que entrena las llamadas funciones ejecutivas: la atención, la memoria de trabajo y la capacidad de cambiar de tarea.","To avoid mixing them, the brain must constantly inhibit the language it doesn't need, an effort that trains the so-called executive functions: attention, working memory and the ability to switch tasks.","เพื่อไม่ให้ปนกัน สมองต้องยับยั้งภาษาที่ไม่ได้ใช้อยู่ตลอดเวลา ความพยายามนี้ช่วยฝึกสิ่งที่เรียกว่าการทำงานของสมองด้านบริหาร ได้แก่ ความใส่ใจ ความจำขณะทำงาน และความสามารถในการสลับงาน"]],
     [["Algunos estudios sugieren incluso que el bilingüismo podría retrasar entre cuatro y cinco años la aparición de los síntomas de la demencia.","Some studies even suggest that bilingualism could delay the appearance of dementia symptoms by four to five years.","งานวิจัยบางชิ้นถึงกับเสนอว่าการรู้สองภาษาอาจชะลอการเกิดอาการสมองเสื่อมได้สี่ถึงห้าปี"],
      ["No obstante, los científicos piden prudencia: los resultados varían según el nivel de dominio, la edad de aprendizaje y el uso cotidiano de cada lengua.","Nevertheless, scientists urge caution: results vary according to the level of proficiency, the age of learning and the daily use of each language.","อย่างไรก็ดี นักวิทยาศาสตร์ขอให้ระมัดระวัง เพราะผลลัพธ์แตกต่างกันไปตามระดับความเชี่ยวชาญ อายุที่เริ่มเรียน และการใช้แต่ละภาษาในชีวิตประจำวัน"],
      ["Lo que sí parece claro es que nunca es tarde para aprender: el cerebro adulto conserva una plasticidad mucho mayor de lo que se pensaba.","What does seem clear is that it's never too late to learn: the adult brain retains much greater plasticity than was thought.","สิ่งที่ดูชัดเจนคือไม่มีคำว่าสายเกินไปที่จะเรียน สมองผู้ใหญ่ยังคงความยืดหยุ่นได้มากกว่าที่เคยคิดไว้มาก"]]],
  v:{"décadas":"B1|n|decades|ทศวรรษ|década","creyó":"B1|v|was believed|เชื่อ (อดีต)|creer","criar":"B2|v|to raise (a child)|เลี้ยงดู","idiomas":"A2|n|languages|ภาษา|idioma","confundirlo":"B1|v|to confuse him|ทำให้เขาสับสน|confundir","retrasar":"B2|v|to delay|ทำให้ล่าช้า","desarrollo":"B1|n|development|พัฒนาการ","investigación":"B1|n|research|การวิจัย","apunta":"B2|v|points|ชี้|apuntar","contraria":"B1|adj|opposite|ตรงกันข้าม|contrario","bilingües":"B1|adj|bilingual|สองภาษา|bilingüe","mantienen":"B1|v|maintain, keep|รักษาไว้|mantener","ambos":"B1|det|both|ทั้งสอง","activos":"B1|adj|active|ทำงานอยู่|activo","utilizan":"B1|v|use|ใช้|utilizar","mezclarlos":"B1|v|to mix them|ผสมพวกมัน|mezclar","inhibir":"C1|v|to inhibit|ยับยั้ง","constantemente":"B2|adv|constantly|อย่างต่อเนื่อง","lengua":"B1|n|language, tongue|ภาษา, ลิ้น","esfuerzo":"B1|n|effort|ความพยายาม","entrena":"B1|v|trains|ฝึก|entrenar","funciones ejecutivas":"C1|n|executive functions|การทำงานของสมองด้านบริหารจัดการ","atención":"A2|n|attention|ความใส่ใจ","memoria de trabajo":"C1|n|working memory|ความจำขณะทำงาน","capacidad":"B2|n|ability, capacity|ความสามารถ","tarea":"A2|n|task|งาน, ภารกิจ","sugieren":"B2|v|suggest|เสนอแนะ|sugerir","bilingüismo":"C1|n|bilingualism|การรู้สองภาษา","aparición":"B2|n|appearance, onset|การปรากฏ","síntomas":"B1|n|symptoms|อาการ|síntoma","demencia":"C1|n|dementia|ภาวะสมองเสื่อม","no obstante":"B2|expr|nevertheless|อย่างไรก็ตาม","prudencia":"C1|n|caution|ความระมัดระวัง","varían":"B2|v|vary|แตกต่างกัน|variar","según":"B1|prep|according to|ตาม","dominio":"B2|n|mastery, proficiency|ความเชี่ยวชาญ","aprendizaje":"B2|n|learning|การเรียนรู้","cotidiano":"B2|adj|daily|ในชีวิตประจำวัน","tarde":"A1|adv|late|สาย","conserva":"B2|v|retains|คงไว้|conservar","plasticidad":"C2|n|plasticity|ความยืดหยุ่น (สมอง)"},
  q:[{t:"main",q:["¿Qué idea resume mejor el texto?","ข้อใดสรุปบทความได้ดีที่สุด"],o:["El bilingüismo confunde a los niños pequeños.","Hablar dos idiomas parece aportar beneficios cognitivos, aunque con matices.","Solo los niños pueden aprender idiomas.","El bilingüismo cura la demencia."],a:1,x:"บทความเสนอประโยชน์ทางสมอง แต่มีย่อหน้าที่ขอให้ “ระมัดระวัง” (prudencia) ข้อ B จึงครบที่สุด ข้อ D เกินจริง: บทความบอกแค่ “อาจชะลอ” ไม่ใช่ “รักษา”"},
     {t:"detail",q:["¿Por qué el cerebro bilingüe se «entrena» constantemente?","ทำไมสมองสองภาษาจึงได้ “ฝึก” อยู่ตลอดเวลา"],o:["Porque traduce todo lo que oye.","Porque tiene que bloquear el idioma que no está usando.","Porque duerme menos.","Porque olvida un idioma cada día."],a:1,x:"“el cerebro debe inhibir constantemente la lengua que no necesita” — inhibir = ยับยั้ง/บล็อก"},
     {t:"not",q:["Según el texto, ¿cuál de estas afirmaciones es FALSA?","ตามบทความ ข้อใดผิด"],o:["Antes se pensaba que el bilingüismo podía retrasar el desarrollo.","Los bilingües activan solo un idioma a la vez.","Los efectos dependen, entre otras cosas, de la edad de aprendizaje.","El cerebro adulto es más flexible de lo que se creía."],a:1,x:"บทความบอกว่า “mantienen ambos idiomas activos al mismo tiempo” ข้อ B จึงผิด"},
     {t:"tone",q:["¿Qué actitud muestran los científicos mencionados en el tercer párrafo?","นักวิทยาศาสตร์ในย่อหน้าที่สามมีทัศนคติอย่างไร"],o:["Entusiasmo sin reservas.","Rechazo total de los estudios.","Cautela ante resultados que no son uniformes.","Indiferencia."],a:2,x:"“piden prudencia: los resultados varían…” แสดงความระมัดระวังเพราะผลไม่สม่ำเสมอ ไม่ได้ปฏิเสธงานวิจัยทั้งหมด"},
     {t:"infer",q:["¿Qué se puede deducir de la última frase?","อนุมานจากประโยคสุดท้ายได้ว่าอย่างไร"],o:["Un adulto de cuarenta años todavía puede aprender un idioma con éxito.","Los adultos aprenden mejor que los niños.","Es inútil estudiar idiomas después de los veinte años.","La plasticidad cerebral desaparece en la infancia."],a:0,x:"“nunca es tarde para aprender” และสมองผู้ใหญ่ยังยืดหยุ่น จึงอนุมานว่าผู้ใหญ่ยังเรียนภาษาได้สำเร็จ ข้อ B เกินกว่าที่บทความบอก"}]},
{ id:"es-r3", cat:"economy", lvl:"C1", src:"เศรษฐกิจ/สังคม", title:["La trampa de la comodidad: cuando todo llega a casa","The comfort trap: when everything is delivered home","กับดักความสะดวก: เมื่อทุกอย่างมาส่งถึงบ้าน"],
  p:[[["En apenas una década, la entrega a domicilio ha pasado de ser un lujo ocasional a convertirse en un hábito cotidiano para millones de personas.","In barely a decade, home delivery has gone from being an occasional luxury to becoming a daily habit for millions of people.","ในเวลาเพียงทศวรรษเดียว บริการส่งถึงบ้านเปลี่ยนจากความหรูหรานานๆ ครั้ง กลายเป็นนิสัยประจำวันของคนนับล้าน"],
      ["Basta con un par de toques en la pantalla para que la cena, un libro o un cargador aparezcan en la puerta en menos de una hora.","A couple of taps on the screen are enough for dinner, a book or a charger to appear at the door in less than an hour.","แค่แตะหน้าจอสองสามครั้ง อาหารเย็น หนังสือ หรือที่ชาร์จก็มาถึงหน้าประตูภายในไม่ถึงชั่วโมง"]],
     [["Esta comodidad, sin embargo, tiene costes que rara vez figuran en el recibo.","This convenience, however, has costs that rarely appear on the receipt.","อย่างไรก็ตาม ความสะดวกนี้มีต้นทุนที่แทบไม่เคยปรากฏในใบเสร็จ"],
      ["Detrás de cada pedido urgente hay repartidores que, en muchos casos, trabajan como autónomos sin protección social y cuyos ingresos dependen de la rapidez con que pedaleen.","Behind every urgent order there are couriers who, in many cases, work as self-employed without social protection and whose income depends on how fast they pedal.","เบื้องหลังทุกคำสั่งซื้อด่วนคือคนส่งของที่หลายกรณีทำงานเป็นฟรีแลนซ์โดยไม่มีสวัสดิการสังคม และรายได้ขึ้นกับว่าปั่นจักรยานได้เร็วแค่ไหน"],
      ["A ello se suma el impacto urbano: furgonetas en doble fila, embalajes que se tiran tras un solo uso y pequeños comercios que no pueden competir con plazos tan cortos.","Added to this is the urban impact: vans double-parked, packaging thrown away after a single use and small shops that cannot compete with such short delivery times.","ยังมีผลกระทบต่อเมืองอีก เช่น รถตู้จอดซ้อนคัน บรรจุภัณฑ์ที่ใช้ครั้งเดียวทิ้ง และร้านค้าเล็กๆ ที่แข่งขันกับระยะเวลาส่งที่สั้นขนาดนี้ไม่ได้"]],
     [["Sería injusto, no obstante, demonizar a los consumidores, que a menudo recurren a estos servicios por falta de tiempo más que por capricho.","It would be unfair, however, to demonise consumers, who often turn to these services out of lack of time rather than whim.","อย่างไรก็ดี คงไม่ยุติธรรมหากจะโทษผู้บริโภค ซึ่งมักใช้บริการเหล่านี้เพราะไม่มีเวลามากกว่าเพราะเอาแต่ใจ"],
      ["El debate de fondo no es si debemos renunciar a la comodidad, sino quién paga realmente por ella y si estamos dispuestos a aceptar unas reglas que repartan esa carga de forma más equitativa.","The underlying debate is not whether we should give up convenience, but who really pays for it and whether we are willing to accept rules that distribute that burden more fairly.","ประเด็นถกเถียงที่แท้จริงไม่ใช่ว่าเราควรละทิ้งความสะดวกหรือไม่ แต่คือใครกันแน่ที่จ่ายราคาของมัน และเราพร้อมยอมรับกฎที่กระจายภาระนั้นอย่างเป็นธรรมกว่านี้หรือเปล่า"]]],
  v:{"trampa":"B2|n|trap|กับดัก","comodidad":"B2|n|comfort, convenience|ความสะดวกสบาย","apenas":"B2|adv|barely, hardly|แทบจะไม่, เพียง","entrega a domicilio":"B2|n|home delivery|บริการส่งถึงบ้าน","entrega":"B1|n|delivery|การส่ง","domicilio":"B2|n|home, residence|ที่อยู่อาศัย","lujo":"B2|n|luxury|ความหรูหรา","ocasional":"B2|adj|occasional|นานๆ ครั้ง","convertirse":"B1|v|to become|กลายเป็น","hábito":"B1|n|habit|นิสัย","basta":"B2|v|it's enough|ก็พอแล้ว|bastar","toques":"B1|n|taps, touches|การแตะ|toque","pantalla":"A2|n|screen|หน้าจอ","cargador":"B1|n|charger|ที่ชาร์จ","aparezcan":"B2|v|appear (subjunctive)|ปรากฏ|aparecer","costes":"B2|n|costs|ต้นทุน|coste","rara vez":"B2|expr|rarely|แทบไม่เคย","figuran":"C1|v|appear, are listed|ปรากฏ (ในรายการ)|figurar","recibo":"B1|n|receipt|ใบเสร็จ","pedido":"B1|n|order|คำสั่งซื้อ","urgente":"B1|adj|urgent|เร่งด่วน","repartidores":"B2|n|delivery riders|คนส่งของ|repartidor","autónomos":"B2|n|self-employed|ผู้ประกอบอาชีพอิสระ|autónomo","protección social":"C1|n|social protection|การคุ้มครองทางสังคม","cuyos":"C1|det|whose|ซึ่ง…ของเขา|cuyo","ingresos":"B2|n|income|รายได้|ingreso","dependen":"B1|v|depend|ขึ้นอยู่กับ|depender","rapidez":"B2|n|speed|ความเร็ว","pedaleen":"C1|v|pedal (subjunctive)|ปั่น (จักรยาน)|pedalear","se suma":"C1|v|is added|เพิ่มเข้ามา|sumarse","furgonetas":"B2|n|vans|รถตู้|furgoneta","doble fila":"C1|expr|double-parked|จอดซ้อนคัน","embalajes":"C1|n|packaging|บรรจุภัณฑ์|embalaje","tiran":"B1|v|throw away|ทิ้ง|tirar","comercios":"B2|n|shops, businesses|ร้านค้า|comercio","competir":"B2|v|to compete|แข่งขัน","plazos":"C1|n|deadlines, time frames|กำหนดเวลา|plazo","injusto":"B1|adj|unfair|ไม่ยุติธรรม","demonizar":"C2|v|to demonise|ป้ายสีว่าเป็นผู้ร้าย","consumidores":"B2|n|consumers|ผู้บริโภค|consumidor","a menudo":"B2|expr|often|บ่อยครั้ง","recurren":"C1|v|resort to|หันไปพึ่ง|recurrir","falta":"B1|n|lack|การขาด","capricho":"C1|n|whim|ความเอาแต่ใจ","de fondo":"C1|expr|underlying|ที่อยู่เบื้องลึก","renunciar":"B2|v|to give up|สละ, ละทิ้ง","dispuestos":"B2|adj|willing|พร้อมที่จะ|dispuesto","reglas":"B1|n|rules|กฎ|regla","repartan":"C1|v|distribute (subjunctive)|กระจาย|repartir","carga":"B2|n|burden, load|ภาระ","equitativa":"C2|adj|equitable, fair|เป็นธรรม|equitativo"},
  q:[{t:"main",q:["¿Cuál es la tesis del autor?","ข้อเสนอหลักของผู้เขียนคืออะไร"],o:["Hay que prohibir la entrega a domicilio.","Los consumidores son culpables de la precariedad de los repartidores.","La comodidad de la entrega rápida tiene costes ocultos y plantea la cuestión de cómo repartirlos de forma justa.","Los pequeños comercios son más rápidos que las plataformas."],a:2,x:"ประโยคสุดท้ายคือหัวใจ: ไม่ใช่เลิกความสะดวก แต่ “ใครจ่าย” และจะกระจายภาระให้เป็นธรรมอย่างไร ข้อ A และ B ผู้เขียนปฏิเสธโดยตรง"},
     {t:"vocab",q:["La expresión «costes que rara vez figuran en el recibo» se refiere a…","สำนวน “ต้นทุนที่แทบไม่ปรากฏในใบเสร็จ” หมายถึงอะไร"],o:["errores en la factura.","consecuencias sociales y ambientales que el cliente no paga directamente.","impuestos ocultos.","propinas para el repartidor."],a:1,x:"ย่อหน้าเดียวกันอธิบายต่อว่าคือภาระของคนส่งของ และผลกระทบต่อเมือง/สิ่งแวดล้อม ซึ่งลูกค้าไม่ได้จ่ายตรง"},
     {t:"not",q:["¿Qué afirmación NO puede extraerse del texto?","ข้อใดสรุปจากบทความไม่ได้"],o:["Muchos repartidores carecen de protección social.","Los embalajes generan residuos.","Los consumidores usan estos servicios principalmente por capricho.","A los pequeños comercios les cuesta competir."],a:2,x:"ผู้เขียนบอกว่าผู้บริโภคใช้บริการ “por falta de tiempo más que por capricho” ข้อ C จึงกลับด้าน"},
     {t:"purpose",q:["¿Qué función cumple el tercer párrafo en la argumentación?","ย่อหน้าที่สามมีบทบาทอย่างไรในการให้เหตุผล"],o:["Introduce un contraargumento para matizar la crítica y reorientar el debate.","Repite la crítica del párrafo anterior.","Presenta datos estadísticos.","Concluye que no hay ningún problema."],a:0,x:"เริ่มด้วย “Sería injusto, no obstante…” เป็นการยอมรับมุมฝั่งผู้บริโภค เพื่อลดความแรงของคำวิจารณ์ แล้วพาไปสู่คำถามเชิงโครงสร้างว่าใครควรรับภาระ"},
     {t:"infer",q:["¿Qué tipo de solución parece preferir el autor?","ผู้เขียนน่าจะชอบแนวทางแก้ไขแบบใด"],o:["Una solución individual: que cada uno deje de pedir comida.","Una solución colectiva basada en normas que distribuyan mejor los costes.","Ninguna, porque el problema no existe.","Aumentar la velocidad de las entregas."],a:1,x:"คำว่า “aceptar unas reglas que repartan esa carga” ชี้ไปที่กฎกติการ่วมกัน (ระดับสังคม) ไม่ใช่โยนให้ปัจเจก"}]}

novel: [
{ id:"es-n1", genre:"horror", lvl:"B2", title:["La niña del pozo","The girl in the well","เด็กหญิงในบ่อน้ำ"], blurb:"บ้านไร่ที่เพิ่งซื้อมามีบ่อน้ำเก่าที่ไม่ควรมีใครตอบเสียงเรียก",
  p:[[["Compramos la casa en septiembre, cuando el pueblo ya se había vaciado de veraneantes y las tardes empezaban a oler a leña.","We bought the house in September, when the village had already emptied of summer visitors and the afternoons were beginning to smell of firewood.","เราซื้อบ้านหลังนั้นในเดือนกันยายน ตอนที่นักท่องเที่ยวหน้าร้อนกลับไปหมดแล้ว และยามบ่ายเริ่มมีกลิ่นฟืน"],
      ["El agente inmobiliario no mencionó el pozo.","The estate agent didn't mention the well.","นายหน้าขายบ้านไม่ได้พูดถึงบ่อน้ำเลย"],
      ["Lo encontró mi hija Alba, escondido bajo una maraña de zarzas al fondo del huerto, con una tapa de madera tan podrida que se deshacía al tocarla.","My daughter Alba found it, hidden under a tangle of brambles at the back of the vegetable garden, with a wooden lid so rotten that it crumbled when touched.","อัลบา ลูกสาวของฉันเป็นคนเจอมัน ซ่อนอยู่ใต้พงหนามท้ายสวนผัก ฝาไม้ผุจนแตกร่วนเมื่อสัมผัส"]],
     [["—Mamá, ahí abajo hay alguien —me dijo aquella noche, mientras le apagaba la luz.","'Mum, there's someone down there,' she told me that night, while I was turning off her light.","“แม่ ข้างล่างนั่นมีคนอยู่” เธอบอกฉันคืนนั้น ขณะที่ฉันกำลังปิดไฟให้"],
      ["Sonreí, como se sonríe ante las fantasías de una niña de siete años, y le di un beso en la frente.","I smiled, the way one smiles at the fantasies of a seven-year-old girl, and kissed her on the forehead.","ฉันยิ้ม อย่างที่คนเราจะยิ้มให้จินตนาการของเด็กเจ็ดขวบ แล้วจูบหน้าผากเธอ"],
      ["—Me ha preguntado cómo me llamo —añadió, ya medio dormida—. Le he dicho que mañana se lo digo.","'She asked me what my name is,' she added, already half asleep. 'I told her I'll tell her tomorrow.'","“เขาถามหนูว่าหนูชื่ออะไร” เธอพูดต่อทั้งที่ครึ่งหลับ “หนูบอกว่าพรุ่งนี้จะบอก”"]],
     [["Al día siguiente, la vecina más anciana del pueblo se detuvo frente a nuestra verja.","The next day, the oldest neighbour in the village stopped in front of our gate.","วันรุ่งขึ้น หญิงชราที่อายุมากที่สุดในหมู่บ้านหยุดยืนหน้ารั้วบ้านเรา"],
      ["Miró el huerto durante un largo rato, santiguándose despacio, y luego me hizo una sola pregunta.","She looked at the garden for a long while, slowly crossing herself, and then asked me a single question.","นางจ้องมองสวนอยู่นาน ค่อยๆ ทำเครื่องหมายกางเขน แล้วถามฉันเพียงคำถามเดียว"],
      ["—¿La niña ya le ha dicho su nombre?","'Has the girl told her her name yet?'","“เด็กคนนั้นบอกชื่อให้มันรู้หรือยัง?”"]],
     [["Le expliqué, con una risa nerviosa, que Alba tenía mucha imaginación.","I explained, with a nervous laugh, that Alba had a lot of imagination.","ฉันอธิบายพร้อมหัวเราะอย่างประหม่าว่าอัลบาเป็นเด็กช่างจินตนาการ"],
      ["La anciana negó con la cabeza.","The old woman shook her head.","หญิงชราส่ายหน้า"],
      ["—En 1952 se cayó una cría a ese pozo y nadie la sacó a tiempo —murmuró—. Desde entonces pregunta nombres. Y a quien se lo dice, se lo queda.","'In 1952 a little girl fell into that well and nobody got her out in time,' she murmured. 'Since then she asks for names. And whoever tells her, she keeps.'","“ปี 1952 มีเด็กหญิงคนหนึ่งตกลงไปในบ่อนั้น ไม่มีใครช่วยขึ้นมาทัน” นางพึมพำ “ตั้งแต่นั้นมันก็ถามชื่อ และใครที่บอกชื่อให้มัน มันจะเอาตัวไป”"]],
     "* * *",

{ id:"es-n2", genre:"comedy", lvl:"B1", title:["El loro de mi suegra","My mother-in-law's parrot","นกแก้วของแม่ยาย"], blurb:"รับฝากนกแก้วแค่สุดสัปดาห์เดียว แต่มันพูดมากเกินกว่าที่ใครควรได้ยิน",
  p:[[["Cuando mi suegra se fue de crucero, nos dejó a cargo de Paco, su loro, con una lista de instrucciones de cuatro páginas.","When my mother-in-law went on a cruise, she left us in charge of Paco, her parrot, with a four-page list of instructions.","ตอนแม่ยายไปล่องเรือสำราญ ท่านฝากพาโก นกแก้วของท่าน ไว้กับเรา พร้อมรายการคำสั่งยาวสี่หน้า"],
      ["La primera decía, en mayúsculas: «NO HABLÉIS DE POLÍTICA DELANTE DE ÉL».","The first one said, in capital letters: 'DO NOT TALK ABOUT POLITICS IN FRONT OF HIM'.","ข้อแรกเขียนตัวใหญ่ว่า “ห้ามคุยเรื่องการเมืองต่อหน้ามัน”"],
      ["Nos pareció una broma.","We thought it was a joke.","เราคิดว่าเป็นเรื่องตลก"],
      ["No lo era.","It wasn't.","แต่มันไม่ใช่"]],
     [["Paco sabía unas trescientas palabras y las usaba con una precisión inquietante.","Paco knew about three hundred words and used them with unsettling precision.","พาโกรู้คำศัพท์ราวสามร้อยคำ และใช้มันอย่างแม่นยำจนน่าขนลุก"],
      ["Cuando mi marido abrió la nevera a medianoche, Paco gritó: «¡Otra vez, Manolo! ¡Otra vez!».","When my husband opened the fridge at midnight, Paco shouted: 'Again, Manolo! Again!'","พอสามีฉันเปิดตู้เย็นตอนเที่ยงคืน พาโกก็ตะโกนว่า “อีกแล้วนะ มาโนโล! อีกแล้ว!”"],
      ["Manolo es el nombre de mi suegro, que lleva quince años a dieta sin perder un solo kilo.","Manolo is my father-in-law's name, who has been on a diet for fifteen years without losing a single kilo.","มาโนโลคือชื่อพ่อตา ผู้ซึ่งลดน้ำหนักมาสิบห้าปีโดยไม่ลดลงเลยสักกิโล"]],
     [["El sábado vinieron a cenar nuestros vecinos, una pareja encantadora y muy formal.","On Saturday our neighbours came for dinner, a charming and very proper couple.","วันเสาร์ เพื่อนบ้านมาทานข้าวเย็นด้วย เป็นคู่รักที่น่ารักและเรียบร้อยมาก"],
      ["Todo iba de maravilla hasta que, en pleno postre, Paco carraspeó como un presentador de televisión y anunció con la voz exacta de mi suegra: «Esa vecina se ha operado la nariz».","Everything was going wonderfully until, in the middle of dessert, Paco cleared his throat like a TV presenter and announced in exactly my mother-in-law's voice: 'That neighbour has had a nose job.'","ทุกอย่างราบรื่นดี จนกระทั่งระหว่างกินของหวาน พาโกกระแอมเหมือนพิธีกรรายการทีวี แล้วประกาศด้วยเสียงเหมือนแม่ยายเป๊ะว่า “ยัยเพื่อนบ้านนั่นไปทำจมูกมา”"]],
     [["Se hizo un silencio tan espeso que se podía cortar con cuchillo.","A silence fell so thick you could cut it with a knife.","ความเงียบเกิดขึ้นหนาทึบจนเอามีดตัดได้"],
      ["La vecina se llevó la mano a la cara.","The neighbour put her hand to her face.","คุณเพื่อนบ้านยกมือขึ้นแตะหน้า"],
      ["Mi marido, en un intento desesperado por salvar la noche, tosió muy fuerte y dijo: «¡Qué loro tan gracioso! Repite cualquier tontería que oye en la tele».","My husband, in a desperate attempt to save the evening, coughed very loudly and said: 'What a funny parrot! He repeats any nonsense he hears on TV.'","สามีฉันพยายามกู้สถานการณ์อย่างสิ้นหวัง ไอเสียงดังแล้วพูดว่า “นกแก้วตลกจัง! มันชอบพูดตามเรื่องไร้สาระที่ได้ยินในทีวี”"],
      ["Paco lo miró con lástima, ladeó la cabeza y respondió: «Mentiroso, como tu padre».","Paco looked at him with pity, tilted his head and replied: 'Liar, just like your father.'","พาโกมองเขาอย่างสมเพช เอียงคอ แล้วตอบว่า “ขี้โกหก เหมือนพ่อแกเลย”"]],

     [["Cuando mi suegra volvió, morena y feliz, le preguntamos si Paco había dado mucha guerra.","When my mother-in-law came back, tanned and happy, she asked us if Paco had given us much trouble.","พอแม่ยายกลับมา ผิวแทนและอารมณ์ดี ท่านถามว่าพาโกสร้างปัญหาเยอะไหม"],

     ["Gezelligheid is, kortom, een vorm van sociale controle vermomd als warmte.","Gezelligheid is, in short, a form of social control disguised as warmth.","กล่าวโดยสรุป ความ gezellig คือการควบคุมทางสังคมรูปแบบหนึ่งที่ปลอมตัวมาเป็นความอบอุ่น"]],

      ["Ouders gingen de straat op en protesteerden.","Parents took to the streets and protested.","พ่อแม่จึงออกมาประท้วงบนถนน"]],
     [["Daarna bouwde de overheid duizenden kilometers aan veilige fietspaden.","After that the government built thousands of kilometres of safe cycle paths.","หลังจากนั้นรัฐบาลจึงสร้างทางจักรยานที่ปลอดภัยเป็นระยะทางหลายพันกิโลเมตร"],
      ["Vandaag is fietsen goedkoop, gezond en vaak sneller dan de auto in de stad.","Today cycling is cheap, healthy and often faster than the car in the city.","ทุกวันนี้การปั่นจักรยานทั้งประหยัด ดีต่อสุขภาพ และในเมืองมักเร็วกว่ารถยนต์"]]],
