{ id:"es-r4", cat:"health", lvl:"A2", src:"สุขภาพ", title:["¿De verdad hay que beber ocho vasos de agua al día?","Do you really have to drink eight glasses of water a day?","ต้องดื่มน้ำวันละแปดแก้วจริงหรือ?"],
  p:[[["Seguro que has oído muchas veces que hay que beber ocho vasos de agua al día.","Surely you've heard many times that you have to drink eight glasses of water a day.","คุณคงเคยได้ยินบ่อยๆ ว่าต้องดื่มน้ำวันละแปดแก้ว"],
      ["Sin embargo, esta regla no tiene una base científica clara.","However, this rule doesn't have a clear scientific basis.","แต่กฎข้อนี้ไม่มีหลักฐานทางวิทยาศาสตร์ที่ชัดเจน"]],
     [["Nuestro cuerpo recibe agua de muchas formas: del café, de la sopa, de la fruta y de las verduras.","Our body receives water in many ways: from coffee, soup, fruit and vegetables.","ร่างกายได้รับน้ำหลายทาง ทั้งจากกาแฟ ซุป ผลไม้ และผัก"],
      ["Una sandía, por ejemplo, tiene más de un noventa por ciento de agua.","A watermelon, for example, is more than ninety per cent water.","ตัวอย่างเช่น แตงโมมีน้ำมากกว่าเก้าสิบเปอร์เซ็นต์"],
      ["Además, la cantidad necesaria depende del clima, de la edad y de la actividad física.","Also, the amount needed depends on the climate, age and physical activity.","นอกจากนี้ ปริมาณที่ต้องการขึ้นอยู่กับสภาพอากาศ อายุ และการออกกำลังกาย"]],
     [["Para la mayoría de las personas sanas, la mejor guía es muy sencilla: beber cuando tienes sed.","For most healthy people, the best guide is very simple: drink when you're thirsty.","สำหรับคนสุขภาพดีส่วนใหญ่ หลักที่ดีที่สุดง่ายมาก คือดื่มเมื่อกระหายน้ำ"],
      ["Otra pista útil es el color de la orina: si es amarilla clara, todo va bien.","Another useful clue is the colour of your urine: if it's pale yellow, all is well.","อีกเบาะแสที่มีประโยชน์คือสีของปัสสาวะ ถ้าเป็นสีเหลืองอ่อน แปลว่าทุกอย่างปกติดี"],
      ["Pero cuidado: las personas mayores sienten menos la sed, así que deben beber un poco más a menudo.","But be careful: older people feel thirst less, so they should drink a little more often.","แต่ต้องระวัง ผู้สูงอายุรู้สึกกระหายน้ำน้อยลง จึงควรดื่มบ่อยขึ้นสักหน่อย"]]],
  v:{"de verdad":"A2|expr|really|จริงๆ","vasos":"A1|n|glasses|แก้ว|vaso","seguro":"A2|adv|surely|แน่นอน","oído":"A2|v|heard|ได้ยิน|oír","regla":"B1|n|rule|กฎ","base":"B1|n|basis|พื้นฐาน","científica":"B1|adj|scientific|ทางวิทยาศาสตร์|científico","clara":"A2|adj|clear; pale|ชัดเจน; อ่อน (สี)|claro","recibe":"A2|v|receives|ได้รับ|recibir","formas":"A2|n|ways, forms|วิธี, รูปแบบ|forma","sopa":"A1|n|soup|ซุป","verduras":"A1|n|vegetables|ผัก|verdura","sandía":"A2|n|watermelon|แตงโม","por ciento":"A2|expr|per cent|เปอร์เซ็นต์","además":"A2|adv|also, besides|นอกจากนี้","cantidad":"B1|n|amount|ปริมาณ","necesaria":"B1|adj|necessary|จำเป็น|necesario","depende":"B1|v|depends|ขึ้นอยู่กับ|depender","clima":"B1|n|climate|สภาพอากาศ","edad":"A2|n|age|อายุ","actividad física":"B1|n|physical activity|การออกกำลังกาย","mayoría":"B1|n|majority|ส่วนใหญ่","sanas":"A2|adj|healthy|สุขภาพดี|sano","guía":"B1|n|guide|แนวทาง","sed":"A2|n|thirst|ความกระหาย","pista":"B1|n|clue|เบาะแส","útil":"A2|adj|useful|มีประโยชน์","orina":"B2|n|urine|ปัสสาวะ","amarilla":"A1|adj|yellow|เหลือง|amarillo","mayores":"A2|adj|older, elderly|สูงอายุ|mayor","a menudo":"B1|expr|often|บ่อย"},
  q:[{t:"main",q:["¿Cuál es la idea principal del texto?","ใจความสำคัญของบทความคืออะไร"],o:["Hay que beber exactamente ocho vasos al día.","La regla de los ocho vasos no es exacta; la cantidad depende de cada persona y la sed es una buena guía.","El café es malo para la salud.","Las personas mayores no deben beber agua."],a:1,x:"บทความโต้แย้งกฎแปดแก้ว แล้วเสนอว่าปริมาณขึ้นกับแต่ละคน และให้ฟังความกระหายของร่างกาย"},
     {t:"detail",q:["Según el texto, ¿de dónde recibe agua el cuerpo?","ตามบทความ ร่างกายได้รับน้ำจากที่ไหน"],o:["Solo del agua que bebemos.","También de otros alimentos y bebidas, como la sopa o la fruta.","Solo de la fruta.","Del aire."],a:1,x:"“del café, de la sopa, de la fruta y de las verduras”"},
     {t:"not",q:["¿Qué información NO aparece en el texto?","ข้อมูลใดไม่ปรากฏในบทความ"],o:["La sandía tiene mucha agua.","El color de la orina puede indicar si bebemos bastante.","Beber demasiada agua es siempre peligroso.","Las personas mayores sienten menos la sed."],a:2,x:"บทความไม่ได้พูดถึงอันตรายของการดื่มน้ำมากเกินไป"},
     {t:"vocab",q:["En el texto, «pista» significa…","ในบทความ คำว่า “pista” หมายถึง…"],o:["una pista de tenis","una señal o indicación","una regla obligatoria","una bebida"],a:1,x:"pista มีหลายความหมาย (สนาม, ร่องรอย) ในบริบทนี้หมายถึงเบาะแสหรือสัญญาณ เพราะสีปัสสาวะช่วยบอกว่าดื่มน้ำพอหรือไม่"},
     {t:"infer",q:["¿Por qué las personas mayores deben beber más a menudo?","ทำไมผู้สูงอายุควรดื่มน้ำบ่อยขึ้น"],o:["Porque necesitan diez vasos al día.","Porque su sensación de sed es más débil y no pueden fiarse solo de ella.","Porque hace más calor para ellos.","Porque beben mucho café."],a:1,x:"ถ้าความกระหายเป็นสัญญาณหลัก แต่ผู้สูงอายุรู้สึกกระหายน้อยลง พวกเขาจึงพึ่งสัญญาณนี้อย่างเดียวไม่ได้"}]},
{ id:"es-r5", cat:"history", lvl:"B1", src:"ประวัติศาสตร์", title:["La Alhambra: un palacio que cuenta una historia","The Alhambra: a palace that tells a story","อัลอัมบรา: พระราชวังที่เล่าเรื่องราว"],
  p:[[["En lo alto de una colina de Granada se levanta la Alhambra, uno de los monumentos más visitados de España.","On top of a hill in Granada stands the Alhambra, one of the most visited monuments in Spain.","บนยอดเนินเขาในเมืองกรานาดา มีอัลอัมบราตั้งตระหง่าน ซึ่งเป็นหนึ่งในโบราณสถานที่มีคนมาเยือนมากที่สุดในสเปน"],
      ["Su nombre viene del árabe y significa «la roja», probablemente por el color de sus muros al atardecer.","Its name comes from Arabic and means 'the red one', probably because of the colour of its walls at sunset.","ชื่อของมันมาจากภาษาอาหรับ แปลว่า “สีแดง” อาจเป็นเพราะสีของกำแพงยามพระอาทิตย์ตก"]],
     [["La mayor parte de los palacios que vemos hoy fue construida en los siglos XIII y XIV por la dinastía nazarí, el último reino musulmán de la península.","Most of the palaces we see today were built in the 13th and 14th centuries by the Nasrid dynasty, the last Muslim kingdom of the peninsula.","พระราชวังส่วนใหญ่ที่เห็นในวันนี้สร้างขึ้นในศตวรรษที่ 13 และ 14 โดยราชวงศ์นาสริด อาณาจักรมุสลิมแห่งสุดท้ายบนคาบสมุทร"],
      ["Sus arquitectos usaban materiales sencillos, como el yeso y la madera, pero los cubrían de decoraciones increíblemente detalladas.","Its architects used simple materials, such as plaster and wood, but covered them with incredibly detailed decorations.","สถาปนิกใช้วัสดุธรรมดาอย่างปูนปลาสเตอร์และไม้ แต่ปกคลุมด้วยลวดลายที่ละเอียดอย่างไม่น่าเชื่อ"],
      ["En las paredes hay poemas escritos en árabe, y el agua de fuentes y estanques crea un ambiente de calma y frescor.","On the walls there are poems written in Arabic, and the water of fountains and pools creates an atmosphere of calm and coolness.","บนผนังมีบทกวีที่เขียนเป็นภาษาอาหรับ และน้ำจากน้ำพุกับสระสร้างบรรยากาศสงบเย็นสบาย"]],
     [["En 1492, los Reyes Católicos conquistaron Granada y la Alhambra pasó a manos cristianas.","In 1492, the Catholic Monarchs conquered Granada and the Alhambra passed into Christian hands.","ในปี 1492 กษัตริย์คาทอลิกพิชิตกรานาดาได้ และอัลอัมบราตกอยู่ในมือของชาวคริสต์"],
      ["Más tarde, el emperador Carlos V mandó construir allí un palacio renacentista, muy diferente del resto.","Later, Emperor Charles V had a Renaissance palace built there, very different from the rest.","ต่อมา จักรพรรดิชาร์ลส์ที่ 5 สั่งให้สร้างพระราชวังแบบเรอเนซองส์ขึ้นที่นั่น ซึ่งแตกต่างจากส่วนอื่นมาก"],
      ["Por eso, pasear por la Alhambra es como leer, en piedra, varios capítulos de la historia de España.","That's why walking around the Alhambra is like reading, in stone, several chapters of Spain's history.","ด้วยเหตุนี้ การเดินชมอัลอัมบราจึงเหมือนได้อ่านประวัติศาสตร์สเปนหลายบทที่จารึกไว้บนหิน"]]],
  v:{"palacio":"B1|n|palace|พระราชวัง","en lo alto":"B1|expr|on top|บนยอด","colina":"B1|n|hill|เนินเขา","se levanta":"B2|v|stands, rises|ตั้งตระหง่าน|levantarse","monumentos":"B1|n|monuments|อนุสาวรีย์, โบราณสถาน|monumento","visitados":"A2|adj|visited|ถูกเยี่ยมชม|visitado","árabe":"A2|n|Arabic|ภาษาอาหรับ","significa":"A2|v|means|หมายถึง|significar","roja":"A1|adj|red|สีแดง|rojo","probablemente":"B1|adv|probably|อาจจะ","muros":"B1|n|walls (outer)|กำแพง|muro","atardecer":"B1|n|sunset|ยามพระอาทิตย์ตก","construida":"B1|adj|built|ถูกสร้าง|construir","siglos":"B1|n|centuries|ศตวรรษ|siglo","dinastía":"B2|n|dynasty|ราชวงศ์","nazarí":"C1|adj|Nasrid|แห่งราชวงศ์นาสริด","reino":"B1|n|kingdom|อาณาจักร","musulmán":"B1|adj|Muslim|มุสลิม","península":"B1|n|peninsula|คาบสมุทร","arquitectos":"B1|n|architects|สถาปนิก|arquitecto","materiales":"B1|n|materials|วัสดุ|material","yeso":"C1|n|plaster|ปูนปลาสเตอร์","cubrían":"B1|v|covered|ปกคลุม|cubrir","decoraciones":"B1|n|decorations|การตกแต่ง|decoración","detalladas":"B2|adj|detailed|ละเอียด|detallado","fuentes":"B1|n|fountains|น้ำพุ|fuente","estanques":"B2|n|ponds, pools|สระน้ำ|estanque","ambiente":"B1|n|atmosphere|บรรยากาศ","frescor":"C1|n|coolness|ความเย็นสบาย","reyes católicos":"B2|n|Catholic Monarchs|กษัตริย์คาทอลิก (อิซาเบลกับเฟร์นันโด)","conquistaron":"B2|v|conquered|พิชิต|conquistar","pasó a manos":"C1|expr|passed into the hands of|ตกอยู่ในมือของ|pasar a manos","cristianas":"B1|adj|Christian|คริสเตียน|cristiano","emperador":"B1|n|emperor|จักรพรรดิ","mandó construir":"B2|expr|had built|สั่งให้สร้าง|mandar construir","renacentista":"C1|adj|Renaissance|แบบเรอเนซองส์","pasear":"A2|v|to stroll|เดินเล่น","piedra":"A2|n|stone|หิน","capítulos":"B1|n|chapters|บท|capítulo"},
  q:[{t:"main",q:["¿Qué idea expresa mejor la última frase del texto?","ประโยคสุดท้ายสื่อความคิดใด"],o:["La Alhambra está hecha solo de piedra.","La Alhambra refleja diferentes épocas y culturas de la historia de España.","Hay que leer libros antes de visitar la Alhambra.","La Alhambra es una biblioteca."],a:1,x:"“leer, en piedra, varios capítulos de la historia” เป็นอุปมาว่าตัวอาคารสะท้อนหลายยุคหลายวัฒนธรรม ทั้งนาสริดและคริสเตียนเรอเนซองส์"},
     {t:"detail",q:["¿Quién construyó la mayor parte de los palacios actuales?","ใครสร้างพระราชวังส่วนใหญ่ที่เห็นในปัจจุบัน"],o:["Los Reyes Católicos.","El emperador Carlos V.","La dinastía nazarí.","Los romanos."],a:2,x:"“fue construida en los siglos XIII y XIV por la dinastía nazarí”"},
     {t:"vocab",q:["¿Qué significa «la Alhambra pasó a manos cristianas»?","“la Alhambra pasó a manos cristianas” หมายถึงอะไร"],o:["Que los cristianos la destruyeron.","Que los cristianos se convirtieron en sus nuevos dueños.","Que los cristianos la construyeron.","Que se vendió a un particular."],a:1,x:"pasar a manos de = ตกเป็นของ/ถูกครอบครองโดย"},
     {t:"not",q:["¿Qué afirmación es FALSA según el texto?","ข้อใดผิดตามบทความ"],o:["El nombre «Alhambra» viene del árabe.","Los nazaríes usaban materiales muy caros, como el oro y el mármol.","Hay poemas en las paredes.","Carlos V construyó un palacio de estilo diferente."],a:1,x:"บทความบอกว่าใช้วัสดุธรรมดา (yeso, madera) ไม่ใช่ทองหรือหินอ่อน"},
     {t:"infer",q:["¿Por qué el palacio de Carlos V parece «muy diferente del resto»?","ทำไมพระราชวังของชาร์ลส์ที่ 5 จึงดู “แตกต่างจากส่วนอื่นมาก”"],o:["Porque es de otra época y de otro estilo artístico.","Porque está en otra ciudad.","Porque es más pequeño.","Porque no tiene paredes."],a:0,x:"สร้างในยุคหลัง (หลัง 1492) และเป็นแบบเรอเนซองส์ ขณะที่ส่วนอื่นเป็นศิลปะนาสริด"}]},
{ id:"es-r6", cat:"society", lvl:"B2", src:"สังคม", title:["España vive con la hora equivocada","Spain lives on the wrong time","สเปนใช้ชีวิตผิดเวลา"],
  p:[[["Si miras un mapa, verás que España está casi en el mismo meridiano que el Reino Unido y Portugal.","If you look at a map, you'll see that Spain is at almost the same longitude as the United Kingdom and Portugal.","ถ้าดูแผนที่ จะเห็นว่าสเปนอยู่ในแนวเส้นแวงเกือบเดียวกับสหราชอาณาจักรและโปรตุเกส"],
      ["Sin embargo, sus relojes marcan la misma hora que los de Berlín o Varsovia.","However, its clocks show the same time as those of Berlin or Warsaw.","แต่นาฬิกาในสเปนกลับบอกเวลาเดียวกับเบอร์ลินหรือวอร์ซอ"]],
     [["La razón es histórica: en 1940, el régimen de Franco adelantó los relojes una hora para alinearse con la Alemania de la época, y el cambio nunca se revirtió.","The reason is historical: in 1940, Franco's regime moved the clocks forward one hour to align with the Germany of the time, and the change was never reversed.","เหตุผลมาจากประวัติศาสตร์ ในปี 1940 รัฐบาลฟรังโกปรับนาฬิกาเร็วขึ้นหนึ่งชั่วโมงเพื่อให้ตรงกับเยอรมนีในยุคนั้น และไม่เคยเปลี่ยนกลับ"],
      ["Como consecuencia, el sol sale y se pone más tarde de lo que le correspondería, lo que explica en parte por qué los españoles cenan a las diez y se acuestan tarde.","As a consequence, the sun rises and sets later than it should, which partly explains why Spaniards have dinner at ten and go to bed late.","ผลที่ตามมาคือดวงอาทิตย์ขึ้นและตกช้ากว่าที่ควรจะเป็น ซึ่งอธิบายได้ส่วนหนึ่งว่าทำไมคนสเปนกินข้าวเย็นตอนสี่ทุ่มและเข้านอนดึก"]],
     [["Varios expertos sostienen que este desfase reduce las horas de sueño y dificulta conciliar la vida laboral y familiar.","Several experts maintain that this mismatch reduces hours of sleep and makes it harder to balance work and family life.","ผู้เชี่ยวชาญหลายคนยืนยันว่าความคลาดเคลื่อนนี้ลดชั่วโมงการนอน และทำให้การสร้างสมดุลระหว่างงานกับครอบครัวยากขึ้น"],
      ["Otros advierten que cambiar la hora oficial no bastaría por sí solo: los horarios españoles, con largas pausas al mediodía, son también una cuestión cultural.","Others warn that changing the official time would not be enough on its own: Spanish schedules, with long midday breaks, are also a cultural matter.","อีกฝ่ายเตือนว่าการเปลี่ยนเวลามาตรฐานอย่างเดียวไม่พอ เพราะตารางชีวิตแบบสเปนที่พักกลางวันนาน เป็นเรื่องของวัฒนธรรมด้วย"],
      ["El debate reaparece cada pocos años, pero hasta ahora ningún gobierno se ha atrevido a mover las agujas.","The debate resurfaces every few years, but so far no government has dared to move the hands of the clock.","ข้อถกเถียงนี้กลับมาทุกสองสามปี แต่จนถึงตอนนี้ยังไม่มีรัฐบาลไหนกล้าขยับเข็มนาฬิกา"]]],

  q:[{t:"main",q:["¿Cuál es el tema central del texto?","ประเด็นหลักของบทความคืออะไร"],o:["La historia de la Segunda Guerra Mundial.","El huso horario de España, su origen y el debate sobre sus efectos.","Por qué los españoles duermen la siesta.","Las diferencias entre España y Portugal."],a:1,x:"บทความอธิบายว่าสเปนใช้เวลาผิดจากตำแหน่งภูมิศาสตร์ ที่มาในปี 1940 และข้อถกเถียงเรื่องผลกระทบ"},

{ id:"es-r7", cat:"economy", lvl:"C1", src:"เศรษฐกิจ/สิ่งแวดล้อม", title:["El triángulo del litio: riqueza bajo el salar","The lithium triangle: wealth beneath the salt flat","สามเหลี่ยมลิเธียม: ความมั่งคั่งใต้ทุ่งเกลือ"],
  p:[[["Entre Chile, Argentina y Bolivia se extiende una región de desiertos y salares que concentra más de la mitad de los recursos de litio conocidos del planeta.","Between Chile, Argentina and Bolivia lies a region of deserts and salt flats that holds more than half of the planet's known lithium resources.","ระหว่างชิลี อาร์เจนตินา และโบลิเวีย มีพื้นที่ทะเลทรายและทุ่งเกลือที่รวมทรัพยากรลิเธียมที่รู้จักกว่าครึ่งของโลก"],
      ["Este metal ligero, imprescindible para las baterías de los coches eléctricos y de los teléfonos, se ha convertido en un recurso estratégico de la transición energética.","This light metal, essential for the batteries of electric cars and phones, has become a strategic resource of the energy transition.","โลหะน้ำหนักเบานี้ซึ่งขาดไม่ได้สำหรับแบตเตอรี่รถยนต์ไฟฟ้าและโทรศัพท์ ได้กลายเป็นทรัพยากรเชิงยุทธศาสตร์ของการเปลี่ยนผ่านด้านพลังงาน"]],
     [["En los salares, el litio se obtiene bombeando salmuera del subsuelo y dejándola evaporar al sol durante meses en enormes piscinas.","In the salt flats, lithium is obtained by pumping brine from underground and leaving it to evaporate in the sun for months in huge pools.","ในทุ่งเกลือ ลิเธียมได้มาจากการสูบน้ำเกลือจากใต้ดินขึ้นมา แล้วปล่อยให้ระเหยกลางแดดเป็นเวลาหลายเดือนในบ่อขนาดใหญ่"],
      ["El método es relativamente barato, pero consume cantidades ingentes de agua en uno de los lugares más áridos del mundo.","The method is relatively cheap, but it consumes enormous amounts of water in one of the most arid places in the world.","วิธีนี้ค่อนข้างถูก แต่ใช้น้ำปริมาณมหาศาลในพื้นที่ที่แห้งแล้งที่สุดแห่งหนึ่งของโลก"],
      ["Las comunidades indígenas, que dependen de esos escasos recursos hídricos para el pastoreo y la agricultura, denuncian que rara vez se las consulta.","Indigenous communities, which depend on those scarce water resources for herding and farming, complain that they are rarely consulted.","ชุมชนชนพื้นเมืองซึ่งพึ่งพาแหล่งน้ำที่มีอยู่น้อยนิดเพื่อเลี้ยงสัตว์และเพาะปลูก ร้องเรียนว่าแทบไม่เคยถูกขอความเห็น"]],
     [["Así se plantea una paradoja incómoda: la tecnología llamada a frenar el cambio climático podría agravar problemas ambientales y sociales a escala local.","Thus an uncomfortable paradox arises: the technology meant to curb climate change could worsen environmental and social problems at a local scale.","จึงเกิดความย้อนแย้งที่น่าอึดอัด คือเทคโนโลยีที่ควรช่วยชะลอการเปลี่ยนแปลงสภาพภูมิอากาศ อาจทำให้ปัญหาสิ่งแวดล้อมและสังคมในระดับท้องถิ่นแย่ลง"],
      ["Los gobiernos de la región, por su parte, intentan no repetir la historia de otras materias primas, de las que exportaron la riqueza y heredaron la contaminación.","The region's governments, for their part, are trying not to repeat the history of other raw materials, from which they exported the wealth and inherited the pollution.","ส่วนรัฐบาลในภูมิภาคพยายามไม่ให้ประวัติศาสตร์ของวัตถุดิบอื่นๆ ซ้ำรอย ซึ่งเคยส่งออกความมั่งคั่งไปแต่ได้รับมลพิษตกทอดไว้"],
      ["Que lo consigan dependerá de algo más que de los precios internacionales: de su capacidad para negociar, regular y escuchar.","Whether they succeed will depend on more than international prices: on their ability to negotiate, regulate and listen.","จะทำสำเร็จหรือไม่ ไม่ได้ขึ้นอยู่กับราคาตลาดโลกเท่านั้น แต่ขึ้นอยู่กับความสามารถในการเจรจา กำกับดูแล และรับฟัง"]]],

     {t:"infer",q:["¿A qué se refiere el autor con «la historia de otras materias primas»?","ผู้เขียนหมายถึงอะไรเมื่อพูดถึง “ประวัติศาสตร์ของวัตถุดิบอื่นๆ”"],o:["A casos en que los beneficios se fueron al extranjero y los daños quedaron en el país.","A la invención de las baterías.","A que el litio siempre fue barato.","A la historia de los coches eléctricos."],a:0,x:"ประโยคเดียวกันขยายว่า ‘exportaron la riqueza y heredaron la contaminación’ คือความมั่งคั่งไหลออก แต่มลพิษตกค้างในประเทศ"},

{ id:"es-n3", genre:"mystery", lvl:"B2", title:["El último pasajero del tranvía","The last passenger on the tram","ผู้โดยสารคนสุดท้ายบนรถราง"], blurb:"คนขับรถรางสายสุดท้ายของลิสบอนเจอกระเป๋าหนังที่ถูกลืมไว้ ข้างในมีรูปถ่ายของตัวเขาเองเมื่อสามสิบปีก่อน",
  p:[[["Joaquim llevaba veintidós años conduciendo el tranvía 28, y sabía distinguir a los turistas de los vecinos solo por la forma en que se agarraban a la barra.","Joaquim had been driving tram 28 for twenty-two years, and could tell tourists from locals just by the way they held on to the bar.","โฆอากิงขับรถรางสาย 28 มายี่สิบสองปี และแยกนักท่องเที่ยวออกจากคนท้องถิ่นได้แค่ดูจากท่าจับราว"],

     [["Eran sus iniciales.","They were his initials.","มันคืออักษรย่อชื่อของเขาเอง"],

  p:[[["Durante el confinamiento, Clara descubrió que la ventana de enfrente estaba a solo seis metros de la suya.","During lockdown, Clara discovered that the window opposite was only six metres from hers.","ช่วงล็อกดาวน์ คลาราเพิ่งรู้ว่าหน้าต่างฝั่งตรงข้ามห่างจากหน้าต่างของเธอแค่หกเมตร"],

  q:[{t:"main",q:["¿De qué trata el texto?","บทความนี้เกี่ยวกับอะไร"],o:["Del aceite de oliva en España: dónde se produce, cómo se usa y por qué es caro.","De las recetas de ensaladas.","De los problemas del corazón.","Del oro en Andalucía."],a:0,x:"สามย่อหน้าครอบคลุม แหล่งผลิต การใช้ และราคาที่สูงขึ้น ส่วน “oro” ในชื่อเรื่องเป็นอุปมา ไม่ใช่ทองจริง"},
     {t:"detail",q:["¿Dónde están la mayoría de los olivos?","ต้นมะกอกส่วนใหญ่อยู่ที่ไหน"],o:["En Madrid","En Andalucía","En Cataluña","En Galicia"],a:1,x:"“La mayoría de los olivos están en Andalucía”"},
     {t:"detail",q:["¿Por qué ha subido el precio?","ทำไมราคาขึ้น"],o:["Porque hay más turistas.","Por la falta de lluvia.","Porque los médicos lo recomiendan.","Porque se exporta todo."],a:1,x:"“La causa principal es la sequía: sin lluvia…”"},
     {t:"vocab",q:["¿Qué significa «oro líquido» en el texto?","“ทองคำเหลว” ในบทความหมายถึงอะไร"],o:["Que el aceite tiene oro.","Que el aceite es muy valioso y caro.","Que el aceite es amarillo.","Que es una bebida."],a:1,x:"เป็นการเปรียบเทียบว่าน้ำมันมะกอกมีค่าและแพงเหมือนทอง"},
     {t:"not",q:["¿Qué NO dice el texto?","ข้อใดบทความไม่ได้กล่าว"],o:["Los españoles usan el aceite para freír.","Es bueno para el corazón.","El aceite de oliva es más barato que nunca.","España es el mayor productor del mundo."],a:2,x:"บทความบอกว่าราคาขึ้นมาก ข้อ C จึงขัดแย้ง"}]},
{ id:"es-r9", cat:"science", lvl:"B1", src:"วิทยาศาสตร์/ธรรมชาติ", title:["Galápagos, el laboratorio de Darwin","Galápagos, Darwin's laboratory","กาลาปากอส ห้องทดลองของดาร์วิน"],
  p:[[["Las islas Galápagos están en el océano Pacífico, a unos mil kilómetros de la costa de Ecuador.","The Galápagos Islands are in the Pacific Ocean, about a thousand kilometres off the coast of Ecuador.","หมู่เกาะกาลาปากอสอยู่ในมหาสมุทรแปซิฟิก ห่างจากชายฝั่งเอกวาดอร์ราวหนึ่งพันกิโลเมตร"],
      ["Como nunca estuvieron unidas al continente, los animales que llegaron allí evolucionaron de forma aislada.","Because they were never joined to the mainland, the animals that arrived there evolved in isolation.","เพราะไม่เคยเชื่อมต่อกับแผ่นดินใหญ่ สัตว์ที่มาถึงจึงวิวัฒนาการแยกโดดเดี่ยว"]],
     [["En 1835, un joven naturalista inglés llamado Charles Darwin pasó varias semanas en las islas.","In 1835, a young English naturalist called Charles Darwin spent several weeks on the islands.","ในปี 1835 นักธรรมชาติวิทยาหนุ่มชาวอังกฤษชื่อชาลส์ ดาร์วิน ใช้เวลาหลายสัปดาห์บนหมู่เกาะนี้"],
      ["Le llamó la atención que los pinzones de cada isla tuvieran picos diferentes, adaptados a la comida disponible.","He was struck by the fact that the finches on each island had different beaks, adapted to the food available.","เขาสะดุดใจที่นกฟินช์ของแต่ละเกาะมีจะงอยปากต่างกัน ซึ่งปรับให้เหมาะกับอาหารที่มีบนเกาะนั้น"],
      ["Años después, estas observaciones le ayudaron a desarrollar su teoría de la evolución por selección natural.","Years later, these observations helped him develop his theory of evolution by natural selection.","หลายปีต่อมา ข้อสังเกตเหล่านี้ช่วยให้เขาพัฒนาทฤษฎีวิวัฒนาการโดยการคัดเลือกตามธรรมชาติ"]],
     [["Hoy, las Galápagos son un parque nacional y Patrimonio de la Humanidad.","Today, the Galápagos are a national park and a World Heritage Site.","ปัจจุบัน กาลาปากอสเป็นอุทยานแห่งชาติและมรดกโลก"],
      ["El turismo aporta dinero, pero también trae especies invasoras, como cabras y ratas, que amenazan a las tortugas gigantes.","Tourism brings money, but it also brings invasive species, like goats and rats, which threaten the giant tortoises.","การท่องเที่ยวนำรายได้มา แต่ก็นำสายพันธุ์รุกรานอย่างแพะและหนูเข้ามาด้วย ซึ่งคุกคามเต่ายักษ์"],
      ["Proteger este laboratorio natural es uno de los grandes retos de Ecuador.","Protecting this natural laboratory is one of Ecuador's great challenges.","การปกป้องห้องทดลองธรรมชาติแห่งนี้เป็นหนึ่งในความท้าทายใหญ่ของเอกวาดอร์"]]],
  v:{"laboratorio":"B1|n|laboratory|ห้องทดลอง","islas":"A2|n|islands|เกาะ|isla","océano":"B1|n|ocean|มหาสมุทร","costa":"B1|n|coast|ชายฝั่ง","unidas":"B1|adj|joined|เชื่อมต่อ|unido","continente":"B1|n|mainland, continent|แผ่นดินใหญ่, ทวีป","evolucionaron":"B2|v|evolved|วิวัฒนาการ|evolucionar","aislada":"B2|adj|isolated|โดดเดี่ยว|aislado","naturalista":"C1|n|naturalist|นักธรรมชาติวิทยา","inglés":"A1|adj|English|อังกฤษ","le llamó la atención":"B2|expr|struck him, caught his attention|ทำให้เขาสะดุดใจ|llamar la atención","pinzones":"C1|n|finches|นกฟินช์|pinzón","picos":"B2|n|beaks|จะงอยปาก|pico","adaptados":"B2|adj|adapted|ปรับตัว|adaptado","disponible":"B1|adj|available|ที่มีอยู่","observaciones":"B2|n|observations|ข้อสังเกต|observación","desarrollar":"B1|v|to develop|พัฒนา","teoría":"B1|n|theory|ทฤษฎี","evolución":"B2|n|evolution|วิวัฒนาการ","selección natural":"C1|n|natural selection|การคัดเลือกตามธรรมชาติ","parque nacional":"B1|n|national park|อุทยานแห่งชาติ","patrimonio de la humanidad":"B2|n|World Heritage|มรดกโลก","aporta":"B2|v|brings, contributes|นำมา|aportar","trae":"A2|v|brings|นำมา|traer","invasoras":"C1|adj|invasive|รุกราน|invasor","cabras":"A2|n|goats|แพะ|cabra","ratas":"A2|n|rats|หนู|rata","amenazan":"B2|v|threaten|คุกคาม|amenazar","tortugas":"A2|n|tortoises, turtles|เต่า|tortuga","gigantes":"A2|adj|giant|ยักษ์|gigante","proteger":"B1|v|to protect|ปกป้อง","retos":"B2|n|challenges|ความท้าทาย|reto"},
  q:[{t:"main",q:["¿Cuál es el tema principal?","หัวข้อหลักคืออะไร"],o:["La vida de Darwin en Inglaterra.","Las Galápagos como lugar clave para la ciencia y los desafíos para protegerlas.","La historia de Ecuador.","Cómo viajar a las Galápagos."],a:1,x:"บทความพูดถึงความโดดเดี่ยวของเกาะ → ข้อสังเกตของดาร์วิน → ความท้าทายด้านการอนุรักษ์"},
     {t:"detail",q:["¿Qué observó Darwin en los pinzones?","ดาร์วินสังเกตอะไรในนกฟินช์"],o:["Que tenían colores distintos en cada isla.","Que sus picos variaban según la comida de cada isla.","Que no podían volar.","Que eran todos iguales."],a:1,x:"“los pinzones de cada isla tuvieran picos diferentes, adaptados a la comida disponible”"},
     {t:"infer",q:["¿Por qué el aislamiento de las islas es importante para la ciencia?","ทำไมความโดดเดี่ยวของหมู่เกาะจึงสำคัญต่อวิทยาศาสตร์"],o:["Porque permite observar cómo las especies cambian de forma independiente.","Porque hace calor.","Porque no hay turistas.","Porque Darwin vivía allí."],a:0,x:"เมื่อสัตว์วิวัฒนาการแยกกันในแต่ละเกาะ นักวิทยาศาสตร์จึงเห็นการเปลี่ยนแปลงชัดเจน เหมือน “ห้องทดลอง” ตามชื่อเรื่อง"},
     {t:"not",q:["¿Qué afirmación es FALSA?","ข้อใดผิด"],o:["Las islas están en el Pacífico.","Darwin visitó las islas en 1835.","El turismo no tiene ningún efecto negativo.","Las cabras y las ratas son especies invasoras."],a:2,x:"บทความบอกว่าการท่องเที่ยวนำสายพันธุ์รุกรานเข้ามา จึงมีผลเสีย"},
     {t:"vocab",q:["En el texto, «retos» significa…","ในบทความ “retos” หมายถึง…"],o:["regalos","desafíos difíciles","viajes","leyes"],a:1,x:"reto = ความท้าทาย (desafío) การปกป้องเกาะเป็นเรื่องยากที่ต้องเอาชนะ"}]},
{ id:"es-r10", cat:"science", lvl:"C1", src:"จิตวิทยา", title:["Por qué olvidamos (y por qué es bueno)","Why we forget (and why that's good)","ทำไมเราจึงลืม (และทำไมนั่นเป็นเรื่องดี)"],
  p:[[["En 1885, el psicólogo alemán Hermann Ebbinghaus se sometió a un experimento tan tedioso como revelador: memorizar listas de sílabas sin sentido y medir cuánto recordaba con el paso del tiempo.","In 1885, the German psychologist Hermann Ebbinghaus subjected himself to an experiment as tedious as it was revealing: memorising lists of nonsense syllables and measuring how much he remembered over time.","ในปี 1885 นักจิตวิทยาชาวเยอรมัน แฮร์มันน์ เอบบิงเฮาส์ ทำการทดลองกับตัวเองที่ทั้งน่าเบื่อและเผยให้เห็นอะไรมาก คือท่องจำพยางค์ไร้ความหมาย แล้ววัดว่าจำได้แค่ไหนเมื่อเวลาผ่านไป"],
      ["El resultado, conocido como la curva del olvido, mostró que la mayor parte de lo aprendido se pierde en las primeras horas y luego el declive se ralentiza.","The result, known as the forgetting curve, showed that most of what is learned is lost in the first hours, and then the decline slows down.","ผลลัพธ์ที่เรียกว่า “เส้นโค้งแห่งการลืม” แสดงว่าสิ่งที่เรียนมาส่วนใหญ่หายไปในไม่กี่ชั่วโมงแรก แล้วจากนั้นการลืมจะช้าลง"]],
     [["Lejos de ser un defecto, el olvido parece cumplir una función.","Far from being a defect, forgetting seems to serve a purpose.","การลืมไม่ใช่ข้อบกพร่อง แต่ดูเหมือนจะมีหน้าที่บางอย่าง"],
      ["Un cerebro que lo retuviera todo se vería desbordado por detalles irrelevantes y tendría más dificultades para generalizar y tomar decisiones.","A brain that retained everything would be overwhelmed by irrelevant details and would find it harder to generalise and make decisions.","สมองที่จำทุกอย่างไว้ได้จะถูกรายละเอียดไร้สาระท่วมท้น และจะสรุปภาพรวมหรือตัดสินใจได้ยากขึ้น"],
      ["Olvidar, en este sentido, es una forma de filtrar.","Forgetting, in this sense, is a way of filtering.","ในแง่นี้ การลืมคือการกลั่นกรองรูปแบบหนึ่ง"]],
     [["La buena noticia para quien aprende idiomas es que la curva puede aplanarse.","The good news for language learners is that the curve can be flattened.","ข่าวดีสำหรับคนเรียนภาษาคือเส้นโค้งนี้ทำให้ราบลงได้"],
      ["Cada vez que recuperamos un recuerdo justo cuando está a punto de desvanecerse, este se consolida y tarda más en borrarse.","Each time we retrieve a memory just as it is about to fade, it consolidates and takes longer to be erased.","ทุกครั้งที่เราดึงความจำกลับมาตอนที่มันกำลังจะเลือนหาย ความจำนั้นจะแข็งแรงขึ้นและลบเลือนช้าลง"],
      ["En ese principio, el de la repetición espaciada, se basan precisamente las tarjetas que usted repasa en esta aplicación.","It is precisely on this principle, spaced repetition, that the flashcards you review in this app are based.","แฟลชการ์ดที่คุณทบทวนในแอปนี้ก็อาศัยหลักการนี้ คือการทบทวนแบบเว้นระยะ"]]],
  v:{"olvidamos":"A2|v|we forget|เราลืม|olvidar","psicólogo":"B1|n|psychologist|นักจิตวิทยา","alemán":"A1|adj|German|ชาวเยอรมัน","se sometió":"C1|v|subjected himself|ยอมตัวเข้ารับ|someterse","experimento":"B1|n|experiment|การทดลอง","tedioso":"C1|adj|tedious|น่าเบื่อ","revelador":"C1|adj|revealing|ที่เผยให้เห็น","memorizar":"B1|v|to memorise|ท่องจำ","sílabas":"B2|n|syllables|พยางค์|sílaba","sin sentido":"B1|expr|meaningless|ไร้ความหมาย","medir":"B1|v|to measure|วัด","con el paso del tiempo":"B2|expr|over time|เมื่อเวลาผ่านไป","curva":"B2|n|curve|เส้นโค้ง","olvido":"B2|n|forgetting|การลืม","declive":"C1|n|decline|การลดลง","se ralentiza":"C1|v|slows down|ช้าลง|ralentizarse","lejos de":"B2|expr|far from|ห่างไกลจากการเป็น","defecto":"B2|n|defect|ข้อบกพร่อง","cumplir una función":"C1|expr|to serve a purpose|ทำหน้าที่","retuviera":"C1|v|retained (subjunctive)|เก็บไว้|retener","desbordado":"C1|adj|overwhelmed|ท่วมท้น|desbordar","irrelevantes":"B2|adj|irrelevant|ไม่เกี่ยวข้อง|irrelevante","generalizar":"C1|v|to generalise|สรุปภาพรวม","filtrar":"B2|v|to filter|กรอง","aplanarse":"C1|v|to flatten|ราบลง","recuperamos":"B2|v|we retrieve|เราดึงกลับ|recuperar","recuerdo":"B1|n|memory|ความทรงจำ","a punto de":"B1|expr|about to|กำลังจะ","desvanecerse":"C1|v|to fade|เลือนหาย","se consolida":"C1|v|consolidates|แข็งแรงขึ้น|consolidarse","tarda":"B1|v|takes (time)|ใช้เวลา|tardar","borrarse":"B2|v|to be erased|ถูกลบ","principio":"B1|n|principle|หลักการ","repetición espaciada":"C1|n|spaced repetition|การทบทวนแบบเว้นระยะ","se basan":"B2|v|are based|อิงอยู่|basarse","tarjetas":"A2|n|cards|การ์ด|tarjeta","repasa":"B1|v|review|ทบทวน|repasar"},
  q:[{t:"main",q:["¿Qué idea defiende el autor?","ผู้เขียนเสนอความคิดใด"],o:["Que olvidar es siempre un problema.","Que el olvido es natural y útil, y que puede gestionarse con repasos espaciados.","Que Ebbinghaus tenía mala memoria.","Que es imposible aprender idiomas."],a:1,x:"บทความบอกว่าการลืมมีประโยชน์ (กลั่นกรอง) และจบด้วยวิธีชะลอการลืมด้วยการทบทวนแบบเว้นระยะ"},
     {t:"detail",q:["Según la curva del olvido, ¿cuándo se olvida más?","ตามเส้นโค้งแห่งการลืม เราลืมมากที่สุดเมื่อไร"],o:["Después de un año.","En las primeras horas.","Solo de noche.","Nunca."],a:1,x:"“se pierde en las primeras horas y luego el declive se ralentiza”"},
     {t:"vocab",q:["«Un cerebro desbordado» es un cerebro…","“Un cerebro desbordado” คือสมองที่…"],o:["muy tranquilo","sobrecargado, con demasiada información","dormido","más pequeño"],a:1,x:"desbordar = ล้น เหมือนน้ำล้นตลิ่ง ในที่นี้คือข้อมูลมากเกินไป"},
     {t:"infer",q:["¿Cuándo es más eficaz repasar una palabra, según el texto?","ตามบทความ ควรทบทวนคำศัพท์เมื่อใดจึงได้ผลที่สุด"],o:["Inmediatamente, diez veces seguidas.","Justo cuando estamos a punto de olvidarla.","Nunca, es mejor olvidar.","Solo el primer día."],a:1,x:"“justo cuando está a punto de desvanecerse, este se consolida” ซึ่งเป็นแนวคิดของแอปแฟลชการ์ด"},
     {t:"purpose",q:["¿Para qué menciona el autor «esta aplicación» al final?","ทำไมผู้เขียนพูดถึง “แอปนี้” ตอนท้าย"],o:["Para vender otra aplicación.","Para conectar la teoría con la práctica concreta del lector.","Para criticar las tarjetas.","Para hablar de Ebbinghaus."],a:1,x:"การยกแฟลชการ์ดที่ผู้อ่านใช้อยู่ ทำให้ทฤษฎีกลายเป็นสิ่งที่เห็นได้ในชีวิตจริงของผู้อ่าน"}]}
],

{ id:"es-n5", genre:"comedy", lvl:"A2", title:["La paella imposible","The impossible paella","ปาเอยาที่เป็นไปไม่ได้"], blurb:"หนุ่มอังกฤษอยากทำปาเอยาเลี้ยงครอบครัวแฟนสาวชาวบาเลนเซีย ทุกอย่างผิดพลาดตั้งแต่เริ่ม",
  p:[[["Tom quería impresionar a la familia de su novia, Ana.","Tom wanted to impress his girlfriend Ana's family.","ทอมอยากสร้างความประทับใจให้ครอบครัวของอานา แฟนสาวของเขา"],
      ["Eran de Valencia, así que decidió cocinar una paella.","They were from Valencia, so he decided to cook a paella.","พวกเขาเป็นคนบาเลนเซีย เขาจึงตัดสินใจทำปาเอยา"],

{ id:"es-n6", genre:"fantasy", lvl:"B2", title:["La biblioteca que no cerraba","The library that never closed","ห้องสมุดที่ไม่เคยปิด"], blurb:"ในห้องสมุดเก่าแก่แห่งหนึ่ง หนังสือที่ไม่มีใครยืมจะค่อยๆ หายไป บรรณารักษ์คนใหม่จึงต้องหาผู้อ่านให้มันทัน",
  p:[[["Cuando Inés aceptó el puesto de bibliotecaria nocturna en la vieja biblioteca de Toledo, nadie le explicó por qué el edificio nunca cerraba.","When Inés accepted the post of night librarian at the old library in Toledo, nobody explained to her why the building never closed.","ตอนที่อิเนสรับตำแหน่งบรรณารักษ์กะกลางคืนที่ห้องสมุดเก่าแห่งโตเลโด ไม่มีใครอธิบายให้เธอฟังว่าทำไมอาคารนี้ไม่เคยปิด"],
      ["Tampoco le dijeron por qué, entre las tres y las cuatro de la madrugada, las estanterías crujían como barcos en una tormenta.","Nor did they tell her why, between three and four in the morning, the shelves creaked like ships in a storm.","และก็ไม่มีใครบอกเธอด้วยว่าทำไมระหว่างตีสามถึงตีสี่ ชั้นหนังสือจึงส่งเสียงเอี๊ยดอ๊าดเหมือนเรือกลางพายุ"]],
     [["La primera noche descubrió un hueco en una estantería que, al cerrar, estaba completa.","On the first night she discovered a gap on a shelf that, at closing time, had been full.","คืนแรก เธอพบช่องว่างบนชั้นหนังสือที่ตอนปิดยังเต็มอยู่"],

      ["La segunda noche faltaban tres.","On the second night, three were missing.","คืนที่สองหายไปสามเล่ม"],
      ["Todos tenían algo en común: hacía décadas que nadie los abría.","They all had something in common: no one had opened them for decades.","ทุกเล่มมีสิ่งที่เหมือนกัน คือไม่มีใครเปิดอ่านมาหลายสิบปี"]],
     [["En el sótano, Inés encontró un cuaderno con la letra de su antecesor, que se había jubilado sin despedirse.","In the basement, Inés found a notebook in the handwriting of her predecessor, who had retired without saying goodbye.","ในห้องใต้ดิน อิเนสพบสมุดที่เขียนด้วยลายมือของบรรณารักษ์คนก่อน ซึ่งเกษียณไปโดยไม่ได้ร่ำลา"],
      ["«Los libros que nadie lee se desvanecen», había escrito.","'Books that nobody reads fade away,' he had written.","“หนังสือที่ไม่มีใครอ่านจะเลือนหายไป” เขาเขียนไว้"],
      ["«No mueren: simplemente dejan de creer que alguien los espera. Tu trabajo no es vigilarlos. Es encontrarles lectores antes del amanecer.»","'They don't die: they simply stop believing that someone is waiting for them. Your job isn't to watch over them. It's to find them readers before dawn.'","“พวกมันไม่ได้ตาย แค่เลิกเชื่อว่ามีใครรออยู่ หน้าที่ของเธอไม่ใช่เฝ้าพวกมัน แต่คือหาผู้อ่านให้ก่อนรุ่งสาง”"]],

{ id:"es-f48", cat:"culture", lvl:"C1", user:"Gabriela Torres", handle:"gaby_spanglish", time:"2 สัปดาห์", likes:1560,

  s:[["Me criaron con la idea de que, si te esfuerzas, llegas: la meritocracia como promesa.","I was raised with the idea that if you work hard, you make it: meritocracy as a promise.","ผมถูกเลี้ยงมาด้วยความคิดว่า ถ้าพยายามก็จะไปถึงเป้าหมาย ระบบคุณธรรมเป็นเหมือนคำสัญญา"],
     ["Con los años he visto a compañeros brillantes estancarse y a otros, mediocres pero bien relacionados, ascender sin esfuerzo aparente.","Over the years I've seen brilliant colleagues stagnate and others, mediocre but well connected, rise without apparent effort.","หลายปีผ่านไป ผมเห็นเพื่อนร่วมงานที่เก่งกาจย่ำอยู่กับที่ ขณะที่คนธรรมดาแต่มีเส้นสายไต่เต้าขึ้นไปโดยแทบไม่ต้องพยายาม"],
     ["No digo que el esfuerzo no importe, sino que creer que todo depende de él nos lleva a culpar a quienes no lo logran.","I'm not saying effort doesn't matter, but believing everything depends on it leads us to blame those who don't succeed.","ผมไม่ได้บอกว่าความพยายามไม่สำคัญ แต่ความเชื่อว่าทุกอย่างขึ้นกับความพยายาม ทำให้เราโทษคนที่ทำไม่สำเร็จ"]],

{ id:"es-f50", cat:"life", lvl:"C1", user:"Inmaculada Soler", handle:"inma_duelo", time:"3 สัปดาห์", likes:3010,
  s:[["Cuando murió mi madre, descubrí que en nuestra sociedad apenas tenemos palabras para el duelo.","When my mother died, I discovered that in our society we barely have words for grief.","ตอนแม่เสีย ฉันพบว่าสังคมของเราแทบไม่มีคำพูดสำหรับความโศกเศร้า"],
     ["La gente me decía «tienes que ser fuerte» o «la vida sigue», frases bienintencionadas que, sin embargo, me dejaban más sola.","People told me 'you have to be strong' or 'life goes on', well-meaning phrases that nevertheless left me lonelier.","คนรอบตัวบอกว่า “ต้องเข้มแข็งนะ” หรือ “ชีวิตต้องดำเนินต่อไป” ประโยคที่มีเจตนาดีเหล่านี้กลับทำให้ฉันรู้สึกโดดเดี่ยวยิ่งกว่าเดิม"],
     ["Lo que de verdad me ayudó fue una vecina que, sin decir nada, me traía un táper de lentejas cada jueves.","What really helped me was a neighbour who, without saying anything, brought me a tub of lentils every Thursday.","สิ่งที่ช่วยฉันได้จริงคือเพื่อนบ้านคนหนึ่ง ที่เอาถั่วเลนทิลหนึ่งกล่องมาให้ทุกวันพฤหัสโดยไม่พูดอะไรเลย"],
     ["A veces acompañar consiste simplemente en estar.","Sometimes being there for someone simply means being present.","บางครั้งการอยู่เคียงข้างใครสักคน ก็แค่การอยู่ตรงนั้น"]],

{ id:"es-r12", cat:"society", lvl:"A2", src:"เทศกาล", title:["La Tomatina, la batalla más roja del mundo","La Tomatina, the reddest battle in the world","ลาโตมาตินา สงครามที่แดงที่สุดในโลก"],
  p:[[["Cada año, el último miércoles de agosto, el pueblo de Buñol, cerca de Valencia, celebra una fiesta muy especial: la Tomatina.","Every year, on the last Wednesday of August, the town of Buñol, near Valencia, celebrates a very special festival: La Tomatina.","ทุกปีในวันพุธสุดท้ายของเดือนสิงหาคม เมืองบุญโญลใกล้บาเลนเซียจะจัดเทศกาลที่พิเศษมาก นั่นคือลาโตมาตินา"],
      ["Durante una hora, miles de personas se lanzan tomates maduros en las calles.","For an hour, thousands of people throw ripe tomatoes at each other in the streets.","ตลอดหนึ่งชั่วโมง ผู้คนนับพันขว้างมะเขือเทศสุกใส่กันบนถนน"]],
     [["La fiesta empezó en 1945, por una pelea entre jóvenes en un desfile.","The festival began in 1945, from a fight between young people during a parade.","เทศกาลนี้เริ่มในปี 1945 จากการทะเลาะกันของวัยรุ่นในขบวนพาเหรด"],
      ["Al año siguiente, los jóvenes repitieron la batalla con tomates, y así nació la tradición.","The following year, the young people repeated the battle with tomatoes, and so the tradition was born.","ปีต่อมา วัยรุ่นกลุ่มนั้นทำสงครามมะเขือเทศอีกครั้ง ธรรมเนียมนี้จึงเกิดขึ้น"]],
     [["Hoy hay reglas: hay que aplastar los tomates antes de lanzarlos y no se puede romper la ropa de nadie.","Today there are rules: you must squash the tomatoes before throwing them and you can't tear anyone's clothes.","ปัจจุบันมีกฎ ต้องบีบมะเขือเทศให้แตกก่อนขว้าง และห้ามฉีกเสื้อผ้าของใคร"],
      ["Después, los bomberos limpian las calles con agua, y el pueblo queda muy limpio.","Afterwards, firefighters clean the streets with water, and the town is left very clean.","หลังจากนั้น นักดับเพลิงจะฉีดน้ำล้างถนน และเมืองก็สะอาดเอี่ยม"]]],

  p:[[["En México, el uno y el dos de noviembre se celebra el Día de Muertos.","In Mexico, the Day of the Dead is celebrated on the first and second of November.","ในเม็กซิโก วันที่หนึ่งและสองพฤศจิกายนคือเทศกาลวันแห่งความตาย"],

     [["En las casas, preparan altares con fotos, velas, flores de color naranja llamadas cempasúchil y la comida favorita de los difuntos.","In homes, they prepare altars with photos, candles, orange flowers called cempasúchil and the favourite food of the deceased.","ในบ้าน ผู้คนจัดแท่นบูชาพร้อมรูปถ่าย เทียน ดอกไม้สีส้มที่เรียกว่าเซมปาซูชิล และอาหารโปรดของผู้ล่วงลับ"],
      ["Según la tradición, esa noche los muertos vuelven a visitar a sus familias.","According to tradition, that night the dead come back to visit their families.","ตามความเชื่อ คืนนั้นวิญญาณของผู้ตายจะกลับมาเยี่ยมครอบครัว"]],
     [["También se comen calaveras de azúcar y el «pan de muerto», un pan dulce y redondo.","People also eat sugar skulls and 'pan de muerto', a sweet, round bread.","ผู้คนยังกินหัวกะโหลกน้ำตาลและ “ขนมปังแห่งความตาย” ซึ่งเป็นขนมปังหวานทรงกลม"],

  p:[[["En lo alto de los Andes peruanos, a más de dos mil cuatrocientos metros de altura, se encuentra Machu Picchu.","High in the Peruvian Andes, at more than two thousand four hundred metres, lies Machu Picchu.","บนเทือกเขาแอนดีสในเปรู สูงกว่าสองพันสี่ร้อยเมตร คือที่ตั้งของมาชูปิกชู"],
      ["Fue construida en el siglo XV, probablemente como residencia del emperador inca Pachacútec.","It was built in the 15th century, probably as a residence of the Inca emperor Pachacuti.","สร้างขึ้นในศตวรรษที่ 15 น่าจะเป็นที่ประทับของจักรพรรดิปาชาคูเตกแห่งอินคา"]],
     [["Los incas no usaban ruedas ni animales de tiro para construir, y aun así cortaron piedras enormes que encajan sin cemento.","The Incas didn't use wheels or draught animals to build, and even so they cut enormous stones that fit together without cement.","ชาวอินคาไม่ได้ใช้ล้อหรือสัตว์ลากในการก่อสร้าง แต่ก็ยังตัดหินก้อนมหึมาที่ประกบกันพอดีโดยไม่ต้องใช้ปูน"],
      ["Gracias a esta técnica, los edificios han resistido muchos terremotos.","Thanks to this technique, the buildings have withstood many earthquakes.","ด้วยเทคนิคนี้ อาคารต่างๆ จึงทนแผ่นดินไหวมาได้หลายครั้ง"]],
     [["Cuando llegaron los españoles, la ciudad ya estaba abandonada y nunca la encontraron.","When the Spanish arrived, the city was already abandoned and they never found it.","เมื่อชาวสเปนมาถึง เมืองนี้ถูกทิ้งร้างไปแล้วและพวกเขาไม่เคยพบมัน"],
      ["En 1911, el explorador estadounidense Hiram Bingham la dio a conocer al mundo, aunque los campesinos de la zona siempre supieron que existía.","In 1911, the American explorer Hiram Bingham made it known to the world, although local farmers always knew it existed.","ในปี 1911 นักสำรวจชาวอเมริกัน ไฮแรม บิงแฮม ทำให้โลกรู้จักเมืองนี้ แม้ชาวนาในพื้นที่จะรู้มาตลอดว่ามันมีอยู่"],
      ["Hoy es Patrimonio de la Humanidad y el número de visitantes diarios está limitado para protegerla.","Today it is a World Heritage Site and the number of daily visitors is limited to protect it.","ปัจจุบันเป็นมรดกโลก และมีการจำกัดจำนวนผู้เข้าชมต่อวันเพื่อปกป้องสถานที่"]]],
  v:{"escondida":"B1|adj|hidden|ซ่อนอยู่|escondido","incas":"B1|n|Incas|ชาวอินคา|inca","andes":"B1|n|Andes|เทือกเขาแอนดีส","peruanos":"B1|adj|Peruvian|เปรู|peruano","altura":"B1|n|altitude|ความสูง","se encuentra":"B1|v|is located|ตั้งอยู่|encontrarse","residencia":"B2|n|residence|ที่ประทับ","emperador":"B1|n|emperor|จักรพรรดิ","ruedas":"A2|n|wheels|ล้อ|rueda","animales de tiro":"C1|n|draught animals|สัตว์ลาก","aun así":"B2|expr|even so|ถึงกระนั้น","cortaron":"B1|v|cut|ตัด|cortar","encajan":"B2|v|fit together|ประกบพอดี|encajar","cemento":"B1|n|cement|ปูนซีเมนต์","técnica":"B1|n|technique|เทคนิค","resistido":"B2|v|withstood|ทนทาน|resistir","terremotos":"B1|n|earthquakes|แผ่นดินไหว|terremoto","abandonada":"B1|adj|abandoned|ถูกทิ้งร้าง|abandonado","explorador":"B1|n|explorer|นักสำรวจ","estadounidense":"B1|adj|American (US)|ชาวอเมริกัน","dio a conocer":"B2|expr|made known|ทำให้เป็นที่รู้จัก|dar a conocer","campesinos":"B1|n|farmers, peasants|ชาวนา|campesino","supieron":"B1|v|knew|รู้|saber","limitado":"B1|adj|limited|จำกัด"},
  q:[{t:"main",q:["¿Cuál es la idea principal del texto?","ใจความสำคัญของบทความคืออะไร"],o:["Machu Picchu es una antigua ciudad inca impresionante y protegida.","Los españoles destruyeron Machu Picchu.","Hiram Bingham construyó Machu Picchu.","Los incas usaban cemento moderno."],a:0,x:"บทความพูดถึงที่ตั้ง การก่อสร้าง ประวัติ และการปกป้องมาชูปิกชู"},
     {t:"detail",q:["¿Por qué los edificios han resistido terremotos?","ทำไมอาคารจึงทนแผ่นดินไหวได้"],o:["Por el cemento","Por las piedras que encajan perfectamente","Porque son pequeños","Porque están bajo tierra"],a:1,x:"“piedras enormes que encajan sin cemento… Gracias a esta técnica…”"},
     {t:"not",q:["¿Qué afirmación es FALSA?","ข้อใดผิด"],o:["Los españoles nunca encontraron la ciudad.","Los campesinos locales no sabían que existía.","Fue construida en el siglo XV.","Hay un límite de visitantes."],a:1,x:"บทความบอกว่า ‘los campesinos de la zona siempre supieron que existía’"},
     {t:"vocab",q:["«La dio a conocer al mundo» significa que Bingham…","“la dio a conocer al mundo” หมายความว่าบิงแฮม…"],o:["la construyó","la hizo famosa internacionalmente","la vendió","la destruyó"],a:1,x:"dar a conocer = ทำให้เป็นที่รู้จัก บิงแฮมไม่ได้ ‘ค้นพบ’ จริงๆ เพราะคนท้องถิ่นรู้อยู่แล้ว"},
     {t:"infer",q:["¿Por qué se limita el número de visitantes?","ทำไมจึงจำกัดจำนวนผู้เข้าชม"],o:["Para ganar más dinero","Para proteger el lugar del daño causado por demasiados turistas","Porque hay pocos hoteles","Porque está prohibido por los incas"],a:1,x:"“para protegerla” แสดงว่านักท่องเที่ยวจำนวนมากเกินไปอาจสร้างความเสียหาย"}]},
{ id:"es-r15", cat:"society", lvl:"B1", src:"ภาษา", title:["El español en el mundo","Spanish around the world","ภาษาสเปนในโลก"],
  p:[[["El español es la lengua materna de casi quinientos millones de personas, lo que lo convierte en la segunda lengua más hablada como primera lengua, después del chino mandarín.","Spanish is the mother tongue of nearly five hundred million people, making it the second most spoken language as a first language, after Mandarin Chinese.","ภาษาสเปนเป็นภาษาแม่ของคนเกือบห้าร้อยล้านคน ทำให้เป็นภาษาที่มีผู้พูดเป็นภาษาแรกมากเป็นอันดับสอง รองจากภาษาจีนกลาง"],
      ["Es lengua oficial en veinte países, la mayoría en América Latina.","It is an official language in twenty countries, most of them in Latin America.","เป็นภาษาราชการในยี่สิบประเทศ ส่วนใหญ่อยู่ในละตินอเมริกา"]],
     [["Curiosamente, el país con más hablantes no es España, sino México, con más de ciento veinte millones.","Interestingly, the country with the most speakers is not Spain, but Mexico, with more than one hundred and twenty million.","ที่น่าสนใจคือ ประเทศที่มีผู้พูดมากที่สุดไม่ใช่สเปน แต่เป็นเม็กซิโก ซึ่งมีกว่าหนึ่งร้อยยี่สิบล้านคน"],
      ["En Estados Unidos, además, viven más de cuarenta millones de personas que lo hablan en casa.","In the United States, moreover, more than forty million people live who speak it at home.","นอกจากนี้ในสหรัฐอเมริกา มีคนกว่าสี่สิบล้านคนที่พูดภาษาสเปนที่บ้าน"]],
     [["Aunque existen muchas variedades y acentos, los hablantes de distintos países se entienden sin grandes problemas.","Although there are many varieties and accents, speakers from different countries understand each other without major problems.","แม้จะมีหลายสำเนียงและรูปแบบ ผู้พูดจากต่างประเทศก็เข้าใจกันได้โดยไม่มีปัญหาใหญ่"],
      ["Las diferencias están sobre todo en el vocabulario: un autobús es una «guagua» en Canarias y en Cuba, y un «camión» en México.","The differences are mainly in vocabulary: a bus is a 'guagua' in the Canaries and Cuba, and a 'camión' in Mexico.","ความแตกต่างอยู่ที่คำศัพท์เป็นหลัก เช่น รถเมล์เรียกว่า “กวากวา” ในหมู่เกาะคานารีและคิวบา และ “กามิออน” ในเม็กซิโก"]]],
  v:{"lengua materna":"B1|n|mother tongue|ภาษาแม่","convierte":"B1|v|makes, turns into|ทำให้กลายเป็น|convertir","hablada":"B1|adj|spoken|ที่พูด|hablado","chino mandarín":"B1|n|Mandarin Chinese|ภาษาจีนกลาง","lengua oficial":"B1|n|official language|ภาษาราชการ","américa latina":"A2|n|Latin America|ละตินอเมริกา","curiosamente":"B2|adv|interestingly|ที่น่าสนใจคือ","hablantes":"B1|n|speakers|ผู้พูด|hablante","sino":"B1|conj|but rather|แต่เป็น","estados unidos":"A2|n|United States|สหรัฐอเมริกา","variedades":"B2|n|varieties|ความหลากหลาย, รูปแบบ|variedad","acentos":"B1|n|accents|สำเนียง|acento","se entienden":"B1|v|understand each other|เข้าใจกัน|entenderse","diferencias":"B1|n|differences|ความแตกต่าง|diferencia","vocabulario":"B1|n|vocabulary|คำศัพท์","guagua":"C1|n|bus (Canaries, Caribbean)|รถเมล์ (สำเนียงแคริบเบียน)","camión":"B1|n|lorry; bus (Mexico)|รถบรรทุก; รถเมล์ (เม็กซิโก)"},
  q:[{t:"main",q:["¿Qué idea resume mejor el texto?","ข้อใดสรุปบทความได้ดีที่สุด"],o:["El español es una lengua muy extendida, con variedades que se entienden entre sí.","El español solo se habla en España.","Los mexicanos no entienden a los españoles.","El español es más hablado que el chino."],a:0,x:"บทความพูดถึงจำนวนผู้พูด ประเทศที่ใช้ และความหลากหลายที่ยังเข้าใจกันได้"},
     {t:"detail",q:["¿Qué país tiene más hablantes de español?","ประเทศใดมีผู้พูดภาษาสเปนมากที่สุด"],o:["España","Argentina","México","Estados Unidos"],a:2,x:"“el país con más hablantes no es España, sino México”"},
     {t:"not",q:["¿Qué afirmación es FALSA según el texto?","ตามบทความ ข้อใดผิด"],o:["El español es lengua oficial en veinte países.","El español es la primera lengua más hablada como lengua materna.","Hay muchos hispanohablantes en Estados Unidos.","Las diferencias están sobre todo en el vocabulario."],a:1,x:"บทความบอกว่าเป็นอันดับสอง รองจากภาษาจีนกลาง"},
     {t:"vocab",q:["En el texto, «sino» se usa para…","ในบทความ คำว่า “sino” ใช้เพื่อ…"],o:["corregir una idea después de una negación","expresar una condición","indicar tiempo","comparar números"],a:0,x:"no… sino… = ไม่ใช่… แต่เป็น… ใช้แก้ไขความคิดหลังประโยคปฏิเสธ"},
     {t:"infer",q:["¿Qué ilustra el ejemplo de «guagua» y «camión»?","ตัวอย่าง “guagua” และ “camión” แสดงอะไร"],o:["Que en cada país hay una lengua distinta.","Que el vocabulario cambia según la región, pero la lengua es la misma.","Que los autobuses son diferentes.","Que en Cuba no hay autobuses."],a:1,x:"ตัวอย่างนี้ใช้อธิบายประโยคก่อนหน้า ว่าความต่างอยู่ที่คำศัพท์ แต่ภาษายังเป็นภาษาเดียวกัน"}]}
]

{ id:"es-r16", cat:"history", lvl:"B2", src:"ศิลปะ/ชีวประวัติ", title:["Frida Kahlo: pintar el dolor","Frida Kahlo: painting pain","ฟรีดา คาห์โล: วาดความเจ็บปวด"],
  p:[[["Frida Kahlo nació en 1907 en Coyoacán, en Ciudad de México.","Frida Kahlo was born in 1907 in Coyoacán, in Mexico City.","ฟรีดา คาห์โลเกิดปี 1907 ที่โกโยอากัน ในเม็กซิโกซิตี"],
      ["A los dieciocho años sufrió un terrible accidente de autobús que le destrozó la columna y la pelvis, y la obligó a pasar meses inmovilizada en la cama.","At eighteen she suffered a terrible bus accident that shattered her spine and pelvis, and forced her to spend months immobilised in bed.","เมื่ออายุสิบแปดปี เธอประสบอุบัติเหตุรถบัสร้ายแรง กระดูกสันหลังและเชิงกรานแตกละเอียด ต้องนอนนิ่งอยู่บนเตียงหลายเดือน"],
      ["Fue entonces cuando empezó a pintar, con un espejo instalado sobre la cama.","It was then that she began to paint, with a mirror installed above the bed.","ช่วงนั้นเองที่เธอเริ่มวาดภาพ โดยมีกระจกติดไว้เหนือเตียง"]],
     [["De ahí nace su obsesión por el autorretrato: de sus aproximadamente ciento cincuenta pinturas, más de un tercio son retratos de sí misma.","From this comes her obsession with self-portraits: of her roughly one hundred and fifty paintings, more than a third are portraits of herself.","จากตรงนั้นเองจึงเกิดความหลงใหลในการวาดภาพเหมือนตัวเอง จากภาพวาดราวหนึ่งร้อยห้าสิบชิ้น มากกว่าหนึ่งในสามเป็นภาพเหมือนของตัวเธอ"],
      ["En ellos aparecen sin pudor su dolor físico, sus operaciones, su dificultad para ser madre y su tormentoso matrimonio con el muralista Diego Rivera.","In them, her physical pain, her operations, her difficulty in becoming a mother and her stormy marriage to the muralist Diego Rivera appear without shame.","ในภาพเหล่านั้นปรากฏอย่างไม่ปิดบัง ทั้งความเจ็บปวดทางกาย การผ่าตัด ความยากลำบากในการเป็นแม่ และชีวิตคู่อันวุ่นวายกับจิตรกรฝาผนัง ดิเอโก ริเวรา"]],
     [["Durante su vida fue conocida sobre todo como «la esposa de Rivera».","During her lifetime she was known mainly as 'Rivera's wife'.","ขณะยังมีชีวิต เธอเป็นที่รู้จักในฐานะ “ภรรยาของริเวรา” เป็นหลัก"],
      ["Solo décadas después de su muerte, en 1954, se convirtió en un icono mundial, hasta el punto de que hoy su rostro aparece en camisetas, tazas y bolsos.","Only decades after her death, in 1954, did she become a global icon, to the point that her face now appears on T-shirts, mugs and bags.","หลายสิบปีหลังเธอเสียชีวิตในปี 1954 เธอจึงกลายเป็นสัญลักษณ์ระดับโลก จนทุกวันนี้ใบหน้าของเธอปรากฏบนเสื้อยืด แก้ว และกระเป๋า"],
      ["Algunos critican que esa comercialización ha borrado su compromiso político y la crudeza de su obra.","Some criticise that this commercialisation has erased her political commitment and the rawness of her work.","บางคนวิจารณ์ว่าการทำให้เป็นสินค้าเช่นนี้ ได้ลบเลือนจุดยืนทางการเมืองและความดิบเถื่อนในผลงานของเธอ"]]],

     {t:"vocab",q:["«Sin pudor» significa que Frida pintaba sus problemas…","“sin pudor” หมายความว่าฟรีดาวาดปัญหาของตัวเอง…"],o:["escondiéndolos","abiertamente, sin vergüenza","con humor","en secreto"],a:1,x:"pudor = ความอาย sin pudor จึงหมายถึงอย่างเปิดเผย ไม่ปิดบัง"},
     {t:"not",q:["¿Qué afirmación es FALSA?","ข้อใดผิด"],o:["Murió en 1954.","Fue famosa en todo el mundo durante su vida.","Más de un tercio de sus pinturas son autorretratos.","Estuvo casada con Diego Rivera."],a:1,x:"บทความบอกว่าในช่วงชีวิตเธอเป็นที่รู้จักในฐานะ ‘ภรรยาของริเวรา’ และกลายเป็นไอคอนระดับโลกหลังเสียชีวิตหลายสิบปี"},
     {t:"tone",q:["¿Qué postura recoge el último párrafo?","ย่อหน้าสุดท้ายนำเสนอมุมมองใด"],o:["Una crítica a que la fama comercial simplifique a la artista.","Un elogio de las camisetas.","Una defensa de Diego Rivera.","Una crítica al accidente."],a:0,x:"ประโยคสุดท้ายรายงานคำวิจารณ์ว่าการขายภาพลักษณ์ทำให้ผลงานและจุดยืนทางการเมืองของเธอถูกลดทอน"}]},
{ id:"es-r17", cat:"history", lvl:"B2", src:"สถาปัตยกรรม", title:["La Sagrada Familia, la obra que no termina","The Sagrada Família, the work that never ends","ซากราดาฟามีเลีย สิ่งก่อสร้างที่ไม่มีวันเสร็จ"],
  p:[[["Las obras de la Sagrada Familia, en Barcelona, empezaron en 1882, y un año después el joven arquitecto Antoni Gaudí se hizo cargo del proyecto.","Work on the Sagrada Família in Barcelona began in 1882, and a year later the young architect Antoni Gaudí took charge of the project.","การก่อสร้างโบสถ์ซากราดาฟามีเลียในบาร์เซโลนาเริ่มในปี 1882 และหนึ่งปีต่อมาสถาปนิกหนุ่มอันโตนี เกาดี ก็เข้ามารับผิดชอบโครงการ"],
      ["Gaudí dedicó a la basílica más de cuarenta años, los últimos casi en exclusiva.","Gaudí devoted more than forty years to the basilica, the last ones almost exclusively.","เกาดีทุ่มเทให้มหาวิหารนี้กว่าสี่สิบปี ช่วงท้ายแทบทำงานนี้อย่างเดียว"],
      ["Cuando le preguntaban por la lentitud de las obras, respondía: «Mi cliente no tiene prisa».","When asked about the slowness of the work, he replied: 'My client is in no hurry.'","เมื่อมีคนถามถึงความล่าช้า เขาตอบว่า “ลูกค้าของผมไม่รีบ”"]],
     [["En 1926 murió atropellado por un tranvía, y al principio nadie lo reconoció por su aspecto humilde.","In 1926 he died after being hit by a tram, and at first no one recognised him because of his humble appearance.","ในปี 1926 เขาเสียชีวิตเพราะถูกรถรางชน และในตอนแรกไม่มีใครจำเขาได้ เพราะแต่งตัวเรียบง่ายมาก"],
      ["Durante la Guerra Civil, parte de sus planos y maquetas fue destruida, lo que obligó a reconstruir su visión a partir de fragmentos.","During the Civil War, some of his plans and models were destroyed, which forced people to reconstruct his vision from fragments.","ในช่วงสงครามกลางเมือง แบบแปลนและโมเดลบางส่วนถูกทำลาย ทำให้ต้องประกอบวิสัยทัศน์ของเขาขึ้นใหม่จากเศษชิ้นส่วน"]],
     [["Financiada únicamente con donativos y entradas, la basílica sigue en construcción más de un siglo después.","Financed solely by donations and tickets, the basilica is still under construction more than a century later.","มหาวิหารได้รับทุนจากเงินบริจาคและค่าเข้าชมเท่านั้น และยังก่อสร้างอยู่แม้เวลาจะผ่านไปกว่าหนึ่งศตวรรษ"],
      ["Para unos es una joya única; para otros, un símbolo del turismo masivo que satura la ciudad.","For some it is a unique jewel; for others, a symbol of the mass tourism that overwhelms the city.","สำหรับบางคน มันคืออัญมณีที่ไม่เหมือนใคร แต่สำหรับอีกบางคน มันคือสัญลักษณ์ของการท่องเที่ยวล้นเมือง"]]],
  v:{"obras":"B1|n|works, construction|งานก่อสร้าง|obra","arquitecto":"B1|n|architect|สถาปนิก","se hizo cargo":"B2|expr|took charge|เข้ารับผิดชอบ|hacerse cargo","dedicó":"B1|v|devoted|อุทิศ|dedicar","basílica":"B2|n|basilica|มหาวิหาร","en exclusiva":"C1|expr|exclusively|อย่างเดียว","lentitud":"B2|n|slowness|ความล่าช้า","respondía":"B1|v|replied|ตอบ|responder","cliente":"A2|n|client|ลูกค้า","prisa":"A2|n|hurry|ความรีบ","atropellado":"B2|adj|run over|ถูกรถชน|atropellar","tranvía":"B1|n|tram|รถราง","reconoció":"B1|v|recognised|จำได้|reconocer","aspecto":"B1|n|appearance|รูปลักษณ์","humilde":"B2|adj|humble|เรียบง่าย, ถ่อมตัว","guerra civil":"B1|n|civil war|สงครามกลางเมือง","planos":"B1|n|plans|แบบแปลน|plano","maquetas":"B2|n|scale models|โมเดลจำลอง|maqueta","destruida":"B1|adj|destroyed|ถูกทำลาย|destruir","reconstruir":"B2|v|to reconstruct|สร้างขึ้นใหม่","visión":"B2|n|vision|วิสัยทัศน์","fragmentos":"B2|n|fragments|เศษชิ้นส่วน|fragmento","financiada":"B2|adj|financed|ได้รับเงินทุน|financiar","únicamente":"B2|adv|solely|เท่านั้น","donativos":"C1|n|donations|เงินบริจาค|donativo","entradas":"A2|n|tickets|ตั๋วเข้าชม|entrada","en construcción":"B1|expr|under construction|อยู่ระหว่างก่อสร้าง","joya":"B1|n|jewel|อัญมณี","turismo masivo":"B2|n|mass tourism|การท่องเที่ยวแบบมวลชน","satura":"C1|v|saturates, overwhelms|ทำให้ล้น|saturar"},
  q:[{t:"main",q:["¿Cuál es la idea principal?","ใจความสำคัญคืออะไร"],o:["La Sagrada Familia es una obra larga y excepcional, ligada a Gaudí y hoy objeto de debate.","Gaudí terminó la Sagrada Familia en 1926.","La Sagrada Familia está pagada por el gobierno.","Gaudí odiaba a sus clientes."],a:0,x:"บทความเล่าประวัติการก่อสร้างอันยาวนานและข้อถกเถียงในปัจจุบัน"},
     {t:"detail",q:["¿Qué quería decir Gaudí con «Mi cliente no tiene prisa»?","เกาดีหมายถึงอะไรด้วยประโยค “ลูกค้าของผมไม่รีบ”"],o:["Que el cliente era Dios y el tiempo no importaba.","Que no tenía clientes.","Que el ayuntamiento no pagaba.","Que quería trabajar más rápido."],a:0,x:"เป็นมหาวิหาร ‘ลูกค้า’ ในที่นี้จึงหมายถึงพระเจ้า ซึ่งไม่ต้องรีบร้อน (เป็นการอนุมานจากบริบท)"},
     {t:"detail",q:["¿Cómo se financia la construcción?","การก่อสร้างได้เงินทุนจากที่ใด"],o:["Con dinero del Estado","Solo con donativos y entradas","Con un banco","Con la Iglesia de Roma"],a:1,x:"“Financiada únicamente con donativos y entradas”"},
     {t:"not",q:["¿Qué afirmación es FALSA?","ข้อใดผิด"],o:["Las obras empezaron en 1882.","Gaudí murió atropellado por un tranvía.","Todos los planos de Gaudí se conservaron intactos.","La basílica sigue sin terminar."],a:2,x:"บทความบอกว่าแบบแปลนบางส่วนถูกทำลายในสงครามกลางเมือง"},
     {t:"vocab",q:["«El turismo masivo que satura la ciudad» significa que…","“el turismo masivo que satura la ciudad” หมายความว่า…"],o:["hay demasiados turistas para la ciudad","los turistas son pocos","la ciudad está vacía","el turismo es barato"],a:0,x:"saturar = ทำให้เต็มเกินขีดจำกัด จึงหมายถึงนักท่องเที่ยวมากเกินที่เมืองจะรับได้"}]},
{ id:"es-r18", cat:"society", lvl:"B2", src:"วัฒนธรรม/การเดินทาง", title:["El Camino de Santiago: de peregrinación a fenómeno global","The Camino de Santiago: from pilgrimage to global phenomenon","เส้นทางแสวงบุญซานติอาโก จากการจาริกแสวงบุญสู่ปรากฏการณ์ระดับโลก"],
  p:[[["Desde la Edad Media, peregrinos de toda Europa caminan hasta Santiago de Compostela, en Galicia, donde según la tradición está enterrado el apóstol Santiago.","Since the Middle Ages, pilgrims from all over Europe have walked to Santiago de Compostela, in Galicia, where according to tradition the apostle James is buried.","ตั้งแต่ยุคกลาง ผู้แสวงบุญจากทั่วยุโรปเดินเท้าไปยังซานติอาโกเดกอมโปสเตลาในกาลิเซีย ซึ่งตามความเชื่อเป็นที่ฝังศพของนักบุญเจมส์อัครสาวก"],
      ["Tras siglos de olvido, la ruta resurgió a finales del siglo XX y hoy la recorren cientos de miles de personas cada año.","After centuries of oblivion, the route re-emerged in the late 20th century and today hundreds of thousands of people walk it every year.","หลังถูกลืมไปหลายศตวรรษ เส้นทางนี้กลับมาได้รับความนิยมในปลายศตวรรษที่ 20 และปัจจุบันมีคนเดินหลายแสนคนต่อปี"]],
     [["Para obtener la «Compostela», el certificado oficial, hay que recorrer al menos los últimos cien kilómetros a pie o doscientos en bicicleta.","To obtain the 'Compostela', the official certificate, you must cover at least the last hundred kilometres on foot or two hundred by bicycle.","หากต้องการใบรับรองอย่างเป็นทางการที่เรียกว่า “กอมโปสเตลา” ต้องเดินอย่างน้อยร้อยกิโลเมตรสุดท้าย หรือปั่นจักรยานสองร้อยกิโลเมตร"],
      ["Muchos caminantes ya no lo hacen por motivos religiosos, sino deportivos, culturales o personales: superar un duelo, pensar en un cambio de vida o simplemente desconectar.","Many walkers no longer do it for religious reasons, but for sporting, cultural or personal ones: getting over a loss, thinking about a life change or simply disconnecting.","ผู้เดินหลายคนไม่ได้เดินด้วยเหตุผลทางศาสนาอีกแล้ว แต่ด้วยเหตุผลด้านกีฬา วัฒนธรรม หรือเรื่องส่วนตัว เช่น เยียวยาความสูญเสีย คิดเรื่องเปลี่ยนชีวิต หรือแค่อยากตัดขาดจากโลกภายนอก"]],
     [["Este éxito tiene una cara menos amable: en temporada alta, los albergues se llenan y algunos tramos parecen procesiones.","This success has a less pleasant side: in high season, hostels fill up and some stretches look like processions.","ความสำเร็จนี้มีด้านที่ไม่ค่อยดีนัก ในช่วงฤดูท่องเที่ยว ที่พักเต็ม และบางช่วงของเส้นทางดูเหมือนขบวนแห่"],
      ["Aun así, para los pueblos del interior, la llegada de caminantes ha sido una fuente de vida económica inesperada.","Even so, for inland villages, the arrival of walkers has been an unexpected source of economic life.","ถึงอย่างนั้น สำหรับหมู่บ้านในชนบท การมาถึงของผู้เดินทางกลายเป็นแหล่งชีวิตทางเศรษฐกิจที่ไม่คาดคิด"]]],
  v:{"peregrinación":"B2|n|pilgrimage|การจาริกแสวงบุญ","fenómeno":"B2|n|phenomenon|ปรากฏการณ์","edad media":"B1|n|Middle Ages|ยุคกลาง","peregrinos":"B2|n|pilgrims|ผู้แสวงบุญ|peregrino","caminan":"A2|v|walk|เดิน|caminar","enterrado":"B2|adj|buried|ถูกฝัง|enterrar","apóstol":"C1|n|apostle|อัครสาวก","olvido":"B2|n|oblivion|การถูกลืม","resurgió":"C1|v|re-emerged|กลับมาอีกครั้ง|resurgir","recorren":"B1|v|travel along|เดินทางผ่าน|recorrer","cientos de miles":"B1|expr|hundreds of thousands|หลายแสน","certificado":"B1|n|certificate|ใบรับรอง","a pie":"A2|expr|on foot|เดินเท้า","caminantes":"B1|n|walkers|ผู้เดิน|caminante","motivos":"B1|n|reasons|เหตุผล|motivo","religiosos":"B1|adj|religious|ทางศาสนา|religioso","deportivos":"B1|adj|sporting|ด้านกีฬา|deportivo","superar":"B2|v|to overcome|ก้าวผ่าน","duelo":"C1|n|grief, loss|ความโศกเศร้า","desconectar":"B1|v|to disconnect|ตัดขาด, พักผ่อน","cara":"B1|n|side, face|ด้าน","amable":"A2|adj|pleasant, kind|ดี, น่ารัก","temporada alta":"B1|n|high season|ฤดูท่องเที่ยว","albergues":"B1|n|hostels|ที่พัก|albergue","tramos":"B2|n|stretches, sections|ช่วง|tramo","procesiones":"B2|n|processions|ขบวนแห่|procesión","interior":"B1|n|inland|พื้นที่ภายใน","fuente":"B1|n|source|แหล่ง","inesperada":"B2|adj|unexpected|ไม่คาดคิด|inesperado"},
  q:[{t:"main",q:["¿Qué idea resume mejor el texto?","ข้อใดสรุปบทความได้ดีที่สุด"],o:["El Camino ha pasado de ser una ruta religiosa a un fenómeno masivo con ventajas e inconvenientes.","El Camino está cerrado desde la Edad Media.","Solo los católicos pueden hacer el Camino.","El Camino se hace en coche."],a:0,x:"บทความเล่าการเปลี่ยนจากการแสวงบุญสู่ความนิยมมวลชน พร้อมข้อดีข้อเสีย"},
     {t:"detail",q:["¿Qué hay que hacer para obtener la Compostela?","ต้องทำอะไรเพื่อได้ใบกอมโปสเตลา"],o:["Caminar al menos los últimos 100 km o pedalear 200 km.","Caminar desde los Pirineos.","Pagar una entrada.","Ser católico."],a:0,x:"“recorrer al menos los últimos cien kilómetros a pie o doscientos en bicicleta”"},
     {t:"not",q:["¿Qué afirmación NO se desprende del texto?","ข้อใดไม่ได้มาจากบทความ"],o:["Muchos caminantes tienen motivos no religiosos.","Los albergues se llenan en temporada alta.","El Camino perjudica la economía de los pueblos.","La ruta resurgió a finales del siglo XX."],a:2,x:"บทความบอกตรงกันข้าม ว่าผู้เดินทางเป็น ‘fuente de vida económica’ ของหมู่บ้าน"},
     {t:"vocab",q:["«Algunos tramos parecen procesiones» quiere decir que…","“บางช่วงดูเหมือนขบวนแห่” หมายความว่า…"],o:["hay mucha gente caminando en fila","hay fiestas religiosas","los caminos están cerrados","hay música en el camino"],a:0,x:"เปรียบเทียบว่ามีคนเดินต่อแถวยาวเหมือนขบวนแห่ เพราะคนเยอะเกินไป"},
     {t:"tone",q:["¿Cuál es el tono general del texto?","น้ำเสียงโดยรวมของบทความเป็นอย่างไร"],o:["Equilibrado: reconoce éxitos y problemas.","Totalmente negativo.","Publicitario y exagerado.","Irónico y burlón."],a:0,x:"ผู้เขียนเสนอทั้งความสำเร็จ (ความนิยม เศรษฐกิจท้องถิ่น) และปัญหา (คนแน่น) อย่างสมดุล"}]},
{ id:"es-r19", cat:"history", lvl:"C1", src:"วรรณกรรม", title:["El realismo mágico: cuando lo extraordinario es cotidiano","Magical realism: when the extraordinary is everyday","สัจนิยมมหัศจรรย์: เมื่อเรื่องเหนือธรรมชาติกลายเป็นเรื่องธรรมดา"],
  p:[[["En «Cien años de soledad», publicada en 1967, una mujer asciende al cielo mientras tiende las sábanas, y nadie en el pueblo parece especialmente sorprendido.","In 'One Hundred Years of Solitude', published in 1967, a woman ascends to heaven while hanging out the sheets, and nobody in the village seems especially surprised.","ใน “หนึ่งร้อยปีแห่งความโดดเดี่ยว” ซึ่งตีพิมพ์ปี 1967 หญิงคนหนึ่งลอยขึ้นสวรรค์ขณะตากผ้าปูที่นอน โดยไม่มีใครในหมู่บ้านดูแปลกใจเป็นพิเศษ"],
      ["Esa naturalidad ante lo prodigioso es la clave del llamado realismo mágico, del que Gabriel García Márquez, premio Nobel en 1982, se convirtió en el máximo exponente.","That matter-of-factness in the face of the marvellous is the key to so-called magical realism, of which Gabriel García Márquez, Nobel laureate in 1982, became the foremost exponent.","ความเป็นธรรมดาต่อหน้าสิ่งมหัศจรรย์นี้คือหัวใจของสิ่งที่เรียกว่าสัจนิยมมหัศจรรย์ ซึ่งกาเบรียล การ์เซีย มาร์เกซ ผู้ได้รับรางวัลโนเบลปี 1982 คือตัวแทนที่โดดเด่นที่สุด"]],
     [["El propio autor rechazaba la etiqueta de fantasía: sostenía que se limitaba a contar el Caribe tal como se lo había narrado su abuela, con la misma cara impávida con la que ella relataba prodigios.","The author himself rejected the label of fantasy: he maintained that he was merely recounting the Caribbean as his grandmother had told it to him, with the same deadpan face with which she related marvels.","ตัวผู้เขียนเองปฏิเสธการถูกจัดเป็นแฟนตาซี เขายืนยันว่าเพียงเล่าเรื่องแคริบเบียนตามที่ยายเคยเล่าให้ฟัง ด้วยสีหน้าเรียบเฉยแบบเดียวกับที่ยายเล่าเรื่องมหัศจรรย์"],
      ["En una realidad latinoamericana marcada por dictaduras grotescas y desmesuras históricas, lo inverosímil, decía, era a menudo lo más fiel a los hechos.","In a Latin American reality marked by grotesque dictatorships and historical excesses, the implausible, he said, was often what was most faithful to the facts.","ในความเป็นจริงของละตินอเมริกาที่เต็มไปด้วยเผด็จการอันพิลึกพิลั่นและความเกินจริงทางประวัติศาสตร์ เขาบอกว่าสิ่งที่ดูไม่น่าเชื่อ มักเป็นสิ่งที่ตรงกับข้อเท็จจริงที่สุด"]],
     [["Con el éxito mundial vino también la sospecha de exotismo: varios escritores posteriores se rebelaron contra la expectativa de que todo autor latinoamericano debía escribir sobre mariposas amarillas y lluvias de cuatro años.","With global success also came the suspicion of exoticism: several later writers rebelled against the expectation that every Latin American author had to write about yellow butterflies and four-year rains.","พร้อมกับความสำเร็จระดับโลกก็มาพร้อมข้อกังขาเรื่องการขายความแปลกตา นักเขียนรุ่นหลังหลายคนลุกขึ้นต่อต้านความคาดหวังว่านักเขียนละตินอเมริกาทุกคนต้องเขียนถึงผีเสื้อสีเหลืองและฝนที่ตกสี่ปี"],
      ["Paradójicamente, esa rebeldía confirma la enorme sombra que el realismo mágico sigue proyectando.","Paradoxically, that rebellion confirms the enormous shadow magical realism still casts.","ย้อนแย้งที่การต่อต้านนั้นเองกลับยืนยันว่าสัจนิยมมหัศจรรย์ยังทอดเงาอันยิ่งใหญ่อยู่"]]],

  q:[{t:"main",q:["¿Qué explica principalmente el texto?","บทความอธิบายอะไรเป็นหลัก"],o:["Qué es el realismo mágico, su origen en García Márquez y su compleja herencia.","La vida de la abuela de García Márquez.","La historia de las dictaduras latinoamericanas.","Cómo escribir una novela fantástica."],a:0,x:"บทความนิยามสัจนิยมมหัศจรรย์ อธิบายมุมมองของการ์เซีย มาร์เกซ และผลกระทบต่อนักเขียนรุ่นหลัง"},
     {t:"detail",q:["Según el texto, ¿cuál es la clave del realismo mágico?","ตามบทความ หัวใจของสัจนิยมมหัศจรรย์คืออะไร"],o:["Que los personajes se asombran de todo.","Que lo extraordinario se cuenta con total naturalidad.","Que todo ocurre en el futuro.","Que no hay personajes humanos."],a:1,x:"“Esa naturalidad ante lo prodigioso es la clave…”"},
     {t:"infer",q:["¿Por qué García Márquez rechazaba la etiqueta de «fantasía»?","ทำไมการ์เซีย มาร์เกซปฏิเสธการถูกเรียกว่า “แฟนตาซี”"],o:["Porque consideraba que reflejaba una realidad que ya parecía increíble.","Porque odiaba la fantasía.","Porque su editor se lo pidió.","Porque escribía novelas policíacas."],a:0,x:"เขาบอกว่าความจริงในละตินอเมริกาเองก็ไม่น่าเชื่ออยู่แล้ว สิ่งที่ดูเหลือเชื่อจึงมักตรงกับความจริง"},

     {t:"purpose",q:["¿Qué función cumple la última frase?","ประโยคสุดท้ายทำหน้าที่อะไร"],o:["Señala la paradoja de que rechazar el realismo mágico demuestra su influencia.","Critica a García Márquez.","Anuncia un nuevo libro.","Resume la biografía del autor."],a:0,x:"‘Paradójicamente’ บ่งบอกว่าการต่อต้านนั้นยิ่งพิสูจน์อิทธิพลของสัจนิยมมหัศจรรย์"}]},
{ id:"es-r20", cat:"tech", lvl:"C1", src:"เทคโนโลยี/สังคม", title:["La economía de la atención","The attention economy","เศรษฐกิจแห่งความสนใจ"],
  p:[[["En 1971, el economista Herbert Simon advirtió que «una riqueza de información crea una pobreza de atención».","In 1971, the economist Herbert Simon warned that 'a wealth of information creates a poverty of attention'.","ในปี 1971 นักเศรษฐศาสตร์เฮอร์เบิร์ต ไซมอน เตือนว่า “ความมั่งคั่งของข้อมูลก่อให้เกิดความยากจนของความสนใจ”"],
      ["Medio siglo después, su intuición describe con precisión el modelo de negocio de buena parte de internet: si un servicio es gratuito, el producto que se vende es el tiempo del usuario.","Half a century later, his intuition precisely describes the business model of much of the internet: if a service is free, the product being sold is the user's time.","ครึ่งศตวรรษต่อมา สัญชาตญาณของเขาอธิบายโมเดลธุรกิจของอินเทอร์เน็ตส่วนใหญ่ได้อย่างแม่นยำ ถ้าบริการใดฟรี สินค้าที่ถูกขายก็คือเวลาของผู้ใช้"]],
     [["Las plataformas compiten por retener nuestra mirada con recursos cada vez más refinados: desplazamiento infinito, reproducción automática, notificaciones diseñadas para generar una pequeña ansiedad que solo se calma al abrir la aplicación.","Platforms compete to hold our gaze with increasingly refined devices: infinite scrolling, autoplay, notifications designed to generate a small anxiety that only subsides when you open the app.","แพลตฟอร์มต่างแข่งกันดึงสายตาเราด้วยกลไกที่ประณีตขึ้นเรื่อยๆ ทั้งการเลื่อนไม่สิ้นสุด การเล่นอัตโนมัติ และการแจ้งเตือนที่ออกแบบให้เกิดความกังวลเล็กๆ ซึ่งจะหายไปเมื่อเปิดแอปเท่านั้น"],
      ["No se trata de una conspiración, sino de una lógica económica: lo que maximiza el tiempo de uso maximiza los ingresos publicitarios.","It isn't a conspiracy, but an economic logic: whatever maximises time spent maximises advertising revenue.","นี่ไม่ใช่การสมคบคิด แต่เป็นตรรกะทางเศรษฐกิจ สิ่งใดที่ทำให้ใช้เวลามากที่สุด ย่อมทำให้รายได้โฆษณาสูงที่สุด"]],
     [["Algunos proponen regular el diseño persuasivo, como se regulan los ingredientes de un alimento; otros apuestan por la educación digital.","Some propose regulating persuasive design, just as food ingredients are regulated; others are betting on digital education.","บางคนเสนอให้ควบคุมการออกแบบที่มุ่งโน้มน้าว เหมือนที่ควบคุมส่วนผสมในอาหาร อีกฝ่ายฝากความหวังไว้กับการศึกษาด้านดิจิทัล"],
      ["Sea cual sea la respuesta, conviene recordar que la atención no es un recurso infinito: es, literalmente, nuestra vida.","Whatever the answer, it's worth remembering that attention is not an infinite resource: it is, literally, our life.","ไม่ว่าคำตอบจะเป็นอย่างไร ควรจำไว้ว่าความสนใจไม่ใช่ทรัพยากรที่ไม่มีวันหมด มันคือชีวิตของเราอย่างแท้จริง"]]],
  v:{"economía de la atención":"C1|n|attention economy|เศรษฐกิจแห่งความสนใจ","advirtió":"B2|v|warned|เตือน|advertir","riqueza":"B2|n|wealth|ความมั่งคั่ง","pobreza":"B2|n|poverty|ความยากจน","intuición":"C1|n|intuition|สัญชาตญาณ","con precisión":"B2|expr|precisely|อย่างแม่นยำ","modelo de negocio":"C1|n|business model|โมเดลธุรกิจ","usuario":"B1|n|user|ผู้ใช้","plataformas":"B2|n|platforms|แพลตฟอร์ม|plataforma","compiten":"B2|v|compete|แข่งขัน|competir","retener":"C1|v|to retain, hold|ดึงไว้","mirada":"B2|n|gaze|สายตา","recursos":"B2|n|devices, resources|กลไก, ทรัพยากร|recurso","refinados":"C1|adj|refined|ประณีต|refinado","desplazamiento infinito":"C1|n|infinite scrolling|การเลื่อนไม่สิ้นสุด","reproducción automática":"C1|n|autoplay|การเล่นอัตโนมัติ","notificaciones":"B1|n|notifications|การแจ้งเตือน|notificación","ansiedad":"B2|n|anxiety|ความวิตกกังวล","se calma":"B2|v|subsides|สงบลง|calmarse","no se trata de":"B2|expr|it isn't a matter of|ไม่ใช่เรื่องของ","conspiración":"C1|n|conspiracy|การสมคบคิด","lógica":"B2|n|logic|ตรรกะ","maximiza":"C1|v|maximises|ทำให้สูงสุด|maximizar","ingresos publicitarios":"C1|n|advertising revenue|รายได้จากโฆษณา","regular":"B2|v|to regulate|ควบคุม","persuasivo":"C1|adj|persuasive|มุ่งโน้มน้าว","apuestan por":"C1|expr|bet on|ฝากความหวังกับ|apostar por","sea cual sea":"C1|expr|whatever|ไม่ว่าจะเป็นอะไร","conviene":"C1|v|it is advisable|ควร|convenir","literalmente":"B2|adv|literally|อย่างแท้จริง"},
  q:[{t:"main",q:["¿Cuál es la tesis del texto?","ข้อเสนอของบทความคืออะไร"],o:["Internet es una conspiración de las empresas.","Muchas plataformas viven de captar nuestra atención, un recurso limitado que conviene proteger.","Las notificaciones son útiles.","Herbert Simon inventó internet."],a:1,x:"บทความอธิบายโมเดลธุรกิจที่ขายความสนใจ และจบด้วยการเตือนว่าความสนใจมีจำกัด ข้อ A ถูกปฏิเสธในบทความ (‘No se trata de una conspiración’)"},
     {t:"detail",q:["Según el texto, si un servicio es gratuito, ¿qué se vende?","ตามบทความ ถ้าบริการฟรี อะไรคือสิ่งที่ถูกขาย"],o:["Los datos bancarios","El tiempo del usuario","El teléfono","La aplicación"],a:1,x:"“el producto que se vende es el tiempo del usuario”"},
     {t:"detail",q:["¿Para qué están diseñadas ciertas notificaciones?","การแจ้งเตือนบางอย่างถูกออกแบบมาเพื่ออะไร"],o:["Para informar de noticias urgentes","Para crear una pequeña ansiedad que empuja a abrir la app","Para ahorrar batería","Para proteger la privacidad"],a:1,x:"“diseñadas para generar una pequeña ansiedad que solo se calma al abrir la aplicación”"},
     {t:"not",q:["¿Qué afirmación NO se desprende del texto?","ข้อใดไม่ได้มาจากบทความ"],o:["El diseño persuasivo podría regularse.","Más tiempo de uso significa más ingresos publicitarios.","Las plataformas actúan por maldad deliberada.","La educación digital es una posible respuesta."],a:2,x:"บทความบอกว่าไม่ใช่การสมคบคิดหรือเจตนาร้าย แต่เป็น ‘lógica económica’"},
     {t:"purpose",q:["¿Por qué el autor compara el diseño persuasivo con los ingredientes de un alimento?","ทำไมผู้เขียนเปรียบการออกแบบที่โน้มน้าวกับส่วนผสมในอาหาร"],o:["Para sugerir que ambos afectan a nuestra salud y pueden regularse.","Para hablar de nutrición.","Para criticar la comida rápida.","Para vender alimentos."],a:0,x:"การเปรียบเทียบนี้ชี้ว่า เหมือนที่อาหารถูกควบคุมเพื่อสุขภาพ การออกแบบดิจิทัลก็ควรถูกควบคุมได้เช่นกัน"}]}
]

      ["Son de zapatillas de casa, de talla muy pequeña…","They're from slippers, a very small size…","มันเป็นรอยรองเท้าแตะใส่ในบ้าน ไซซ์เล็กมาก…"]],
     "* * *",
     [["Las huellas terminan en la habitación de la abuela.","The footprints end in Grandma's bedroom.","รอยเท้าไปสิ้นสุดที่ห้องนอนของคุณยาย"],

  p:[[["En la feria del pueblo, Marta ganó una muñeca de porcelana en el puesto de tiro.","At the village fair, Marta won a porcelain doll at the shooting stall.","ที่งานวัดของหมู่บ้าน มาร์ตาได้ตุ๊กตากระเบื้องจากซุ้มยิงปืน"],
      ["El feriante, un hombre viejo de ojos muy claros, se la entregó sin sonreír.","The stallholder, an old man with very pale eyes, handed it to her without smiling.","คนเฝ้าซุ้ม ชายชราตาสีอ่อนจัด ยื่นตุ๊กตาให้เธอโดยไม่ยิ้ม"],
      ["«Cuídala bien», dijo. «No le gusta estar sola.»","'Look after her well,' he said. 'She doesn't like being alone.'","“ดูแลมันดีๆ นะ” เขาพูด “มันไม่ชอบอยู่ตัวคนเดียว”"]],
     [["Marta la puso en la estantería de su habitación, mirando hacia la ventana.","Marta put it on the shelf in her bedroom, facing the window.","มาร์ตาวางตุ๊กตาไว้บนชั้นในห้องนอน หันหน้าออกไปทางหน้าต่าง"],
      ["A la mañana siguiente, la muñeca miraba hacia la cama.","The next morning, the doll was facing the bed.","เช้าวันรุ่งขึ้น ตุ๊กตาหันหน้ามาทางเตียง"],

      ["Esa noche, Marta cerró la puerta con llave.","That night, Marta locked the door.","คืนนั้น มาร์ตาล็อกประตูห้อง"]],
     [["Se despertó a las tres de la madrugada por un ruido suave, como de pasitos sobre la madera.","She woke at three in the morning to a soft noise, like little steps on the wood.","เธอตื่นตอนตีสามเพราะเสียงเบาๆ เหมือนเสียงก้าวเล็กๆ บนพื้นไม้"],
      ["No se atrevió a encender la luz.","She didn't dare switch on the light.","เธอไม่กล้าเปิดไฟ"],
      ["Sintió que algo pequeño y frío se acomodaba en la almohada, junto a su cara.","She felt something small and cold settle on the pillow, next to her face.","เธอรู้สึกถึงบางอย่างเล็กๆ และเย็นเฉียบมาซุกอยู่บนหมอนข้างใบหน้า"]],
     "* * *",
     [["Por la mañana, la muñeca estaba en la estantería, en su sitio.","In the morning, the doll was on the shelf, in its place.","ตอนเช้า ตุ๊กตาอยู่บนชั้นตรงที่เดิม"],
      ["Pero tenía el pelo despeinado y, en la mejilla de porcelana, una pequeña marca roja, como la de una almohada.","But its hair was messy and, on its porcelain cheek, there was a small red mark, like one from a pillow.","แต่ผมของมันยุ่งเหยิง และบนแก้มกระเบื้องมีรอยแดงเล็กๆ เหมือนรอยหมอน"],
      ["Esa tarde, Marta volvió a la feria para devolverla.","That afternoon, Marta went back to the fair to return it.","บ่ายวันนั้น มาร์ตากลับไปที่งานวัดเพื่อคืนตุ๊กตา"],
