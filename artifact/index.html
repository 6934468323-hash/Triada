{ id:"es-n10", genre:"comedy", lvl:"B2", title:["La boda de mi prima","My cousin's wedding","งานแต่งของลูกพี่ลูกน้อง"], blurb:"เขาได้รับหน้าที่ดูแลแหวนแต่งงานในงานแต่งที่เซบียา และนกพิราบตัวหนึ่งก็มีแผนของมันเอง",
  p:[[["Mi prima Reyes me eligió para custodiar los anillos de su boda, una responsabilidad que acepté con la solemnidad de un notario.","My cousin Reyes chose me to guard the rings at her wedding, a responsibility I accepted with the solemnity of a notary.","เรเยส ลูกพี่ลูกน้องของผม เลือกให้ผมดูแลแหวนแต่งงาน ผมรับหน้าที่นี้อย่างจริงจังราวกับเป็นนักกฎหมาย"],
      ["Los guardé en una cajita de terciopelo, la cajita en el bolsillo interior de la chaqueta, y la chaqueta no me la quité en todo el día, a pesar de los treinta y ocho grados de Sevilla en junio.","I kept them in a little velvet box, the box in my jacket's inside pocket, and I didn't take the jacket off all day, despite Seville's thirty-eight degrees in June.","ผมเก็บแหวนไว้ในกล่องกำมะหยี่ใบเล็ก กล่องอยู่ในกระเป๋าด้านในเสื้อสูท และผมไม่ถอดสูทเลยทั้งวัน ทั้งที่เซบียาเดือนมิถุนายนร้อนสามสิบแปดองศา"]],
     [["Todo iba a la perfección hasta que, en el patio de la iglesia, el fotógrafo nos pidió una foto «espontánea» con palomas.","Everything was going perfectly until, in the church courtyard, the photographer asked us for a 'spontaneous' photo with pigeons.","ทุกอย่างราบรื่นสมบูรณ์แบบ จนกระทั่งที่ลานโบสถ์ ช่างภาพขอให้เราถ่ายรูป “แบบเป็นธรรมชาติ” กับนกพิราบ"],
      ["Me agaché para echarles migas y la cajita, traicionera, se deslizó del bolsillo.","I crouched down to throw them crumbs and the box, treacherously, slipped out of my pocket.","ผมย่อตัวลงโปรยเศษขนมปัง แล้วกล่องแหวนก็เลื่อนหลุดออกจากกระเป๋าอย่างทรยศ"],
      ["Una paloma especialmente robusta, convencida de que el terciopelo era comestible, la agarró con el pico y echó a volar hacia el campanario.","An especially sturdy pigeon, convinced the velvet was edible, grabbed it in its beak and took off towards the bell tower.","นกพิราบตัวอ้วนท้วนเป็นพิเศษเชื่อว่ากำมะหยี่กินได้ จึงคาบกล่องแล้วบินขึ้นไปทางหอระฆัง"]],
     [["Lo que siguió quedará para siempre en los anales de la familia: el sacristán subiendo los peldaños de tres en tres, mi tía rezando a san Antonio, patrón de las cosas perdidas, y yo, sudando dentro de la chaqueta, negociando con un ave.","What followed will remain forever in the family annals: the sacristan climbing the steps three at a time, my aunt praying to Saint Anthony, patron of lost things, and me, sweating inside my jacket, negotiating with a bird.","สิ่งที่ตามมาจะถูกจารึกไว้ในตำนานครอบครัวตลอดไป ผู้ดูแลโบสถ์วิ่งขึ้นบันไดทีละสามขั้น ป้าของผมสวดอ้อนวอนนักบุญอันโตนี ผู้คุ้มครองของหาย และผมที่เหงื่อท่วมอยู่ในสูท กำลังต่อรองกับนก"],
      ["La paloma, finalmente, soltó la caja sobre el tejado, por pura indiferencia.","The pigeon finally dropped the box onto the roof, out of sheer indifference.","สุดท้ายนกพิราบก็ปล่อยกล่องลงบนหลังคา ด้วยความไม่แยแสล้วนๆ"]],
     "* * *",
     [["La ceremonia empezó con cuarenta minutos de retraso.","The ceremony started forty minutes late.","พิธีเริ่มช้าไปสี่สิบนาที"],
      ["Cuando llegó el momento de los anillos, el cura me miró con una ceja levantada y el templo entero contuvo la respiración.","When the time for the rings came, the priest looked at me with one eyebrow raised and the whole church held its breath.","เมื่อถึงเวลาสวมแหวน บาทหลวงมองผมพร้อมเลิกคิ้วข้างหนึ่ง และทั้งโบสถ์ก็กลั้นหายใจ"],
      ["Los saqué intactos, aunque ligeramente cubiertos de plumas, y la carcajada fue tan unánime que hasta la novia lloró de risa.","I took them out intact, though slightly covered in feathers, and the burst of laughter was so unanimous that even the bride cried with laughter.","ผมหยิบแหวนออกมาอย่างปลอดภัย แม้จะมีขนนกติดอยู่บ้าง เสียงหัวเราะดังพร้อมกันทั้งโบสถ์ จนเจ้าสาวหัวเราะจนน้ำตาไหล"],
      ["Desde entonces, en cada boda familiar, alguien me pregunta si he traído las alas.","Since then, at every family wedding, someone asks me if I've brought my wings.","ตั้งแต่นั้นมา ในงานแต่งของครอบครัวทุกครั้ง จะมีคนถามผมว่าเอาปีกมาด้วยหรือเปล่า"]]],

{ id:"es-n11", genre:"fantasy", lvl:"C1", title:["El cartógrafo de los sueños","The cartographer of dreams","นักทำแผนที่แห่งความฝัน"], blurb:"ในเมืองที่ผู้คนสูญเสียความฝัน มีชายชราคนหนึ่งที่ทำแผนที่ของฝันที่ถูกลืม",
  p:[[["En Valdeluna, una mañana de otoño, la gente se despertó sin haber soñado, y lo mismo ocurrió la noche siguiente, y la otra.","In Valdeluna, one autumn morning, people woke up without having dreamed, and the same thing happened the following night, and the next.","ที่เมืองบัลเดลูนา เช้าวันหนึ่งในฤดูใบไม้ร่วง ผู้คนตื่นขึ้นโดยไม่ได้ฝัน และคืนถัดมาก็เป็นเช่นนั้น คืนต่อไปก็เช่นกัน"],
      ["Al principio nadie le dio importancia; después, los poetas dejaron de escribir, los niños dejaron de inventar juegos y los enamorados descubrieron que ya no sabían qué decirse.","At first nobody paid any attention; later, poets stopped writing, children stopped inventing games and lovers discovered that they no longer knew what to say to each other.","ตอนแรกไม่มีใครใส่ใจ แต่ต่อมากวีเลิกเขียน เด็กๆ เลิกคิดเกม และคู่รักพบว่าไม่รู้จะพูดอะไรกันอีกแล้ว"]],
     [["Fue la niña Alba quien recordó al viejo cartógrafo que vivía en la torre del reloj, al que todos consideraban un excéntrico inofensivo.","It was the girl Alba who remembered the old cartographer who lived in the clock tower, whom everyone considered a harmless eccentric.","เด็กหญิงอัลบาเป็นคนนึกถึงนักทำแผนที่ชราที่อาศัยอยู่บนหอนาฬิกา ซึ่งทุกคนมองว่าเป็นคนประหลาดที่ไม่มีพิษภัย"],
      ["En su taller, entre brújulas oxidadas y mapas de costas inexistentes, el anciano desplegó un pergamino inmenso cubierto de ríos de tinta azul.","In his workshop, among rusty compasses and maps of non-existent coasts, the old man unrolled an immense parchment covered in rivers of blue ink.","ในห้องทำงานของเขา ท่ามกลางเข็มทิศขึ้นสนิมและแผนที่ชายฝั่งที่ไม่มีอยู่จริง ชายชราคลี่แผ่นหนังขนาดมหึมาที่เต็มไปด้วยแม่น้ำหมึกสีน้ำเงิน"],
      ["«Los sueños también tienen geografía», explicó, «y alguien ha desviado su cauce.»","'Dreams also have a geography,' he explained, 'and someone has diverted their course.'","“ความฝันก็มีภูมิศาสตร์เหมือนกัน” เขาอธิบาย “และมีใครบางคนเบี่ยงทางน้ำของมัน”"]],
     [["Siguiendo el mapa, Alba y el cartógrafo descubrieron que los sueños de la ciudad desembocaban ahora en una sola casa: la del alcalde, que, temeroso de perder las elecciones, había querido soñar por todos.","Following the map, Alba and the cartographer discovered that the city's dreams now flowed into a single house: the mayor's, who, fearful of losing the election, had wanted to dream for everyone.","เมื่อทำตามแผนที่ อัลบาและนักทำแผนที่ค้นพบว่าความฝันของเมืองไหลไปรวมอยู่ที่บ้านหลังเดียว คือบ้านของนายกเทศมนตรี ซึ่งกลัวแพ้การเลือกตั้งจนอยากฝันแทนทุกคน"],
      ["Lo encontraron extenuado, con los ojos enrojecidos, incapaz de soportar la marea de anhelos ajenos que lo inundaba cada noche.","They found him exhausted, his eyes red, unable to bear the tide of other people's longings that flooded him every night.","พวกเขาพบเขาในสภาพหมดแรง ตาแดงก่ำ ทนรับกระแสความปรารถนาของผู้อื่นที่ท่วมท้นเขาทุกคืนไม่ไหวอีกต่อไป"]],
     "* * *",
     [["Bastó con que el anciano trazara una nueva línea en el pergamino para que los sueños regresaran, cada uno a su almohada.","All it took was for the old man to draw a new line on the parchment for the dreams to return, each to its own pillow.","เพียงชายชราขีดเส้นใหม่บนแผ่นหนัง ความฝันก็กลับคืนสู่หมอนของแต่ละคน"],
      ["El alcalde perdió las elecciones, pero aquella primera noche durmió como un niño y soñó, por fin, únicamente con lo suyo.","The mayor lost the election, but that first night he slept like a child and dreamed, at last, only of his own things.","นายกเทศมนตรีแพ้การเลือกตั้ง แต่คืนแรกนั้นเขาหลับเหมือนเด็ก และในที่สุดก็ได้ฝันถึงเรื่องของตัวเองเพียงอย่างเดียว"],

{ id:"es-n12", genre:"mystery", lvl:"C1", title:["El último tren de Canfranc","The last train from Canfranc","รถไฟขบวนสุดท้ายจากกันฟรังก์"], blurb:"ในสถานีรถไฟร้างบนเทือกเขาพิเรนีส นักประวัติศาสตร์พบกระเป๋าเดินทางที่ถูกลืมมาตั้งแต่ยุคสงคราม",
  p:[[["La estación internacional de Canfranc, en el Pirineo aragonés, fue en su día uno de los edificios ferroviarios más grandes de Europa, y durante décadas no fue más que un esqueleto majestuoso.","Canfranc International Station, in the Aragonese Pyrenees, was once one of the largest railway buildings in Europe, and for decades it was nothing more than a majestic skeleton.","สถานีนานาชาติกันฟรังก์ในเทือกเขาพิเรนีสแคว้นอารากอน เคยเป็นหนึ่งในอาคารสถานีรถไฟที่ใหญ่ที่สุดในยุโรป และเป็นเพียงโครงร่างอันสง่างามที่ร้างผู้คนมาหลายทศวรรษ"],
      ["Allí llegó la historiadora Irene Lasarte, contratada para catalogar los documentos hallados durante la restauración.","There arrived the historian Irene Lasarte, hired to catalogue the documents found during the restoration.","นักประวัติศาสตร์อิเรเน ลาซาร์เต เดินทางมาที่นี่ เธอได้รับการว่าจ้างให้จัดทำบัญชีเอกสารที่พบระหว่างการบูรณะ"]],
     [["Entre facturas aduaneras y horarios amarillentos, encontró una maleta de cuero con una etiqueta escrita a mano: «Para Sophie, si algún día vuelve».","Among customs invoices and yellowed timetables, she found a leather suitcase with a handwritten label: 'For Sophie, if she ever comes back'.","ท่ามกลางใบศุลกากรและตารางรถไฟที่เหลืองซีด เธอพบกระเป๋าหนังใบหนึ่ง ติดป้ายลายมือว่า “ถึงโซฟี หากวันใดเธอกลับมา”"],
      ["Dentro había un pasaporte francés de 1943, un billete de tren sin usar hasta Lisboa y una partitura de piano con anotaciones en los márgenes que no parecían musicales.","Inside there was a French passport from 1943, an unused train ticket to Lisbon and a piano score with notes in the margins that didn't look musical.","ข้างในมีหนังสือเดินทางฝรั่งเศสปี 1943 ตั๋วรถไฟไปลิสบอนที่ยังไม่ได้ใช้ และโน้ตเปียโนที่มีบันทึกริมกระดาษซึ่งดูไม่เหมือนสัญลักษณ์ดนตรี"]],
     [["Irene tardó tres semanas en comprender que las anotaciones eran un código: la partitura era un mapa del paso fronterizo por el que un jefe de estación había ayudado a huir a decenas de perseguidos.","Irene took three weeks to understand that the annotations were a code: the score was a map of the border crossing through which a stationmaster had helped dozens of persecuted people escape.","อิเรเนใช้เวลาสามสัปดาห์กว่าจะเข้าใจว่าบันทึกเหล่านั้นคือรหัส โน้ตเพลงคือแผนที่ช่องทางข้ามพรมแดนที่นายสถานีคนหนึ่งใช้ช่วยผู้ถูกไล่ล่าหลายสิบคนหลบหนี"],
      ["Sophie había sido una de ellas; nunca subió al tren de Lisboa.","Sophie had been one of them; she never boarded the Lisbon train.","โซฟีเคยเป็นหนึ่งในนั้น แต่เธอไม่เคยได้ขึ้นรถไฟไปลิสบอน"],
      ["Siguiendo su rastro en archivos de tres países, Irene descubrió que había sobrevivido, que se había quedado escondida en un pueblo del valle y que había muerto en 1998, a pocos kilómetros de la estación.","Following her trail in archives in three countries, Irene discovered that she had survived, that she had stayed hidden in a village in the valley and had died in 1998, a few kilometres from the station.","เมื่อตามรอยในหอจดหมายเหตุของสามประเทศ อิเรเนพบว่าโซฟีรอดชีวิต ซ่อนตัวอยู่ในหมู่บ้านแห่งหนึ่งในหุบเขา และเสียชีวิตในปี 1998 ห่างจากสถานีเพียงไม่กี่กิโลเมตร"]],
     "* * *",
     [["La nieta de Sophie, una mujer de pelo cano que regentaba la panadería del pueblo, abrió la maleta en silencio.","Sophie's granddaughter, a grey-haired woman who ran the village bakery, opened the suitcase in silence.","หลานสาวของโซฟี หญิงผมขาวที่เป็นเจ้าของร้านขนมปังในหมู่บ้าน เปิดกระเป๋าอย่างเงียบงัน"],
      ["Después se sentó al viejo piano del comedor, colocó la partitura y empezó a tocar.","Then she sat down at the old piano in the dining room, placed the score and began to play.","จากนั้นเธอนั่งลงที่เปียโนเก่าในห้องอาหาร วางโน้ตเพลง แล้วเริ่มบรรเลง"],
      ["«Mi abuela tarareaba esto cada noche», dijo, «y nunca supimos de dónde lo había sacado».","'My grandmother used to hum this every night,' she said, 'and we never knew where she'd got it from.'","“ยายเคยฮัมเพลงนี้ทุกคืน” เธอพูด “และเราไม่เคยรู้เลยว่ายายได้มันมาจากไหน”"]]],

  s:[["Wat mij aan het begrip 'gezellig' fascineert, is niet zozeer dat het onvertaalbaar zou zijn, maar dat het zo moeiteloos sociale normen in zich draagt.","What fascinates me about the concept of 'gezellig' is not so much that it's supposedly untranslatable, but that it so effortlessly carries social norms within it.","สิ่งที่ทำให้ผมทึ่งเกี่ยวกับคำว่า ‘gezellig’ ไม่ใช่ว่ามันแปลไม่ได้ แต่คือมันแฝงบรรทัดฐานทางสังคมไว้ในตัวได้อย่างง่ายดาย"],

      ["Ouders gingen de straat op en protesteerden.","Parents took to the streets and protested.","พ่อแม่จึงออกมาประท้วงบนถนน"]],
     [["Daarna bouwde de overheid duizenden kilometers aan veilige fietspaden.","After that the government built thousands of kilometres of safe cycle paths.","หลังจากนั้นรัฐบาลจึงสร้างทางจักรยานที่ปลอดภัยเป็นระยะทางหลายพันกิโลเมตร"],
      ["Vandaag is fietsen goedkoop, gezond en vaak sneller dan de auto in de stad.","Today cycling is cheap, healthy and often faster than the car in the city.","ทุกวันนี้การปั่นจักรยานทั้งประหยัด ดีต่อสุขภาพ และในเมืองมักเร็วกว่ารถยนต์"]]],

  q:[{t:"main",q:["Waar gaat de tekst vooral over?","บทความนี้พูดถึงอะไรเป็นหลัก"],o:["Over fietsen die gestolen worden.","Over de redenen waarom fietsen in Nederland zo populair is.","Over de geschiedenis van de auto.","Over de markt in Amsterdam."],a:1,x:"บทความอธิบายเหตุผลหลายข้อ (พื้นที่ราบ, การประท้วงในยุค 70, ทางจักรยาน) ว่าทำไมคนดัตช์ปั่นจักรยานมาก"},
     {t:"detail",q:["Wat gebeurde er in de jaren zeventig?","เกิดอะไรขึ้นในทศวรรษ 1970"],o:["Er kwamen meer fietsen dan mensen.","Veel kinderen stierven in het verkeer en ouders protesteerden.","De overheid verbood auto's.","Het land werd vlak."],a:1,x:"“veel kinderen kwamen om het leven. Ouders gingen de straat op en protesteerden.” — om het leven komen = เสียชีวิต"},
     {t:"not",q:["Wat staat NIET in de tekst?","ข้อใดไม่มีในบทความ"],o:["Nederland heeft ongeveer 23 miljoen fietsen.","Fietsen is in de stad vaak sneller dan de auto.","Auto's zijn in Nederland verboden.","Het land is vlak."],a:2,x:"บทความไม่ได้พูดว่ารถยนต์ถูกห้าม แค่บอกว่าจักรยานมักเร็วกว่ารถในเมือง"},
     {t:"infer",q:["Wat bedoelt de schrijver met 'Maar dat is niet de enige reden'?","ผู้เขียนหมายถึงอะไรเมื่อเขียนว่า ‘แต่นั่นไม่ใช่เหตุผลเดียว’"],o:["Dat het land eigenlijk niet vlak is.","Dat er ook politieke en historische redenen zijn.","Dat fietsen duur is.","Dat niemand meer fietst."],a:1,x:"ประโยคนี้เป็นตัวเชื่อมไปสู่เหตุผลทางประวัติศาสตร์/การเมือง คือการประท้วงและการลงทุนของรัฐ"},
     {t:"title",q:["Welke titel past ook goed bij de tekst?","ชื่อเรื่องใดเหมาะกับบทความนี้ด้วย"],o:["Van protest naar fietspad","De beste auto's van Europa","Een dag op de markt","Waarom Nederlanders niet sporten"],a:0,x:"บทความเล่าว่าการประท้วงนำไปสู่การสร้างทางจักรยาน “จากการประท้วงสู่ทางจักรยาน” จึงสรุปแก่นได้ดี"}]},
{ id:"nl-r2", cat:"env", lvl:"B2", src:"สิ่งแวดล้อม", title:["Leven onder de zeespiegel","Living below sea level","ใช้ชีวิตใต้ระดับน้ำทะเล"],
  p:[[["Ongeveer een kwart van Nederland ligt onder de zeespiegel, en zonder dijken, duinen en gemalen zou ruim de helft van het land regelmatig onderlopen.","About a quarter of the Netherlands lies below sea level, and without dikes, dunes and pumping stations well over half the country would regularly flood.","ราวหนึ่งในสี่ของเนเธอร์แลนด์อยู่ต่ำกว่าระดับน้ำทะเล และหากไม่มีเขื่อน เนินทราย และสถานีสูบน้ำ ประเทศกว่าครึ่งจะถูกน้ำท่วมเป็นประจำ"],
      ["De strijd tegen het water is daardoor diep verankerd in de nationale identiteit.","The struggle against water is therefore deeply anchored in the national identity.","การต่อสู้กับน้ำจึงฝังรากลึกในอัตลักษณ์ของชาติ"]],
     [["Na de watersnoodramp van 1953, waarbij meer dan achttienhonderd mensen omkwamen, begon het land aan de Deltawerken: een reeks dammen en stormvloedkeringen die tot de grootste waterbouwkundige projecten ter wereld behoren.","After the flood disaster of 1953, in which more than eighteen hundred people died, the country began the Delta Works: a series of dams and storm surge barriers that rank among the largest hydraulic engineering projects in the world.","หลังมหาอุทกภัยปี 1953 ซึ่งมีผู้เสียชีวิตกว่าหนึ่งพันแปดร้อยคน ประเทศได้เริ่มโครงการเดลตาเวิร์กส์ ซึ่งเป็นชุดเขื่อนและประตูกั้นคลื่นพายุที่จัดอยู่ในกลุ่มโครงการวิศวกรรมชลศาสตร์ที่ใหญ่ที่สุดในโลก"],
      ["Lange tijd was de filosofie eenvoudig: hoger en sterker bouwen.","For a long time the philosophy was simple: build higher and stronger.","เป็นเวลานานที่หลักคิดนั้นเรียบง่าย คือสร้างให้สูงขึ้นและแข็งแรงขึ้น"]],
     [["Sinds de jaren negentig is die aanpak echter gekanteld.","Since the nineties, however, that approach has shifted.","อย่างไรก็ตาม ตั้งแต่ทศวรรษ 1990 แนวทางนั้นได้พลิกเปลี่ยนไป"],
      ["Onder het motto 'Ruimte voor de Rivier' werden dijken op sommige plekken juist landinwaarts verlegd, zodat rivieren bij hoogwater veilig kunnen uitstromen over weilanden in plaats van door woonwijken.","Under the motto 'Room for the River', dikes were in some places actually moved inland, so that rivers can safely overflow onto meadows instead of through residential areas during high water.","ภายใต้คำขวัญ ‘พื้นที่ให้แม่น้ำ’ เขื่อนบางแห่งกลับถูกย้ายถอยเข้าไปในแผ่นดิน เพื่อให้แม่น้ำล้นออกไปยังทุ่งหญ้าอย่างปลอดภัยเมื่อน้ำขึ้นสูง แทนที่จะไหลผ่านย่านที่อยู่อาศัย"],
      ["Het idee is niet langer het water te bevechten, maar het een plek te geven.","The idea is no longer to fight the water, but to give it a place.","แนวคิดไม่ใช่การต่อสู้กับน้ำอีกต่อไป แต่คือการให้พื้นที่แก่มัน"]],
     [["Met een stijgende zeespiegel en heviger regenval staat dat model opnieuw onder druk.","With a rising sea level and heavier rainfall, that model is once again under pressure.","เมื่อระดับน้ำทะเลสูงขึ้นและฝนตกหนักขึ้น โมเดลนี้ก็ถูกกดดันอีกครั้ง"],
      ["Sommige experts pleiten al voor drijvende wijken, andere waarschuwen dat ook Nederlands vernuft grenzen kent.","Some experts are already advocating floating neighbourhoods, others warn that Dutch ingenuity also has its limits.","ผู้เชี่ยวชาญบางคนเริ่มเสนอให้สร้างชุมชนลอยน้ำ ขณะที่บางคนเตือนว่าความเฉลียวฉลาดของชาวดัตช์ก็มีขีดจำกัดเช่นกัน"]]],
  v:{"kwart":"B1|n|quarter|หนึ่งในสี่","ligt":"A2|v|lies|ตั้งอยู่|liggen","zeespiegel":"B2|n|sea level|ระดับน้ำทะเล","dijken":"B2|n|dikes|เขื่อน, คันกั้นน้ำ|dijk","gemalen":"C1|n|pumping stations|สถานีสูบน้ำ|gemaal","ruim":"B2|adv|well over|มากกว่า…พอสมควร","helft":"B1|n|half|ครึ่ง","regelmatig":"B1|adv|regularly|เป็นประจำ","onderlopen":"C1|v|to flood|ถูกน้ำท่วม","strijd":"B2|n|struggle, fight|การต่อสู้","daardoor":"B1|adv|because of that|ด้วยเหตุนั้น","verankerd":"C1|adj|anchored|ฝังราก|verankeren","nationale":"B1|adj|national|แห่งชาติ|nationaal","identiteit":"B2|n|identity|อัตลักษณ์","watersnoodramp":"C1|n|flood disaster|มหาอุทกภัย","waarbij":"B2|adv|in which|ซึ่งในนั้น","omkwamen":"B2|v|died, perished|เสียชีวิต|omkomen","deltawerken":"C1|n|Delta Works|โครงการเดลตาเวิร์กส์","reeks":"B2|n|series|ชุด, ลำดับ","dammen":"B1|n|dams|เขื่อน|dam","stormvloedkeringen":"C2|n|storm surge barriers|ประตูกั้นคลื่นพายุ|stormvloedkering","waterbouwkundige":"C2|adj|hydraulic engineering|ด้านวิศวกรรมชลศาสตร์|waterbouwkundig","behoren":"B2|v|to belong, rank among|จัดอยู่ใน","filosofie":"B2|n|philosophy|ปรัชญา, หลักคิด","eenvoudig":"B1|adj|simple|เรียบง่าย","aanpak":"B2|n|approach|แนวทาง","echter":"B2|adv|however|อย่างไรก็ตาม","gekanteld":"C1|v|tilted, shifted|พลิก, เปลี่ยน|kantelen","ruimte":"B1|n|space, room|พื้นที่","rivier":"A2|n|river|แม่น้ำ","plekken":"B1|n|places|สถานที่|plek","landinwaarts":"C1|adv|inland|เข้าไปในแผ่นดิน","verlegd":"C1|v|moved, relocated|ย้าย|verleggen","zodat":"B1|conj|so that|เพื่อที่จะ","hoogwater":"B2|n|high water|น้ำขึ้นสูง","uitstromen":"C1|v|to flow out|ไหลออก","weilanden":"B2|n|meadows|ทุ่งหญ้า|weiland","in plaats van":"B1|expr|instead of|แทนที่จะ","woonwijken":"B2|n|residential areas|ย่านที่อยู่อาศัย|woonwijk","niet langer":"B2|expr|no longer|ไม่…อีกต่อไป","bevechten":"C1|v|to fight against|ต่อสู้กับ","stijgende":"B2|adj|rising|ที่สูงขึ้น|stijgen","heviger":"B2|adj|heavier, more intense|รุนแรงกว่า|hevig","regenval":"B2|n|rainfall|ปริมาณฝน","onder druk":"B2|expr|under pressure|อยู่ภายใต้แรงกดดัน","pleiten":"C1|v|to advocate|สนับสนุน, เรียกร้อง","drijvende":"B2|adj|floating|ลอยน้ำ|drijven","wijken":"B1|n|neighbourhoods|ย่าน|wijk","waarschuwen":"B1|v|to warn|เตือน","vernuft":"C2|n|ingenuity|ความเฉลียวฉลาด","grenzen":"B1|n|limits, borders|ขีดจำกัด, พรมแดน|grens"},
  q:[{t:"main",q:["Wat is de kern van de tekst?","แก่นของบทความคืออะไร"],o:["Nederland heeft het water definitief overwonnen.","De Nederlandse omgang met water is geëvolueerd van bevechten naar ruimte geven, en staat opnieuw voor uitdagingen.","Drijvende wijken zijn de enige oplossing.","De ramp van 1953 had weinig gevolgen."],a:1,x:"โครงเรื่อง: ต่อสู้กับน้ำ → 1953 และเดลตาเวิร์กส์ → เปลี่ยนเป็น ‘ให้พื้นที่แม่น้ำ’ → แรงกดดันใหม่ ข้อ B ครอบคลุมทั้งหมด"},
     {t:"detail",q:["Wat houdt 'Ruimte voor de Rivier' in?","‘Ruimte voor de Rivier’ หมายถึงอะไร"],o:["Hogere dijken langs alle rivieren.","Rivieren de mogelijkheid geven om veilig buiten hun bedding te treden, bijvoorbeeld over weilanden.","Woonwijken bouwen in rivieren.","Rivieren laten opdrogen."],a:1,x:"เขื่อนถูกย้ายเข้าไปในแผ่นดินเพื่อให้น้ำล้นไปที่ทุ่งหญ้าแทนย่านที่อยู่อาศัย"},
     {t:"vocab",q:["'Die aanpak is gekanteld' betekent in deze context dat…","‘Die aanpak is gekanteld’ ในบริบทนี้หมายความว่า…"],o:["de aanpak is mislukt.","de aanpak fundamenteel is veranderd.","de aanpak hetzelfde is gebleven.","de dijken zijn omgevallen."],a:1,x:"kantelen แปลตรงตัวว่า ‘พลิก/เอียง’ ใช้เชิงเปรียบเทียบว่าแนวคิดเปลี่ยนไปอย่างมีนัยสำคัญ ประโยคถัดมาให้ตัวอย่างการเปลี่ยน"},
     {t:"not",q:["Welke bewering is in strijd met de tekst?","ข้อใดขัดแย้งกับบทความ"],o:["Zonder bescherming zou meer dan de helft van het land regelmatig overstromen.","Bij de ramp van 1953 kwamen ruim 1800 mensen om.","Alle experts zijn het eens dat drijvende wijken de toekomst zijn.","Klimaatverandering zet het huidige model onder druk."],a:2,x:"บทความบอกว่า ‘sommige experts… andere waarschuwen’ แปลว่าผู้เชี่ยวชาญเห็นไม่ตรงกัน ข้อ C จึงขัดแย้ง"},
     {t:"tone",q:["Welke houding neemt de auteur aan in de laatste alinea?","ผู้เขียนมีท่าทีอย่างไรในย่อหน้าสุดท้าย"],o:["Triomfantelijk.","Genuanceerd: hij presenteert verschillende standpunten zonder een definitief oordeel.","Volledig pessimistisch.","Spottend."],a:1,x:"ผู้เขียนเสนอทั้งฝ่ายที่สนับสนุนชุมชนลอยน้ำและฝ่ายที่เตือน โดยไม่ตัดสินเอง จึงเป็นท่าทีที่ชั่งน้ำหนัก"}]},
{ id:"nl-r3", cat:"health", lvl:"B1", src:"สุขภาพ/สังคม", title:["Eenzaamheid: niet alleen een probleem van ouderen","Loneliness: not just a problem of the elderly","ความเหงา: ไม่ใช่ปัญหาของผู้สูงอายุเท่านั้น"],
  p:[[["Als we aan eenzaamheid denken, zien we vaak een oudere vrouw die alleen thuis zit.","When we think of loneliness, we often picture an older woman sitting alone at home.","เมื่อนึกถึงความเหงา เรามักนึกภาพหญิงสูงอายุนั่งอยู่บ้านคนเดียว"],
      ["Toch blijkt uit onderzoek dat jongeren tussen de achttien en vijfentwintig zich minstens zo vaak eenzaam voelen.","Yet research shows that young people between eighteen and twenty-five feel lonely at least as often.","แต่ผลวิจัยชี้ว่าคนหนุ่มสาวอายุสิบแปดถึงยี่สิบห้าปีรู้สึกเหงาบ่อยไม่แพ้กัน"]],
     [["Dat lijkt vreemd, want jongeren hebben vaak honderden contacten op sociale media.","That seems strange, because young people often have hundreds of contacts on social media.","ดูแปลก เพราะคนหนุ่มสาวมักมีคนติดต่อในโซเชียลมีเดียเป็นร้อยๆ"],
      ["Maar eenzaamheid gaat niet over het aantal mensen om je heen; het gaat over het gevoel dat niemand je echt begrijpt.","But loneliness isn't about the number of people around you; it's about the feeling that nobody really understands you.","แต่ความเหงาไม่ได้เกี่ยวกับจำนวนคนรอบตัว มันเกี่ยวกับความรู้สึกว่าไม่มีใครเข้าใจเราจริงๆ"],
      ["Je kunt je dus eenzaam voelen in een volle collegezaal.","So you can feel lonely in a full lecture hall.","เราจึงรู้สึกเหงาได้แม้ในห้องบรรยายที่เต็มไปด้วยผู้คน"]],
     [["Langdurige eenzaamheid is slecht voor de gezondheid: het verhoogt het risico op depressie, slaapproblemen en zelfs hartziekten.","Long-term loneliness is bad for health: it increases the risk of depression, sleep problems and even heart disease.","ความเหงาเรื้อรังไม่ดีต่อสุขภาพ เพิ่มความเสี่ยงต่อภาวะซึมเศร้า ปัญหาการนอน และแม้แต่โรคหัวใจ"],
      ["Psychologen raden aan om klein te beginnen: een vast moment per week met één vriend, of vrijwilligerswerk, waarbij je samen iets doet in plaats van alleen te praten.","Psychologists recommend starting small: a fixed moment each week with one friend, or volunteer work, where you do something together instead of only talking.","นักจิตวิทยาแนะนำให้เริ่มจากสิ่งเล็กๆ เช่น นัดเพื่อนหนึ่งคนเป็นประจำทุกสัปดาห์ หรือทำงานอาสาสมัครที่ได้ทำอะไรด้วยกัน แทนที่จะแค่คุยกัน"]]],

  q:[{t:"main",q:["Wat is de belangrijkste boodschap van de tekst?","สารสำคัญที่สุดของบทความคืออะไร"],o:["Sociale media maken iedereen eenzaam.","Eenzaamheid komt in alle leeftijden voor en hangt af van de kwaliteit van contact, niet van het aantal.","Ouderen zijn nooit eenzaam.","Je moet meer vrienden op sociale media zoeken."],a:1,x:"บทความชี้ว่าเด็กหนุ่มสาวก็เหงา และ ‘ความเหงาไม่ใช่เรื่องจำนวนคน แต่เป็นความรู้สึกว่าไม่มีใครเข้าใจ’ ข้อ A เกินจริงจากที่บทความกล่าว"},
     {t:"detail",q:["Welke leeftijdsgroep voelt zich volgens onderzoek minstens zo vaak eenzaam als ouderen?","ตามผลวิจัย กลุ่มอายุใดรู้สึกเหงาบ่อยไม่แพ้ผู้สูงอายุ"],o:["Kinderen onder de twaalf.","Jongeren tussen 18 en 25.","Mensen van 40 tot 50.","Gepensioneerden."],a:1,x:"“jongeren tussen de achttien en vijfentwintig zich minstens zo vaak eenzaam voelen”"},
     {t:"infer",q:["Waarom noemt de schrijver 'een volle collegezaal'?","ทำไมผู้เขียนยกตัวอย่าง ‘ห้องบรรยายที่เต็มไปด้วยคน’"],o:["Om te laten zien dat studeren saai is.","Om te illustreren dat je tussen veel mensen toch eenzaam kunt zijn.","Omdat collegezalen te klein zijn.","Om studenten te bekritiseren."],a:1,x:"เป็นตัวอย่างสนับสนุนประโยคก่อนหน้าว่าความเหงาไม่ขึ้นกับจำนวนคนรอบตัว"},
     {t:"not",q:["Wat noemt de tekst NIET als gevolg van langdurige eenzaamheid?","ข้อใดบทความไม่ได้กล่าวว่าเป็นผลของความเหงาเรื้อรัง"],o:["Depressie.","Slaapproblemen.","Hartziekten.","Overgewicht."],a:3,x:"บทความระบุ depressie, slaapproblemen, hartziekten แต่ไม่ได้พูดถึงน้ำหนักเกิน (overgewicht)"},
     {t:"detail",q:["Wat raden psychologen aan?","นักจิตวิทยาแนะนำอะไร"],o:["Meteen veel nieuwe mensen ontmoeten.","Klein beginnen, bijvoorbeeld met een vaste afspraak of samen iets doen.","Sociale media volledig stoppen.","Alleen praten over problemen."],a:1,x:"“klein te beginnen: een vast moment per week… of vrijwilligerswerk, waarbij je samen iets doet in plaats van alleen te praten” ข้อ D กลับด้านกับคำแนะนำ"}]}

novel: [
{ id:"nl-n1", genre:"fantasy", lvl:"B2", title:["De kaartenmaker van Drijfstad","The mapmaker of Drijfstad","ช่างทำแผนที่แห่งเมืองลอยน้ำ"], blurb:"ในเมืองที่ลอยไปตามกระแสน้ำ แผนที่ไม่ได้บอกว่าเราอยู่ที่ไหน แต่บอกว่าเราจะไปอยู่ที่ไหน",
  p:[[["In Drijfstad lag niets ooit twee nachten op dezelfde plek.","In Drijfstad nothing ever lay in the same place for two nights.","ในเมืองดไรฟ์สตัด ไม่มีสิ่งใดอยู่ที่เดิมได้นานถึงสองคืน"],
      ["De huizen rustten op reusachtige vlotten van zwart eikenhout, en elke nacht verschoof de stroming de straten een beetje, zodat de bakker soms naast de haven wakker werd en de burgemeester naast de vismarkt.","The houses rested on gigantic rafts of black oak, and every night the current shifted the streets a little, so that the baker sometimes woke up next to the harbour and the mayor next to the fish market.","บ้านเรือนตั้งอยู่บนแพยักษ์ทำจากไม้โอ๊กสีดำ และทุกคืนกระแสน้ำจะเลื่อนถนนไปเล็กน้อย บางครั้งคนทำขนมปังตื่นมาพบว่าอยู่ข้างท่าเรือ และนายกเทศมนตรีอยู่ข้างตลาดปลา"],
      ["Daarom was Mira de Wit de belangrijkste persoon van de stad, hoewel bijna niemand haar naam kende.","That is why Mira de Wit was the most important person in the city, although almost nobody knew her name.","ด้วยเหตุนี้ มีรา เดอ วิตจึงเป็นบุคคลสำคัญที่สุดของเมือง แม้แทบไม่มีใครรู้จักชื่อเธอ"]],
     [["Mira tekende kaarten.","Mira drew maps.","มีราวาดแผนที่"],
      ["Niet van hoe de stad eruitzag, want dat had geen zin, maar van hoe de stad er morgen uit zou zien.","Not of what the city looked like, because that was pointless, but of what the city would look like tomorrow.","ไม่ใช่แผนที่ว่าเมืองหน้าตาเป็นอย่างไร เพราะไร้ประโยชน์ แต่เป็นแผนที่ว่าพรุ่งนี้เมืองจะเป็นอย่างไร"],
      ["Ze luisterde 's avonds naar het kraken van de touwen, voelde met haar blote voeten de richting van het water en liet haar pen het werk doen.","In the evening she listened to the creaking of the ropes, felt the direction of the water with her bare feet and let her pen do the work.","ยามเย็นเธอฟังเสียงเชือกเอี๊ยดอ๊าด ใช้เท้าเปล่าสัมผัสทิศทางของน้ำ แล้วปล่อยให้ปากกาทำงานเอง"],
      ["Haar kaarten hadden zich in veertig jaar nooit vergist.","In forty years, her maps had never been wrong.","ตลอดสี่สิบปี แผนที่ของเธอไม่เคยผิดพลาดเลย"]],
     [["Tot die ene dinsdag.","Until that one Tuesday.","จนกระทั่งวันอังคารวันนั้น"],
      ["Toen ze de inkt liet drogen, zag Mira dat er op haar kaart een straat stond die niet bestond: een smalle steeg, helemaal aan de rand, die eindigde in het open water.","As she let the ink dry, Mira saw that on her map there was a street that didn't exist: a narrow alley, right at the edge, that ended in open water.","ขณะปล่อยให้หมึกแห้ง มีราเห็นว่าบนแผนที่มีถนนสายหนึ่งที่ไม่มีอยู่จริง เป็นตรอกแคบๆ ที่ขอบสุดของเมือง ซึ่งไปสิ้นสุดที่น้ำเปิด"],
      ["Boven de steeg had haar hand, zonder dat ze het merkte, één woord geschreven: Thuis.","Above the alley her hand had, without her noticing, written a single word: Home.","เหนือตรอกนั้น มือของเธอเขียนคำหนึ่งไว้โดยไม่รู้ตัว: บ้าน"]],
     "* * *",
     [["De volgende ochtend was de steeg er.","The next morning, the alley was there.","เช้าวันต่อมา ตรอกนั้นก็ปรากฏขึ้นจริง"],
      ["Mira liep erheen in haar ochtendjas, terwijl de mist nog als natte wol tussen de huizen hing.","Mira walked there in her dressing gown, while the mist still hung like wet wool between the houses.","มีราเดินไปที่นั่นในชุดคลุมนอน ขณะที่หมอกยังลอยอยู่ระหว่างบ้านเรือนราวกับขนแกะเปียก"],
      ["Aan het einde, waar het vlot ophield, lag een klein bootje, en in het bootje zat een meisje met inkt aan haar vingers.","At the end, where the raft stopped, lay a small boat, and in the boat sat a girl with ink on her fingers.","ที่ปลายตรอกซึ่งแพสิ้นสุด มีเรือลำเล็กลอยอยู่ และในเรือมีเด็กหญิงคนหนึ่งนั่งอยู่ นิ้วมือเปื้อนหมึก"],
      ["'Ik heb de stad gisteren getekend,' zei het meisje verlegen, 'en ik wist niet waar ik anders heen moest.'","'I drew the city yesterday,' the girl said shyly, 'and I didn't know where else to go.'","“หนูวาดเมืองนี้เมื่อวาน” เด็กหญิงพูดอย่างเขินอาย “แล้วหนูก็ไม่รู้ว่าจะไปที่ไหนอีก”"]],
     [["Mira keek naar de kleine, trillende handen, en voor het eerst in veertig jaar begreep ze waarom haar kaarten nooit over haarzelf gingen.","Mira looked at the small, trembling hands, and for the first time in forty years she understood why her maps had never been about herself.","มีรามองมือเล็กๆ ที่สั่นเทา และเป็นครั้งแรกในรอบสี่สิบปีที่เธอเข้าใจว่าทำไมแผนที่ของเธอไม่เคยมีตัวเธอเองอยู่เลย"],
      ["Een kaartenmaker tekent de weg voor anderen, tot er iemand komt die de weg naar haar tekent.","A mapmaker draws the way for others, until someone comes who draws the way to her.","ช่างทำแผนที่วาดทางให้คนอื่น จนกว่าจะมีใครสักคนมาวาดทางกลับไปหาเธอ"]]],
  v:{"lag":"B1|v|lay|ตั้งอยู่, นอนอยู่|liggen","dezelfde":"A2|det|the same|เดียวกัน","plek":"B1|n|place|สถานที่","rustten":"B2|v|rested|วางอยู่, พัก|rusten","reusachtige":"C1|adj|gigantic|มหึมา|reusachtig","vlotten":"B2|n|rafts|แพ|vlot","eikenhout":"C1|n|oak wood|ไม้โอ๊ก","verschoof":"C1|v|shifted|เลื่อน|verschuiven","stroming":"B2|n|current|กระแสน้ำ","beetje":"A2|n|bit|นิดหน่อย","bakker":"A2|n|baker|คนทำขนมปัง","naast":"A2|prep|next to|ข้างๆ","haven":"B1|n|harbour|ท่าเรือ","wakker":"A2|adj|awake|ตื่น","burgemeester":"B1|n|mayor|นายกเทศมนตรี","vismarkt":"B1|n|fish market|ตลาดปลา","daarom":"A2|adv|therefore|ด้วยเหตุนั้น","belangrijkste":"B1|adj|most important|สำคัญที่สุด|belangrijk","hoewel":"B1|conj|although|แม้ว่า","kende":"A2|v|knew|รู้จัก|kennen","tekende":"B1|v|drew|วาด|tekenen","kaarten":"A2|n|maps; cards|แผนที่; การ์ด|kaart","eruitzag":"B2|v|looked like|มีหน้าตา|eruitzien","geen zin":"B2|expr|no point|ไม่มีประโยชน์","luisterde":"A2|v|listened|ฟัง|luisteren","kraken":"C1|n|creaking|เสียงเอี๊ยดอ๊าด","touwen":"B2|n|ropes|เชือก|touw","blote":"B2|adj|bare|เปลือย|bloot","voeten":"A1|n|feet|เท้า|voet","richting":"B1|n|direction|ทิศทาง","pen":"A1|n|pen|ปากกา","vergist":"B2|v|been mistaken|ผิดพลาด|zich vergissen","inkt":"B1|n|ink|หมึก","drogen":"B1|v|to dry|ทำให้แห้ง","bestond":"B1|v|existed|มีอยู่|bestaan","smalle":"B1|adj|narrow|แคบ|smal","steeg":"C1|n|alley|ตรอก","rand":"B2|n|edge|ขอบ","eindigde":"B1|v|ended|สิ้นสุด|eindigen","merkte":"B1|v|noticed|สังเกต|merken","ochtendjas":"C1|n|dressing gown|ชุดคลุมนอน","mist":"B1|n|mist, fog|หมอก","wol":"B2|n|wool|ขนแกะ","hing":"B1|v|hung|แขวน, ลอย|hangen","ophield":"B2|v|stopped, ended|หยุด, สิ้นสุด|ophouden","bootje":"A2|n|little boat|เรือเล็ก|boot","vingers":"A2|n|fingers|นิ้ว|vinger","verlegen":"B2|adj|shy|เขินอาย","trillende":"B2|adj|trembling|สั่นเทา|trillen","begreep":"B1|v|understood|เข้าใจ|begrijpen","haarzelf":"B2|pron|herself|ตัวเธอเอง"}},
{ id:"nl-n2", genre:"mystery", lvl:"B1", title:["Het zevende kopje","The seventh cup","ถ้วยใบที่เจ็ด"], blurb:"งานเลี้ยงวันเกิดหกคน แต่มีถ้วยชาเจ็ดใบบนโต๊ะ และไม่มีใครยอมรับว่าเป็นของตัวเอง",
  p:[[["Tante Wil werd negentig, en zoals elk jaar dronken we thee in haar donkere kamer aan de gracht.","Aunt Wil turned ninety, and as every year we drank tea in her dark room by the canal.","ป้าวิลอายุครบเก้าสิบปี และเหมือนทุกปี เราดื่มชากันในห้องมืดๆ ของป้าริมคลอง"],
      ["We waren met zes: tante Wil, mijn moeder, mijn twee neven, de buurvrouw en ik.","There were six of us: Aunt Wil, my mother, my two cousins, the neighbour and me.","เรามีกันหกคน: ป้าวิล แม่ของฉัน ลูกพี่ลูกน้องสองคน หญิงเพื่อนบ้าน และฉัน"],
      ["Toch stonden er zeven kopjes op tafel.","Yet there were seven cups on the table.","แต่บนโต๊ะกลับมีถ้วยชาเจ็ดใบ"]],
     [["Het zevende kopje stond bij de lege stoel bij het raam.","The seventh cup stood by the empty chair near the window.","ถ้วยใบที่เจ็ดวางอยู่ตรงเก้าอี้ว่างข้างหน้าต่าง"],
      ["Er zat thee in, nog warm, en op de rand zat een vage afdruk van rode lippenstift.","There was tea in it, still warm, and on the rim was a faint print of red lipstick.","ในถ้วยมีชาที่ยังอุ่นอยู่ และที่ขอบถ้วยมีรอยลิปสติกสีแดงจางๆ"],
      ["Niemand van ons droeg rode lippenstift.","None of us wore red lipstick.","ไม่มีใครในพวกเราทาลิปสติกสีแดง"]],
     [["'Dat is voor Hendrika,' zei tante Wil kalm, terwijl ze een koekje in haar thee doopte.","'That's for Hendrika,' Aunt Wil said calmly, while she dunked a biscuit in her tea.","“ถ้วยนั้นของเฮนดริกา” ป้าวิลพูดอย่างใจเย็น ขณะจุ่มคุกกี้ลงในชา"],
      ["Mijn moeder werd bleek.","My mother turned pale.","แม่ของฉันหน้าซีด"],
      ["Hendrika was tante Wils zus, en ze was in 1962 verdwenen, op de dag van haar eigen verjaardagsfeest.","Hendrika was Aunt Wil's sister, and she had disappeared in 1962, on the day of her own birthday party.","เฮนดริกาเป็นน้องสาวของป้าวิล และเธอหายตัวไปในปี 1962 ในวันงานเลี้ยงวันเกิดของตัวเอง"]],
     [["Ik besloot het raadsel op te lossen.","I decided to solve the mystery.","ฉันตัดสินใจไขปริศนานี้"],
      ["Terwijl de anderen over het weer praatten, bekeek ik de kamer zoals een detective dat zou doen.","While the others talked about the weather, I examined the room the way a detective would.","ระหว่างที่คนอื่นคุยเรื่องอากาศ ฉันสำรวจห้องอย่างที่นักสืบจะทำ"],
      ["Onder de lege stoel lag een oude sleutel, en achter het gordijn hing een jas die naar lavendel rook.","Under the empty chair lay an old key, and behind the curtain hung a coat that smelled of lavender.","ใต้เก้าอี้ว่างมีกุญแจเก่าวางอยู่ และหลังผ้าม่านมีเสื้อโค้ตที่มีกลิ่นลาเวนเดอร์แขวนอยู่"]],
     "* * *",
     [["Pas toen iedereen weg was, vertelde tante Wil me de waarheid.","Only when everyone had gone did Aunt Wil tell me the truth.","จนกระทั่งทุกคนกลับไปแล้ว ป้าวิลจึงเล่าความจริงให้ฉันฟัง"],
      ["Hendrika was niet verdwenen; ze was gevlucht, met een man die de familie niet goedkeurde.","Hendrika had not disappeared; she had run away, with a man the family did not approve of.","เฮนดริกาไม่ได้หายตัวไป แต่หนีไปกับผู้ชายที่ครอบครัวไม่ยอมรับ"],
      ["Elk jaar, op haar verjaardag, kwam ze terug via de achterdeur, dronk één kopje thee bij het raam en vertrok weer voordat iemand het merkte.","Every year, on her birthday, she came back through the back door, drank one cup of tea by the window and left again before anyone noticed.","ทุกปีในวันเกิดของเธอ เธอจะกลับมาทางประตูหลัง ดื่มชาหนึ่งถ้วยข้างหน้าต่าง แล้วจากไปก่อนที่ใครจะสังเกต"],

     ["Ik werk zelf vier dagen en geniet van mijn vrije woensdag, maar ik merk ook de keerzijde.","I work four days myself and enjoy my free Wednesday, but I also notice the downside.","ตัวฉันเองทำงานสี่วัน และมีความสุขกับวันพุธที่ได้หยุด แต่ก็เห็นด้านลบด้วย"],
     ["Vooral vrouwen werken in deeltijd, wat gevolgen heeft voor hun carrière en pensioen, terwijl ziekenhuizen en scholen schreeuwen om personeel.","It is mostly women who work part-time, which has consequences for their career and pension, while hospitals and schools are crying out for staff.","คนที่ทำงานพาร์ตไทม์ส่วนใหญ่เป็นผู้หญิง ซึ่งส่งผลต่อหน้าที่การงานและเงินบำนาญ ขณะที่โรงพยาบาลและโรงเรียนขาดแคลนบุคลากรอย่างหนัก"],
     ["Is deeltijd een verworvenheid of een valkuil?","Is part-time work an achievement or a trap?","การทำงานพาร์ตไทม์เป็นความก้าวหน้าหรือกับดักกันแน่?"]],

  c:[{u:"Bas", s:[["Het hangt ervan af of het een vrije keuze is of dat er geen betaalbare kinderopvang is.","It depends on whether it's a free choice or whether there's no affordable childcare.","ขึ้นอยู่กับว่าเป็นทางเลือกโดยสมัครใจ หรือเพราะไม่มีที่รับเลี้ยงเด็กในราคาที่จ่ายไหว"]]}],

{ id:"nl-f13", cat:"life", lvl:"C1", user:"Annelies Groen", handle:"annelies_direct", time:"3 สัปดาห์", likes:1876,
  s:[["Een Japanse collega vroeg me laatst voorzichtig waarom Nederlanders 'zo bot' zijn.","A Japanese colleague recently asked me cautiously why Dutch people are 'so blunt'.","เพื่อนร่วมงานชาวญี่ปุ่นถามฉันอย่างระมัดระวังเมื่อเร็วๆ นี้ว่าทำไมคนดัตช์ถึง ‘ทื่อ’ นัก"],
     ["Mijn eerste reflex was me te verdedigen: wij noemen het eerlijkheid, efficiëntie, respect voor iemands tijd.","My first reflex was to defend myself: we call it honesty, efficiency, respect for someone's time.","ปฏิกิริยาแรกของฉันคือแก้ตัว เราเรียกมันว่าความซื่อตรง ความมีประสิทธิภาพ และการเคารพเวลาของผู้อื่น"],
     ["Maar toen ze uitlegde hoe gekwetst ze zich had gevoeld door een 'eerlijke' opmerking over haar presentatie, besefte ik dat directheid alleen een deugd is als de ander de code kent.","But when she explained how hurt she had felt by an 'honest' remark about her presentation, I realised that directness is only a virtue if the other person knows the code.","แต่เมื่อเธออธิบายว่ารู้สึกเจ็บแค่ไหนกับคำวิจารณ์ ‘ตรงไปตรงมา’ เรื่องการนำเสนอของเธอ ฉันจึงตระหนักว่าความตรงจะเป็นคุณธรรมก็ต่อเมื่ออีกฝ่ายเข้าใจรหัสเดียวกัน"],
     ["Anders is het gewoon onbeleefdheid met een goed geweten.","Otherwise it's just rudeness with a clear conscience.","ไม่อย่างนั้นมันก็เป็นแค่ความหยาบคายที่ทำโดยไม่รู้สึกผิด"]],
  v:{"japanse":"A2|adj|Japanese|ญี่ปุ่น|Japans","collega":"A2|n|colleague|เพื่อนร่วมงาน","laatst":"B1|adv|recently|เมื่อเร็วๆ นี้","voorzichtig":"B1|adv|cautiously|อย่างระมัดระวัง","bot":"C1|adj|blunt|ทื่อ, ห้วน","reflex":"B2|n|reflex|ปฏิกิริยาอัตโนมัติ","verdedigen":"B2|v|to defend|ปกป้อง, แก้ตัว","eerlijkheid":"B2|n|honesty|ความซื่อสัตย์","efficiëntie":"B2|n|efficiency|ประสิทธิภาพ","respect":"B1|n|respect|ความเคารพ","uitlegde":"B1|v|explained|อธิบาย|uitleggen","gekwetst":"C1|adj|hurt (emotionally)|เจ็บใจ|kwetsen","opmerking":"B1|n|remark|คำพูด, ข้อสังเกต","presentatie":"B1|n|presentation|การนำเสนอ","besefte":"C1|v|realised|ตระหนัก|beseffen","directheid":"C1|n|directness|ความตรงไปตรงมา","deugd":"C1|n|virtue|คุณธรรม","code":"B2|n|code|รหัส","anders":"B1|adv|otherwise|ไม่อย่างนั้น","onbeleefdheid":"C1|n|rudeness|ความหยาบคาย","geweten":"C1|n|conscience|มโนธรรม"},
  c:[{u:"Ricardo", s:[["Als Braziliaan in Utrecht heb ik leren onderscheiden tussen 'bot' en 'duidelijk'. Het verschil zit vaak in een glimlach.","As a Brazilian in Utrecht I've learned to tell 'blunt' from 'clear'. The difference is often in a smile.","ในฐานะคนบราซิลในอูเทรกต์ ผมเรียนรู้ที่จะแยก ‘ทื่อ’ กับ ‘ชัดเจน’ ความต่างมักอยู่ที่รอยยิ้ม"]]}],
  vv:{"onderscheiden":"C1|v|to distinguish|แยกแยะ","duidelijk":"B1|adj|clear|ชัดเจน","verschil":"B1|n|difference|ความแตกต่าง","glimlach":"B1|n|smile|รอยยิ้ม"} },

  s:[["Vandaag ben ik met mijn oma naar de bollenvelden gefietst.","Today I cycled to the bulb fields with my grandma.","วันนี้ฉันปั่นจักรยานไปทุ่งดอกทิวลิปกับคุณยาย"],
     ["Rood, geel, roze, paars: de tulpen staan in lange rechte rijen tot aan de horizon.","Red, yellow, pink, purple: the tulips stand in long straight rows up to the horizon.","แดง เหลือง ชมพู ม่วง ทิวลิปเรียงเป็นแถวตรงยาวไปจนถึงขอบฟ้า"],

{ id:"nl-r4", cat:"history", lvl:"A2", src:"ศิลปะ/ประวัติศาสตร์", title:["De Nachtwacht is eigenlijk geen nachtscène","The Night Watch isn't really a night scene","ภาพยามราตรีที่จริงไม่ใช่ฉากกลางคืน"],
  p:[[["In het Rijksmuseum in Amsterdam hangt het beroemdste schilderij van Nederland: De Nachtwacht van Rembrandt.","In the Rijksmuseum in Amsterdam hangs the most famous painting in the Netherlands: The Night Watch by Rembrandt.","ในพิพิธภัณฑ์ไรก์สในอัมสเตอร์ดัม มีภาพวาดที่มีชื่อเสียงที่สุดของเนเธอร์แลนด์แขวนอยู่ คือภาพยามราตรีของแร็มบรันต์"],
      ["Rembrandt schilderde het in 1642.","Rembrandt painted it in 1642.","แร็มบรันต์วาดภาพนี้ในปี 1642"],
      ["Het is enorm: bijna vier meter hoog en meer dan vier meter breed.","It's enormous: almost four metres high and more than four metres wide.","ภาพใหญ่มาก สูงเกือบสี่เมตร และกว้างกว่าสี่เมตร"]],
     [["Op het schilderij zie je een groep mannen met wapens en vlaggen.","In the painting you see a group of men with weapons and flags.","ในภาพจะเห็นกลุ่มผู้ชายถืออาวุธและธง"],
      ["Het zijn geen soldaten, maar rijke burgers die samen de stad bewaakten.","They aren't soldiers, but rich citizens who guarded the city together.","พวกเขาไม่ใช่ทหาร แต่เป็นพลเมืองร่ำรวยที่ร่วมกันเฝ้ารักษาเมือง"],
      ["Ze betaalden Rembrandt om een groepsportret te maken.","They paid Rembrandt to make a group portrait.","พวกเขาจ้างแร็มบรันต์ให้วาดภาพหมู่"]],
     [["Waarom heet het dan 'De Nachtwacht'?","Why is it called 'The Night Watch', then?","แล้วทำไมถึงเรียกว่า ‘ภาพยามราตรี’?"],
      ["Door oude vernis werd het schilderij in de loop van de tijd steeds donkerder.","Because of old varnish, the painting became darker and darker over time.","เพราะน้ำมันเคลือบเงาเก่า ภาพจึงมืดลงเรื่อยๆ ตามกาลเวลา"],
      ["Mensen dachten later dat het 's nachts speelde, maar eigenlijk is het een scène overdag.","People later thought it took place at night, but it's actually a daytime scene.","คนรุ่นหลังจึงคิดว่าเป็นฉากกลางคืน แต่ที่จริงเป็นฉากกลางวัน"]]],
  v:{"nachtwacht":"B1|n|night watch|ยามกลางคืน","nachtscène":"B1|n|night scene|ฉากกลางคืน","rijksmuseum":"A2|n|Rijksmuseum (national museum)|พิพิธภัณฑ์แห่งชาติไรก์ส","hangt":"A2|v|hangs|แขวน|hangen","beroemdste":"B1|adj|most famous|มีชื่อเสียงที่สุด|beroemd","schilderij":"A2|n|painting|ภาพวาด","schilderde":"A2|v|painted|วาด|schilderen","enorm":"B1|adj|enormous|ใหญ่โต","hoog":"A1|adj|high|สูง","breed":"A2|adj|wide|กว้าง","groep":"A2|n|group|กลุ่ม","wapens":"B1|n|weapons|อาวุธ|wapen","vlaggen":"A2|n|flags|ธง|vlag","soldaten":"B1|n|soldiers|ทหาร|soldaat","rijke":"A2|adj|rich|ร่ำรวย|rijk","burgers":"B1|n|citizens|พลเมือง|burger","bewaakten":"B2|v|guarded|เฝ้ารักษา|bewaken","betaalden":"A2|v|paid|จ่าย|betalen","groepsportret":"B2|n|group portrait|ภาพเหมือนหมู่","vernis":"C1|n|varnish|น้ำมันเคลือบเงา","in de loop van de tijd":"B2|expr|over time|เมื่อเวลาผ่านไป","donkerder":"A2|adj|darker|มืดกว่า|donker","dachten":"A2|v|thought|คิด|denken","'s nachts":"A2|adv|at night|ตอนกลางคืน","speelde":"B1|v|took place, played|เกิดขึ้น, เล่น|spelen","overdag":"A2|adv|during the day|ตอนกลางวัน"},
  q:[{t:"main",q:["Wat is de belangrijkste informatie in de tekst?","ข้อมูลสำคัญที่สุดในบทความคืออะไร"],o:["Rembrandt woonde in Amsterdam.","De Nachtwacht is een groot groepsportret dat door oude vernis donker werd en daardoor een verkeerde naam kreeg.","Het Rijksmuseum is groot.","De mannen op het schilderij zijn soldaten."],a:1,x:"บทความอธิบายว่าภาพคืออะไร ใครอยู่ในภาพ และทำไมชื่อจึงผิดความจริง ข้อ B ครอบคลุมที่สุด"},
     {t:"detail",q:["Wie staan er op het schilderij?","ใครอยู่ในภาพ"],o:["Soldaten van het leger.","Rijke burgers die de stad bewaakten.","De familie van Rembrandt.","Koningen en koninginnen."],a:1,x:"“Het zijn geen soldaten, maar rijke burgers die samen de stad bewaakten.”"},
     {t:"not",q:["Wat is NIET waar volgens de tekst?","ข้อใดไม่จริงตามบทความ"],o:["Het schilderij is bijna vier meter hoog.","Rembrandt schilderde het in 1642.","Rembrandt wilde een nachtscène schilderen.","De mannen betaalden Rembrandt."],a:2,x:"บทความบอกว่า ‘eigenlijk is het een scène overdag’ แร็มบรันต์ไม่ได้ตั้งใจวาดฉากกลางคืน"},
     {t:"vocab",q:["Wat betekent 'overdag'?","‘overdag’ หมายถึงอะไร"],o:["'s nachts","tijdens de dag","heel vroeg","gisteren"],a:1,x:"overdag = ช่วงกลางวัน ตรงข้ามกับ ’s nachts ในประโยคเดียวกัน"},
     {t:"infer",q:["Waarom is de naam 'De Nachtwacht' een beetje vreemd?","ทำไมชื่อ ‘ภาพยามราตรี’ จึงดูแปลกนิดหน่อย"],o:["Omdat het schilderij te klein is.","Omdat de scène eigenlijk overdag plaatsvindt.","Omdat er geen mensen op staan.","Omdat Rembrandt geen Nederlander was."],a:1,x:"ชื่อมาจากความเข้าใจผิดเพราะภาพมืดลง ที่จริงเป็นฉากกลางวัน"}]},
{ id:"nl-r5", cat:"science", lvl:"B1", src:"วิทยาศาสตร์", title:["Waarom zijn Nederlanders zo lang?","Why are the Dutch so tall?","ทำไมคนดัตช์ถึงตัวสูงนัก?"],
  p:[[["Nederlanders behoren tot de langste mensen ter wereld: mannen zijn gemiddeld ongeveer een meter drieëntachtig.","The Dutch are among the tallest people in the world: men are on average about one metre eighty-three.","คนดัตช์อยู่ในกลุ่มคนที่สูงที่สุดในโลก ผู้ชายสูงเฉลี่ยราวหนึ่งเมตรแปดสิบสาม"],
      ["Dat was niet altijd zo.","That wasn't always the case.","แต่ไม่ได้เป็นแบบนี้มาตลอด"],
      ["Rond 1850 waren ze juist relatief klein, kleiner dan bijvoorbeeld Amerikanen.","Around 1850 they were actually relatively short, shorter than Americans, for example.","ราวปี 1850 พวกเขากลับค่อนข้างเตี้ย เตี้ยกว่าคนอเมริกันเสียอีก"]],
     [["Een deel van de verklaring is welvaart: betere voeding, schoon drinkwater en goede gezondheidszorg.","Part of the explanation is prosperity: better nutrition, clean drinking water and good healthcare.","ส่วนหนึ่งของคำอธิบายคือความมั่งคั่ง ทั้งโภชนาการที่ดีขึ้น น้ำดื่มสะอาด และระบบสาธารณสุขที่ดี"],
      ["Ook eten Nederlanders traditioneel veel zuivel, zoals melk en kaas.","The Dutch also traditionally eat a lot of dairy, such as milk and cheese.","นอกจากนี้ คนดัตช์กินผลิตภัณฑ์นมเยอะมาแต่ดั้งเดิม เช่น นมและชีส"],
      ["Maar dat verklaart niet alles, want andere rijke landen groeiden minder snel.","But that doesn't explain everything, because other rich countries grew less quickly.","แต่นั่นอธิบายได้ไม่หมด เพราะประเทศร่ำรวยอื่นๆ ไม่ได้สูงขึ้นเร็วเท่า"]],
     [["Onderzoekers ontdekten iets opvallends: in Nederland kregen lange mannen gemiddeld meer kinderen dan korte mannen.","Researchers discovered something striking: in the Netherlands, tall men had more children on average than short men.","นักวิจัยค้นพบสิ่งที่น่าสนใจ ในเนเธอร์แลนด์ ผู้ชายตัวสูงมีลูกมากกว่าผู้ชายตัวเตี้ยโดยเฉลี่ย"],
      ["Zo werd de bevolking, generatie na generatie, een klein beetje langer.","So the population became, generation after generation, a little bit taller.","ประชากรจึงสูงขึ้นทีละนิดในแต่ละรุ่น"],
      ["Er is dus waarschijnlijk niet één oorzaak, maar een combinatie van voeding, welvaart en evolutie.","So there probably isn't one cause, but a combination of nutrition, prosperity and evolution.","จึงอาจไม่ได้มีสาเหตุเดียว แต่เป็นผลรวมของโภชนาการ ความมั่งคั่ง และวิวัฒนาการ"]]],
  v:{"lang":"A1|adj|tall, long|สูง, ยาว","behoren tot":"B2|expr|belong to, be among|อยู่ในกลุ่ม|behoren","langste":"A2|adj|tallest|สูงที่สุด|lang","ter wereld":"B1|expr|in the world|ในโลก","gemiddeld":"B1|adv|on average|โดยเฉลี่ย","relatief":"B2|adv|relatively|ค่อนข้าง","verklaring":"B1|n|explanation|คำอธิบาย","welvaart":"B2|n|prosperity|ความมั่งคั่ง","voeding":"B1|n|nutrition, food|โภชนาการ","schoon":"A2|adj|clean|สะอาด","drinkwater":"A2|n|drinking water|น้ำดื่ม","gezondheidszorg":"B2|n|healthcare|ระบบสาธารณสุข","traditioneel":"B1|adv|traditionally|ตามประเพณี","zuivel":"B2|n|dairy|ผลิตภัณฑ์นม","kaas":"A1|n|cheese|ชีส","verklaart":"B1|v|explains|อธิบาย|verklaren","groeiden":"A2|v|grew|เติบโต|groeien","onderzoekers":"B1|n|researchers|นักวิจัย|onderzoeker","ontdekten":"B1|v|discovered|ค้นพบ|ontdekken","opvallends":"B2|adj|striking (something)|ที่น่าสังเกต|opvallend","kregen":"A2|v|got, had (children)|ได้รับ, มี (ลูก)|krijgen","bevolking":"B1|n|population|ประชากร","generatie":"B1|n|generation|รุ่น","waarschijnlijk":"B1|adv|probably|อาจจะ","oorzaak":"B1|n|cause|สาเหตุ","combinatie":"B1|n|combination|การผสมผสาน","evolutie":"B2|n|evolution|วิวัฒนาการ"},
  q:[{t:"main",q:["Wat is de conclusie van de tekst?","บทสรุปของบทความคืออะไร"],o:["Nederlanders zijn lang omdat ze veel kaas eten.","De lengte van Nederlanders heeft waarschijnlijk meerdere oorzaken samen.","Nederlanders waren altijd de langste mensen.","Lange mannen zijn gezonder."],a:1,x:"ประโยคสุดท้าย: ‘niet één oorzaak, maar een combinatie…’ ข้อ A เป็นเพียงปัจจัยหนึ่ง"},
     {t:"detail",q:["Hoe was de situatie rond 1850?","สถานการณ์ราวปี 1850 เป็นอย่างไร"],o:["Nederlanders waren toen al de langsten.","Nederlanders waren relatief klein.","Er waren geen Amerikanen.","Iedereen at veel zuivel."],a:1,x:"“Rond 1850 waren ze juist relatief klein” — juist ในที่นี้เน้นว่ากลับตรงกันข้ามกับปัจจุบัน"},
     {t:"infer",q:["Waarom noemt de schrijver 'andere rijke landen'?","ทำไมผู้เขียนพูดถึง ‘ประเทศร่ำรวยอื่นๆ’"],o:["Om te laten zien dat welvaart alleen de lengte niet volledig verklaart.","Om andere landen te bekritiseren.","Om te zeggen dat Nederland arm is.","Om over toerisme te praten."],a:0,x:"ถ้าความมั่งคั่งอธิบายได้ทั้งหมด ประเทศร่ำรวยอื่นก็ควรสูงขึ้นเร็วเท่ากัน การยกตัวอย่างนี้จึงชี้ว่ายังมีปัจจัยอื่น"},
     {t:"not",q:["Welke factor wordt NIET genoemd?","ปัจจัยใดไม่ได้ถูกกล่าวถึง"],o:["Schoon drinkwater.","Gezondheidszorg.","Sport op school.","Natuurlijke selectie via het aantal kinderen."],a:2,x:"บทความไม่ได้พูดถึงกีฬาในโรงเรียน ส่วนข้ออื่นมีทั้งหมด (การที่คนสูงมีลูกมากกว่า = การคัดเลือกตามธรรมชาติ)"},
     {t:"vocab",q:["Wat betekent 'welvaart'?","‘welvaart’ หมายถึงอะไร"],o:["armoede","rijkdom en een goed leven","snelheid","weer"],a:1,x:"welvaart = ความมั่งคั่ง/ความเป็นอยู่ดี ประโยคเดียวกันให้ตัวอย่าง: อาหารดี น้ำสะอาด สาธารณสุขดี"}]},
{ id:"nl-r6", cat:"tech", lvl:"B2", src:"เทคโนโลยี/เศรษฐกิจ", title:["Het Nederlandse bedrijf waar de hele chipindustrie van afhangt","The Dutch company the whole chip industry depends on","บริษัทดัตช์ที่ทั้งอุตสาหกรรมชิปต้องพึ่งพา"],
  p:[[["Weinig mensen buiten de technologiewereld kennen ASML, een bedrijf uit het Brabantse Veldhoven.","Few people outside the tech world know ASML, a company from Veldhoven in Brabant.","คนนอกวงการเทคโนโลยีน้อยคนจะรู้จัก ASML บริษัทจากเมืองเฟลด์โฮเฟนในจังหวัดบราบันต์"],
      ["Toch zit er in vrijwel elke smartphone een chip die met een machine van ASML is gemaakt.","Yet in virtually every smartphone there's a chip made with an ASML machine.","แต่สมาร์ทโฟนแทบทุกเครื่องมีชิปที่ผลิตด้วยเครื่องจักรของ ASML"]],
     [["Het bedrijf maakt lithografiemachines: apparaten die met licht ontzettend kleine patronen op siliciumschijven 'printen'.","The company makes lithography machines: devices that use light to 'print' incredibly small patterns onto silicon wafers.","บริษัทผลิตเครื่องลิโทกราฟี เครื่องที่ใช้แสง ‘พิมพ์’ ลวดลายขนาดจิ๋วลงบนแผ่นซิลิคอน"],
      ["Voor de meest geavanceerde chips is extreem ultraviolet licht nodig, en ASML is wereldwijd de enige leverancier van zulke machines.","The most advanced chips require extreme ultraviolet light, and ASML is the only supplier of such machines worldwide.","ชิปที่ทันสมัยที่สุดต้องใช้แสงอัลตราไวโอเลตแบบสุดขั้ว และ ASML เป็นผู้ผลิตเครื่องแบบนี้เพียงรายเดียวในโลก"],
      ["Eén machine is zo groot als een bus, kost honderden miljoenen euro's en wordt in onderdelen per vliegtuig vervoerd.","One machine is as big as a bus, costs hundreds of millions of euros and is transported in parts by plane.","เครื่องหนึ่งใหญ่เท่ารถบัส ราคาหลายร้อยล้านยูโร และถูกแยกชิ้นส่วนขนส่งทางเครื่องบิน"]],
     [["Die unieke positie maakt van een Nederlands bedrijf een speler in de geopolitiek.","That unique position turns a Dutch company into a player in geopolitics.","สถานะพิเศษนี้ทำให้บริษัทดัตช์กลายเป็นผู้เล่นในเวทีภูมิรัฐศาสตร์"],
      ["Onder druk van de Verenigde Staten beperkte de Nederlandse regering de export van de meest geavanceerde machines naar China.","Under pressure from the United States, the Dutch government restricted the export of the most advanced machines to China.","ภายใต้แรงกดดันจากสหรัฐฯ รัฐบาลเนเธอร์แลนด์จำกัดการส่งออกเครื่องที่ทันสมัยที่สุดไปยังจีน"],
      ["Critici vrezen dat zulke maatregelen op termijn vooral de concurrentie aanwakkeren, terwijl voorstanders wijzen op de veiligheidsrisico's.","Critics fear that such measures will in the long run mainly spur competition, while supporters point to the security risks.","ฝ่ายวิจารณ์กังวลว่ามาตรการเช่นนี้ในระยะยาวจะยิ่งกระตุ้นให้คู่แข่งเกิดขึ้น ส่วนฝ่ายสนับสนุนชี้ถึงความเสี่ยงด้านความมั่นคง"]]],
  v:{"chipindustrie":"B2|n|chip industry|อุตสาหกรรมชิป","afhangt":"B2|v|depends|ขึ้นอยู่กับ|afhangen","technologiewereld":"B2|n|tech world|วงการเทคโนโลยี","brabantse":"B2|adj|from Brabant|ของจังหวัดบราบันต์|Brabants","vrijwel":"B2|adv|virtually|แทบจะ","chip":"B1|n|chip|ชิป","machine":"A2|n|machine|เครื่องจักร","lithografiemachines":"C1|n|lithography machines|เครื่องลิโทกราฟี|lithografiemachine","apparaten":"B1|n|devices|อุปกรณ์|apparaat","ontzettend":"B2|adv|incredibly|อย่างมาก","patronen":"B2|n|patterns|ลวดลาย|patroon","siliciumschijven":"C2|n|silicon wafers|แผ่นเวเฟอร์ซิลิคอน|siliciumschijf","geavanceerde":"B2|adj|advanced|ทันสมัย|geavanceerd","extreem":"B2|adj|extreme|สุดขั้ว","ultraviolet":"B2|adj|ultraviolet|อัลตราไวโอเลต","nodig":"A2|adj|necessary|จำเป็น","wereldwijd":"B1|adv|worldwide|ทั่วโลก","leverancier":"B2|n|supplier|ผู้จัดหา, ซัพพลายเออร์","zulke":"B1|det|such|เช่นนั้น|zulk","onderdelen":"B2|n|parts|ชิ้นส่วน|onderdeel","vliegtuig":"A1|n|plane|เครื่องบิน","vervoerd":"B2|v|transported|ขนส่ง|vervoeren","unieke":"B1|adj|unique|เป็นเอกลักษณ์|uniek","positie":"B1|n|position|สถานะ, ตำแหน่ง","speler":"A2|n|player|ผู้เล่น","geopolitiek":"C1|n|geopolitics|ภูมิรัฐศาสตร์","onder druk":"B2|expr|under pressure|ภายใต้แรงกดดัน","verenigde staten":"A2|n|United States|สหรัฐอเมริกา","beperkte":"B2|v|restricted|จำกัด|beperken","regering":"B1|n|government|รัฐบาล","export":"B1|n|export|การส่งออก","critici":"B2|n|critics|ผู้วิจารณ์|criticus","vrezen":"B2|v|fear|กลัว, กังวล","maatregelen":"B2|n|measures|มาตรการ|maatregel","op termijn":"C1|expr|in the long run|ในระยะยาว","concurrentie":"B2|n|competition|การแข่งขัน","aanwakkeren":"C2|v|to fan, stoke|กระตุ้น, โหมให้แรงขึ้น","voorstanders":"C1|n|supporters, advocates|ผู้สนับสนุน|voorstander","wijzen op":"B2|v|point to|ชี้ไปที่","veiligheidsrisico's":"C1|n|security risks|ความเสี่ยงด้านความมั่นคง|veiligheidsrisico"},
  q:[{t:"main",q:["Wat is de kern van de tekst?","แก่นของบทความคืออะไร"],o:["ASML maakt smartphones.","Een weinig bekend Nederlands bedrijf heeft een sleutelpositie in de chipindustrie, met technologische én politieke gevolgen.","China maakt de beste chips.","Lithografie is een oude kunstvorm."],a:1,x:"ย่อหน้า 1–2 อธิบายบทบาทสำคัญของ ASML ส่วนย่อหน้า 3 พูดถึงผลทางการเมือง ข้อ A ผิดเพราะ ASML ผลิตเครื่องจักร ไม่ได้ผลิตสมาร์ทโฟน"},
     {t:"detail",q:["Wat maakt ASML uniek?","อะไรทำให้ ASML ไม่เหมือนใคร"],o:["Het is het grootste bedrijf van Europa.","Het is de enige leverancier van machines met extreem ultraviolet licht.","Het maakt de goedkoopste chips.","Het heeft fabrieken in China."],a:1,x:"“ASML is wereldwijd de enige leverancier van zulke machines”"},
     {t:"vocab",q:["'Op termijn' betekent hier…","‘Op termijn’ ในที่นี้หมายถึง…"],o:["meteen","op de lange duur","nooit","per maand"],a:1,x:"op termijn = ในระยะยาว (op de lange duur) ไม่ใช่ทันที"},
     {t:"not",q:["Welke bewering klopt NIET?","ข้อใดไม่ถูกต้อง"],o:["Een ASML-machine wordt in onderdelen vervoerd.","De Nederlandse regering beperkte de export naar China.","Alle experts steunen de exportbeperkingen.","ASML zit in Veldhoven."],a:2,x:"บทความกล่าวถึงทั้ง ‘critici’ ที่กังวล และ ‘voorstanders’ ผู้เชี่ยวชาญจึงไม่ได้สนับสนุนทั้งหมด"},
     {t:"infer",q:["Waarom 'vrezen critici' dat de maatregelen de concurrentie aanwakkeren?","ทำไมฝ่ายวิจารณ์จึงกลัวว่ามาตรการจะกระตุ้นการแข่งขัน"],o:["Omdat China dan zelf zulke machines kan gaan ontwikkelen.","Omdat ASML dan failliet gaat.","Omdat de VS ook machines verkopen.","Omdat chips goedkoper worden."],a:0,x:"ถ้าซื้อจากเนเธอร์แลนด์ไม่ได้ จีนอาจหันไปพัฒนาเทคโนโลยีเอง จนเกิดคู่แข่งของ ASML ในระยะยาว"}]},
{ id:"nl-r7", cat:"env", lvl:"C1", src:"สิ่งแวดล้อม/การเมือง", title:["De stikstofcrisis: wanneer natuur en landbouw botsen","The nitrogen crisis: when nature and farming collide","วิกฤตไนโตรเจน: เมื่อธรรมชาติปะทะเกษตรกรรม"],
  p:[[["In 2019 oordeelde de Raad van State, de hoogste bestuursrechter van Nederland, dat de overheid de uitstoot van stikstof onvoldoende beperkte om kwetsbare natuurgebieden te beschermen.","In 2019 the Council of State, the highest administrative court in the Netherlands, ruled that the government was not limiting nitrogen emissions enough to protect vulnerable nature areas.","ในปี 2019 สภาแห่งรัฐ ซึ่งเป็นศาลปกครองสูงสุดของเนเธอร์แลนด์ ตัดสินว่ารัฐบาลจำกัดการปล่อยไนโตรเจนไม่เพียงพอที่จะปกป้องพื้นที่ธรรมชาติที่เปราะบาง"],
      ["Van de ene dag op de andere lagen duizenden bouwprojecten stil, van woonwijken tot snelwegen.","From one day to the next, thousands of construction projects came to a standstill, from housing estates to motorways.","ชั่วข้ามคืน โครงการก่อสร้างนับพันต้องหยุดชะงัก ตั้งแต่โครงการบ้านจัดสรรไปจนถึงทางด่วน"]],
     [["Stikstofverbindingen komen onder meer uit verkeer en industrie, maar de grootste bron is de intensieve veehouderij, die het land tot een van 's werelds grootste landbouwexporteurs heeft gemaakt.","Nitrogen compounds come, among other things, from traffic and industry, but the largest source is intensive livestock farming, which has made the country one of the world's largest agricultural exporters.","สารประกอบไนโตรเจนมาจากการจราจรและอุตสาหกรรม แต่แหล่งใหญ่ที่สุดคือปศุสัตว์แบบเข้มข้น ซึ่งทำให้ประเทศนี้เป็นหนึ่งในผู้ส่งออกสินค้าเกษตรรายใหญ่ที่สุดของโลก"],
      ["Neergeslagen in de natuur werkt stikstof als een overdosis kunstmest: snelgroeiende planten als brandnetels en grassen verdringen zeldzame soorten, en daarmee ook de insecten die ervan afhankelijk zijn.","Once deposited in nature, nitrogen acts like an overdose of fertiliser: fast-growing plants such as nettles and grasses crowd out rare species, and with them the insects that depend on them.","เมื่อตกลงสู่ธรรมชาติ ไนโตรเจนทำหน้าที่เหมือนปุ๋ยเกินขนาด พืชที่โตเร็วอย่างต้นตำแยและหญ้าจะเบียดพืชหายาก รวมถึงแมลงที่ต้องพึ่งพาพืชเหล่านั้น"]],
     [["De voorgestelde halvering van de uitstoot leidde tot massale boerenprotesten, met trekkers op de snelweg en omgekeerde vlaggen als symbool van verzet.","The proposed halving of emissions led to massive farmers' protests, with tractors on the motorway and upside-down flags as a symbol of resistance.","ข้อเสนอให้ลดการปล่อยลงครึ่งหนึ่ง นำไปสู่การประท้วงครั้งใหญ่ของเกษตรกร มีรถแทรกเตอร์บนทางด่วน และธงชาติกลับหัวเป็นสัญลักษณ์ของการต่อต้าน"],
      ["Voor veel boeren gaat het niet alleen om inkomen, maar om identiteit: hun familie bewerkt het land soms al generaties lang.","For many farmers it's not just about income, but about identity: their family has sometimes worked the land for generations.","สำหรับเกษตรกรหลายคน เรื่องนี้ไม่ได้เป็นแค่เรื่องรายได้ แต่เป็นเรื่องอัตลักษณ์ เพราะบางครอบครัวทำกินบนผืนดินนี้มาหลายชั่วอายุคน"],
      ["Tegelijkertijd wijzen ecologen erop dat uitstel de rekening alleen maar verhoogt.","At the same time, ecologists point out that delay only increases the bill.","ในขณะเดียวกัน นักนิเวศวิทยาชี้ว่าการผัดวันประกันพรุ่งยิ่งทำให้ค่าใช้จ่ายสูงขึ้น"]],
     [["De crisis legt een dieper dilemma bloot: hoeveel economische activiteit kan een klein, dichtbevolkt land zich veroorloven zonder zijn eigen natuur uit te putten?","The crisis exposes a deeper dilemma: how much economic activity can a small, densely populated country afford without exhausting its own nature?","วิกฤตนี้เผยให้เห็นภาวะกลืนไม่เข้าคายไม่ออกที่ลึกกว่านั้น ประเทศเล็กๆ ที่ประชากรหนาแน่นจะมีกิจกรรมทางเศรษฐกิจได้มากแค่ไหน โดยไม่ทำให้ธรรมชาติของตัวเองเสื่อมโทรม?"]]],

  s:[["Afgelopen weekend ben ik gaan wadlopen: met een gids lopend over de zeebodem van Groningen naar Schiermonnikoog.","Last weekend I went mudflat hiking: walking across the seabed with a guide from Groningen to Schiermonnikoog.","สุดสัปดาห์ที่แล้ว ฉันไปเดินบนหาดเลน เดินข้ามพื้นทะเลกับไกด์จากโกรนิงเงินไปเกาะสคีร์มอนนิกโอค"],
     ["Bij eb valt een groot deel van de Waddenzee droog, maar je moet precies weten wanneer het water terugkomt.","At low tide a large part of the Wadden Sea dries out, but you have to know exactly when the water comes back.","ช่วงน้ำลง ทะเลวัดเดินส่วนใหญ่จะแห้ง แต่ต้องรู้ให้แน่ชัดว่าน้ำจะกลับมาเมื่อไร"],

  s:[["Buitenlandse collega's vragen me vaak waarom vergaderingen hier zo lang duren als er toch geen baas is die beslist.","Foreign colleagues often ask me why meetings here last so long when there's no boss who decides anyway.","เพื่อนร่วมงานต่างชาติชอบถามผมว่า ทำไมการประชุมที่นี่ถึงนานนัก ในเมื่อไม่มีหัวหน้าเป็นคนตัดสินใจ"],
     ["Het antwoord heet 'polderen': het streven naar een besluit dat iedereen kan dragen, ook als het niemands eerste keuze is.","The answer is called 'polderen': striving for a decision everyone can live with, even if it's nobody's first choice.","คำตอบเรียกว่า ‘พอลเดอเริน’ คือการพยายามหาข้อตัดสินใจที่ทุกคนรับได้ แม้จะไม่ใช่ตัวเลือกแรกของใครเลย"],
     ["Historici leggen een verband met de waterschappen: wie samen een dijk moet onderhouden, kan zich geen eeuwige ruzie veroorloven.","Historians link it to the water boards: those who must maintain a dike together can't afford an eternal quarrel.","นักประวัติศาสตร์โยงเรื่องนี้กับคณะกรรมการจัดการน้ำ คนที่ต้องดูแลเขื่อนร่วมกันจะทะเลาะกันไม่รู้จบไม่ได้"],

{ id:"nl-r9", cat:"history", lvl:"B1", src:"ประวัติศาสตร์", title:["Het Achterhuis","The Secret Annex","บ้านหลังลับ"],
  p:[[["Aan de Prinsengracht in Amsterdam staat een smal grachtenhuis dat elk jaar meer dan een miljoen bezoekers trekt.","On the Prinsengracht in Amsterdam stands a narrow canal house that attracts more than a million visitors every year.","ริมคลองปรินเซินกราคต์ในอัมสเตอร์ดัม มีบ้านริมคลองแคบๆ หลังหนึ่งที่มีผู้มาเยือนกว่าหนึ่งล้านคนทุกปี"],
      ["Achter een draaibare boekenkast zat van 1942 tot 1944 een groep van acht Joodse onderduikers verborgen, onder wie de jonge Anne Frank.","Behind a revolving bookcase, from 1942 to 1944, a group of eight Jewish people in hiding lay concealed, among them the young Anne Frank.","หลังตู้หนังสือที่หมุนเปิดได้ ระหว่างปี 1942 ถึง 1944 มีชาวยิวแปดคนหลบซ่อนตัวอยู่ หนึ่งในนั้นคืออันเนอ ฟรังค์วัยเยาว์"]],
     [["Anne schreef in haar dagboek over angst en verveling, maar ook over haar dromen, haar ruzies met haar moeder en haar eerste verliefdheid.","Anne wrote in her diary about fear and boredom, but also about her dreams, her quarrels with her mother and her first crush.","อันเนอเขียนบันทึกประจำวันเกี่ยวกับความกลัวและความเบื่อหน่าย รวมถึงความฝัน การทะเลาะกับแม่ และรักครั้งแรกของเธอ"],
      ["In augustus 1944 werden de onderduikers verraden en gearresteerd.","In August 1944 the people in hiding were betrayed and arrested.","ในเดือนสิงหาคม 1944 ผู้หลบซ่อนถูกทรยศและถูกจับกุม"],
      ["Anne stierf begin 1945 in het concentratiekamp Bergen-Belsen, enkele weken voor de bevrijding.","Anne died in early 1945 in the Bergen-Belsen concentration camp, a few weeks before liberation.","อันเนอเสียชีวิตต้นปี 1945 ที่ค่ายกักกันแบร์เกิน-เบลเซิน ไม่กี่สัปดาห์ก่อนการปลดปล่อย"]],
     [["Haar vader Otto was de enige van de groep die de oorlog overleefde.","Her father Otto was the only one of the group who survived the war.","อ็อตโต พ่อของเธอ เป็นคนเดียวในกลุ่มที่รอดชีวิตจากสงคราม"],
      ["Hij besloot het dagboek te publiceren, en het is inmiddels in meer dan zeventig talen vertaald.","He decided to publish the diary, and it has since been translated into more than seventy languages.","เขาตัดสินใจตีพิมพ์บันทึกนั้น และปัจจุบันได้รับการแปลเป็นภาษาต่างๆ กว่าเจ็ดสิบภาษา"],
      ["Juist omdat het zo persoonlijk is, maakt het boek een onvoorstelbare geschiedenis voor lezers van over de hele wereld begrijpelijk.","Precisely because it is so personal, the book makes an unimaginable history understandable for readers all over the world.","เพราะความเป็นเรื่องส่วนตัวอย่างยิ่งนี่เอง หนังสือเล่มนี้จึงทำให้ผู้อ่านทั่วโลกเข้าใจประวัติศาสตร์ที่ไม่อาจจินตนาการได้"]]],

  q:[{t:"main",q:["Wat is de belangrijkste boodschap van de tekst?","สารหลักของบทความคืออะไร"],o:["Het Achterhuis is een mooi toeristisch gebouw.","Het dagboek van Anne Frank maakt een vreselijke geschiedenis begrijpelijk doordat het zo persoonlijk is.","Otto Frank was een bekende schrijver.","De boekenkast was een uitvinding van Anne."],a:1,x:"ประโยคสุดท้ายคือแก่นของบทความ ความเป็นเรื่องส่วนตัวทำให้ผู้อ่านทั่วโลกเข้าใจประวัติศาสตร์"},
     {t:"detail",q:["Hoe lang zaten de onderduikers ongeveer verborgen?","ผู้หลบซ่อนอยู่ในบ้านนั้นนานประมาณเท่าไร"],o:["Een paar weken","Ongeveer twee jaar","Tien jaar","Een maand"],a:1,x:"“van 1942 tot 1944” ประมาณสองปี"},
     {t:"not",q:["Welke bewering is NIET juist?","ข้อใดไม่ถูกต้อง"],o:["Anne schreef over haar eerste verliefdheid.","Alle onderduikers overleefden de oorlog.","Het dagboek is in meer dan zeventig talen vertaald.","Er waren acht onderduikers."],a:1,x:"บทความบอกว่าอ็อตโตเป็น ‘คนเดียว’ ที่รอดชีวิต"},

     {t:"infer",q:["Waarom trekt het huis volgens de tekst zoveel bezoekers?","ตามบทความ ทำไมบ้านหลังนี้จึงมีผู้มาเยือนมาก"],o:["Omdat het het grootste huis van Amsterdam is.","Omdat Annes verhaal wereldwijd bekend en ontroerend is.","Omdat het gratis is.","Omdat er een museum over grachten is."],a:1,x:"บทความบอกว่าบันทึกถูกแปลกว่า 70 ภาษาและผู้อ่านทั่วโลกเข้าใจได้ จึงอนุมานได้ว่าเป็นเหตุผลที่คนมาเยือนมาก"}]},
{ id:"nl-r10", cat:"history", lvl:"C1", src:"ประวัติศาสตร์/สังคม", title:["De Gouden Eeuw: glans en schaduw","The Golden Age: splendour and shadow","ยุคทอง: ความรุ่งโรจน์และเงามืด"],
  p:[[["In de zeventiende eeuw groeide de jonge Republiek der Zeven Verenigde Nederlanden uit tot een van de rijkste en machtigste handelsnaties ter wereld.","In the seventeenth century the young Republic of the Seven United Netherlands grew into one of the richest and most powerful trading nations in the world.","ในศตวรรษที่ 17 สาธารณรัฐเจ็ดจังหวัดแห่งเนเธอร์แลนด์ที่เพิ่งก่อตั้ง เติบโตเป็นหนึ่งในชาติการค้าที่ร่ำรวยและทรงอำนาจที่สุดในโลก"],
      ["De Verenigde Oost-Indische Compagnie, opgericht in 1602, geldt als een van de eerste multinationals en gaf als eerste op grote schaal aandelen uit aan het publiek.","The Dutch East India Company, founded in 1602, is regarded as one of the first multinationals and was the first to issue shares to the public on a large scale.","บริษัทอินเดียตะวันออกของดัตช์ (VOC) ก่อตั้งปี 1602 ถือเป็นบริษัทข้ามชาติแห่งแรกๆ และเป็นรายแรกที่ออกหุ้นขายแก่สาธารณชนในวงกว้าง"]],
     [["De welvaart voedde een ongekende bloei van kunst en wetenschap: Rembrandt, Vermeer en Spinoza werkten in een land dat relatief tolerant was tegenover andersdenkenden.","Prosperity fed an unprecedented flowering of art and science: Rembrandt, Vermeer and Spinoza worked in a country that was relatively tolerant of dissenters.","ความมั่งคั่งหล่อเลี้ยงการเบ่งบานของศิลปะและวิทยาศาสตร์อย่างที่ไม่เคยมีมาก่อน แร็มบรันต์ เฟอร์เมร์ และสปิโนซาทำงานในประเทศที่ค่อนข้างอดกลั้นต่อผู้เห็นต่าง"],
      ["Tegelijkertijd werd die rijkdom voor een aanzienlijk deel verdiend met geweld in Azië en met de handel in tot slaaf gemaakte mensen.","At the same time, a considerable part of that wealth was earned through violence in Asia and through the trade in enslaved people.","ในเวลาเดียวกัน ความมั่งคั่งส่วนใหญ่ได้มาจากความรุนแรงในเอเชียและการค้ามนุษย์ที่ถูกทำให้เป็นทาส"]],
     [["Lange tijd bleef die schaduwzijde in schoolboeken onderbelicht.","For a long time that dark side remained underexposed in school textbooks.","เป็นเวลานานที่ด้านมืดนี้แทบไม่ถูกกล่าวถึงในแบบเรียน"],
      ["Sinds enkele jaren gebruiken sommige musea liever de neutralere term 'zeventiende eeuw', en in 2022 bood de Nederlandse regering formeel excuses aan voor het slavernijverleden.","For some years now, some museums have preferred the more neutral term 'seventeenth century', and in 2022 the Dutch government formally apologised for the history of slavery.","หลายปีมานี้ พิพิธภัณฑ์บางแห่งเลือกใช้คำที่เป็นกลางกว่าว่า ‘ศตวรรษที่ 17’ และในปี 2022 รัฐบาลเนเธอร์แลนด์ได้ขอโทษอย่างเป็นทางการต่ออดีตเรื่องการค้าทาส"],
      ["Critici vinden dat daarmee het verleden wordt herschreven; voorstanders betogen dat het juist eindelijk volledig wordt verteld.","Critics feel that the past is thereby being rewritten; supporters argue that, on the contrary, it is finally being told in full.","ฝ่ายวิจารณ์เห็นว่านี่คือการเขียนประวัติศาสตร์ใหม่ ส่วนฝ่ายสนับสนุนแย้งว่า ที่จริงแล้วนี่คือการเล่าเรื่องให้ครบถ้วนเสียที"]]],
  v:{"gouden eeuw":"B2|n|Golden Age|ยุคทอง","glans":"C1|n|splendour, shine|ความรุ่งโรจน์, ความแวววาว","schaduw":"B1|n|shadow|เงา","groeide uit tot":"C1|expr|grew into|เติบโตกลายเป็น|uitgroeien tot","republiek":"B2|n|republic|สาธารณรัฐ","rijkste":"B1|adj|richest|ร่ำรวยที่สุด|rijk","machtigste":"B2|adj|most powerful|ทรงอำนาจที่สุด|machtig","handelsnaties":"C1|n|trading nations|ชาติการค้า|handelsnatie","opgericht":"B2|v|founded|ก่อตั้ง|oprichten","geldt als":"C1|expr|is regarded as|ถือว่าเป็น|gelden als","multinationals":"B2|n|multinationals|บริษัทข้ามชาติ|multinational","op grote schaal":"C1|expr|on a large scale|ในวงกว้าง","aandelen":"B2|n|shares|หุ้น|aandeel","gaf uit":"B2|v|issued|ออก (หุ้น)|uitgeven","voedde":"C1|v|fed|หล่อเลี้ยง|voeden","ongekende":"C1|adj|unprecedented|ไม่เคยมีมาก่อน|ongekend","bloei":"C1|n|flowering, heyday|การเบ่งบาน","wetenschap":"B1|n|science|วิทยาศาสตร์","tolerant":"B2|adj|tolerant|อดกลั้น","andersdenkenden":"C2|n|dissenters|ผู้เห็นต่าง|andersdenkende","aanzienlijk":"C1|adj|considerable|มากพอสมควร","verdiend":"B1|v|earned|หาได้|verdienen","geweld":"B2|n|violence|ความรุนแรง","tot slaaf gemaakte":"C1|expr|enslaved|ที่ถูกทำให้เป็นทาส","schaduwzijde":"C1|n|dark side|ด้านมืด","onderbelicht":"C1|adj|underexposed, neglected|ถูกมองข้าม","musea":"B1|n|museums|พิพิธภัณฑ์|museum","neutralere":"B2|adj|more neutral|เป็นกลางกว่า|neutraal","term":"B2|n|term|คำศัพท์","bood excuses aan":"C1|expr|apologised|ขอโทษ|excuses aanbieden","formeel":"B2|adv|formally|อย่างเป็นทางการ","slavernijverleden":"C1|n|history of slavery|อดีตการค้าทาส","herschreven":"C1|v|rewritten|เขียนใหม่|herschrijven","betogen":"C1|v|argue|โต้แย้ง","volledig":"B2|adv|fully|อย่างครบถ้วน"},
  q:[{t:"main",q:["Welke uitspraak vat de tekst het best samen?","ข้อใดสรุปบทความได้ดีที่สุด"],o:["De Gouden Eeuw was alleen een periode van kunst.","De zeventiende eeuw bracht grote rijkdom en culturele bloei, maar ook geweld en uitbuiting, wat tot een debat over herinnering leidt.","De VOC was een museum.","Nederland was in de 17e eeuw arm."],a:1,x:"บทความมีสามส่วน คือความรุ่งเรือง ด้านมืด และข้อถกเถียงร่วมสมัย ข้อ B ครอบคลุมทั้งหมด"},
     {t:"detail",q:["Wat was bijzonder aan de VOC?","VOC มีความพิเศษอย่างไร"],o:["Ze was de eerste die op grote schaal aandelen aan het publiek uitgaf.","Ze maakte schilderijen.","Ze werd opgericht in 1942.","Ze was een kleine familiezaak."],a:0,x:"“gaf als eerste op grote schaal aandelen uit aan het publiek”"},
     {t:"vocab",q:["'Onderbelicht' betekent hier dat de schaduwzijde…","‘Onderbelicht’ ในที่นี้หมายความว่าด้านมืดนั้น…"],o:["te veel aandacht kreeg.","te weinig aandacht kreeg.","verboden was.","goed werd uitgelegd."],a:1,x:"onderbelicht แปลตรงตัวว่า ‘ได้รับแสงน้อยเกินไป’ (ศัพท์ถ่ายภาพ) ในเชิงเปรียบเทียบหมายถึงไม่ได้รับความสนใจพอ"},
     {t:"not",q:["Welke bewering is in strijd met de tekst?","ข้อใดขัดแย้งกับบทความ"],o:["Spinoza werkte in de Republiek.","De regering bood in 2022 excuses aan voor het slavernijverleden.","Alle musea gebruiken nog steeds de term 'Gouden Eeuw'.","Een deel van de rijkdom kwam uit geweld in Azië."],a:2,x:"บทความบอกว่าพิพิธภัณฑ์บางแห่งเลือกใช้คำว่า ‘ศตวรรษที่ 17’ แทน"},
     {t:"tone",q:["Welke houding neemt de auteur aan in de laatste zin?","ผู้เขียนมีท่าทีอย่างไรในประโยคสุดท้าย"],o:["Hij kiest duidelijk de kant van de critici.","Hij presenteert beide standpunten zonder zelf te oordelen.","Hij vindt het debat onbelangrijk.","Hij is spottend."],a:1,x:"ผู้เขียนเสนอทั้งฝ่ายวิจารณ์ (herschreven) และฝ่ายสนับสนุน (volledig verteld) โดยไม่ตัดสินเอง"}]}

{ id:"nl-n5", genre:"fantasy", lvl:"A2", title:["De paraplu van opa","Grandpa's umbrella","ร่มของคุณตา"], blurb:"ร่มสีเหลืองเก่าๆ ของคุณตาพาเด็กหญิงลอยขึ้นฟ้าทุกครั้งที่ฝนตก",
  p:[[["Opa had een oude gele paraplu.","Grandpa had an old yellow umbrella.","คุณตามีร่มสีเหลืองเก่าคันหนึ่ง"],
      ["Na zijn dood mocht Lieke hem hebben.","After his death Lieke was allowed to have it.","หลังคุณตาเสีย ลีเกอได้ร่มคันนั้นมา"],
      ["'Pas op,' zei oma met een glimlach. 'Hij doet soms rare dingen.'","'Be careful,' said Grandma with a smile. 'It sometimes does strange things.'","“ระวังนะ” คุณยายพูดพร้อมรอยยิ้ม “บางทีมันก็ทำอะไรแปลกๆ”"]],
     [["De volgende dag regende het.","The next day it rained.","วันรุ่งขึ้นฝนตก"],
      ["Lieke deed de paraplu open en voelde meteen een sterke trek.","Lieke opened the umbrella and immediately felt a strong pull.","ลีเกอกางร่ม แล้วรู้สึกถึงแรงดึงอย่างแรงทันที"],
      ["Haar voeten kwamen los van de grond.","Her feet came off the ground.","เท้าของเธอลอยพ้นพื้น"],
      ["Langzaam vloog ze omhoog, boven de daken, boven de kerk, tot in de grijze wolken.","Slowly she flew up, above the roofs, above the church, into the grey clouds.","เธอค่อยๆ ลอยสูงขึ้น เหนือหลังคาบ้าน เหนือโบสถ์ จนเข้าไปในเมฆสีเทา"]],
     [["Boven de wolken scheen de zon.","Above the clouds the sun was shining.","เหนือเมฆ แดดส่องสว่าง"],
      ["Op een wolk zat een oude man in een gele regenjas, met een kopje thee.","On a cloud sat an old man in a yellow raincoat, with a cup of tea.","บนก้อนเมฆมีชายชราสวมเสื้อกันฝนสีเหลืองนั่งจิบชาอยู่"],
      ["'Daar ben je eindelijk,' zei hij. 'Ik heb op je gewacht.'","'There you are at last,' he said. 'I've been waiting for you.'","“มาถึงสักที” เขาพูด “ตาคอยหนูอยู่นะ”"]],
     "* * *",
     [["Ze praatten de hele middag, over vroeger, over school, over oma.","They talked all afternoon, about the old days, about school, about Grandma.","ทั้งสองคุยกันทั้งบ่าย เรื่องวันเก่าๆ เรื่องโรงเรียน เรื่องคุณยาย"],
      ["Toen de regen stopte, begon de paraplu te zakken.","When the rain stopped, the umbrella began to sink.","เมื่อฝนหยุด ร่มก็เริ่มลดระดับลง"],
      ["'Kom terug als het weer regent,' riep opa.","'Come back when it rains again,' Grandpa called.","“มาอีกนะตอนฝนตก” คุณตาตะโกน"],
      ["Sindsdien is Lieke de enige in Nederland die blij is met slecht weer.","Since then, Lieke is the only person in the Netherlands who is happy about bad weather.","ตั้งแต่นั้นมา ลีเกอเป็นคนเดียวในเนเธอร์แลนด์ที่ดีใจเวลาอากาศไม่ดี"]]],
  v:{"opa":"A1|n|grandpa|คุณตา, คุณปู่","gele":"A1|adj|yellow|สีเหลือง|geel","paraplu":"A2|n|umbrella|ร่ม","dood":"A2|n|death|ความตาย","mocht":"A2|v|was allowed|ได้รับอนุญาต|mogen","pas op":"A2|expr|be careful|ระวัง|oppassen","glimlach":"B1|n|smile|รอยยิ้ม","rare":"A2|adj|strange|แปลก|raar","dingen":"A1|n|things|สิ่งของ|ding","deed open":"A2|v|opened|เปิด|opendoen","voelde":"A2|v|felt|รู้สึก|voelen","sterke":"A2|adj|strong|แรง|sterk","trek":"B2|n|pull|แรงดึง","los":"B1|adj|loose, off|หลุด, ลอย","grond":"A2|n|ground|พื้นดิน","vloog":"A2|v|flew|บิน|vliegen","omhoog":"A2|adv|up|ขึ้นไป","daken":"A2|n|roofs|หลังคา|dak","kerk":"A2|n|church|โบสถ์","wolken":"A2|n|clouds|เมฆ|wolk","regenjas":"A2|n|raincoat|เสื้อกันฝน","gewacht":"A2|v|waited|รอ|wachten","middag":"A1|n|afternoon|ตอนบ่าย","stopte":"A2|v|stopped|หยุด|stoppen","zakken":"B1|v|to sink, drop|ลดลง, จม","riep":"B1|v|called|ตะโกน, เรียก|roepen","sindsdien":"B1|adv|since then|ตั้งแต่นั้นมา","slecht":"A1|adj|bad|แย่"}},
{ id:"nl-n6", genre:"comedy", lvl:"B1", title:["De verkeerde fiets","The wrong bike","จักรยานผิดคัน"], blurb:"หนุ่มนักศึกษาปลดล็อกจักรยานคันที่หน้าตาเหมือนของตัวเอง แล้วเรื่องวุ่นๆ ก็ตามมาทั้งเมือง",

{ id:"nl-r12", cat:"society", lvl:"A2", src:"วัฒนธรรม/ประเพณี", title:["Sinterklaas: het feest van 5 december","Sinterklaas: the celebration of 5 December","ซินเตอร์คลาส: เทศกาลวันที่ 5 ธันวาคม"],
  p:[[["Voor Nederlandse kinderen is Sinterklaas het belangrijkste feest van het jaar.","For Dutch children, Sinterklaas is the most important celebration of the year.","สำหรับเด็กดัตช์ ซินเตอร์คลาสคือเทศกาลที่สำคัญที่สุดของปี"],
      ["Sinterklaas is een oude man met een lange witte baard, een rode mantel en een hoge hoed, de mijter.","Sinterklaas is an old man with a long white beard, a red cloak and a tall hat, the mitre.","ซินเตอร์คลาสเป็นชายชราเคราขาวยาว สวมเสื้อคลุมสีแดงและหมวกทรงสูงที่เรียกว่ามิเตอร์"],
      ["Volgens het verhaal komt hij elk jaar half november met een stoomboot uit Spanje.","According to the story, he comes every year in mid-November on a steamboat from Spain.","ตามเรื่องเล่า เขาจะมาถึงทุกปีช่วงกลางเดือนพฤศจิกายนโดยเรือกลไฟจากสเปน"]],
     [["In de weken daarna zetten kinderen 's avonds hun schoen bij de verwarming.","In the weeks after that, children put their shoe by the heater in the evening.","ในสัปดาห์ต่อมา เด็กๆ จะวางรองเท้าไว้ข้างเครื่องทำความร้อนตอนกลางคืน"],
      ["Ze zingen liedjes en leggen soms een wortel in de schoen voor het paard van Sinterklaas.","They sing songs and sometimes put a carrot in the shoe for Sinterklaas's horse.","พวกเขาร้องเพลง และบางครั้งก็ใส่แครอทไว้ในรองเท้าให้ม้าของซินเตอร์คลาส"],
      ["De volgende ochtend ligt er vaak een klein cadeautje of snoep in.","The next morning there is often a small present or sweets in it.","เช้าวันต่อมามักจะมีของขวัญชิ้นเล็กหรือขนมอยู่ข้างใน"]],
     [["Op de avond van 5 december is het pakjesavond: dan krijgen kinderen hun grote cadeaus.","On the evening of 5 December it's 'parcel evening': then children get their big presents.","ค่ำวันที่ 5 ธันวาคมคือ ‘คืนห่อของขวัญ’ เด็กๆ จะได้รับของขวัญชิ้นใหญ่"],
      ["Volwassenen schrijven vaak grappige gedichten voor elkaar.","Adults often write funny poems for each other.","ผู้ใหญ่มักเขียนกลอนตลกๆ ให้กัน"],
      ["Typisch snoep is het pepernootje, een klein, rond koekje met kruiden.","Typical sweets are 'pepernoten', small round spiced biscuits.","ขนมประจำเทศกาลคือ ‘เปเปอร์โนต’ คุกกี้กลมเล็กๆ ผสมเครื่องเทศ"]]],

{ id:"nl-r13", cat:"env", lvl:"A2", src:"ธรรมชาติ/ประวัติศาสตร์", title:["De tulp: een Nederlands symbool uit het oosten","The tulip: a Dutch symbol from the east","ทิวลิป: สัญลักษณ์ของเนเธอร์แลนด์ที่มาจากตะวันออก"],
