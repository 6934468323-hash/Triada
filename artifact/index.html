<title>Tríada Reader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,600&display=swap">
<style>/* Layout: one reading column (max 720px) between a sticky language bar and a fixed bottom tab bar.
   The accent follows the language being studied: French blue, Spanish red, Dutch orange. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EBEEF3; --ink:#18202D; --muted:#5B6476; --line:#DCE1E9;
  --fr:#2D47D2; --es:#C7351F; --nl:#D9620C; --accent:var(--fr); --accent-ink:#FFFFFF;
  --accent-soft:color-mix(in srgb, var(--accent) 12%, transparent);
  --good:#17845A; --bad:#C0392B; --warn:#B7791F; --hard:color-mix(in srgb, var(--accent) 70%, var(--ink));
  --saved-bg:color-mix(in srgb, var(--warn) 18%, transparent);
  --speak-bg:color-mix(in srgb, var(--accent) 16%, transparent);
  --shadow:0 10px 30px rgba(20,28,45,.12);
  --f-read:"Literata", "Iowan Old Style", Georgia, "IBM Plex Sans Thai", serif;
  --f-ui:"IBM Plex Sans Thai", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-display:"Bricolage Grotesque", "IBM Plex Sans Thai", system-ui, sans-serif;
  --read-size:19px; --read-lh:1.75;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not([data-skin="sepia"]){
  --bg:#0F1218; --surface:#171B24; --surface-2:#202533; --ink:#E6E9F0; --muted:#98A1B3; --line:#2A3040;
  --fr:#8197FF; --es:#FF7C60; --nl:#FF9C4F; --accent-ink:#0F1218;
  --good:#4CC38A; --bad:#FF7A6B; --warn:#E3B04B; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]:not([data-skin="sepia"]){
  --bg:#0F1218; --surface:#171B24; --surface-2:#202533; --ink:#E6E9F0; --muted:#98A1B3; --line:#2A3040;
  --fr:#8197FF; --es:#FF7C60; --nl:#FF9C4F; --accent-ink:#0F1218;
  --good:#4CC38A; --bad:#FF7A6B; --warn:#E3B04B; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }
:root[data-skin="sepia"]{
  --bg:#EFE6D2; --surface:#F8F1E1; --surface-2:#E6DBC3; --ink:#3A2E1F; --muted:#76664F; --line:#D8CAAE;
  --fr:#2D47A8; --es:#A8321E; --nl:#B2550F; --accent-ink:#FFF8EA; color-scheme:light }
:root[data-lang="es"]{--accent:var(--es)} :root[data-lang="nl"]{--accent:var(--nl)}
:root[data-accent="teal"]{--accent:#0F8C84} :root[data-accent="violet"]{--accent:#7446D6} :root[data-accent="green"]{--accent:#2E8540} :root[data-accent="pink"]{--accent:#C2367A}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.38}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px;margin-right:auto;min-width:0}
.brand small{font-family:var(--f-ui);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langs{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.langs button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.04em}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{border:0;background:transparent;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}

/* ---------- main column ---------- */
main{max-width:760px;margin:0 auto;padding-block:14px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 12px;flex-wrap:wrap}
.view-head h1{font-size:26px;letter-spacing:-.02em}
.view-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.eyebrow{font-size:11.5px;line-height:1.7;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* chips / filters */
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chiprow::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.lv{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;letter-spacing:.04em;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.lvl{background:var(--accent-soft);color:var(--accent)}
.badge.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}

/* ---------- reading text ---------- */
.rt{font-family:var(--f-read);font-size:var(--read-size);line-height:var(--read-lh);overflow-wrap:break-word}
.rt.sans{font-family:var(--f-ui)}
.rt p{margin:0 0 .9em}
.sent{border-radius:4px;transition:background .2s}
.sent.speaking{background:var(--speak-bg)}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:var(--accent-soft)}
.w.hard{text-decoration:underline dotted var(--hard);text-decoration-thickness:1.5px;text-underline-offset:4px}
.w.saved{background:var(--saved-bg)}
.w.sel{background:var(--accent);color:var(--accent-ink)}
.tr{display:none;font-family:var(--f-ui);font-size:.78em;line-height:1.55;color:var(--muted);margin:.15em 0 .6em;padding-left:10px;border-left:2px solid var(--line)}
.showtr .sent{display:block;margin-bottom:.1em}
.showtr .tr{display:block}
.sent.open .tr{display:block}
.sent.open{display:block}

/* toolbar */
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;font-size:13.5px;color:var(--ink)}
.tbtn:hover{border-color:var(--accent)}
a.tbtn{text-decoration:none}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tbtn.ghost{border-color:transparent;background:transparent}
.tbtn svg.i{width:17px;height:17px}

/* ---------- feed posts ---------- */
.post{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.post-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;flex:none;font-family:var(--f-display)}
.who{min-width:0;flex:1}
.who b{display:block;font-size:14.5px}
.who span{font-size:12.5px;color:var(--muted)}
.post .rt{font-size:calc(var(--read-size) - 1px)}
.post-f{display:flex;gap:4px;align-items:center;border-top:1px solid var(--line);margin-top:8px;padding-top:8px;flex-wrap:wrap}
.post-f .tbtn{border:0;background:transparent;padding:6px 8px;color:var(--muted)}
.post-f .tbtn[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.liked{color:var(--bad)!important}
.liked svg{fill:currentColor}
.comments{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.cmt{display:flex;gap:9px}
.cmt .av{width:30px;height:30px;font-size:12px}
.cmt-b{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:8px 12px;min-width:0;flex:1}
.cmt-b b{font-size:13px}
.cmt-b .rt{font-size:calc(var(--read-size) - 3px);line-height:1.6}
.feed-end{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:6px 0 18px}
.feed-end::before,.feed-end::after{content:"";flex:1;height:1px;background:var(--line)}
.readmark{font-size:12px;color:var(--good);display:inline-flex;gap:4px;align-items:center}

/* ---------- article list ---------- */
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
button.card:hover{border-color:var(--accent)}
.card h3{font-size:17.5px;font-family:var(--f-read);font-weight:600;letter-spacing:-.005em}
.card .sub{font-size:13px;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.live{border-style:dashed}

/* article page */
.art-head{margin:6px 0 14px}
.art-head h1{font-family:var(--f-read);font-size:28px;font-weight:600;letter-spacing:-.01em;margin:8px 0 4px}
.art-head .tsub{color:var(--muted);font-size:14px}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);padding:4px 0;font-size:14px}
.stickytools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);z-index:10;background:var(--bg);padding:8px 0;margin-bottom:8px;border-bottom:1px solid var(--line)}
#artBody .rt p:first-child::first-letter{font-size:3.1em;float:left;line-height:.9;margin:.06em .08em 0 0;font-weight:600;color:var(--accent)}
.endbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:20px}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.q .qtype{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700}
.q .qt{font-family:var(--f-read);font-size:17px;font-weight:600;margin:6px 0 2px}
.q .qth{color:var(--muted);font-size:13.5px;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px;color:var(--ink)}
.opt .k{font-weight:700;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--surface-2);font-size:12.5px;flex:none}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt[disabled]{cursor:default}
.expl{margin-top:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.score{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}

/* novel */
.genre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cover{position:relative;border-radius:16px;padding:18px 16px 16px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;text-align:left;border:1px solid var(--line);color:var(--ink);background:var(--surface);overflow:hidden}
.cover::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--g)}
.cover .gname{position:absolute;top:16px;left:16px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--g)}
.cover h3{font-family:var(--f-read);font-size:20px;font-weight:600;font-style:italic}
.cover p{margin:0;font-size:13px;color:var(--muted)}
.novel .rt{font-size:calc(var(--read-size) + 1px)}
.novel .rt p{text-indent:1.4em;margin-bottom:.5em}
.novel .rt p:first-child{text-indent:0}
.novel .rt p.scene{text-indent:0;text-align:center;letter-spacing:.6em;color:var(--muted)}
.progress{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}

/* flashcards */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.flash{perspective:1200px;margin:6px 0 14px}
.fc{position:relative;min-height:290px;border-radius:20px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc-side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;overflow:auto}
.fc-back{transform:rotateY(180deg)}
.fc .big{font-family:var(--f-read);font-size:36px;font-weight:600;overflow-wrap:anywhere}
.fc .mean{font-size:20px;font-weight:600}
.fc .ex{font-family:var(--f-read);font-size:15px;color:var(--muted);max-width:52ch}
.fc .hint{font-size:12px;color:var(--muted);position:absolute;bottom:12px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:center;color:var(--ink)}
.grades button small{font-weight:400;color:var(--muted);font-size:11.5px}
.grades .g0{color:var(--bad)} .grades .g3{color:var(--good)}
.wordrow{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.wordrow .wd{flex:1;min-width:0}
.wordrow .wd b{font-family:var(--f-read);font-size:16.5px}
.wordrow .wd div{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* dictionary */
.search{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 12px;margin-bottom:12px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;border:0;background:transparent;padding:9px 0;outline:none;min-width:0;font-size:16px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.entry h2{font-family:var(--f-read);font-size:24px;font-weight:600}
.entry .m{margin:6px 0 0;font-size:15.5px}
.entry .m.en{color:var(--muted)}
.exs{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.exs blockquote{margin:0;border-left:3px solid var(--accent);padding:2px 0 2px 10px;font-family:var(--f-read);font-size:15px}
.exs blockquote small{display:block;font-family:var(--f-ui);color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* settings */
.set-group{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.set-group h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 16px 4px;font-family:var(--f-ui)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.set-group h2+.row{border-top:0}
.row label{flex:1;min-width:150px}
.row label small{display:block;color:var(--muted);font-size:12.5px}
.row select,.row input[type="text"],textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s;pointer-events:none}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{left:21px}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
input[type="range"]{accent-color:var(--accent);width:170px;max-width:100%}
.swatches{display:flex;gap:8px}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar-h)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs .dot{position:absolute;top:8px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;font-weight:700}

/* ---------- word sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.sheet.on{transform:none;pointer-events:auto}
.sheet-in{max-width:640px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:78vh;overflow:auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sh-word{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sh-word h2{font-family:var(--f-read);font-size:30px;font-weight:600}
.sh-mean{font-size:18px;font-weight:600;margin:8px 0 0}
.sh-mean2{color:var(--muted);margin:2px 0 0}
.sh-sent{margin-top:14px;background:var(--bg);border-radius:12px;padding:12px 14px}

{ id:"fr-r1", cat:"health", lvl:"A2", src:"สุขภาพ", title:["Pourquoi dormir est si important","Why sleeping is so important","ทำไมการนอนจึงสำคัญนัก"],
  p:[[["Chaque nuit, notre corps travaille pendant que nous dormons.","Every night, our body works while we sleep.","ทุกคืน ร่างกายของเราทำงานในขณะที่เรานอนหลับ"],
      ["Le cerveau classe les informations de la journée et garde les plus importantes.","The brain sorts the day's information and keeps the most important.","สมองจัดระเบียบข้อมูลของวันและเก็บส่วนที่สำคัญที่สุดไว้"],
      ["Les muscles se réparent et le système immunitaire devient plus fort.","Muscles repair themselves and the immune system becomes stronger.","กล้ามเนื้อซ่อมแซมตัวเองและระบบภูมิคุ้มกันแข็งแรงขึ้น"]],
     [["Un adulte a besoin de sept à neuf heures de sommeil.","An adult needs seven to nine hours of sleep.","ผู้ใหญ่ต้องการการนอนหลับเจ็ดถึงเก้าชั่วโมง"],
      ["Pourtant, beaucoup de personnes dorment moins de six heures, surtout à cause des écrans.","Yet many people sleep less than six hours, especially because of screens.","อย่างไรก็ตาม หลายคนนอนน้อยกว่าหกชั่วโมง ส่วนใหญ่เป็นเพราะหน้าจอ"],
      ["La lumière bleue des téléphones dit au cerveau qu'il fait encore jour.","The blue light of phones tells the brain that it is still daytime.","แสงสีฟ้าจากโทรศัพท์บอกสมองว่ายังเป็นเวลากลางวันอยู่"]],
     [["Quand on dort mal, on est fatigué, on mange plus de sucre et on se concentre difficilement.","When you sleep badly, you are tired, you eat more sugar and you concentrate with difficulty.","เมื่อนอนไม่ดี เราจะเหนื่อย กินน้ำตาลมากขึ้น และมีสมาธิได้ยาก"],
      ["Les médecins conseillent donc de se coucher à la même heure et d'éteindre les écrans une heure avant.","Doctors therefore advise going to bed at the same time and turning off screens an hour before.","แพทย์จึงแนะนำให้เข้านอนเวลาเดิมทุกวันและปิดหน้าจอก่อนนอนหนึ่งชั่วโมง"],
      ["Dormir n'est pas une perte de temps : c'est un investissement pour la santé.","Sleeping is not a waste of time: it's an investment in health.","การนอนไม่ใช่การเสียเวลา แต่เป็นการลงทุนเพื่อสุขภาพ"]]],
  v:{"corps":"A2|n|body|ร่างกาย","cerveau":"A2|n|brain|สมอง","classe":"B1|v|sorts, classifies|จัดหมวดหมู่|classer","informations":"A2|n|information|ข้อมูล|information","muscles":"A2|n|muscles|กล้ามเนื้อ|muscle","réparent":"B1|v|repair|ซ่อมแซม|réparer","système immunitaire":"B1|n|immune system|ระบบภูมิคุ้มกัน","immunitaire":"B1|adj|immune|เกี่ยวกับภูมิคุ้มกัน","besoin":"A2|n|need|ความต้องการ","sommeil":"A2|n|sleep|การนอนหลับ","écrans":"A2|n|screens|หน้าจอ|écran","lumière":"A2|n|light|แสง","fatigué":"A1|adj|tired|เหนื่อย","sucre":"A1|n|sugar|น้ำตาล","concentre":"B1|v|concentrates|มีสมาธิ|concentrer","difficilement":"B1|adv|with difficulty|อย่างยากลำบาก","médecins":"A2|n|doctors|แพทย์|médecin","conseillent":"B1|v|advise|แนะนำ|conseiller","coucher":"A2|v|to go to bed (se coucher)|เข้านอน","éteindre":"B1|v|to turn off|ปิด (ไฟ/เครื่อง)","perte":"B1|n|loss, waste|การสูญเสีย","investissement":"B2|n|investment|การลงทุน","santé":"A2|n|health|สุขภาพ"},
  q:[{t:"main",q:["Quelle est l'idée principale du texte ?","ใจความสำคัญของบทความคืออะไร"],o:["Les écrans sont dangereux pour les enfants.","Le sommeil est essentiel au bon fonctionnement du corps et du cerveau.","Les adultes dorment trop.","Il faut manger moins de sucre le soir."],a:1,x:"ทั้งบทความอธิบายว่าระหว่างนอน สมองและร่างกายทำงานอย่างไร และปิดท้ายว่าการนอนคือ “การลงทุนเพื่อสุขภาพ” ข้อ A และ D เป็นเพียงรายละเอียดย่อย"},
     {t:"detail",q:["Selon le texte, que fait le cerveau pendant la nuit ?","ตามบทความ สมองทำอะไรในตอนกลางคืน"],o:["Il se repose complètement.","Il produit de la lumière bleue.","Il trie les informations et garde les plus importantes.","Il répare les muscles."],a:2,x:"ประโยค “Le cerveau classe les informations… et garde les plus importantes” ส่วนการซ่อมกล้ามเนื้อเป็นหน้าที่ของร่างกาย ไม่ใช่สมองโดยตรง"},
     {t:"not",q:["Laquelle de ces affirmations N'EST PAS conforme au texte ?","ข้อใดไม่สอดคล้องกับบทความ"],o:["Un adulte a besoin d'au moins sept heures de sommeil.","La lumière des écrans perturbe le rythme du cerveau.","Mal dormir donne envie de manger sucré.","Les médecins conseillent de dormir avec le téléphone allumé."],a:3,x:"บทความบอกให้ “ปิดหน้าจอก่อนนอนหนึ่งชั่วโมง” ดังนั้นข้อ D ขัดแย้งกับเนื้อหา"},
     {t:"vocab",q:["Dans le texte, le mot « investissement » signifie que dormir…","คำว่า “investissement” ในบทความสื่อว่าการนอน…"],o:["coûte cher.","apporte des bénéfices plus tard.","prend trop de temps.","est une obligation légale."],a:1,x:"การลงทุน = ใส่บางอย่างลงไปตอนนี้เพื่อได้ผลตอบแทนภายหลัง ผู้เขียนใช้เปรียบเทียบตรงข้ามกับ “perte de temps” (การเสียเวลา)"},
     {t:"infer",q:["Que peut-on déduire du texte ?","อนุมานจากบทความได้ว่าอย่างไร"],o:["Regarder son téléphone au lit peut retarder l'endormissement.","Dormir neuf heures est mauvais pour la santé.","Les muscles ne travaillent que le jour.","Le sucre aide à mieux dormir."],a:0,x:"บทความบอกว่าแสงสีฟ้า “บอกสมองว่ายังเป็นกลางวัน” จึงอนุมานได้ว่าการดูมือถือบนเตียงทำให้หลับช้าลง แม้ไม่ได้เขียนไว้ตรงๆ"}]},
{ id:"fr-r2", cat:"science", lvl:"B2", src:"วิทยาศาสตร์", title:["La pieuvre, une intelligence venue d'ailleurs","The octopus, an intelligence from elsewhere","ปลาหมึกยักษ์ ความฉลาดที่มาจากอีกโลก"],
  p:[[["Parmi les invertébrés, la pieuvre fait figure d'exception.","Among invertebrates, the octopus stands out as an exception.","ในบรรดาสัตว์ไม่มีกระดูกสันหลัง ปลาหมึกยักษ์ถือเป็นข้อยกเว้น"],
      ["Elle est capable d'ouvrir un bocal, de reconnaître des visages humains et même de s'échapper de son aquarium pour aller chasser dans un bassin voisin.","It is able to open a jar, recognise human faces and even escape from its aquarium to go hunting in a neighbouring tank.","มันเปิดขวดโหลได้ จำใบหน้ามนุษย์ได้ และถึงขั้นหนีออกจากตู้ไปล่าเหยื่อในบ่อข้างๆ"]],
     [["Ce qui fascine les chercheurs, c'est surtout l'organisation de son système nerveux.","What fascinates researchers above all is the organisation of its nervous system.","สิ่งที่ทำให้นักวิจัยทึ่งที่สุดคือการจัดระบบประสาทของมัน"],
      ["Sur ses quelque cinq cents millions de neurones, environ deux tiers se trouvent non pas dans le cerveau, mais dans les bras.","Of its roughly five hundred million neurons, about two thirds are located not in the brain, but in the arms.","จากเซลล์ประสาทราวห้าร้อยล้านเซลล์ ประมาณสองในสามไม่ได้อยู่ในสมอง แต่อยู่ในหนวด"],
      ["Chaque bras peut ainsi goûter, toucher et prendre des décisions simples de manière relativement autonome.","Each arm can thus taste, touch and make simple decisions relatively autonomously.","หนวดแต่ละเส้นจึงรับรส สัมผัส และตัดสินใจง่ายๆ ได้ค่อนข้างเป็นอิสระ"]],
     [["Cette intelligence est d'autant plus surprenante que la pieuvre vit rarement plus de deux ans et ne connaît pas ses parents.","This intelligence is all the more surprising as the octopus rarely lives more than two years and does not know its parents.","ความฉลาดนี้ยิ่งน่าประหลาดใจ เพราะปลาหมึกยักษ์มักมีชีวิตไม่เกินสองปีและไม่รู้จักพ่อแม่ของตัวเอง"],
      ["Elle n'apprend donc rien de ses aînés : tout ce qu'elle sait, elle le découvre seule.","So it learns nothing from its elders: everything it knows, it discovers alone.","มันจึงไม่ได้เรียนรู้อะไรจากรุ่นก่อนเลย ทุกสิ่งที่รู้ มันค้นพบเองทั้งหมด"],
      ["Pour certains biologistes, elle constitue la preuve que l'intelligence complexe est apparue plusieurs fois au cours de l'évolution, par des chemins très différents.","For some biologists, it is proof that complex intelligence appeared several times during evolution, by very different paths.","สำหรับนักชีววิทยาบางคน มันคือหลักฐานว่าความฉลาดที่ซับซ้อนเกิดขึ้นหลายครั้งในวิวัฒนาการ ผ่านเส้นทางที่ต่างกันมาก"]],
     [["Ces découvertes soulèvent aussi des questions éthiques.","These discoveries also raise ethical questions.","การค้นพบเหล่านี้ยังจุดประเด็นคำถามเชิงจริยธรรมด้วย"],
      ["Plusieurs pays ont récemment reconnu que les céphalopodes peuvent ressentir la douleur, ce qui remet en cause les projets d'élevage industriel de pieuvres.","Several countries have recently recognised that cephalopods can feel pain, which calls into question plans for industrial octopus farming.","หลายประเทศเพิ่งยอมรับว่าสัตว์จำพวกหมึกรู้สึกเจ็บปวดได้ ทำให้โครงการฟาร์มเลี้ยงปลาหมึกยักษ์แบบอุตสาหกรรมถูกตั้งคำถาม"]]],

  q:[{t:"main",q:["Quel est le sujet principal de ce texte ?","หัวข้อหลักของบทความนี้คืออะไร"],o:["Les techniques d'élevage des pieuvres.","Les caractéristiques étonnantes de l'intelligence de la pieuvre et leurs implications.","La comparaison entre le cerveau humain et celui de la pieuvre.","La durée de vie des invertébrés marins."],a:1,x:"บทความพูดถึงความฉลาด → โครงสร้างประสาท → ความน่าทึ่งที่มันเรียนรู้เอง → ผลทางจริยธรรม ข้อ B ครอบคลุมทุกย่อหน้า ส่วนข้ออื่นแคบเกินไปหรือไม่ได้กล่าวถึง"},
     {t:"detail",q:["Où se trouve la majorité des neurones de la pieuvre ?","เซลล์ประสาทส่วนใหญ่ของปลาหมึกยักษ์อยู่ที่ใด"],o:["Dans son cerveau.","Dans ses yeux.","Dans ses bras.","Répartie également dans tout le corps."],a:2,x:"“environ deux tiers se trouvent non pas dans le cerveau, mais dans les bras” สองในสามคือส่วนใหญ่"},
     {t:"not",q:["Quelle affirmation est CONTRAIRE au texte ?","ข้อใดขัดแย้งกับบทความ"],o:["La pieuvre peut identifier certains humains.","La pieuvre apprend en observant ses parents.","Les bras de la pieuvre peuvent agir de façon assez indépendante.","Certains pays reconnaissent que les céphalopodes souffrent."],a:1,x:"บทความบอกว่ามัน “ไม่รู้จักพ่อแม่” และ “ไม่ได้เรียนรู้อะไรจากรุ่นก่อน” ข้อ B จึงขัดกับเนื้อหา"},
     {t:"infer",q:["Pourquoi l'auteur dit-il que l'intelligence de la pieuvre est « d'autant plus surprenante » ?","ทำไมผู้เขียนจึงบอกว่าความฉลาดของปลาหมึกยักษ์ “ยิ่งน่าประหลาดใจ”"],o:["Parce qu'elle a très peu de neurones.","Parce qu'elle l'acquiert sans transmission et en très peu de temps.","Parce qu'elle vit dans des aquariums.","Parce qu'elle est un mammifère."],a:1,x:"ประโยคถัดมาอธิบายว่ามันอายุสั้น (ไม่เกิน 2 ปี) และไม่ได้เรียนจากรุ่นก่อน ความฉลาดจึงได้มาเองในเวลาสั้นๆ ข้อ A ผิดเพราะ 500 ล้านเซลล์ไม่ใช่น้อย"},
     {t:"purpose",q:["Quelle est la fonction du dernier paragraphe ?","ย่อหน้าสุดท้ายมีหน้าที่อะไร"],o:["Résumer les expériences scientifiques citées.","Montrer les conséquences concrètes de ces découvertes sur la manière de traiter l'animal.","Contredire les biologistes.","Présenter une recette de cuisine."],a:1,x:"ย่อหน้าสุดท้ายเชื่อมความรู้ทางวิทยาศาสตร์ไปสู่ผลในโลกจริง คือกฎหมายและข้อถกเถียงเรื่องฟาร์มปลาหมึก ไม่ได้สรุปหรือโต้แย้งนักชีววิทยา"}]},
{ id:"fr-r3", cat:"env", lvl:"C1", src:"สิ่งแวดล้อม/สังคม", title:["Îlots de chaleur : la ville face à ses propres excès","Heat islands: the city facing its own excesses","เกาะความร้อน: เมืองที่ต้องเผชิญความล้นเกินของตัวเอง"],
  p:[[["Lors des canicules, il n'est pas rare que le centre d'une grande ville affiche plusieurs degrés de plus que la campagne environnante.","During heatwaves, it is not unusual for the centre of a big city to show several degrees more than the surrounding countryside.","ช่วงคลื่นความร้อน ไม่ใช่เรื่องแปลกที่ใจกลางเมืองใหญ่จะร้อนกว่าชนบทรอบๆ หลายองศา"],
      ["Ce phénomène, baptisé « îlot de chaleur urbain », tient moins au climat qu'à la façon dont nous avons bâti nos villes.","This phenomenon, called the 'urban heat island', is due less to the climate than to the way we have built our cities.","ปรากฏการณ์นี้ที่เรียกว่า “เกาะความร้อนในเมือง” เกิดจากวิธีที่เราสร้างเมืองมากกว่าจากสภาพภูมิอากาศ"]],
     [["L'asphalte et le béton absorbent le rayonnement solaire pendant la journée, puis le restituent la nuit, empêchant l'air de se rafraîchir.","Asphalt and concrete absorb solar radiation during the day, then release it at night, preventing the air from cooling.","ยางมะตอยและคอนกรีตดูดซับรังสีดวงอาทิตย์ตอนกลางวัน แล้วคายออกมาตอนกลางคืน ทำให้อากาศไม่เย็นลง"],
      ["À cela s'ajoutent la chaleur dégagée par les climatiseurs et la circulation, ainsi que la rareté de la végétation, qui, par l'évaporation, joue pourtant le rôle d'un climatiseur naturel.","Added to this are the heat given off by air conditioners and traffic, as well as the scarcity of vegetation, which, through evaporation, nevertheless acts as a natural air conditioner.","นอกจากนี้ยังมีความร้อนจากเครื่องปรับอากาศและการจราจร รวมถึงการขาดแคลนพืชพรรณ ซึ่งที่จริงแล้วทำหน้าที่เป็นเครื่องปรับอากาศธรรมชาติผ่านการระเหยของน้ำ"],
      ["Le paradoxe est cruel : plus il fait chaud, plus on climatise, et plus on réchauffe la rue.","The paradox is cruel: the hotter it is, the more we air-condition, and the more we heat up the street.","ความย้อนแย้งนี้โหดร้าย ยิ่งร้อนก็ยิ่งเปิดแอร์ และยิ่งทำให้ถนนร้อนขึ้น"]],
     [["Les conséquences ne sont pas seulement inconfortables ; elles sont sanitaires et sociales.","The consequences are not only uncomfortable; they are health-related and social.","ผลกระทบไม่ได้แค่ทำให้ไม่สบายตัว แต่ยังเกี่ยวกับสุขภาพและสังคมด้วย"],
      ["Les personnes âgées et les habitants de logements mal isolés, souvent les plus modestes, sont les premiers exposés.","Elderly people and residents of poorly insulated housing, often the poorest, are the first exposed.","ผู้สูงอายุและผู้อยู่อาศัยในบ้านที่กันความร้อนได้ไม่ดี ซึ่งมักเป็นผู้มีรายได้น้อย เป็นกลุ่มแรกที่ได้รับผลกระทบ"]],
     [["Face à ce constat, plusieurs métropoles misent sur des solutions dites « fondées sur la nature » : cours d'école végétalisées, toitures blanches, rues ombragées.","Faced with this observation, several cities are betting on so-called 'nature-based' solutions: greened schoolyards, white roofs, shaded streets.","เมื่อเห็นเช่นนี้ หลายมหานครจึงหันมาใช้ “แนวทางที่อิงธรรมชาติ” เช่น ลานโรงเรียนที่ปลูกต้นไม้ หลังคาสีขาว และถนนที่มีร่มเงา"],
      ["Ces mesures, si elles ne suffiront pas à elles seules à compenser le réchauffement global, rappellent qu'une partie de la solution se trouve sous nos pieds.","These measures, while they will not on their own be enough to offset global warming, remind us that part of the solution lies beneath our feet.","มาตรการเหล่านี้แม้ลำพังจะไม่พอชดเชยภาวะโลกร้อน แต่ก็เตือนให้รู้ว่าทางออกส่วนหนึ่งอยู่ใต้เท้าเรานี่เอง"]]],

"toitures":"C1|n|roofs|หลังคา|toiture","ombragées":"C1|adj|shaded|มีร่มเงา|ombragé","mesures":"B2|n|measures|มาตรการ|mesure","suffiront":"B2|v|will suffice|จะเพียงพอ|suffire","compenser":"C1|v|to offset, compensate|ชดเชย","réchauffement":"B2|n|warming|ภาวะร้อนขึ้น","rappellent":"B1|v|remind|เตือนให้นึกถึง|rappeler","pieds":"A1|n|feet|เท้า|pied"},
  q:[{t:"main",q:["Quelle est la thèse centrale du texte ?","ข้อเสนอหลักของบทความคืออะไร"],o:["Le réchauffement climatique est la seule cause de la chaleur en ville.","Les îlots de chaleur résultent largement de choix d'urbanisme, sur lesquels on peut agir.","La climatisation est la meilleure réponse aux canicules.","La campagne souffre davantage des canicules que la ville."],a:1,x:"ประโยค “tient moins au climat qu'à la façon dont nous avons bâti nos villes” และย่อหน้าสุดท้าย (“ทางออกอยู่ใต้เท้าเรา”) ยืนยันว่าเป็นผลจากการออกแบบเมืองที่แก้ไขได้ ข้อ A ขัดตรงๆ"},
     {t:"detail",q:["Selon l'auteur, pourquoi l'air urbain se rafraîchit-il mal la nuit ?","ตามผู้เขียน ทำไมอากาศในเมืองจึงเย็นลงยากในตอนกลางคืน"],o:["Parce que le vent est plus fort en ville.","Parce que les matériaux urbains relâchent la chaleur stockée le jour.","Parce que les arbres produisent de la chaleur.","Parce que le soleil se couche plus tard en ville."],a:1,x:"“L'asphalte et le béton absorbent… puis le restituent la nuit” วัสดุเก็บความร้อนตอนกลางวันแล้วคายออกตอนกลางคืน"},
     {t:"vocab",q:["Que signifie « Le paradoxe est cruel » dans le contexte ?","“Le paradoxe est cruel” ในบริบทนี้หมายความว่าอะไร"],o:["La solution adoptée par les habitants aggrave le problème qu'elle cherche à résoudre.","Les canicules sont de plus en plus rares.","La végétation coûte trop cher.","Les climatiseurs sont interdits."],a:0,x:"ความย้อนแย้งคือ การเปิดแอร์ (วิธีแก้ร้อน) ปล่อยความร้อนออกสู่ถนน ทำให้ปัญหาแย่ลง — “plus on climatise, plus on réchauffe la rue”"},
     {t:"not",q:["Laquelle de ces idées N'APPARAÎT PAS dans le texte ?","ข้อใดไม่ปรากฏในบทความ"],o:["Les populations modestes sont plus vulnérables.","La végétation rafraîchit l'air par évaporation.","Les toitures blanches font partie des solutions envisagées.","Les solutions naturelles suffiront à stopper le réchauffement global."],a:3,x:"ผู้เขียนบอกตรงกันข้ามว่ามาตรการเหล่านี้ “ne suffiront pas à elles seules” (ลำพังไม่พอ) ข้อ D จึงไม่สอดคล้อง ข้อนี้ต้องอ่านโครงสร้าง si…ne…pas ให้แม่น"},
     {t:"tone",q:["Quelle attitude l'auteur adopte-t-il dans la conclusion ?","ในบทสรุป ผู้เขียนมีทัศนคติอย่างไร"],o:["Un optimisme naïf : le problème sera bientôt réglé.","Un pessimisme total : rien ne peut être fait.","Un réalisme mesuré : ces mesures sont utiles mais limitées.","Une indifférence complète."],a:2,x:"ผู้เขียนยอมรับข้อจำกัด (ไม่พอชดเชยโลกร้อน) แต่ยังเห็นประโยชน์ (เป็นส่วนหนึ่งของทางออก) จึงเป็นความสมจริงแบบชั่งน้ำหนัก ไม่ใช่มองโลกแง่ดีหรือร้ายสุดขั้ว"}]}

  p:[[["L'hôtel des Mouettes n'avait que quatorze chambres, et depuis trente ans, Madame Arnaud connaissait chacune d'elles mieux que son propre visage.","The Hôtel des Mouettes had only fourteen rooms, and for thirty years, Madame Arnaud had known each of them better than her own face.","โรงแรมเดมูแอ็ตมีเพียงสิบสี่ห้อง และตลอดสามสิบปี มาดามอาร์โนรู้จักทุกห้องดีกว่าใบหน้าของตัวเอง"],

     [["La porte de la chambre 14 était entrouverte.","The door of room 14 was ajar.","ประตูห้อง 14 แง้มอยู่"],

     [["L'inspecteur Rivière arriva vers midi, trempé par une pluie qui ne voulait pas s'arrêter.","Inspector Rivière arrived around noon, soaked by a rain that would not stop.","สารวัตรริวีแยร์มาถึงราวเที่ยง ตัวเปียกโชกจากฝนที่ไม่ยอมหยุด"],

  p:[[["Chaque jeudi, à dix-huit heures, Léa traversait le pont des Arts et s'arrêtait devant la même boîte verte, sur le quai de la Seine.","Every Thursday, at six in the evening, Léa crossed the Pont des Arts and stopped in front of the same green box on the bank of the Seine.","ทุกวันพฤหัสบดี หกโมงเย็น เลอาเดินข้ามสะพานเดซาร์ แล้วหยุดอยู่หน้ากล่องสีเขียวใบเดิมริมแม่น้ำแซน"],
      ["Le bouquiniste, un jeune homme aux lunettes rondes, ne parlait presque jamais.","The bookseller, a young man with round glasses, almost never spoke.","คนขายหนังสือเก่าเป็นชายหนุ่มใส่แว่นกลม แทบไม่เคยพูดอะไรเลย"],

     ["Je gagne trois fois moins, je n'ai jamais aussi bien dormi, et je ne prétends pas que ce choix convienne à tout le monde.","I earn three times less, I've never slept so well, and I'm not claiming this choice suits everyone.","ฉันได้เงินน้อยลงสามเท่า แต่ไม่เคยนอนหลับสบายขนาดนี้ และไม่ได้อ้างว่าทางเลือกนี้เหมาะกับทุกคน"],

  c:[{u:"Mathieu", s:[["Merci de mentionner les économies ; on romantise trop souvent ces reconversions.","Thanks for mentioning savings; these career changes are too often romanticised.","ขอบคุณที่พูดถึงเรื่องเงินเก็บ คนมักมองการเปลี่ยนสายอาชีพแบบนี้อย่างโรแมนติกเกินไป"]]},
     {u:"Sophie R.", s:[["J'ai fait l'inverse : de pâtissière à juriste. Comme quoi, il n'y a pas de bon sens unique !","I did the opposite: from pastry chef to legal adviser. Which goes to show, there's no single right direction!","ฉันทำกลับกันเลย จากคนทำขนมมาเป็นนักกฎหมาย แสดงว่าไม่มีทิศทางไหนถูกอยู่ทางเดียว!"]]}],

     ["Chaque année, le 21 juin, tout le monde peut jouer dans la rue, gratuitement.","Every year, on 21 June, everyone can play in the street, for free.","ทุกปีในวันที่ 21 มิถุนายน ใครก็เล่นดนตรีบนถนนได้ฟรี"],

{ id:"fr-r4", cat:"science", lvl:"A2", src:"ดาราศาสตร์", title:["La Lune s'éloigne de nous","The Moon is moving away from us","ดวงจันทร์กำลังเคลื่อนห่างจากเรา"],
  p:[[["Chaque année, la Lune s'éloigne de la Terre d'environ trois centimètres et huit millimètres.","Every year, the Moon moves away from the Earth by about three centimetres and eight millimetres.","ทุกปี ดวงจันทร์เคลื่อนห่างจากโลกประมาณสามเซนติเมตรแปดมิลลิเมตร"],
      ["C'est à peu près la vitesse à laquelle poussent nos ongles.","That's about the speed at which our nails grow.","ใกล้เคียงกับความเร็วที่เล็บของเรายาวขึ้น"]],
     [["Comment le savons-nous ?","How do we know?","เรารู้ได้อย่างไร?"],
      ["En 1969, les astronautes de la mission Apollo 11 ont posé des miroirs sur la Lune.","In 1969, the astronauts of the Apollo 11 mission placed mirrors on the Moon.","ในปี 1969 นักบินอวกาศของภารกิจอะพอลโล 11 ได้วางกระจกไว้บนดวงจันทร์"],
      ["Depuis, des scientifiques envoient un rayon laser vers ces miroirs et mesurent le temps du retour.","Since then, scientists have been sending a laser beam towards these mirrors and measuring the return time.","ตั้งแต่นั้นมา นักวิทยาศาสตร์ยิงลำแสงเลเซอร์ไปยังกระจกเหล่านั้นแล้ววัดเวลาที่แสงสะท้อนกลับมา"]],
     [["La cause de cet éloignement, ce sont les marées.","The cause of this moving away is the tides.","สาเหตุของการเคลื่อนห่างนี้คือน้ำขึ้นน้ำลง"],
      ["Elles freinent un peu la rotation de la Terre, et les journées deviennent très lentement plus longues.","They slow the Earth's rotation a little, and days become very slowly longer.","มันทำให้การหมุนของโลกช้าลงเล็กน้อย และวันก็ยาวขึ้นอย่างช้ามากๆ"],
      ["Pas de panique : dans mille ans, la différence sera encore minuscule.","Don't panic: in a thousand years, the difference will still be tiny.","ไม่ต้องตกใจ อีกพันปีความต่างก็ยังเล็กน้อยมาก"]]],
  v:{"lune":"A1|n|moon|ดวงจันทร์","éloigne":"B1|v|moves away (s'éloigner)|เคลื่อนห่างออกไป|éloigner","terre":"A1|n|Earth, ground|โลก, พื้นดิน","environ":"A2|adv|about, roughly|ประมาณ","centimètres":"A1|n|centimetres|เซนติเมตร|centimètre","millimètres":"A2|n|millimetres|มิลลิเมตร|millimètre","à peu près":"B1|expr|approximately|ประมาณ","vitesse":"A2|n|speed|ความเร็ว","poussent":"B1|v|grow|งอก, ยาวขึ้น|pousser","ongles":"B1|n|nails|เล็บ|ongle","astronautes":"A2|n|astronauts|นักบินอวกาศ|astronaute","mission":"B1|n|mission|ภารกิจ","posé":"B1|v|placed|วาง|poser","miroirs":"A2|n|mirrors|กระจกเงา|miroir","scientifiques":"B1|n|scientists|นักวิทยาศาสตร์|scientifique","envoient":"A2|v|send|ส่ง|envoyer","rayon":"B1|n|beam, ray|ลำแสง","mesurent":"B1|v|measure|วัด|mesurer","retour":"A2|n|return|การกลับมา","cause":"B1|n|cause|สาเหตุ","éloignement":"B2|n|moving away, distance|การเคลื่อนห่าง","marées":"B2|n|tides|น้ำขึ้นน้ำลง|marée","freinent":"B2|v|slow down, brake|ชะลอ|freiner","rotation":"B2|n|rotation|การหมุน","lentement":"A2|adv|slowly|อย่างช้าๆ","longues":"A1|adj|long (fem.)|ยาว|long","panique":"B1|n|panic|ความตื่นตระหนก","différence":"A2|n|difference|ความแตกต่าง","minuscule":"B2|adj|tiny|เล็กจิ๋ว"},
  q:[{t:"main",q:["De quoi parle principalement ce texte ?","บทความพูดถึงอะไรเป็นหลัก"],o:["Des voyages des astronautes vers la Lune.","Du fait que la Lune s'éloigne lentement de la Terre, et pourquoi.","De la croissance des ongles.","D'un danger immédiat pour la Terre."],a:1,x:"ทั้งบทความอธิบายว่าดวงจันทร์ห่างออกไป วัดได้อย่างไร และเพราะอะไร ส่วน A และ C เป็นแค่รายละเอียดหรือการเปรียบเทียบ"},
     {t:"detail",q:["Comment les scientifiques mesurent-ils la distance ?","นักวิทยาศาสตร์วัดระยะทางอย่างไร"],o:["Avec un grand télescope sur un bateau.","En envoyant un laser sur des miroirs posés sur la Lune.","En regardant les marées.","Grâce aux ongles des astronautes."],a:1,x:"ย่อหน้าที่สอง: ยิงเลเซอร์ไปยังกระจกที่ทีมอะพอลโล 11 วางไว้ แล้ววัดเวลาที่แสงกลับมา"},
     {t:"vocab",q:["Dans le texte, « freinent » veut dire…","ในบทความ “freinent” หมายถึง…"],o:["accélèrent","ralentissent","arrêtent complètement","mesurent"],a:1,x:"freiner = เบรก/ชะลอ ประโยคถัดไปยืนยันว่า วันยาวขึ้น ซึ่งแปลว่าโลกหมุนช้าลง ไม่ได้หยุดสนิท"},
     {t:"not",q:["Quelle phrase est FAUSSE selon le texte ?","ข้อใดผิดตามบทความ"],o:["La Lune s'éloigne d'environ 3,8 cm par an.","Les marées sont la cause de l'éloignement.","Les journées raccourcissent.","Les miroirs ont été posés en 1969."],a:2,x:"บทความบอกว่าวัน ‘deviennent plus longues’ (ยาวขึ้น) ไม่ใช่สั้นลง (raccourcir)"},
     {t:"tone",q:["Quel est le ton de la dernière phrase ?","ประโยคสุดท้ายมีน้ำเสียงอย่างไร"],o:["Alarmiste","Rassurant","Triste","Ironique et critique"],a:1,x:"“Pas de panique” = ไม่ต้องตกใจ ผู้เขียนต้องการทำให้ผู้อ่านสบายใจ (rassurant)"}]},
{ id:"fr-r5", cat:"history", lvl:"B1", src:"ประวัติศาสตร์", title:["Le canal du Midi, le rêve d'un homme obstiné","The Canal du Midi, the dream of a stubborn man","คลองดูมีดี ความฝันของชายผู้ไม่ยอมแพ้"],
  p:[[["Au XVIIe siècle, pour transporter des marchandises de l'Atlantique à la Méditerranée, les bateaux devaient faire le tour de l'Espagne.","In the 17th century, to transport goods from the Atlantic to the Mediterranean, boats had to sail all the way around Spain.","ในศตวรรษที่ 17 เรือที่ขนส่งสินค้าจากมหาสมุทรแอตแลนติกไปทะเลเมดิเตอร์เรเนียนต้องแล่นอ้อมสเปน"],
      ["Le voyage était long, coûteux et dangereux, à cause des tempêtes et des pirates.","The journey was long, costly and dangerous, because of storms and pirates.","การเดินทางยาวนาน แพง และอันตราย เพราะพายุและโจรสลัด"]],
     [["Un homme, Pierre-Paul Riquet, a imaginé une autre solution : creuser un canal à travers le sud de la France.","One man, Pierre-Paul Riquet, imagined another solution: digging a canal across the south of France.","ชายคนหนึ่งชื่อปีแยร์-ปอล ริเกต์ คิดหาทางออกอื่น คือขุดคลองข้ามทางใต้ของฝรั่งเศส"],
      ["Le plus grand problème était de trouver assez d'eau pour remplir le canal au point le plus haut.","The biggest problem was finding enough water to fill the canal at its highest point.","ปัญหาใหญ่ที่สุดคือหาน้ำให้พอเติมคลองตรงจุดที่สูงที่สุด"],
      ["Riquet, qui connaissait parfaitement la région, a eu l'idée de récupérer l'eau des rivières de la Montagne Noire.","Riquet, who knew the region perfectly, had the idea of collecting water from the rivers of the Montagne Noire.","ริเกต์ซึ่งรู้จักพื้นที่เป็นอย่างดี จึงคิดนำน้ำจากแม่น้ำในเทือกเขามงตาญนัวร์มาใช้"]],
     [["Les travaux ont commencé en 1666 et ont mobilisé jusqu'à douze mille ouvriers, dont de nombreuses femmes.","Work began in 1666 and employed up to twelve thousand workers, including many women.","งานก่อสร้างเริ่มในปี 1666 และใช้แรงงานมากถึงหนึ่งหมื่นสองพันคน ในจำนวนนั้นมีผู้หญิงจำนวนมาก"],
      ["Riquet a investi presque toute sa fortune dans le projet.","Riquet invested almost his entire fortune in the project.","ริเกต์ลงทุนทรัพย์สินเกือบทั้งหมดของเขาในโครงการนี้"],
      ["Malheureusement, il est mort en 1680, quelques mois avant l'inauguration.","Unfortunately, he died in 1680, a few months before the inauguration.","น่าเสียดายที่เขาเสียชีวิตในปี 1680 ไม่กี่เดือนก่อนพิธีเปิด"]],
     [["Aujourd'hui, le canal ne sert presque plus au commerce, mais il attire des milliers de touristes en bateau ou à vélo.","Today, the canal is hardly used for trade any more, but it attracts thousands of tourists by boat or by bike.","ทุกวันนี้แทบไม่มีการใช้คลองนี้เพื่อการค้าแล้ว แต่ดึงดูดนักท่องเที่ยวนับพันที่มาล่องเรือหรือปั่นจักรยาน"],
      ["Depuis 1996, il fait partie du patrimoine mondial de l'UNESCO.","Since 1996, it has been part of UNESCO World Heritage.","ตั้งแต่ปี 1996 คลองนี้เป็นส่วนหนึ่งของมรดกโลกของยูเนสโก"]]],
  v:{"canal":"B1|n|canal|คลอง","rêve":"A2|n|dream|ความฝัน","obstiné":"C1|adj|stubborn, persistent|ดื้อรั้น, ไม่ยอมแพ้","siècle":"B1|n|century|ศตวรรษ","transporter":"B1|v|to transport|ขนส่ง","marchandises":"B2|n|goods|สินค้า|marchandise","bateaux":"A1|n|boats|เรือ|bateau","faire le tour":"B1|expr|to go around|ไปรอบๆ, อ้อม","coûteux":"B2|adj|costly|แพง, สิ้นเปลือง","dangereux":"A2|adj|dangerous|อันตราย","tempêtes":"B1|n|storms|พายุ|tempête","pirates":"B1|n|pirates|โจรสลัด|pirate","imaginé":"B1|v|imagined|คิดขึ้น|imaginer","solution":"B1|n|solution|ทางออก","creuser":"B2|v|to dig|ขุด","à travers":"B1|prep|across, through|ข้าม, ผ่าน","sud":"A2|n|south|ทิศใต้","remplir":"B1|v|to fill|เติมให้เต็ม","région":"A2|n|region|ภูมิภาค","récupérer":"B1|v|to collect, recover|เก็บรวบรวม, นำกลับมา","rivières":"A2|n|rivers|แม่น้ำ|rivière","travaux":"B1|n|works (construction)|งานก่อสร้าง","mobilisé":"C1|v|mobilised, employed|ระดมกำลัง|mobiliser","ouvriers":"B1|n|workers|คนงาน|ouvrier","dont":"B2|pron|including, of whom|ซึ่งในนั้น","nombreuses":"B1|adj|numerous|จำนวนมาก|nombreux","investi":"B2|v|invested|ลงทุน|investir","fortune":"B2|n|fortune|ทรัพย์สมบัติ","malheureusement":"A2|adv|unfortunately|น่าเสียดาย","inauguration":"C1|n|inauguration|พิธีเปิด","sert":"B1|v|is used, serves|ใช้สำหรับ|servir","commerce":"B1|n|trade|การค้า","attire":"B1|v|attracts|ดึงดูด|attirer","milliers":"B1|n|thousands|หลายพัน|millier","patrimoine mondial":"B2|n|world heritage|มรดกโลก","patrimoine":"B2|n|heritage|มรดก"},
  q:[{t:"main",q:["Quelle est l'idée principale du texte ?","ใจความสำคัญของบทความคืออะไร"],o:["La vie privée de Pierre-Paul Riquet.","L'histoire de la construction du canal du Midi et ce qu'il est devenu.","Les dangers de la mer Méditerranée.","Le tourisme à vélo en France."],a:1,x:"บทความเล่าตั้งแต่ปัญหาเดิม → แนวคิดของริเกต์ → การก่อสร้าง → สถานะปัจจุบัน B ครอบคลุมที่สุด"},
     {t:"detail",q:["Quel était le plus grand défi technique ?","ความท้าทายทางเทคนิคที่ใหญ่ที่สุดคืออะไร"],o:["Trouver assez d'ouvriers.","Alimenter en eau le point le plus haut du canal.","Éviter les pirates.","Convaincre les touristes."],a:1,x:"“Le plus grand problème était de trouver assez d'eau pour remplir le canal au point le plus haut.”"},
     {t:"not",q:["Quelle information N'EST PAS dans le texte ?","ข้อมูลใดไม่มีในบทความ"],o:["Riquet a utilisé l'eau de la Montagne Noire.","Des femmes ont travaillé sur le chantier.","Le roi a payé tous les travaux.","Le canal est classé à l'UNESCO."],a:2,x:"บทความบอกว่าริเกต์ลงทุนทรัพย์สินของตัวเองเกือบทั้งหมด ไม่ได้พูดถึงกษัตริย์ออกเงินทั้งหมด"},
     {t:"infer",q:["Pourquoi l'auteur qualifie-t-il Riquet d'« obstiné » dans le titre ?","ทำไมผู้เขียนเรียกริเกต์ว่า “obstiné” ในชื่อเรื่อง"],o:["Parce qu'il refusait de parler aux ouvriers.","Parce qu'il a poursuivi son projet malgré les difficultés, jusqu'à y risquer sa fortune.","Parce qu'il n'aimait pas la mer.","Parce qu'il a abandonné le projet."],a:1,x:"เขาแก้ปัญหาน้ำ ลงทุนเงินเกือบทั้งหมด และทำงานจนวาระสุดท้าย คำว่า obstiné ในที่นี้จึงหมายถึงความมุ่งมั่นไม่ยอมแพ้"},
     {t:"vocab",q:["« Le canal ne sert presque plus au commerce » signifie que…","“Le canal ne sert presque plus au commerce” หมายความว่า…"],o:["le commerce y est interdit.","on ne l'utilise pratiquement plus pour transporter des marchandises.","il est fermé.","il sert surtout au commerce."],a:1,x:"ne… presque plus = แทบไม่…อีกแล้ว จึงยังมีการใช้อยู่บ้างแต่น้อยมาก ไม่ได้ถูกห้ามหรือปิด"}]},
{ id:"fr-r6", cat:"news", lvl:"B2", src:"ข่าว/สังคม", title:["Dunkerque, la ville où le bus ne coûte rien","Dunkirk, the town where the bus costs nothing","ดันเคิร์ก เมืองที่ขึ้นรถเมล์ฟรี"],
  p:[[["Depuis septembre 2018, les habitants de l'agglomération de Dunkerque peuvent monter dans n'importe quel bus sans payer un centime.","Since September 2018, residents of the Dunkirk urban area can board any bus without paying a cent.","ตั้งแต่กันยายน 2018 ชาวเมืองดันเคิร์กและปริมณฑลขึ้นรถเมล์คันไหนก็ได้โดยไม่ต้องจ่ายแม้แต่เซนต์เดียว"],
      ["À l'époque, beaucoup y voyaient une mesure électoraliste, condamnée à l'échec.","At the time, many saw it as a vote-winning measure, doomed to failure.","ในตอนนั้น หลายคนมองว่าเป็นนโยบายหาเสียงที่ต้องล้มเหลวแน่นอน"]],
     [["Les premières études ont pourtant montré une hausse nette de la fréquentation, en particulier le week-end.","Yet the first studies showed a clear rise in ridership, especially at weekends.","อย่างไรก็ตาม ผลการศึกษาแรกๆ แสดงให้เห็นว่าจำนวนผู้โดยสารเพิ่มขึ้นชัดเจน โดยเฉพาะในวันหยุดสุดสัปดาห์"],
      ["Une partie des nouveaux voyageurs a déclaré avoir laissé sa voiture au garage, tandis que d'autres, souvent jeunes ou âgés, disent simplement sortir davantage.","Some of the new passengers said they had left their car in the garage, while others, often young or elderly, say they simply go out more.","ผู้โดยสารใหม่ส่วนหนึ่งบอกว่าทิ้งรถยนต์ไว้ในโรงรถ ส่วนคนอื่นๆ ซึ่งมักเป็นวัยรุ่นหรือผู้สูงอายุ บอกว่าแค่ได้ออกจากบ้านบ่อยขึ้น"]],
     [["Le financement repose essentiellement sur une taxe payée par les entreprises locales, la billetterie ne couvrant de toute façon qu'une faible part des coûts.","Funding relies mainly on a tax paid by local businesses, since ticket sales only covered a small share of the costs anyway.","เงินทุนมาจากภาษีที่เก็บจากธุรกิจท้องถิ่นเป็นหลัก เพราะถึงอย่างไรรายได้จากค่าตั๋วก็ครอบคลุมต้นทุนเพียงส่วนน้อย"],
      ["Les critiques font toutefois valoir que la gratuité ne suffit pas : sans lignes fréquentes et rapides, elle attire surtout des piétons et des cyclistes plutôt que des automobilistes.","Critics nevertheless argue that free travel is not enough: without frequent and fast lines, it mainly attracts pedestrians and cyclists rather than motorists.","ฝ่ายวิจารณ์ชี้ว่าการให้ขึ้นฟรีอย่างเดียวไม่พอ หากไม่มีสายรถเมล์ที่มาบ่อยและเร็ว ก็จะดึงดูดคนเดินเท้าและคนปั่นจักรยานมากกว่าคนขับรถยนต์"]],
     [["L'expérience dunkerquoise n'a donc pas valeur de recette universelle.","The Dunkirk experiment is therefore not a universal recipe.","ประสบการณ์ของดันเคิร์กจึงไม่ใช่สูตรสำเร็จที่ใช้ได้ทุกที่"],
      ["Elle prouve en revanche qu'une politique audacieuse, accompagnée d'une refonte du réseau, peut modifier durablement les habitudes de déplacement.","It does prove, however, that a bold policy, accompanied by a redesign of the network, can lastingly change travel habits.","แต่ก็พิสูจน์ว่านโยบายที่กล้าหาญ ควบคู่กับการปรับปรุงเครือข่ายเส้นทางใหม่ทั้งหมด สามารถเปลี่ยนพฤติกรรมการเดินทางได้อย่างยั่งยืน"]]],
  v:{"habitants":"A2|n|inhabitants|ผู้อยู่อาศัย|habitant","agglomération":"C1|n|urban area|เขตเมืองและปริมณฑล","n'importe quel":"B1|expr|any|…ไหนก็ได้","centime":"A2|n|cent|เซนต์","électoraliste":"C2|adj|vote-catching|ที่หวังคะแนนเสียง","condamnée":"B2|adj|doomed|ถูกกำหนดให้ (ล้มเหลว)|condamné","échec":"B1|n|failure|ความล้มเหลว","études":"B1|n|studies|การศึกษา|étude","hausse":"B2|n|rise|การเพิ่มขึ้น","nette":"B2|adj|clear, marked|ชัดเจน|net","fréquentation":"C1|n|ridership, attendance|จำนวนผู้ใช้บริการ","voyageurs":"B1|n|passengers|ผู้โดยสาร|voyageur","déclaré":"B1|v|stated|ระบุ, ประกาศ|déclarer","tandis que":"B2|conj|while, whereas|ในขณะที่","davantage":"B2|adv|more|มากขึ้น","financement":"B2|n|funding|การจัดหาเงินทุน","repose":"B2|v|rests, relies|อาศัย, ตั้งอยู่บน|reposer","essentiellement":"B2|adv|essentially|โดยหลัก","taxe":"B1|n|tax|ภาษี","billetterie":"C1|n|ticket sales|การขายตั๋ว","couvrant":"B2|v|covering|ครอบคลุม|couvrir","de toute façon":"B1|expr|anyway|ยังไงก็ตาม","faible":"B1|adj|weak, small|อ่อน, น้อย","coûts":"B1|n|costs|ต้นทุน|coût","font valoir":"C1|expr|argue, point out|ชี้ให้เห็น|faire valoir","toutefois":"B2|adv|however|อย่างไรก็ตาม","gratuité":"C1|n|being free of charge|การให้บริการฟรี","lignes":"A2|n|lines, routes|สาย (รถเมล์)|ligne","fréquentes":"B1|adj|frequent|บ่อย|fréquent","piétons":"B1|n|pedestrians|คนเดินเท้า|piéton","cyclistes":"B1|n|cyclists|คนปั่นจักรยาน|cycliste","plutôt que":"B1|expr|rather than|มากกว่า, แทนที่จะ","automobilistes":"B2|n|motorists|ผู้ขับรถยนต์|automobiliste","valeur":"B1|n|value|คุณค่า","recette":"B1|n|recipe|สูตร","universelle":"B2|adj|universal|สากล|universel","prouve":"B1|v|proves|พิสูจน์|prouver","audacieuse":"C1|adj|bold, daring|กล้าหาญ|audacieux","refonte":"C1|n|overhaul, redesign|การปรับใหม่ทั้งหมด","réseau":"B1|n|network|เครือข่าย","durablement":"C1|adv|lastingly|อย่างยั่งยืน","déplacement":"B2|n|travel, movement|การเดินทาง"},
  q:[{t:"main",q:["Quelle conclusion l'auteur tire-t-il de l'exemple de Dunkerque ?","ผู้เขียนสรุปอะไรจากกรณีดันเคิร์ก"],o:["Toutes les villes devraient rendre le bus gratuit immédiatement.","La gratuité peut changer les habitudes, à condition d'être accompagnée d'un bon réseau ; ce n'est pas une solution universelle.","La gratuité a été un échec total.","Les automobilistes refusent de prendre le bus."],a:1,x:"ย่อหน้าสุดท้าย: ‘pas… recette universelle’ แต่ ‘politique audacieuse, accompagnée d'une refonte du réseau’ เปลี่ยนพฤติกรรมได้ ข้อ A เกินกว่าที่ผู้เขียนเสนอ"},
     {t:"detail",q:["Comment le service est-il principalement financé ?","บริการนี้ได้เงินทุนจากไหนเป็นหลัก"],o:["Par les tickets.","Par une taxe sur les entreprises locales.","Par l'Union européenne.","Par les habitants, via un impôt spécial."],a:1,x:"“Le financement repose essentiellement sur une taxe payée par les entreprises locales”"},
     {t:"vocab",q:["« Une mesure électoraliste » est une mesure…","“Une mesure électoraliste” คือนโยบายที่…"],o:["prise pour gagner des voix plutôt que pour son utilité réelle.","décidée par les électeurs eux-mêmes.","très coûteuse.","imposée par l'État."],a:0,x:"électoraliste มาจาก élection หมายถึงทำเพื่อหาคะแนนเสียง คำว่า ‘condamnée à l'échec’ ต่อท้าย สื่อว่าคนในตอนนั้นมองในแง่ลบ"},
     {t:"not",q:["Selon le texte, quelle affirmation est INEXACTE ?","ตามบทความ ข้อใดไม่ถูกต้อง"],o:["La fréquentation a augmenté surtout le week-end.","Certains usagers ont abandonné leur voiture.","Les recettes des tickets couvraient la majorité des coûts.","Des critiques jugent que la gratuité seule ne suffit pas."],a:2,x:"บทความบอกว่าค่าตั๋ว ‘ne couvrant… qu'une faible part des coûts’ คือครอบคลุมเพียงส่วนน้อย ไม่ใช่ส่วนใหญ่"},
     {t:"purpose",q:["Quel rôle joue le troisième paragraphe ?","ย่อหน้าที่สามมีบทบาทอะไร"],o:["Il présente le financement et les limites de la mesure.","Il raconte l'histoire de la ville.","Il décrit les bus.","Il conclut que la mesure est parfaite."],a:0,x:"ย่อหน้านี้มีสองส่วน คือแหล่งเงินทุน และข้อวิจารณ์ (toutefois…) ซึ่งเตรียมทางไปสู่บทสรุปแบบชั่งน้ำหนัก"}]},
{ id:"fr-r7", cat:"health", lvl:"C1", src:"สุขภาพ/วิทยาศาสตร์", title:["Le microbiote, ce second cerveau qui nous gouverne","The microbiota, that second brain that rules us","จุลินทรีย์ในลำไส้ สมองที่สองที่ควบคุมเรา"],
  p:[[["Nous hébergeons dans nos intestins des dizaines de milliers de milliards de micro-organismes, à peu près autant que de cellules humaines dans notre corps.","We host tens of trillions of micro-organisms in our intestines, roughly as many as there are human cells in our body.","เราเป็นที่อยู่ของจุลินทรีย์หลายสิบล้านล้านตัวในลำไส้ ซึ่งมีจำนวนใกล้เคียงกับเซลล์มนุษย์ในร่างกายเรา"],
      ["Longtemps réduit à un rôle digestif, ce « microbiote » apparaît aujourd'hui comme un acteur central de notre santé.","Long reduced to a digestive role, this 'microbiota' now appears to be a central player in our health.","จุลินทรีย์กลุ่มนี้ เคยถูกมองว่ามีบทบาทเพียงด้านการย่อยอาหาร แต่วันนี้กลับกลายเป็นตัวแสดงหลักด้านสุขภาพของเรา"]],
     [["Il intervient dans la maturation du système immunitaire, la synthèse de certaines vitamines et, plus étonnamment, dans la régulation de l'humeur.","It is involved in the maturation of the immune system, the synthesis of certain vitamins and, more surprisingly, in the regulation of mood.","มันมีส่วนในการพัฒนาระบบภูมิคุ้มกัน การสังเคราะห์วิตามินบางชนิด และที่น่าแปลกใจกว่าคือ การควบคุมอารมณ์"],
      ["Des expériences menées sur des souris ont montré qu'en transférant le microbiote d'un animal anxieux à un animal calme, on pouvait modifier le comportement de ce dernier.","Experiments on mice have shown that by transferring the microbiota of an anxious animal to a calm one, the latter's behaviour could be altered.","การทดลองในหนูพบว่า เมื่อย้ายจุลินทรีย์จากหนูที่วิตกกังวลไปยังหนูที่สงบ พฤติกรรมของหนูตัวหลังเปลี่ยนไปได้"]],
     [["Faut-il pour autant parler de « second cerveau » ?","Should we for all that speak of a 'second brain'?","แต่นั่นทำให้เราเรียกมันว่า “สมองที่สอง” ได้แล้วหรือ?"],
      ["La formule, séduisante, mérite d'être nuancée : chez l'humain, la plupart des liens observés restent des corrélations, et l'on peine encore à distinguer la cause de l'effet.","The phrase, appealing as it is, deserves to be qualified: in humans, most of the observed links remain correlations, and we still struggle to distinguish cause from effect.","สำนวนนี้แม้จะฟังน่าสนใจ แต่ควรระมัดระวัง เพราะในมนุษย์ ความเชื่อมโยงส่วนใหญ่ที่พบยังเป็นเพียงสหสัมพันธ์ และยังแยกเหตุกับผลออกจากกันได้ยาก"],
      ["Un microbiote appauvri est-il à l'origine de la dépression, ou n'en est-il que la conséquence, à travers une alimentation déséquilibrée ?","Is an impoverished microbiota the origin of depression, or merely its consequence, through an unbalanced diet?","จุลินทรีย์ที่ลดความหลากหลายลงเป็นต้นเหตุของภาวะซึมเศร้า หรือเป็นเพียงผลที่ตามมาจากการกินที่ไม่สมดุลกันแน่?"]],
     [["Une chose fait néanmoins consensus : la diversité microbienne se nourrit de diversité alimentaire.","One thing, however, is agreed: microbial diversity feeds on dietary diversity.","อย่างไรก็ตาม มีเรื่องหนึ่งที่เห็นพ้องกัน คือความหลากหลายของจุลินทรีย์ได้มาจากความหลากหลายของอาหาร"],
      ["Fibres, légumineuses et aliments fermentés favorisent un écosystème riche, tandis que les antibiotiques pris sans nécessité peuvent le dévaster pour des mois.","Fibre, pulses and fermented foods promote a rich ecosystem, whereas antibiotics taken unnecessarily can devastate it for months.","ใยอาหาร พืชตระกูลถั่ว และอาหารหมักช่วยให้ระบบนิเวศนี้อุดมสมบูรณ์ ในขณะที่ยาปฏิชีวนะที่กินโดยไม่จำเป็นอาจทำลายมันได้นานหลายเดือน"]]],
  v:{"microbiote":"C1|n|microbiota|จุลินทรีย์ประจำถิ่น (ในลำไส้)","gouverne":"C1|v|governs, rules|ปกครอง, ควบคุม|gouverner","hébergeons":"C1|v|we host|เป็นที่พักให้|héberger","intestins":"B2|n|intestines|ลำไส้|intestin","dizaines":"B1|n|tens|หลายสิบ|dizaine","milliards":"B1|n|billions|พันล้าน|milliard","micro-organismes":"C1|n|micro-organisms|จุลินทรีย์|micro-organisme","cellules":"B2|n|cells|เซลล์|cellule","réduit":"B2|adj|reduced, confined|ถูกจำกัด|réduire","digestif":"C1|adj|digestive|เกี่ยวกับการย่อย","acteur":"B2|n|player, actor|ผู้มีบทบาท","intervient":"C1|v|is involved, intervenes|มีส่วนร่วม|intervenir","maturation":"C2|n|maturation|การเจริญเติบโตเต็มที่","synthèse":"C1|n|synthesis|การสังเคราะห์","étonnamment":"C1|adv|surprisingly|อย่างน่าประหลาดใจ","régulation":"C1|n|regulation|การควบคุม","humeur":"B2|n|mood|อารมณ์","menées":"C1|adj|conducted|ที่ดำเนินการ|mener","souris":"A2|n|mice, mouse|หนู","transférant":"B2|v|transferring|ย้าย, ถ่ายโอน|transférer","anxieux":"B2|adj|anxious|วิตกกังวล","comportement":"B2|n|behaviour|พฤติกรรม","ce dernier":"B2|pron|the latter|อย่างหลัง","formule":"B2|n|phrase, formula|สำนวน, สูตร","séduisante":"C1|adj|appealing|น่าดึงดูด|séduisant","mérite":"B2|v|deserves|สมควร|mériter","nuancée":"C1|adj|qualified, nuanced|ที่มีความละเอียดอ่อน|nuancer","corrélations":"C1|n|correlations|สหสัมพันธ์|corrélation","peine":"C1|v|struggles (peiner à)|ลำบากที่จะ|peiner","distinguer":"B2|v|to distinguish|แยกแยะ","appauvri":"C1|adj|impoverished|ที่ยากจนลง, ลดความหลากหลาย","à l'origine de":"C1|expr|the cause of|เป็นต้นเหตุของ","dépression":"B2|n|depression|ภาวะซึมเศร้า","conséquence":"B2|n|consequence|ผลที่ตามมา","alimentation":"B2|n|diet, food|อาหารการกิน","déséquilibrée":"C1|adj|unbalanced|ไม่สมดุล|déséquilibré","néanmoins":"C1|adv|nevertheless|อย่างไรก็ดี","fait consensus":"C1|expr|is agreed upon|เป็นที่เห็นพ้อง|faire consensus","microbienne":"C2|adj|microbial|เกี่ยวกับจุลินทรีย์|microbien","se nourrit":"B2|v|feeds on|หล่อเลี้ยงด้วย|se nourrir","fibres":"B2|n|fibre|ใยอาหาร|fibre","légumineuses":"C1|n|pulses, legumes|พืชตระกูลถั่ว|légumineuse","fermentés":"C1|adj|fermented|หมัก|fermenté","favorisent":"B2|v|favour, promote|ส่งเสริม|favoriser","écosystème":"B2|n|ecosystem|ระบบนิเวศ","antibiotiques":"B2|n|antibiotics|ยาปฏิชีวนะ|antibiotique","nécessité":"B2|n|necessity|ความจำเป็น","dévaster":"C1|v|to devastate|ทำลายล้าง"},
  q:[{t:"main",q:["Quelle est la position de l'auteur sur le microbiote ?","ผู้เขียนมีจุดยืนต่อเรื่องจุลินทรีย์ในลำไส้อย่างไร"],o:["Le microbiote contrôle entièrement notre cerveau.","Son rôle est important et prometteur, mais certaines affirmations, comme le « second cerveau », restent à nuancer.","Le microbiote n'a qu'un rôle digestif.","Il faut prendre des antibiotiques pour l'améliorer."],a:1,x:"ย่อหน้าที่ 1–2 ยืนยันว่ามีบทบาทสำคัญ แต่ย่อหน้าที่ 3 บอกว่าสำนวน “สมองที่สอง” ‘mérite d'être nuancée’ ข้อ A จึงเกินจริง"},
     {t:"detail",q:["Que montrent les expériences sur les souris ?","การทดลองในหนูแสดงอะไร"],o:["Que les souris calmes ont plus de bactéries.","Qu'un transfert de microbiote peut modifier le comportement.","Que les souris n'ont pas de microbiote.","Que l'anxiété est contagieuse par le toucher."],a:1,x:"ย้ายจุลินทรีย์จากหนูที่วิตกกังวล → หนูที่สงบเปลี่ยนพฤติกรรม"},
     {t:"infer",q:["Pourquoi l'auteur pose-t-il la question « Un microbiote appauvri est-il à l'origine de la dépression, ou n'en est-il que la conséquence ? »","ทำไมผู้เขียนจึงตั้งคำถามว่าจุลินทรีย์ที่เสื่อมลงเป็นต้นเหตุหรือผลของภาวะซึมเศร้า"],o:["Pour illustrer la difficulté de distinguer la cause de l'effet.","Pour prouver que le microbiote cause la dépression.","Pour critiquer les médecins.","Pour conseiller un régime précis."],a:0,x:"คำถามนี้เป็นตัวอย่างประกอบประโยคก่อนหน้า ‘on peine encore à distinguer la cause de l'effet’ ไม่ได้มีไว้พิสูจน์ทิศทางใดทิศทางหนึ่ง"},

{ id:"fr-r9", cat:"history", lvl:"B1", src:"วัฒนธรรม", title:["La baguette, patrimoine de l'humanité","The baguette, heritage of humanity","บาแก็ต มรดกของมนุษยชาติ"],
  p:[[["En 2022, l'UNESCO a inscrit le savoir-faire artisanal et la culture de la baguette de pain sur la liste du patrimoine culturel immatériel de l'humanité.","In 2022, UNESCO added the artisanal know-how and culture of the baguette to its list of the intangible cultural heritage of humanity.","ในปี 2022 ยูเนสโกได้ขึ้นทะเบียนภูมิปัญญาการทำและวัฒนธรรมของขนมปังบาแก็ตเป็นมรดกทางวัฒนธรรมที่จับต้องไม่ได้ของมนุษยชาติ"],

     [["Cette reconnaissance arrive à un moment important.","This recognition comes at an important time.","การได้รับการยอมรับนี้มาถึงในช่วงเวลาสำคัญ"],
      ["Depuis plusieurs décennies, de nombreuses boulangeries de village ferment, concurrencées par les supermarchés et les baguettes industrielles.","For several decades, many village bakeries have been closing, facing competition from supermarkets and industrial baguettes.","หลายทศวรรษที่ผ่านมา ร้านขนมปังในหมู่บ้านจำนวนมากปิดตัวลง เพราะสู้ซูเปอร์มาร์เก็ตและบาแก็ตแบบอุตสาหกรรมไม่ได้"],

{ id:"fr-r10", cat:"society", lvl:"C1", src:"สังคม/สื่อ", title:["Pourquoi le faux circule plus vite que le vrai","Why falsehood travels faster than truth","ทำไมข่าวปลอมจึงแพร่เร็วกว่าข่าวจริง"],
  p:[[["En 2018, des chercheurs du MIT ont publié dans la revue Science l'une des plus vastes études jamais menées sur la propagation des informations en ligne.","In 2018, MIT researchers published in the journal Science one of the largest studies ever conducted on the spread of information online.","ในปี 2018 นักวิจัยจาก MIT ตีพิมพ์งานวิจัยในวารสาร Science ซึ่งเป็นหนึ่งในการศึกษาการแพร่กระจายของข้อมูลออนไลน์ที่ใหญ่ที่สุดเท่าที่เคยมีมา"],
      ["Après avoir analysé plus de cent mille rumeurs partagées sur Twitter pendant une décennie, ils sont parvenus à une conclusion dérangeante : les fausses nouvelles se diffusent plus loin, plus vite et plus largement que les vraies.","After analysing more than one hundred thousand rumours shared on Twitter over a decade, they reached a disturbing conclusion: false news spreads farther, faster and more widely than true news.","หลังวิเคราะห์ข่าวลือกว่าหนึ่งแสนเรื่องที่แชร์บนทวิตเตอร์ตลอดสิบปี พวกเขาได้ข้อสรุปที่น่ากังวลว่า ข่าวปลอมแพร่ไปได้ไกลกว่า เร็วกว่า และกว้างกว่าข่าวจริง"]],
     [["Contrairement à une idée reçue, les robots automatisés n'expliquaient pas cet écart : ils relayaient le vrai et le faux à peu près au même rythme.","Contrary to a common belief, automated bots did not explain this gap: they relayed true and false at roughly the same rate.","ต่างจากความเชื่อที่แพร่หลาย บอตอัตโนมัติไม่ได้เป็นสาเหตุของความต่างนี้ เพราะมันส่งต่อทั้งข่าวจริงและปลอมในอัตราใกล้เคียงกัน"],
      ["Ce sont bel et bien les humains qui, en partageant, faisaient la différence.","It was indeed humans who, by sharing, made the difference.","คนจริงๆ นั่นเองที่สร้างความแตกต่างด้วยการกดแชร์"],
      ["L'hypothèse avancée par les auteurs tient à la nouveauté : une information inédite surprend, suscite des émotions fortes et donne à celui qui la transmet l'impression d'être mieux informé que les autres.","The hypothesis put forward by the authors comes down to novelty: an unheard-of piece of information surprises, arouses strong emotions and gives the person passing it on the impression of being better informed than others.","สมมติฐานของผู้วิจัยคือเรื่องความแปลกใหม่ ข้อมูลที่ไม่เคยได้ยินมาก่อนทำให้ประหลาดใจ กระตุ้นอารมณ์รุนแรง และทำให้คนที่ส่งต่อรู้สึกว่าตัวเองรู้มากกว่าคนอื่น"]],
     [["Or le faux a un avantage structurel : libéré de la contrainte du réel, il peut être taillé sur mesure pour étonner ou indigner.","Yet falsehood has a structural advantage: freed from the constraint of reality, it can be tailor-made to astonish or outrage.","ทว่าข่าวปลอมมีข้อได้เปรียบเชิงโครงสร้าง เพราะไม่ต้องผูกติดกับความจริง จึงถูกปั้นแต่งให้น่าตกใจหรือน่าโกรธได้ตามต้องการ"],
      ["Dès lors, la lutte contre la désinformation ne peut pas reposer uniquement sur la suppression de contenus ; elle suppose aussi d'apprendre à chacun à se méfier de sa propre envie de partager.","Consequently, the fight against disinformation cannot rely solely on removing content; it also requires teaching everyone to be wary of their own urge to share.","ดังนั้น การต่อสู้กับข้อมูลเท็จจะพึ่งการลบเนื้อหาอย่างเดียวไม่ได้ แต่ต้องสอนให้ทุกคนระวังความอยากแชร์ของตัวเองด้วย"]]],
  v:{"faux":"B1|n|the false, falsehood|สิ่งที่เป็นเท็จ","circule":"B2|v|circulates|แพร่กระจาย|circuler","publié":"B1|v|published|ตีพิมพ์|publier","revue":"B2|n|journal|วารสาร","vastes":"B2|adj|vast, large|กว้างใหญ่|vaste","menées":"C1|adj|conducted|ที่ดำเนินการ|mener","propagation":"C1|n|spread|การแพร่กระจาย","analysé":"B2|v|analysed|วิเคราะห์|analyser","rumeurs":"B2|n|rumours|ข่าวลือ|rumeur","parvenus":"C1|v|reached, arrived|ไปถึง|parvenir","dérangeante":"C1|adj|disturbing|น่ากังวล|dérangeant","se diffusent":"B2|v|spread|แพร่กระจาย|se diffuser","largement":"B2|adv|widely|อย่างกว้างขวาง","contrairement à":"B2|expr|contrary to|ตรงข้ามกับ","idée reçue":"C1|n|common belief, cliché|ความเชื่อที่ยึดถือกันทั่วไป","automatisés":"B2|adj|automated|อัตโนมัติ|automatisé","écart":"C1|n|gap|ช่องว่าง, ความต่าง","relayaient":"C1|v|relayed|ส่งต่อ|relayer","rythme":"B2|n|rate, pace|อัตรา, จังหวะ","bel et bien":"C1|expr|indeed, truly|โดยแท้จริง","hypothèse":"B2|n|hypothesis|สมมติฐาน","avancée":"C1|adj|put forward|ที่เสนอ|avancer","tient à":"C1|expr|comes down to|ขึ้นอยู่กับ|tenir à","nouveauté":"B2|n|novelty|ความแปลกใหม่","inédite":"C1|adj|unheard-of, new|ไม่เคยมีมาก่อน|inédit","suscite":"C1|v|arouses|กระตุ้น|susciter","transmet":"B2|v|passes on|ส่งต่อ|transmettre","or":"C1|conj|yet, now|ทว่า","structurel":"C1|adj|structural|เชิงโครงสร้าง","libéré":"B2|adj|freed|ได้รับการปลดปล่อย|libérer","contrainte":"C1|n|constraint|ข้อจำกัด","taillé sur mesure":"C1|expr|tailor-made|ตัดเย็บตามสั่ง","étonner":"B2|v|to astonish|ทำให้ประหลาดใจ","indigner":"C1|v|to outrage|ทำให้โกรธเคือง","dès lors":"C1|expr|consequently|ดังนั้น","lutte":"B2|n|fight|การต่อสู้","désinformation":"C1|n|disinformation|ข้อมูลเท็จ","uniquement":"B2|adv|solely|เพียงอย่างเดียว","suppression":"C1|n|removal|การลบ","contenus":"B2|n|content|เนื้อหา|contenu","suppose":"C1|v|requires, presupposes|ต้องอาศัย|supposer","se méfier":"C1|v|to be wary|ระแวง, ระวัง","envie":"B1|n|urge, desire|ความอยาก"},
  q:[{t:"main",q:["Quelle est la thèse principale du texte ?","ข้อเสนอหลักของบทความคืออะไร"],o:["Les robots sont les principaux responsables des fausses nouvelles.","Le faux se propage plus vite surtout à cause du comportement humain, attiré par la nouveauté, ce qui impose une responsabilité individuelle.","Twitter a supprimé toutes les fausses informations.","Les vraies nouvelles sont plus intéressantes."],a:1,x:"บทความบอกว่ามนุษย์คือตัวการ (ไม่ใช่บอต) เพราะความแปลกใหม่ และจบด้วยการเรียกร้องให้ทุกคนระวังการแชร์ของตัวเอง ข้อ A ขัดกับบทความโดยตรง"},
     {t:"detail",q:["Quel rôle ont joué les robots selon l'étude ?","ตามงานวิจัย บอตมีบทบาทอย่างไร"],o:["Ils diffusaient surtout le faux.","Ils diffusaient le vrai et le faux de manière comparable.","Ils bloquaient les rumeurs.","Ils n'ont pas été étudiés."],a:1,x:"“ils relayaient le vrai et le faux à peu près au même rythme”"},
     {t:"vocab",q:["Que signifie « taillé sur mesure » dans le troisième paragraphe ?","“taillé sur mesure” ในย่อหน้าที่สามหมายความว่าอะไร"],o:["mal fabriqué","conçu exactement pour produire un effet voulu","très court","vérifié avec soin"],a:1,x:"สำนวนจากการตัดเสื้อตามขนาด หมายถึงสร้างขึ้นให้พอดีกับจุดประสงค์ ในที่นี้คือทำให้ตกใจหรือโกรธ"},
     {t:"infer",q:["Pourquoi le faux aurait-il un « avantage structurel » ?","ทำไมข่าวปลอมจึงมี “ข้อได้เปรียบเชิงโครงสร้าง”"],o:["Parce qu'il est publié par des journalistes.","Parce qu'il n'est pas limité par les faits et peut donc être plus surprenant.","Parce qu'il est plus court.","Parce que les robots le préfèrent."],a:1,x:"“libéré de la contrainte du réel” ข่าวปลอมไม่ต้องตรงความจริง จึงแต่งให้ใหม่และน่าตื่นเต้นกว่า ซึ่งเชื่อมกับสมมติฐานเรื่องความแปลกใหม่"},
     {t:"tone",q:["Quelle solution l'auteur privilégie-t-il implicitement ?","ผู้เขียนให้น้ำหนักกับแนวทางแก้ไขแบบใด"],o:["Uniquement la censure des plateformes.","Une combinaison de modération et d'éducation à l'esprit critique.","L'interdiction des réseaux sociaux.","Aucune, le problème est insoluble."],a:1,x:"“ne peut pas reposer uniquement sur la suppression… elle suppose aussi d'apprendre…” = ต้องทำทั้งสองอย่าง ไม่ใช่การลบเนื้อหาอย่างเดียว"}]}
],
