{ id:"fr-n5", genre:"mystery", lvl:"A2", title:["Le chat de Madame Blanche","Madame Blanche's cat","แมวของมาดามบล็องช์"], blurb:"แมวของคุณยายข้างบ้านหายไป ร่องรอยเดียวคือรอยเท้าสีฟ้าบนบันได",
  p:[[["Madame Blanche habite au troisième étage, juste au-dessus de chez moi.","Madame Blanche lives on the third floor, just above my flat.","มาดามบล็องช์อาศัยอยู่ชั้นสาม อยู่เหนือห้องของฉันพอดี"],
      ["Elle a quatre-vingts ans et un chat gris qui s'appelle Monsieur Gris.","She is eighty and has a grey cat called Monsieur Gris.","เธออายุแปดสิบปี และมีแมวสีเทาชื่อเมอซิเยอร์กรี"],
      ["Lundi matin, elle frappe à ma porte, très inquiète.","On Monday morning, she knocks on my door, very worried.","เช้าวันจันทร์ เธอมาเคาะประตูห้องฉันด้วยท่าทางกังวลมาก"],
      ["« Monsieur Gris a disparu ! »","'Monsieur Gris has disappeared!'","“เมอซิเยอร์กรีหายไป!”"]],
     [["Nous cherchons partout : dans la cave, dans la cour, sous les voitures.","We look everywhere: in the cellar, in the courtyard, under the cars.","เราหากันทุกที่ ทั้งห้องใต้ดิน ลานบ้าน และใต้รถยนต์"],
      ["Rien.","Nothing.","ไม่พบเลย"],
      ["Puis je remarque quelque chose de bizarre dans l'escalier : de petites traces bleues.","Then I notice something strange on the stairs: small blue marks.","แล้วฉันก็สังเกตเห็นบางอย่างแปลกๆ บนบันได เป็นรอยเล็กๆ สีฟ้า"],
      ["Ce sont des traces de pattes de chat, et elles montent.","They are cat paw prints, and they go up.","มันคือรอยเท้าแมว และมันมุ่งขึ้นไปข้างบน"]],
     [["Au cinquième étage, il y a un nouveau voisin : un jeune peintre.","On the fifth floor, there is a new neighbour: a young painter.","ที่ชั้นห้ามีเพื่อนบ้านใหม่ เป็นจิตรกรหนุ่ม"],
      ["Sa porte est ouverte, et ça sent la peinture.","His door is open, and it smells of paint.","ประตูห้องเขาเปิดอยู่ และมีกลิ่นสี"],
      ["Sur un grand tableau tout frais, au milieu du ciel bleu, on voit des petites pattes.","On a big, completely fresh painting, in the middle of the blue sky, you can see little paws.","บนภาพวาดผืนใหญ่ที่สียังไม่แห้ง กลางท้องฟ้าสีฟ้ามีรอยเท้าเล็กๆ"],
      ["Et sur le canapé, Monsieur Gris dort tranquillement, avec le bout de la queue tout bleu.","And on the sofa, Monsieur Gris is sleeping peacefully, with the tip of his tail all blue.","และบนโซฟา เมอซิเยอร์กรีนอนหลับสบาย ปลายหางเป็นสีฟ้าทั้งหมด"]],
     "* * *",
     [["Le peintre est très gêné.","The painter is very embarrassed.","จิตรกรอายมาก"],
      ["« Il est entré par la fenêtre ce matin, et il n'a plus voulu partir », explique-t-il.","'He came in through the window this morning, and didn't want to leave any more,' he explains.","“มันเข้ามาทางหน้าต่างเมื่อเช้า แล้วก็ไม่ยอมไปไหนเลย” เขาอธิบาย"],
      ["Madame Blanche regarde le tableau longtemps, puis elle sourit.","Madame Blanche looks at the painting for a long time, then she smiles.","มาดามบล็องช์มองภาพวาดอยู่นาน แล้วก็ยิ้ม"],
      ["« Il est beau, votre ciel. Je vous l'achète. Avec les pattes. »","'It's beautiful, your sky. I'll buy it from you. With the paws.'","“ท้องฟ้าของคุณสวยนะ ฉันขอซื้อ พร้อมรอยเท้าด้วย”"]]],
  v:{"étage":"A2|n|floor, storey|ชั้น (ของอาคาร)","au-dessus de":"A2|prep|above|เหนือ","gris":"A1|adj|grey|สีเทา","frappe":"A2|v|knocks|เคาะ|frapper","inquiète":"B1|adj|worried (fem.)|กังวล|inquiet","disparu":"B1|v|disappeared|หายไป|disparaître","cherchons":"A2|v|we look for|เราหา|chercher","cave":"B1|n|cellar|ห้องใต้ดิน","remarque":"B1|v|notice|สังเกต|remarquer","bizarre":"A2|adj|strange|แปลก","escalier":"A2|n|stairs|บันได","traces":"B1|n|marks, prints|ร่องรอย|trace","pattes":"B1|n|paws|อุ้งเท้า|patte","montent":"A2|v|go up|ขึ้นไป|monter","peintre":"A2|n|painter|จิตรกร","ouverte":"A2|adj|open|เปิด|ouvert","peinture":"A2|n|paint|สี (ทา)","frais":"A2|adj|fresh, wet (paint)|ใหม่, ยังไม่แห้ง","au milieu de":"A2|expr|in the middle of|ตรงกลาง","tranquillement":"B1|adv|peacefully|อย่างสงบ","queue":"A2|n|tail|หาง","gêné":"B1|adj|embarrassed|อาย, ลำบากใจ","entré":"A2|v|came in|เข้ามา|entrer","partir":"A1|v|to leave|ออกไป","explique":"A2|v|explains|อธิบาย|expliquer","longtemps":"A2|adv|for a long time|เป็นเวลานาน","achète":"A1|v|buy|ซื้อ|acheter"}},
{ id:"fr-n6", genre:"horror", lvl:"B1", title:["L'ascenseur du sixième","The lift to the sixth floor","ลิฟต์ชั้นหก"], blurb:"อาคารนี้มีห้าชั้น แต่คืนหนึ่งลิฟต์กลับมีปุ่มเลข 6 เพิ่มขึ้นมา",
  p:[[["Notre immeuble a cinq étages.","Our building has five floors.","อาคารของเรามีห้าชั้น"],
      ["Je le sais parce que j'y habite depuis dix ans et que je monte souvent à pied, pour garder la forme.","I know because I've lived there for ten years and I often walk up, to stay fit.","ฉันรู้เพราะอยู่ที่นี่มาสิบปี และมักเดินขึ้นบันไดเพื่อออกกำลังกาย"],
      ["Pourtant, ce soir-là, en rentrant tard du travail, j'ai pris l'ascenseur, et il y avait un bouton de plus.","Yet that evening, coming home late from work, I took the lift, and there was one more button.","แต่คืนนั้น ตอนกลับจากที่ทำงานดึกๆ ฉันขึ้นลิฟต์ และมีปุ่มเพิ่มมาอีกปุ่มหนึ่ง"],
      ["Un bouton argenté, tout neuf, avec le chiffre 6.","A silver button, brand new, with the number 6.","เป็นปุ่มสีเงินดูใหม่เอี่ยม มีเลข 6"]],
     [["Je me suis dit que c'était une erreur du réparateur, ou une blague des voisins.","I told myself it was the repairman's mistake, or a joke by the neighbours.","ฉันบอกตัวเองว่าคงเป็นความผิดพลาดของช่างซ่อม หรือเพื่อนบ้านแกล้งเล่น"],
      ["Mon doigt a hésité au-dessus du 4, mon étage.","My finger hesitated over the 4, my floor.","นิ้วของฉันลังเลอยู่เหนือปุ่มเลข 4 ซึ่งเป็นชั้นของฉัน"],
      ["Puis, sans vraiment le décider, j'ai appuyé sur le 6.","Then, without really deciding to, I pressed the 6.","แล้ว โดยไม่ได้ตั้งใจจริงจัง ฉันก็กดเลข 6"]],
     [["L'ascenseur est monté longtemps, beaucoup trop longtemps.","The lift went up for a long time, far too long.","ลิฟต์เคลื่อนขึ้นไปนาน นานเกินไปมาก"],
      ["Quand les portes se sont ouvertes, j'ai vu un couloir exactement comme le mien : même moquette rouge, même plante en plastique, mêmes portes.","When the doors opened, I saw a corridor exactly like mine: same red carpet, same plastic plant, same doors.","เมื่อประตูเปิด ฉันเห็นทางเดินที่เหมือนชั้นของฉันทุกอย่าง พรมแดงแบบเดียวกัน ต้นไม้พลาสติกต้นเดียวกัน ประตูแบบเดียวกัน"],
      ["Mais il n'y avait aucun bruit, ni télévision, ni voix, ni pas.","But there was no sound, no television, no voices, no footsteps.","แต่ไม่มีเสียงใดๆ เลย ไม่มีเสียงทีวี ไม่มีเสียงคน ไม่มีเสียงฝีเท้า"],
      ["Et sur la porte du fond, mon nom était écrit, de ma propre écriture.","And on the door at the end, my name was written, in my own handwriting.","และบนประตูห้องสุดทางเดิน มีชื่อของฉันเขียนอยู่ ด้วยลายมือของฉันเอง"]],
     "* * *",
     [["J'ai appuyé sur tous les boutons à la fois.","I pressed all the buttons at once.","ฉันกดปุ่มทุกปุ่มพร้อมกัน"],
      ["Les portes se sont refermées lentement, très lentement, pendant que, de l'autre côté du couloir, ma porte commençait à s'ouvrir.","The doors closed slowly, very slowly, while on the other side of the corridor, my door was beginning to open.","ประตูลิฟต์ค่อยๆ ปิดลงช้าๆ ช้ามาก ขณะที่อีกฝั่งของทางเดิน ประตูห้องของฉันเริ่มเปิดออก"],

     [["Aujourd'hui, la course dure environ trois semaines, en juillet.","Today, the race lasts about three weeks, in July.","ปัจจุบันการแข่งขันใช้เวลาราวสามสัปดาห์ในเดือนกรกฎาคม"],
      ["Les coureurs parcourent plus de trois mille kilomètres, avec des étapes difficiles dans les Alpes et les Pyrénées.","The riders cover more than three thousand kilometres, with difficult stages in the Alps and the Pyrenees.","นักปั่นต้องปั่นกว่าสามพันกิโลเมตร โดยมีสเตจที่ยากในเทือกเขาแอลป์และพิเรนีส"],
      ["Le leader du classement général porte le célèbre maillot jaune.","The leader of the general classification wears the famous yellow jersey.","ผู้นำคะแนนรวมจะได้สวมเสื้อเหลืองอันโด่งดัง"]],
     [["Chaque année, des millions de spectateurs attendent les coureurs au bord des routes.","Every year, millions of spectators wait for the riders by the roadside.","ทุกปีมีผู้ชมนับล้านคนรอนักปั่นอยู่ข้างถนน"],
      ["C'est gratuit, et c'est souvent une vraie fête de village.","It's free, and it's often a real village festival.","ดูฟรี และมักเป็นเหมือนงานเทศกาลของหมู่บ้าน"]]],
  v:{"centenaire":"B2|adj|centenarian, over 100 years old|อายุร้อยปี","course":"A2|n|race|การแข่งขัน","cycliste":"A2|adj|cycling|จักรยาน","célèbre":"A2|adj|famous|มีชื่อเสียง","édition":"B1|n|edition|ครั้ง (ของการจัด)","a eu lieu":"A2|expr|took place|เกิดขึ้น|avoir lieu","créée":"A2|v|created|สร้าง|créer","journal":"A1|n|newspaper|หนังสือพิมพ์","vendre":"A1|v|to sell|ขาย","exemplaires":"B1|n|copies|ฉบับ|exemplaire","dure":"A2|v|lasts|ใช้เวลา|durer","parcourent":"B1|v|cover, travel|เดินทางผ่าน|parcourir","étapes":"B1|n|stages|สเตจ, ช่วง|étape","pyrénées":"A2|n|Pyrenees|เทือกเขาพิเรนีส","leader":"B1|n|leader|ผู้นำ","classement général":"B2|n|general classification|อันดับคะแนนรวม","porte":"A2|v|wears|สวม|porter","maillot jaune":"A2|n|yellow jersey|เสื้อเหลือง","spectateurs":"B1|n|spectators|ผู้ชม|spectateur","au bord des routes":"A2|expr|by the roadside|ข้างถนน"},
  q:[{t:"main",q:["Quelle est l'idée principale ?","ใจความสำคัญคืออะไร"],o:["Le Tour de France est une course ancienne, longue et populaire.","Le maillot jaune est cher.","Le Tour se fait en hiver.","Le Tour est réservé aux Français."],a:0,x:"บทความพูดถึงประวัติ ความยาว และความนิยมของตูร์"},
     {t:"detail",q:["Pourquoi le Tour a-t-il été créé ?","ทำไมจึงมีการก่อตั้งตูร์"],o:["Pour la santé des Français.","Pour qu'un journal vende plus.","Pour les touristes.","Pour l'armée."],a:1,x:"“créée par un journal pour vendre plus d'exemplaires”"},
     {t:"detail",q:["Qui porte le maillot jaune ?","ใครได้สวมเสื้อเหลือง"],o:["Le plus jeune coureur","Le leader du classement général","Le dernier coureur","Le vainqueur d'une étape de montagne"],a:1,x:"“Le leader du classement général porte le célèbre maillot jaune.”"},
     {t:"not",q:["Quelle information est FAUSSE ?","ข้อมูลใดผิด"],o:["Le Tour dure environ trois semaines.","Les spectateurs doivent payer pour regarder.","La première édition date de 1903.","Il y a des étapes dans les Alpes."],a:1,x:"บทความบอกว่า ‘C'est gratuit’ ดูฟรี"},
     {t:"vocab",q:["« Centenaire » dans le titre signifie…","คำว่า “centenaire” ในชื่อเรื่องหมายถึง…"],o:["qui a cent ans ou plus","qui a cent coureurs","qui coûte cent euros","qui dure cent jours"],a:0,x:"centenaire มาจาก cent (ร้อย) หมายถึงมีอายุร้อยปี เพราะจัดมาตั้งแต่ 1903"}]},
{ id:"fr-r13", cat:"history", lvl:"A2", src:"อาหาร/ประวัติศาสตร์", title:["Le long voyage du chocolat","The long journey of chocolate","การเดินทางอันยาวนานของช็อกโกแลต"],
  p:[[["Le chocolat vient de la graine du cacaoyer, un arbre originaire d'Amérique centrale et du Sud.","Chocolate comes from the seed of the cacao tree, a tree native to Central and South America.","ช็อกโกแลตมาจากเมล็ดของต้นโกโก้ ซึ่งเป็นต้นไม้พื้นเมืองของอเมริกากลางและอเมริกาใต้"],
      ["Les Mayas et les Aztèques buvaient déjà du cacao, souvent froid, épicé et sans sucre.","The Maya and the Aztecs already drank cacao, often cold, spicy and without sugar.","ชาวมายาและแอซเท็กดื่มโกโก้กันมานาน มักดื่มแบบเย็น ใส่เครื่องเทศ และไม่ใส่น้ำตาล"]],
     [["Au seizième siècle, les Espagnols l'ont rapporté en Europe.","In the sixteenth century, the Spanish brought it back to Europe.","ในศตวรรษที่ 16 ชาวสเปนนำโกโก้กลับไปยุโรป"],
      ["Les Européens y ont ajouté du sucre, et la boisson est devenue à la mode chez les riches.","Europeans added sugar, and the drink became fashionable among the rich.","ชาวยุโรปเติมน้ำตาลลงไป และเครื่องดื่มนี้ก็กลายเป็นที่นิยมในหมู่คนรวย"]],
     [["Aujourd'hui, la plus grande partie du cacao est cultivée en Afrique de l'Ouest, surtout en Côte d'Ivoire et au Ghana.","Today, most cacao is grown in West Africa, especially in Ivory Coast and Ghana.","ปัจจุบัน โกโก้ส่วนใหญ่ปลูกในแอฟริกาตะวันตก โดยเฉพาะที่โกตดิวัวร์และกานา"],
      ["Beaucoup de petits producteurs gagnent pourtant très peu d'argent.","Yet many small producers earn very little money.","แต่เกษตรกรรายย่อยจำนวนมากกลับมีรายได้น้อยมาก"],
      ["C'est pourquoi certains consommateurs choisissent du chocolat issu du commerce équitable.","That is why some consumers choose fair-trade chocolate.","ผู้บริโภคบางคนจึงเลือกช็อกโกแลตจากการค้าที่เป็นธรรม"]]],
  v:{"graine":"B1|n|seed|เมล็ด","cacaoyer":"C1|n|cacao tree|ต้นโกโก้","originaire":"B1|adj|native, originating|มีถิ่นกำเนิด","amérique centrale":"A2|n|Central America|อเมริกากลาง","mayas":"B1|n|Maya|ชาวมายา|maya","aztèques":"B1|n|Aztecs|ชาวแอซเท็ก|aztèque","buvaient":"A2|v|drank|ดื่ม|boire","cacao":"A2|n|cocoa, cacao|โกโก้","épicé":"A2|adj|spicy|เผ็ด, ใส่เครื่องเทศ","seizième siècle":"B1|n|sixteenth century|ศตวรรษที่ 16","espagnols":"A1|n|Spanish people|ชาวสเปน|espagnol","rapporté":"B1|v|brought back|นำกลับมา|rapporter","ajouté":"A2|v|added|เพิ่ม|ajouter","boisson":"A2|n|drink|เครื่องดื่ม","à la mode":"A2|expr|fashionable|ทันสมัย, เป็นที่นิยม","riches":"A2|n|rich people|คนรวย|riche","cultivée":"B1|adj|grown|เพาะปลูก|cultiver","afrique de l'ouest":"B1|n|West Africa|แอฟริกาตะวันตก","producteurs":"B1|n|producers|ผู้ผลิต|producteur","consommateurs":"B1|n|consumers|ผู้บริโภค|consommateur","issu":"B2|adj|coming from|มาจาก","commerce équitable":"B2|n|fair trade|การค้าที่เป็นธรรม"},
  q:[{t:"main",q:["Quel est le sujet du texte ?","หัวข้อของบทความคืออะไร"],o:["L'histoire du chocolat, de l'Amérique à aujourd'hui.","Comment faire un gâteau.","Les fêtes aztèques.","Le sucre en Europe."],a:0,x:"บทความเล่าเส้นทางของโกโก้จากอเมริกา สู่ยุโรป และแหล่งผลิตปัจจุบัน"},
     {t:"detail",q:["Comment les Aztèques buvaient-ils le cacao ?","ชาวแอซเท็กดื่มโกโก้อย่างไร"],o:["Chaud et très sucré","Souvent froid, épicé, sans sucre","Avec du lait","Avec du café"],a:1,x:"“souvent froid, épicé et sans sucre”"},
     {t:"detail",q:["Où est cultivé la plus grande partie du cacao aujourd'hui ?","ปัจจุบันโกโก้ส่วนใหญ่ปลูกที่ไหน"],o:["En Espagne","En Afrique de l'Ouest","En France","Au Mexique"],a:1,x:"“surtout en Côte d'Ivoire et au Ghana”"},
     {t:"not",q:["Quelle affirmation est FAUSSE ?","ข้อใดผิด"],o:["Les Européens ont ajouté du sucre.","Le cacaoyer vient d'Asie.","Les Espagnols ont apporté le cacao en Europe.","Les petits producteurs gagnent peu."],a:1,x:"ต้นโกโก้มีถิ่นกำเนิดในอเมริกากลางและอเมริกาใต้ ไม่ใช่เอเชีย"},
     {t:"infer",q:["Pourquoi choisir du chocolat du « commerce équitable » ?","ทำไมจึงเลือกช็อกโกแลตจาก “การค้าที่เป็นธรรม”"],o:["Parce qu'il est plus sucré.","Pour que les producteurs soient mieux payés.","Parce qu'il vient d'Europe.","Parce qu'il est gratuit."],a:1,x:"ประโยคก่อนหน้าบอกว่าเกษตรกรได้เงินน้อย การค้าที่เป็นธรรมจึงมุ่งให้พวกเขาได้ค่าตอบแทนดีขึ้น"}]},
{ id:"fr-r14", cat:"history", lvl:"B1", src:"ประวัติศาสตร์", title:["La tour Eiffel, un monument qui devait disparaître","The Eiffel Tower, a monument that was meant to disappear","หอไอเฟล อนุสาวรีย์ที่เกือบถูกรื้อ"],
  p:[[["La tour Eiffel a été construite pour l'Exposition universelle de 1889, qui célébrait le centenaire de la Révolution française.","The Eiffel Tower was built for the 1889 World's Fair, which celebrated the centenary of the French Revolution.","หอไอเฟลสร้างขึ้นสำหรับงานมหกรรมโลกปี 1889 ซึ่งฉลองครบรอบร้อยปีการปฏิวัติฝรั่งเศส"],
      ["À l'époque, de nombreux artistes la trouvaient affreuse et ont signé une lettre de protestation.","At the time, many artists found it hideous and signed a letter of protest.","ในตอนนั้น ศิลปินหลายคนมองว่ามันน่าเกลียดและร่วมลงชื่อในจดหมายประท้วง"]],
     [["La tour ne devait rester debout que vingt ans.","The tower was only meant to stand for twenty years.","เดิมหอคอยนี้มีกำหนดตั้งอยู่เพียงยี่สิบปี"],
      ["Gustave Eiffel, pour la sauver, l'a transformée en laboratoire scientifique : on y a fait des expériences de météorologie et surtout de radio.","To save it, Gustave Eiffel turned it into a scientific laboratory: meteorology experiments and, above all, radio experiments were carried out there.","กุสตาฟ ไอเฟลเปลี่ยนให้มันเป็นห้องทดลองทางวิทยาศาสตร์เพื่อรักษามันไว้ มีการทดลองด้านอุตุนิยมวิทยาและที่สำคัญที่สุดคือวิทยุ"],
      ["Son utilité pour les communications militaires a finalement convaincu l'État de la garder.","Its usefulness for military communications finally convinced the state to keep it.","ประโยชน์ด้านการสื่อสารทางทหารทำให้รัฐตัดสินใจเก็บมันไว้ในที่สุด"]],
     [["Aujourd'hui, avec ses antennes, elle mesure environ trois cent trente mètres et accueille près de six millions de visiteurs par an.","Today, with its antennas, it is about three hundred and thirty metres tall and welcomes nearly six million visitors a year.","ปัจจุบันเมื่อรวมเสาอากาศ หอสูงราวสามร้อยสามสิบเมตร และมีผู้มาเยือนเกือบหกล้านคนต่อปี"],
      ["Le monument que l'on voulait démolir est devenu le symbole même de Paris.","The monument people wanted to demolish has become the very symbol of Paris.","อนุสาวรีย์ที่ครั้งหนึ่งคนอยากรื้อทิ้ง กลับกลายเป็นสัญลักษณ์ของปารีส"]]],
  v:{"construite":"B1|adj|built|ถูกสร้าง|construire","exposition universelle":"B2|n|World's Fair|งานมหกรรมโลก","célébrait":"B1|v|celebrated|เฉลิมฉลอง|célébrer","centenaire":"B2|n|centenary|ครบรอบร้อยปี","révolution":"B1|n|revolution|การปฏิวัติ","affreuse":"B1|adj|hideous|น่าเกลียด|affreux","signé":"B1|v|signed|ลงชื่อ|signer","protestation":"B2|n|protest|การประท้วง","debout":"B1|adv|standing|ตั้งอยู่","sauver":"B1|v|to save|ช่วยไว้","transformée":"B1|v|transformed|เปลี่ยนเป็น|transformer","laboratoire":"B1|n|laboratory|ห้องทดลอง","expériences":"B1|n|experiments|การทดลอง|expérience","météorologie":"B2|n|meteorology|อุตุนิยมวิทยา","utilité":"B2|n|usefulness|ประโยชน์","communications":"B1|n|communications|การสื่อสาร|communication","militaires":"B1|adj|military|ทางทหาร|militaire","convaincu":"B1|v|convinced|โน้มน้าว|convaincre","l'état":"B1|n|the state|รัฐ","antennes":"B1|n|antennas|เสาอากาศ|antenne","mesure":"A2|v|measures (height)|สูง (วัดได้)|mesurer","accueille":"B1|v|welcomes|ต้อนรับ|accueillir","démolir":"B2|v|to demolish|รื้อถอน","symbole":"B1|n|symbol|สัญลักษณ์"},
  q:[{t:"main",q:["Quelle est l'idée principale du texte ?","ใจความสำคัญคืออะไร"],o:["La tour Eiffel, d'abord critiquée et provisoire, est devenue le symbole de Paris.","Gustave Eiffel détestait Paris.","La tour Eiffel a été démolie en 1909.","La tour Eiffel est un musée de peinture."],a:0,x:"บทความเล่าว่าหอไอเฟลเคยถูกวิจารณ์และมีกำหนดรื้อ แต่รอดและกลายเป็นสัญลักษณ์"},
     {t:"detail",q:["Pourquoi la tour a-t-elle été construite ?","หอไอเฟลสร้างขึ้นเพื่ออะไร"],o:["Pour la radio","Pour l'Exposition universelle de 1889","Pour l'armée","Pour un roi"],a:1,x:"“construite pour l'Exposition universelle de 1889”"},
     {t:"detail",q:["Qu'est-ce qui a convaincu l'État de garder la tour ?","อะไรทำให้รัฐเก็บหอไว้"],o:["Les artistes","Son utilité pour les communications militaires","Le nombre de touristes","Sa couleur"],a:1,x:"“Son utilité pour les communications militaires a finalement convaincu l'État”"},
     {t:"not",q:["Quelle information est FAUSSE ?","ข้อมูลใดผิด"],o:["Des artistes ont protesté contre la tour.","La tour devait rester vingt ans.","Tous les Parisiens ont aimé la tour dès le début.","On y a fait des expériences de radio."],a:2,x:"ศิลปินหลายคนมองว่ามันน่าเกลียดและประท้วง จึงไม่ใช่ทุกคนที่ชอบตั้งแต่แรก"},
     {t:"vocab",q:["« Le symbole même de Paris » signifie que la tour…","“le symbole même de Paris” หมายความว่าหอคอย…"],o:["ressemble à Paris","représente Paris mieux que tout autre chose","est à côté de Paris","a été construite par Paris"],a:1,x:"même วางหลังคำนามใช้เน้นว่า ‘ตัวจริง/แท้ๆ’ จึงหมายถึงสัญลักษณ์ที่โดดเด่นที่สุดของปารีส"}]},
{ id:"fr-r15", cat:"env", lvl:"B1", src:"สิ่งแวดล้อม", title:["Le verre, champion du recyclage","Glass, the recycling champion","แก้ว แชมป์แห่งการรีไซเคิล"],
  p:[[["Le verre a une qualité rare : on peut le recycler à l'infini, sans qu'il perde sa qualité.","Glass has a rare quality: it can be recycled endlessly without losing its quality.","แก้วมีคุณสมบัติที่หาได้ยาก คือรีไซเคิลได้ไม่รู้จบโดยคุณภาพไม่ลดลง"],
      ["Une bouteille jetée dans le conteneur peut redevenir une bouteille neuve en quelques semaines.","A bottle thrown into the bin can become a new bottle again in a few weeks.","ขวดที่ทิ้งลงถังรีไซเคิลสามารถกลับมาเป็นขวดใหม่ได้ภายในไม่กี่สัปดาห์"]],
     [["Dans l'usine, le verre est trié, nettoyé puis broyé en petits morceaux, appelés « calcin ».","At the factory, the glass is sorted, cleaned and then crushed into small pieces called 'cullet'.","ในโรงงาน แก้วจะถูกคัดแยก ทำความสะอาด แล้วบดเป็นชิ้นเล็กๆ เรียกว่า “คัลเล็ต”"],
      ["On le fait fondre avec du sable dans un four très chaud.","It is melted with sand in a very hot furnace.","จากนั้นนำไปหลอมรวมกับทรายในเตาที่ร้อนมาก"],
      ["Utiliser du calcin permet d'économiser de l'énergie et des matières premières.","Using cullet saves energy and raw materials.","การใช้คัลเล็ตช่วยประหยัดพลังงานและวัตถุดิบ"]],
     [["Attention cependant : tout ce qui est transparent n'est pas du verre recyclable.","Be careful, though: not everything transparent is recyclable glass.","แต่ต้องระวัง ของใสทุกอย่างไม่ใช่แก้วที่รีไซเคิลได้"],
      ["La vaisselle, les miroirs ou les ampoules ont une composition différente et peuvent perturber la fabrication.","Tableware, mirrors and light bulbs have a different composition and can disrupt manufacturing.","จานชาม กระจกเงา หรือหลอดไฟมีส่วนประกอบต่างกัน และอาจทำให้กระบวนการผลิตเสียหาย"],
      ["Il vaut donc mieux les jeter avec les ordures ménagères ou en déchetterie.","So it's better to throw them away with household rubbish or at the recycling centre.","จึงควรทิ้งรวมกับขยะครัวเรือนหรือนำไปที่ศูนย์รับขยะ"]]],

  p:[[["Née à Varsovie en 1867, Maria Skłodowska part étudier à Paris, faute de pouvoir entrer à l'université dans une Pologne où les femmes en étaient exclues.","Born in Warsaw in 1867, Maria Skłodowska left to study in Paris, unable to enter university in a Poland where women were excluded from it.","มารีอา สกวอดอฟสกาเกิดที่วอร์ซอในปี 1867 และย้ายไปเรียนที่ปารีส เพราะเข้ามหาวิทยาลัยในโปแลนด์ไม่ได้ เนื่องจากผู้หญิงถูกกีดกัน"],
      ["Elle y rencontre Pierre Curie, avec qui elle étudie un phénomène tout juste découvert : la radioactivité.","There she meets Pierre Curie, with whom she studies a newly discovered phenomenon: radioactivity.","ที่นั่นเธอได้พบปีแยร์ กูรี และศึกษาปรากฏการณ์ที่เพิ่งถูกค้นพบด้วยกัน นั่นคือกัมมันตภาพรังสี"]],
     [["En 1903, elle devient la première femme à recevoir un prix Nobel, celui de physique, partagé avec Pierre et Henri Becquerel.","In 1903, she became the first woman to receive a Nobel Prize, in physics, shared with Pierre and Henri Becquerel.","ในปี 1903 เธอเป็นผู้หญิงคนแรกที่ได้รับรางวัลโนเบล สาขาฟิสิกส์ ร่วมกับปีแยร์และอ็องรี แบ็กแรล"],
      ["Huit ans plus tard, elle obtient seule le prix Nobel de chimie pour la découverte du polonium et du radium.","Eight years later, she won the Nobel Prize in Chemistry on her own for the discovery of polonium and radium.","แปดปีต่อมา เธอได้รับรางวัลโนเบลสาขาเคมีเพียงลำพัง จากการค้นพบธาตุพอโลเนียมและเรเดียม"],
      ["Elle reste à ce jour la seule personne récompensée dans deux disciplines scientifiques différentes.","To this day she remains the only person awarded in two different scientific fields.","จนถึงทุกวันนี้ เธอยังคงเป็นบุคคลเดียวที่ได้รับรางวัลในวิทยาศาสตร์สองสาขาที่ต่างกัน"]],
     [["Pendant la Première Guerre mondiale, elle équipe des voitures d'appareils de radiographie, surnommées les « petites Curies », pour soigner les blessés près du front.","During the First World War, she fitted cars with X-ray machines, nicknamed 'little Curies', to treat the wounded near the front.","ในสงครามโลกครั้งที่หนึ่ง เธอติดตั้งเครื่องเอกซเรย์ในรถยนต์ ที่ได้ฉายาว่า “กูรีน้อย” เพื่อรักษาทหารบาดเจ็บใกล้แนวหน้า"],

  p:[[["Selon l'Organisation internationale de la Francophonie, plus de trois cents millions de personnes parlent français dans le monde.","According to the International Organisation of La Francophonie, more than three hundred million people speak French worldwide.","ตามข้อมูลขององค์การระหว่างประเทศแห่งประชาคมฟรังโกโฟนี มีผู้พูดภาษาฝรั่งเศสทั่วโลกกว่าสามร้อยล้านคน"],
      ["Contrairement à une représentation tenace, la majorité de ceux qui l'utilisent au quotidien ne vivent pas en Europe, mais en Afrique.","Contrary to a persistent image, most of those who use it daily do not live in Europe but in Africa.","ตรงข้ามกับภาพจำที่ฝังแน่น คนส่วนใหญ่ที่ใช้ภาษาฝรั่งเศสในชีวิตประจำวันไม่ได้อยู่ในยุโรป แต่อยู่ในแอฟริกา"]],
     [["Avec la croissance démographique du continent, cette tendance devrait s'accentuer au cours des prochaines décennies.","With the continent's population growth, this trend is expected to intensify over the coming decades.","ด้วยการเติบโตของประชากรในทวีปนี้ แนวโน้มดังกล่าวน่าจะเข้มข้นขึ้นในทศวรรษต่อๆ ไป"],
      ["Kinshasa, Abidjan ou Dakar sont déjà des laboratoires linguistiques où le français se mêle aux langues locales et invente des mots que Paris finit parfois par adopter.","Kinshasa, Abidjan and Dakar are already linguistic laboratories where French mixes with local languages and invents words that Paris sometimes ends up adopting.","กินชาซา อาบีจาน หรือดาการ์ เป็นห้องทดลองทางภาษาแล้ว ภาษาฝรั่งเศสที่นั่นผสมกับภาษาท้องถิ่นและสร้างคำใหม่ ซึ่งบางครั้งปารีสก็รับไปใช้ในที่สุด"]],
     [["Cette évolution n'a rien d'automatique : dans plusieurs pays, l'anglais gagne du terrain dans l'enseignement supérieur et les affaires, tandis que certains gouvernements revalorisent les langues nationales.","This development is by no means automatic: in several countries, English is gaining ground in higher education and business, while some governments are giving new status to national languages.","วิวัฒนาการนี้ไม่ได้เกิดขึ้นเองโดยอัตโนมัติ ในหลายประเทศ ภาษาอังกฤษกำลังรุกคืบในการศึกษาระดับสูงและธุรกิจ ขณะที่รัฐบาลบางประเทศหันมายกสถานะภาษาประจำชาติ"],
      ["L'avenir du français se jouera donc moins à l'Académie qu'à l'école primaire de Bamako ou de Yaoundé.","The future of French will therefore be decided less at the Académie than in the primary schools of Bamako or Yaoundé.","อนาคตของภาษาฝรั่งเศสจึงไม่ได้ถูกกำหนดที่บัณฑิตยสถานเท่ากับที่โรงเรียนประถมในบามาโกหรือยาอุนเด"]]],
  v:{"francophonie":"C1|n|French-speaking world|ประชาคมผู้พูดภาษาฝรั่งเศส","représentation":"C1|n|image, representation|ภาพจำ","tenace":"C1|adj|persistent|ฝังแน่น","au quotidien":"B2|expr|on a daily basis|ในชีวิตประจำวัน","croissance démographique":"C1|n|population growth|การเติบโตของประชากร","tendance":"B2|n|trend|แนวโน้ม","s'accentuer":"C1|v|to intensify|เข้มข้นขึ้น","linguistiques":"B2|adj|linguistic|ทางภาษา|linguistique","se mêle":"C1|v|mixes|ผสมผสาน|se mêler","locales":"B1|adj|local|ท้องถิ่น|local","invente":"B1|v|invents|ประดิษฐ์|inventer","finit par":"B2|expr|ends up|ลงเอยด้วย|finir par","adopter":"B2|v|to adopt|รับมาใช้","n'a rien de":"C1|expr|is not at all|ไม่ได้…เลย|n'avoir rien de","gagne du terrain":"C1|expr|gains ground|รุกคืบ|gagner du terrain","enseignement supérieur":"B2|n|higher education|อุดมศึกษา","revalorisent":"C1|v|give new value to|ยกสถานะ|revaloriser","se jouera":"C1|v|will be decided|จะถูกตัดสิน|se jouer","primaire":"B1|adj|primary|ประถม"},
  q:[{t:"main",q:["Quelle est la thèse du texte ?","ข้อเสนอของบทความคืออะไร"],o:["Le français va disparaître.","L'avenir du français dépend surtout de l'Afrique, sans que rien soit garanti.","Seule la France décide de l'avenir du français.","L'anglais a déjà remplacé le français en Afrique."],a:1,x:"บทความบอกว่าผู้ใช้ส่วนใหญ่อยู่ในแอฟริกา และอนาคตอยู่ที่นั่น แต่ ‘n'a rien d'automatique’"},
     {t:"detail",q:["Où vivent la plupart des personnes qui utilisent le français au quotidien ?","คนส่วนใหญ่ที่ใช้ภาษาฝรั่งเศสในชีวิตประจำวันอาศัยอยู่ที่ไหน"],o:["En France","Au Canada","En Afrique","En Belgique"],a:2,x:"“la majorité … ne vivent pas en Europe, mais en Afrique”"},
     {t:"vocab",q:["« Une représentation tenace » est une idée…","“Une représentation tenace” คือความคิดที่…"],o:["récente et fragile","qui résiste malgré les faits","scientifique","officielle"],a:1,x:"tenace = ฝังแน่น ไม่ยอมหายไป แม้ข้อเท็จจริงจะขัดแย้ง"},
     {t:"not",q:["Quelle idée le texte NE soutient-il PAS ?","บทความไม่ได้สนับสนุนความคิดใด"],o:["Le français s'enrichit au contact des langues africaines.","L'anglais progresse dans certains secteurs.","La croissance du français en Afrique est garantie.","Certains gouvernements valorisent les langues nationales."],a:2,x:"บทความบอกชัดว่า ‘n'a rien d'automatique’ ไม่มีอะไรรับประกัน"},
     {t:"purpose",q:["Pourquoi l'auteur oppose-t-il l'« Académie » à « l'école primaire de Bamako » ?","ทำไมผู้เขียนเปรียบเทียบ “บัณฑิตยสถาน” กับ “โรงเรียนประถมในบามาโก”"],o:["Pour montrer que l'usage réel compte plus que les institutions parisiennes.","Pour critiquer les enseignants.","Pour parler d'architecture.","Pour vanter l'Académie."],a:0,x:"เป็นการเปรียบเทียบว่าอนาคตของภาษาขึ้นกับผู้ใช้จริงจำนวนมาก มากกว่าสถาบันที่กำหนดกฎในปารีส"}]},
{ id:"fr-r19", cat:"history", lvl:"C1", src:"ประวัติศาสตร์/ภาษา", title:["L'Académie française, gardienne contestée de la langue","The Académie française, contested guardian of the language","บัณฑิตยสถานฝรั่งเศส ผู้พิทักษ์ภาษาที่ถูกตั้งคำถาม"],
  p:[[["Fondée en 1635 par le cardinal de Richelieu, l'Académie française réunit quarante membres élus à vie, que l'on surnomme les « Immortels ».","Founded in 1635 by Cardinal Richelieu, the Académie française brings together forty members elected for life, nicknamed the 'Immortals'.","บัณฑิตยสถานฝรั่งเศสก่อตั้งในปี 1635 โดยพระคาร์ดินัลรีเชอลีเยอ มีสมาชิกสี่สิบคนที่ได้รับเลือกตลอดชีพ มีฉายาว่า “ผู้เป็นอมตะ”"],
      ["Sa mission principale consiste à rédiger le dictionnaire de l'usage, dont la neuvième édition n'a été achevée qu'en 2024, près d'un siècle après la précédente.","Its main mission is to write the dictionary of usage, whose ninth edition was only completed in 2024, nearly a century after the previous one.","ภารกิจหลักคือการเรียบเรียงพจนานุกรม ซึ่งฉบับที่เก้าเพิ่งเสร็จในปี 2024 เกือบหนึ่งศตวรรษหลังฉบับก่อน"]],
     [["Ses détracteurs lui reprochent sa lenteur, son conservatisme et un recrutement longtemps peu ouvert : il a fallu attendre 1980 pour qu'une femme, Marguerite Yourcenar, y soit élue.","Its critics reproach it for its slowness, its conservatism and a long-closed recruitment: it took until 1980 for a woman, Marguerite Yourcenar, to be elected.","ผู้วิจารณ์ติว่าสถาบันนี้เชื่องช้า หัวโบราณ และรับสมาชิกแบบปิดมานาน ต้องรอถึงปี 1980 กว่าจะมีผู้หญิงคนแรก คือ มาร์เกอริต ยูร์เซอนาร์ ได้รับเลือก"],
      ["Ses avis, par ailleurs, n'ont aucune valeur contraignante : ni les journaux ni les ministères ne sont tenus de les suivre.","Its opinions, moreover, have no binding force: neither newspapers nor ministries are obliged to follow them.","นอกจากนี้ ความเห็นของบัณฑิตยสถานไม่มีผลผูกมัดใดๆ ทั้งหนังสือพิมพ์และกระทรวงไม่จำเป็นต้องทำตาม"]],
     [["Ses défenseurs y voient pourtant un symbole précieux : celui d'un pays qui considère sa langue comme un bien commun, digne d'être pensé et débattu.","Its defenders, however, see it as a precious symbol: that of a country that considers its language a common good, worthy of being thought about and debated.","ฝ่ายที่ปกป้องกลับมองว่ามันคือสัญลักษณ์อันล้ำค่า ของประเทศที่ถือว่าภาษาคือสมบัติร่วม ซึ่งควรค่าแก่การคิดและถกเถียง"],
      ["Entre institution poussiéreuse et vigie culturelle, l'Académie demeure, à près de quatre siècles, une exception française.","Somewhere between dusty institution and cultural watchman, the Académie remains, at nearly four centuries old, a French exception.","ไม่ว่าจะมองว่าเป็นสถาบันเก่าคร่ำครึหรือผู้เฝ้าระวังทางวัฒนธรรม บัณฑิตยสถานซึ่งมีอายุเกือบสี่ศตวรรษ ก็ยังคงเป็นเอกลักษณ์เฉพาะของฝรั่งเศส"]]],
  v:{"gardienne":"B2|n|guardian (fem.)|ผู้พิทักษ์|gardien","contestée":"C1|adj|contested|ถูกโต้แย้ง|contester","fondée":"B1|adj|founded|ก่อตั้ง|fonder","cardinal":"B2|n|cardinal|พระคาร์ดินัล","réunit":"B1|v|brings together|รวบรวม|réunir","élus":"B2|adj|elected|ได้รับเลือก|élire","à vie":"B2|expr|for life|ตลอดชีพ","surnomme":"C1|v|nicknames|ตั้งฉายา|surnommer","immortels":"B2|n|Immortals|ผู้เป็นอมตะ|immortel","consiste à":"B2|expr|consists in|ประกอบด้วย|consister à","dictionnaire":"A2|n|dictionary|พจนานุกรม","achevée":"B2|adj|completed|เสร็จสิ้น|achever","précédente":"B1|adj|previous|ก่อนหน้า|précédent","détracteurs":"C1|n|critics|ผู้วิจารณ์|détracteur","lenteur":"B2|n|slowness|ความเชื่องช้า","conservatisme":"C1|n|conservatism|ความหัวโบราณ","recrutement":"B2|n|recruitment|การรับสมาชิก","avis":"B2|n|opinions|ความเห็น","par ailleurs":"C1|expr|moreover|นอกจากนี้","contraignante":"C1|adj|binding|มีผลผูกมัด|contraignant","ministères":"B2|n|ministries|กระทรวง|ministère","tenus de":"C1|expr|obliged to|จำเป็นต้อง|être tenu de","défenseurs":"B2|n|defenders|ผู้ปกป้อง|défenseur","précieux":"B2|adj|precious|ล้ำค่า","bien commun":"C1|n|common good|สมบัติส่วนรวม","digne":"B2|adj|worthy|สมควร","débattu":"B2|adj|debated|ถกเถียง|débattre","poussiéreuse":"C1|adj|dusty, outdated|เก่าคร่ำครึ|poussiéreux","vigie":"C2|n|lookout, watchman|ผู้เฝ้าระวัง"},
  q:[{t:"main",q:["Quelle est la position de l'auteur ?","ผู้เขียนมีจุดยืนอย่างไร"],o:["L'Académie est inutile et doit disparaître.","L'Académie est critiquable mais reste un symbole singulier.","L'Académie contrôle la langue des journaux.","L'Académie a été créée en 1980."],a:1,x:"ผู้เขียนเสนอทั้งข้อวิจารณ์และมุมมองฝ่ายปกป้อง แล้วสรุปว่าเป็น ‘une exception française’"},
     {t:"detail",q:["Quand la neuvième édition du dictionnaire a-t-elle été achevée ?","พจนานุกรมฉบับที่เก้าเสร็จเมื่อใด"],o:["En 1635","En 1935","En 2024","Elle n'est pas finie"],a:2,x:"“la neuvième édition n'a été achevée qu'en 2024”"},
     {t:"vocab",q:["« Aucune valeur contraignante » signifie que les avis…","“aucune valeur contraignante” หมายความว่าความเห็นนั้น…"],o:["sont obligatoires","ne sont pas obligatoires à suivre","sont secrets","sont très chers"],a:1,x:"contraignant = มีผลผูกมัด ประโยคถัดไปยืนยันว่าไม่มีใครจำเป็นต้องทำตาม"},
     {t:"not",q:["Quelle affirmation est FAUSSE ?","ข้อใดผิด"],o:["Les membres sont élus à vie.","Marguerite Yourcenar a été la première femme élue.","Les ministères doivent suivre les avis de l'Académie.","L'Académie a été fondée par Richelieu."],a:2,x:"บทความบอกว่า ‘ni les journaux ni les ministères ne sont tenus de les suivre’"},
     {t:"infer",q:["Pourquoi l'auteur mentionne-t-il qu'il a fallu attendre 1980 ?","ทำไมผู้เขียนพูดถึงปี 1980"],o:["Pour illustrer le manque d'ouverture de l'institution.","Pour célébrer la rapidité de l'Académie.","Pour parler de littérature.","Pour donner une date de fondation."],a:0,x:"ใช้เป็นตัวอย่างประกอบคำวิจารณ์เรื่อง ‘recrutement longtemps peu ouvert’"}]},
{ id:"fr-r20", cat:"economy", lvl:"C1", src:"เศรษฐกิจ/สิ่งแวดล้อม", title:["L'effet rebond, ou pourquoi l'efficacité ne suffit pas","The rebound effect, or why efficiency isn't enough","ปรากฏการณ์ดีดกลับ หรือทำไมประสิทธิภาพอย่างเดียวไม่พอ"],
  p:[[["En 1865, l'économiste britannique William Stanley Jevons fit une observation déroutante : à mesure que les machines à vapeur consommaient moins de charbon, la consommation totale de charbon de l'Angleterre augmentait.","In 1865, the British economist William Stanley Jevons made a puzzling observation: as steam engines used less coal, England's total coal consumption increased.","ในปี 1865 นักเศรษฐศาสตร์ชาวอังกฤษ วิลเลียม สแตนลีย์ เจวอนส์ สังเกตเห็นสิ่งที่น่าฉงน คือยิ่งเครื่องจักรไอน้ำใช้ถ่านหินน้อยลง ปริมาณการใช้ถ่านหินรวมของอังกฤษกลับเพิ่มขึ้น"],
      ["Rendue moins chère, l'énergie était utilisée pour davantage d'usages.","Made cheaper, energy was used for more purposes.","เมื่อพลังงานถูกลง ก็ถูกนำไปใช้ในงานที่หลากหลายขึ้น"]],
     [["Ce paradoxe, aujourd'hui appelé « effet rebond », se retrouve partout.","This paradox, now called the 'rebound effect', is found everywhere.","ความย้อนแย้งนี้ ปัจจุบันเรียกว่า “ปรากฏการณ์ดีดกลับ” พบได้ทุกที่"],
      ["Des voitures plus sobres incitent à rouler davantage ; des éclairages LED peu gourmands encouragent à illuminer des espaces jusque-là plongés dans l'obscurité.","More fuel-efficient cars encourage people to drive more; low-consumption LED lighting encourages lighting spaces that were previously dark.","รถที่ประหยัดน้ำมันกว่าทำให้คนขับมากขึ้น ไฟ LED ที่กินไฟน้อยทำให้คนเปิดไฟในพื้นที่ที่เคยมืดมาก่อน"],
      ["Le gain d'efficacité est réel, mais une partie, parfois la totalité, en est absorbée par la hausse de la demande.","The efficiency gain is real, but part of it, sometimes all of it, is absorbed by rising demand.","ประสิทธิภาพที่เพิ่มขึ้นเป็นของจริง แต่บางส่วน หรือบางครั้งทั้งหมด ถูกกลืนหายไปกับความต้องการที่เพิ่มขึ้น"]],
     [["Faut-il pour autant renoncer à l'innovation technique ?","Should we therefore give up on technical innovation?","ถ้าอย่างนั้นเราควรเลิกพัฒนาเทคโนโลยีหรือ?"],
      ["Certainement pas ; mais l'effet rebond rappelle qu'aucune transition écologique ne peut reposer sur la seule technologie, sans interroger aussi nos usages et nos besoins.","Certainly not; but the rebound effect reminds us that no ecological transition can rely on technology alone, without also questioning our habits and needs.","ไม่ใช่แน่นอน แต่ปรากฏการณ์ดีดกลับเตือนเราว่า การเปลี่ยนผ่านเพื่อสิ่งแวดล้อมจะพึ่งเทคโนโลยีอย่างเดียวไม่ได้ ต้องตั้งคำถามกับพฤติกรรมและความต้องการของเราด้วย"]]],

{ id:"es-f6", cat:"culture", lvl:"C1", user:"Ignacio Ruiz", handle:"nacho_lee", time:"3 สัปดาห์", likes:743,
  s:[["Acabo de terminar «Cien años de soledad» por tercera vez y sigo sin saber si es una novela sobre una familia o sobre la condena de repetir la historia.","I've just finished 'One Hundred Years of Solitude' for the third time and I still don't know whether it's a novel about a family or about the curse of repeating history.","ผมเพิ่งอ่าน “หนึ่งร้อยปีแห่งความโดดเดี่ยว” จบเป็นรอบที่สาม และยังไม่แน่ใจว่ามันเป็นนิยายเกี่ยวกับครอบครัว หรือเกี่ยวกับคำสาปของการซ้ำรอยประวัติศาสตร์"],
     ["Lo que en la primera lectura me pareció un caos de nombres idénticos, ahora se me revela como un mecanismo deliberado.","What on the first reading seemed to me a chaos of identical names now reveals itself to me as a deliberate mechanism.","สิ่งที่ตอนอ่านรอบแรกดูเหมือนความวุ่นวายของชื่อซ้ำกัน ตอนนี้กลับเผยให้เห็นว่าเป็นกลไกที่ตั้งใจวางไว้"],
     ["García Márquez no se limita a narrar: obliga al lector a extraviarse, a sentir en carne propia ese tiempo circular del que los Buendía no logran escapar.","García Márquez doesn't merely narrate: he forces the reader to get lost, to feel first-hand that circular time from which the Buendías cannot escape.","การ์เซีย มาร์เกซไม่ได้แค่เล่าเรื่อง แต่บังคับให้ผู้อ่านหลงทาง ให้รู้สึกด้วยตัวเองถึงเวลาที่วนเป็นวงกลมซึ่งตระกูลบวนเดียหนีไม่พ้น"]],
  v:{"soledad":"B2|n|solitude, loneliness|ความโดดเดี่ยว","tercera":"A2|adj|third|ที่สาม|tercero","sigo sin":"C1|expr|I still don't|ยังคงไม่|seguir sin","novela":"B1|n|novel|นิยาย","condena":"C1|n|curse, sentence|คำสาป, การลงโทษ","repetir":"B1|v|to repeat|ทำซ้ำ","lectura":"B1|n|reading|การอ่าน","pareció":"B1|v|seemed|ดูเหมือน|parecer","caos":"B2|n|chaos|ความโกลาหล","idénticos":"B2|adj|identical|เหมือนกันทุกประการ|idéntico","revela":"C1|v|reveals|เผยให้เห็น|revelar","mecanismo":"C1|n|mechanism|กลไก","deliberado":"C1|adj|deliberate|โดยเจตนา","se limita":"C1|v|limits himself|จำกัดตัวเอง|limitarse","narrar":"C1|v|to narrate|เล่าเรื่อง","obliga":"B2|v|forces|บังคับ|obligar","lector":"B1|n|reader|ผู้อ่าน","extraviarse":"C2|v|to get lost|หลงทาง","en carne propia":"C2|expr|first-hand|ด้วยตัวเอง","circular":"B2|adj|circular|เป็นวงกลม","logran":"B2|v|manage to|สามารถ (ทำสำเร็จ)|lograr","escapar":"B1|v|to escape|หนี"},
  c:[{u:"Beatriz C.", s:[["Yo me hice un árbol genealógico en la segunda página y aun así me perdí.","I drew a family tree on the second page and even so I got lost.","ฉันวาดแผนผังตระกูลไว้ตั้งแต่หน้าสอง แต่ก็ยังหลงอยู่ดี"]]},
     {u:"Ignacio Ruiz", s:[["Precisamente: perderse forma parte de la experiencia.","Precisely: getting lost is part of the experience.","นั่นแหละ การหลงทางก็เป็นส่วนหนึ่งของประสบการณ์"]]}],
  vv:{"árbol genealógico":"B2|n|family tree|แผนผังตระกูล","aun así":"B2|expr|even so|ถึงอย่างนั้น","precisamente":"B2|adv|precisely|ถูกต้องเลย"} }

read: [
{ id:"es-r1", cat:"env", lvl:"B1", src:"สิ่งแวดล้อม", title:["El agua que no vemos","The water we don't see","น้ำที่เรามองไม่เห็น"],
  p:[[["Cuando pensamos en ahorrar agua, normalmente imaginamos duchas más cortas o grifos cerrados.","When we think about saving water, we usually imagine shorter showers or turned-off taps.","เมื่อคิดถึงการประหยัดน้ำ เรามักนึกถึงการอาบน้ำให้สั้นลงหรือการปิดก๊อก"],
      ["Sin embargo, la mayor parte del agua que consumimos es invisible.","However, most of the water we consume is invisible.","อย่างไรก็ตาม น้ำส่วนใหญ่ที่เราใช้นั้นมองไม่เห็น"],
      ["Se llama «agua virtual» y es la que se necesita para producir lo que comemos, vestimos y compramos.","It's called 'virtual water' and it's what is needed to produce what we eat, wear and buy.","เรียกว่า “น้ำเสมือน” คือน้ำที่ใช้ในการผลิตสิ่งที่เรากิน สวมใส่ และซื้อ"]],
     [["Por ejemplo, para fabricar una camiseta de algodón hacen falta unos dos mil quinientos litros.","For example, to make a cotton T-shirt, about two thousand five hundred litres are needed.","ตัวอย่างเช่น การผลิตเสื้อยืดผ้าฝ้ายหนึ่งตัวต้องใช้น้ำราวสองพันห้าร้อยลิตร"],
      ["Un kilo de carne de vaca puede necesitar más de quince mil, sobre todo por el agua que consume el pienso de los animales.","A kilo of beef can require more than fifteen thousand, mainly because of the water consumed by the animals' feed.","เนื้อวัวหนึ่งกิโลกรัมอาจต้องใช้มากกว่าหนึ่งหมื่นห้าพันลิตร ส่วนใหญ่เป็นน้ำที่ใช้ปลูกอาหารสัตว์"],
      ["En comparación, una ducha de cinco minutos gasta unos sesenta litros.","In comparison, a five-minute shower uses about sixty litres.","เมื่อเปรียบเทียบ การอาบน้ำห้านาทีใช้น้ำประมาณหกสิบลิตร"]],
     [["Esto no significa que cerrar el grifo sea inútil, pero sí que nuestras decisiones de compra tienen un impacto mucho mayor.","This doesn't mean that turning off the tap is useless, but it does mean our purchasing decisions have a much bigger impact.","นี่ไม่ได้หมายความว่าการปิดก๊อกไร้ประโยชน์ แต่หมายความว่าการตัดสินใจซื้อของเรามีผลกระทบมากกว่ามาก"],
      ["Además, muchos países ricos importan productos de regiones donde el agua escasea, de modo que, sin saberlo, contribuyen a la sequía de otros.","Moreover, many rich countries import products from regions where water is scarce, so that, without knowing it, they contribute to others' drought.","นอกจากนี้ ประเทศร่ำรวยหลายแห่งนำเข้าสินค้าจากภูมิภาคที่ขาดแคลนน้ำ จึงมีส่วนทำให้ที่อื่นแห้งแล้งโดยไม่รู้ตัว"],
      ["Comprar menos ropa, aprovechar la comida y reducir el consumo de carne son gestos sencillos con un efecto real.","Buying fewer clothes, not wasting food and reducing meat consumption are simple gestures with a real effect.","ซื้อเสื้อผ้าให้น้อยลง ใช้อาหารให้คุ้ม และลดการกินเนื้อ เป็นการกระทำง่ายๆ ที่ได้ผลจริง"]]],
  v:{"ahorrar":"A2|v|to save|ประหยัด","imaginamos":"B1|v|we imagine|เรานึกภาพ|imaginar","duchas":"A2|n|showers|การอาบน้ำฝักบัว|ducha","cortas":"A1|adj|short|สั้น|corto","grifos":"B1|n|taps|ก๊อกน้ำ|grifo","grifo":"B1|n|tap|ก๊อกน้ำ","sin embargo":"B1|expr|however|อย่างไรก็ตาม","mayor parte":"B1|expr|most, the majority|ส่วนใหญ่","consumimos":"B1|v|we consume|เราบริโภค|consumir","invisible":"B1|adj|invisible|มองไม่เห็น","virtual":"B2|adj|virtual|เสมือน","producir":"B1|v|to produce|ผลิต","vestimos":"B1|v|we wear|เราสวมใส่|vestir","fabricar":"B1|v|to manufacture|ผลิต","camiseta":"A1|n|T-shirt|เสื้อยืด","algodón":"B1|n|cotton|ผ้าฝ้าย","hacen falta":"B1|expr|are needed|จำเป็นต้องใช้|hacer falta","litros":"A2|n|litres|ลิตร|litro","carne de vaca":"A2|n|beef|เนื้อวัว","pienso":"C1|n|animal feed|อาหารสัตว์","comparación":"B1|n|comparison|การเปรียบเทียบ","gasta":"B1|v|uses, spends|ใช้, สิ้นเปลือง|gastar","inútil":"B1|adj|useless|ไร้ประโยชน์","impacto":"B2|n|impact|ผลกระทบ","importan":"B2|v|import|นำเข้า|importar","escasea":"C1|v|is scarce|ขาดแคลน|escasear","de modo que":"B2|expr|so that|ดังนั้น","contribuyen":"B2|v|contribute|มีส่วน|contribuir","sequía":"B2|n|drought|ความแห้งแล้ง","aprovechar":"B2|v|to make the most of|ใช้ให้คุ้มค่า","reducir":"B1|v|to reduce|ลด","consumo":"B2|n|consumption|การบริโภค","gestos":"B2|n|gestures|การกระทำ, ท่าที|gesto","sencillos":"A2|adj|simple|ง่าย|sencillo"},
  q:[{t:"main",q:["¿Cuál es la idea principal del texto?","ใจความสำคัญของบทความคืออะไร"],o:["Ducharse menos es la mejor forma de ahorrar agua.","Gran parte del agua que gastamos está oculta en los productos que consumimos.","Los países ricos tienen más agua que los pobres.","La carne de vaca es mala para la salud."],a:1,x:"ทั้งบทความอธิบายแนวคิด “น้ำเสมือน” ที่ซ่อนอยู่ในสินค้า ข้อ A ถูกผู้เขียนลดความสำคัญลง ส่วนข้อ D ไม่ได้พูดเรื่องสุขภาพ"},
     {t:"detail",q:["Según el texto, ¿por qué la carne de vaca necesita tanta agua?","ตามบทความ ทำไมเนื้อวัวจึงใช้น้ำมาก"],o:["Porque las vacas beben mucho.","Porque hay que lavar la carne.","Sobre todo por el agua que se usa para producir su alimento.","Porque se transporta en barco."],a:2,x:"“sobre todo por el agua que consume el pienso de los animales” — น้ำส่วนใหญ่ใช้ปลูกอาหารสัตว์ ไม่ใช่น้ำที่วัวดื่ม (กับดักข้อ A)"},
     {t:"not",q:["¿Qué afirmación NO se corresponde con el texto?","ข้อใดไม่สอดคล้องกับบทความ"],o:["Una camiseta de algodón necesita miles de litros de agua.","Cerrar el grifo no sirve para nada.","Algunos países contribuyen a la sequía de otros sin saberlo.","Reducir el consumo de carne tiene un efecto real."],a:1,x:"ผู้เขียนบอกชัดว่า “Esto no significa que cerrar el grifo sea inútil” ข้อ B จึงขัดแย้ง"},
     {t:"vocab",q:["En el texto, «escasea» significa que el agua…","ในบทความ คำว่า “escasea” หมายความว่าน้ำ…"],o:["es abundante.","es cara.","hay poca.","está contaminada."],a:2,x:"escasear = มีไม่เพียงพอ/ขาดแคลน ซึ่งสอดคล้องกับคำว่า sequía (ความแห้งแล้ง) ในประโยคเดียวกัน"},
     {t:"purpose",q:["¿Para qué menciona el autor la ducha de cinco minutos?","ผู้เขียนกล่าวถึงการอาบน้ำห้านาทีเพื่ออะไร"],o:["Para recomendar duchas más largas.","Para mostrar, por contraste, lo pequeño que es ese gasto frente al agua virtual.","Para explicar cómo funciona un grifo.","Para criticar a los países ricos."],a:1,x:"ใช้เป็นตัวเปรียบเทียบ (En comparación) 60 ลิตร กับ 2,500 และ 15,000 ลิตร เพื่อให้เห็นว่าน้ำเสมือนมีขนาดใหญ่กว่ามาก"}]},
{ id:"es-r2", cat:"science", lvl:"B2", src:"วิทยาศาสตร์", title:["El cerebro bilingüe","The bilingual brain","สมองสองภาษา"],
  p:[[["Durante décadas se creyó que criar a un niño en dos idiomas podía confundirlo y retrasar su desarrollo.","For decades it was believed that raising a child in two languages could confuse them and delay their development.","หลายทศวรรษที่ผ่านมา ผู้คนเชื่อว่าการเลี้ยงเด็กด้วยสองภาษาอาจทำให้เด็กสับสนและพัฒนาการช้า"],
      ["Hoy, la investigación apunta en la dirección contraria.","Today, research points in the opposite direction.","ปัจจุบัน งานวิจัยชี้ไปในทิศทางตรงกันข้าม"]],
     [["Las personas bilingües mantienen ambos idiomas activos al mismo tiempo, incluso cuando solo utilizan uno.","Bilingual people keep both languages active at the same time, even when they only use one.","คนที่พูดได้สองภาษาจะเปิดใช้ทั้งสองภาษาพร้อมกัน แม้ในขณะที่ใช้เพียงภาษาเดียว"],
      ["Para no mezclarlos, el cerebro debe inhibir constantemente la lengua que no necesita, un esfuerzo que entrena las llamadas funciones ejecutivas: la atención, la memoria de trabajo y la capacidad de cambiar de tarea.","To avoid mixing them, the brain must constantly inhibit the language it doesn't need, an effort that trains the so-called executive functions: attention, working memory and the ability to switch tasks.","เพื่อไม่ให้ปนกัน สมองต้องยับยั้งภาษาที่ไม่ได้ใช้อยู่ตลอดเวลา ความพยายามนี้ช่วยฝึกสิ่งที่เรียกว่าการทำงานของสมองด้านบริหาร ได้แก่ ความใส่ใจ ความจำขณะทำงาน และความสามารถในการสลับงาน"]],
     [["Algunos estudios sugieren incluso que el bilingüismo podría retrasar entre cuatro y cinco años la aparición de los síntomas de la demencia.","Some studies even suggest that bilingualism could delay the appearance of dementia symptoms by four to five years.","งานวิจัยบางชิ้นถึงกับเสนอว่าการรู้สองภาษาอาจชะลอการเกิดอาการสมองเสื่อมได้สี่ถึงห้าปี"],
      ["No obstante, los científicos piden prudencia: los resultados varían según el nivel de dominio, la edad de aprendizaje y el uso cotidiano de cada lengua.","Nevertheless, scientists urge caution: results vary according to the level of proficiency, the age of learning and the daily use of each language.","อย่างไรก็ดี นักวิทยาศาสตร์ขอให้ระมัดระวัง เพราะผลลัพธ์แตกต่างกันไปตามระดับความเชี่ยวชาญ อายุที่เริ่มเรียน และการใช้แต่ละภาษาในชีวิตประจำวัน"],
      ["Lo que sí parece claro es que nunca es tarde para aprender: el cerebro adulto conserva una plasticidad mucho mayor de lo que se pensaba.","What does seem clear is that it's never too late to learn: the adult brain retains much greater plasticity than was thought.","สิ่งที่ดูชัดเจนคือไม่มีคำว่าสายเกินไปที่จะเรียน สมองผู้ใหญ่ยังคงความยืดหยุ่นได้มากกว่าที่เคยคิดไว้มาก"]]],
  v:{"décadas":"B1|n|decades|ทศวรรษ|década","creyó":"B1|v|was believed|เชื่อ (อดีต)|creer","criar":"B2|v|to raise (a child)|เลี้ยงดู","idiomas":"A2|n|languages|ภาษา|idioma","confundirlo":"B1|v|to confuse him|ทำให้เขาสับสน|confundir","retrasar":"B2|v|to delay|ทำให้ล่าช้า","desarrollo":"B1|n|development|พัฒนาการ","investigación":"B1|n|research|การวิจัย","apunta":"B2|v|points|ชี้|apuntar","contraria":"B1|adj|opposite|ตรงกันข้าม|contrario","bilingües":"B1|adj|bilingual|สองภาษา|bilingüe","mantienen":"B1|v|maintain, keep|รักษาไว้|mantener","ambos":"B1|det|both|ทั้งสอง","activos":"B1|adj|active|ทำงานอยู่|activo","utilizan":"B1|v|use|ใช้|utilizar","mezclarlos":"B1|v|to mix them|ผสมพวกมัน|mezclar","inhibir":"C1|v|to inhibit|ยับยั้ง","constantemente":"B2|adv|constantly|อย่างต่อเนื่อง","lengua":"B1|n|language, tongue|ภาษา, ลิ้น","esfuerzo":"B1|n|effort|ความพยายาม","entrena":"B1|v|trains|ฝึก|entrenar","funciones ejecutivas":"C1|n|executive functions|การทำงานของสมองด้านบริหารจัดการ","atención":"A2|n|attention|ความใส่ใจ","memoria de trabajo":"C1|n|working memory|ความจำขณะทำงาน","capacidad":"B2|n|ability, capacity|ความสามารถ","tarea":"A2|n|task|งาน, ภารกิจ","sugieren":"B2|v|suggest|เสนอแนะ|sugerir","bilingüismo":"C1|n|bilingualism|การรู้สองภาษา","aparición":"B2|n|appearance, onset|การปรากฏ","síntomas":"B1|n|symptoms|อาการ|síntoma","demencia":"C1|n|dementia|ภาวะสมองเสื่อม","no obstante":"B2|expr|nevertheless|อย่างไรก็ตาม","prudencia":"C1|n|caution|ความระมัดระวัง","varían":"B2|v|vary|แตกต่างกัน|variar","según":"B1|prep|according to|ตาม","dominio":"B2|n|mastery, proficiency|ความเชี่ยวชาญ","aprendizaje":"B2|n|learning|การเรียนรู้","cotidiano":"B2|adj|daily|ในชีวิตประจำวัน","tarde":"A1|adv|late|สาย","conserva":"B2|v|retains|คงไว้|conservar","plasticidad":"C2|n|plasticity|ความยืดหยุ่น (สมอง)"},
  q:[{t:"main",q:["¿Qué idea resume mejor el texto?","ข้อใดสรุปบทความได้ดีที่สุด"],o:["El bilingüismo confunde a los niños pequeños.","Hablar dos idiomas parece aportar beneficios cognitivos, aunque con matices.","Solo los niños pueden aprender idiomas.","El bilingüismo cura la demencia."],a:1,x:"บทความเสนอประโยชน์ทางสมอง แต่มีย่อหน้าที่ขอให้ “ระมัดระวัง” (prudencia) ข้อ B จึงครบที่สุด ข้อ D เกินจริง: บทความบอกแค่ “อาจชะลอ” ไม่ใช่ “รักษา”"},
     {t:"detail",q:["¿Por qué el cerebro bilingüe se «entrena» constantemente?","ทำไมสมองสองภาษาจึงได้ “ฝึก” อยู่ตลอดเวลา"],o:["Porque traduce todo lo que oye.","Porque tiene que bloquear el idioma que no está usando.","Porque duerme menos.","Porque olvida un idioma cada día."],a:1,x:"“el cerebro debe inhibir constantemente la lengua que no necesita” — inhibir = ยับยั้ง/บล็อก"},
     {t:"not",q:["Según el texto, ¿cuál de estas afirmaciones es FALSA?","ตามบทความ ข้อใดผิด"],o:["Antes se pensaba que el bilingüismo podía retrasar el desarrollo.","Los bilingües activan solo un idioma a la vez.","Los efectos dependen, entre otras cosas, de la edad de aprendizaje.","El cerebro adulto es más flexible de lo que se creía."],a:1,x:"บทความบอกว่า “mantienen ambos idiomas activos al mismo tiempo” ข้อ B จึงผิด"},
     {t:"tone",q:["¿Qué actitud muestran los científicos mencionados en el tercer párrafo?","นักวิทยาศาสตร์ในย่อหน้าที่สามมีทัศนคติอย่างไร"],o:["Entusiasmo sin reservas.","Rechazo total de los estudios.","Cautela ante resultados que no son uniformes.","Indiferencia."],a:2,x:"“piden prudencia: los resultados varían…” แสดงความระมัดระวังเพราะผลไม่สม่ำเสมอ ไม่ได้ปฏิเสธงานวิจัยทั้งหมด"},
     {t:"infer",q:["¿Qué se puede deducir de la última frase?","อนุมานจากประโยคสุดท้ายได้ว่าอย่างไร"],o:["Un adulto de cuarenta años todavía puede aprender un idioma con éxito.","Los adultos aprenden mejor que los niños.","Es inútil estudiar idiomas después de los veinte años.","La plasticidad cerebral desaparece en la infancia."],a:0,x:"“nunca es tarde para aprender” และสมองผู้ใหญ่ยังยืดหยุ่น จึงอนุมานว่าผู้ใหญ่ยังเรียนภาษาได้สำเร็จ ข้อ B เกินกว่าที่บทความบอก"}]},
{ id:"es-r3", cat:"economy", lvl:"C1", src:"เศรษฐกิจ/สังคม", title:["La trampa de la comodidad: cuando todo llega a casa","The comfort trap: when everything is delivered home","กับดักความสะดวก: เมื่อทุกอย่างมาส่งถึงบ้าน"],
  p:[[["En apenas una década, la entrega a domicilio ha pasado de ser un lujo ocasional a convertirse en un hábito cotidiano para millones de personas.","In barely a decade, home delivery has gone from being an occasional luxury to becoming a daily habit for millions of people.","ในเวลาเพียงทศวรรษเดียว บริการส่งถึงบ้านเปลี่ยนจากความหรูหรานานๆ ครั้ง กลายเป็นนิสัยประจำวันของคนนับล้าน"],
      ["Basta con un par de toques en la pantalla para que la cena, un libro o un cargador aparezcan en la puerta en menos de una hora.","A couple of taps on the screen are enough for dinner, a book or a charger to appear at the door in less than an hour.","แค่แตะหน้าจอสองสามครั้ง อาหารเย็น หนังสือ หรือที่ชาร์จก็มาถึงหน้าประตูภายในไม่ถึงชั่วโมง"]],
     [["Esta comodidad, sin embargo, tiene costes que rara vez figuran en el recibo.","This convenience, however, has costs that rarely appear on the receipt.","อย่างไรก็ตาม ความสะดวกนี้มีต้นทุนที่แทบไม่เคยปรากฏในใบเสร็จ"],
      ["Detrás de cada pedido urgente hay repartidores que, en muchos casos, trabajan como autónomos sin protección social y cuyos ingresos dependen de la rapidez con que pedaleen.","Behind every urgent order there are couriers who, in many cases, work as self-employed without social protection and whose income depends on how fast they pedal.","เบื้องหลังทุกคำสั่งซื้อด่วนคือคนส่งของที่หลายกรณีทำงานเป็นฟรีแลนซ์โดยไม่มีสวัสดิการสังคม และรายได้ขึ้นกับว่าปั่นจักรยานได้เร็วแค่ไหน"],
      ["A ello se suma el impacto urbano: furgonetas en doble fila, embalajes que se tiran tras un solo uso y pequeños comercios que no pueden competir con plazos tan cortos.","Added to this is the urban impact: vans double-parked, packaging thrown away after a single use and small shops that cannot compete with such short delivery times.","ยังมีผลกระทบต่อเมืองอีก เช่น รถตู้จอดซ้อนคัน บรรจุภัณฑ์ที่ใช้ครั้งเดียวทิ้ง และร้านค้าเล็กๆ ที่แข่งขันกับระยะเวลาส่งที่สั้นขนาดนี้ไม่ได้"]],
     [["Sería injusto, no obstante, demonizar a los consumidores, que a menudo recurren a estos servicios por falta de tiempo más que por capricho.","It would be unfair, however, to demonise consumers, who often turn to these services out of lack of time rather than whim.","อย่างไรก็ดี คงไม่ยุติธรรมหากจะโทษผู้บริโภค ซึ่งมักใช้บริการเหล่านี้เพราะไม่มีเวลามากกว่าเพราะเอาแต่ใจ"],
      ["El debate de fondo no es si debemos renunciar a la comodidad, sino quién paga realmente por ella y si estamos dispuestos a aceptar unas reglas que repartan esa carga de forma más equitativa.","The underlying debate is not whether we should give up convenience, but who really pays for it and whether we are willing to accept rules that distribute that burden more fairly.","ประเด็นถกเถียงที่แท้จริงไม่ใช่ว่าเราควรละทิ้งความสะดวกหรือไม่ แต่คือใครกันแน่ที่จ่ายราคาของมัน และเราพร้อมยอมรับกฎที่กระจายภาระนั้นอย่างเป็นธรรมกว่านี้หรือเปล่า"]]],
  v:{"trampa":"B2|n|trap|กับดัก","comodidad":"B2|n|comfort, convenience|ความสะดวกสบาย","apenas":"B2|adv|barely, hardly|แทบจะไม่, เพียง","entrega a domicilio":"B2|n|home delivery|บริการส่งถึงบ้าน","entrega":"B1|n|delivery|การส่ง","domicilio":"B2|n|home, residence|ที่อยู่อาศัย","lujo":"B2|n|luxury|ความหรูหรา","ocasional":"B2|adj|occasional|นานๆ ครั้ง","convertirse":"B1|v|to become|กลายเป็น","hábito":"B1|n|habit|นิสัย","basta":"B2|v|it's enough|ก็พอแล้ว|bastar","toques":"B1|n|taps, touches|การแตะ|toque","pantalla":"A2|n|screen|หน้าจอ","cargador":"B1|n|charger|ที่ชาร์จ","aparezcan":"B2|v|appear (subjunctive)|ปรากฏ|aparecer","costes":"B2|n|costs|ต้นทุน|coste","rara vez":"B2|expr|rarely|แทบไม่เคย","figuran":"C1|v|appear, are listed|ปรากฏ (ในรายการ)|figurar","recibo":"B1|n|receipt|ใบเสร็จ","pedido":"B1|n|order|คำสั่งซื้อ","urgente":"B1|adj|urgent|เร่งด่วน","repartidores":"B2|n|delivery riders|คนส่งของ|repartidor","autónomos":"B2|n|self-employed|ผู้ประกอบอาชีพอิสระ|autónomo","protección social":"C1|n|social protection|การคุ้มครองทางสังคม","cuyos":"C1|det|whose|ซึ่ง…ของเขา|cuyo","ingresos":"B2|n|income|รายได้|ingreso","dependen":"B1|v|depend|ขึ้นอยู่กับ|depender","rapidez":"B2|n|speed|ความเร็ว","pedaleen":"C1|v|pedal (subjunctive)|ปั่น (จักรยาน)|pedalear","se suma":"C1|v|is added|เพิ่มเข้ามา|sumarse","furgonetas":"B2|n|vans|รถตู้|furgoneta","doble fila":"C1|expr|double-parked|จอดซ้อนคัน","embalajes":"C1|n|packaging|บรรจุภัณฑ์|embalaje","tiran":"B1|v|throw away|ทิ้ง|tirar","comercios":"B2|n|shops, businesses|ร้านค้า|comercio","competir":"B2|v|to compete|แข่งขัน","plazos":"C1|n|deadlines, time frames|กำหนดเวลา|plazo","injusto":"B1|adj|unfair|ไม่ยุติธรรม","demonizar":"C2|v|to demonise|ป้ายสีว่าเป็นผู้ร้าย","consumidores":"B2|n|consumers|ผู้บริโภค|consumidor","a menudo":"B2|expr|often|บ่อยครั้ง","recurren":"C1|v|resort to|หันไปพึ่ง|recurrir","falta":"B1|n|lack|การขาด","capricho":"C1|n|whim|ความเอาแต่ใจ","de fondo":"C1|expr|underlying|ที่อยู่เบื้องลึก","renunciar":"B2|v|to give up|สละ, ละทิ้ง","dispuestos":"B2|adj|willing|พร้อมที่จะ|dispuesto","reglas":"B1|n|rules|กฎ|regla","repartan":"C1|v|distribute (subjunctive)|กระจาย|repartir","carga":"B2|n|burden, load|ภาระ","equitativa":"C2|adj|equitable, fair|เป็นธรรม|equitativo"},
  q:[{t:"main",q:["¿Cuál es la tesis del autor?","ข้อเสนอหลักของผู้เขียนคืออะไร"],o:["Hay que prohibir la entrega a domicilio.","Los consumidores son culpables de la precariedad de los repartidores.","La comodidad de la entrega rápida tiene costes ocultos y plantea la cuestión de cómo repartirlos de forma justa.","Los pequeños comercios son más rápidos que las plataformas."],a:2,x:"ประโยคสุดท้ายคือหัวใจ: ไม่ใช่เลิกความสะดวก แต่ “ใครจ่าย” และจะกระจายภาระให้เป็นธรรมอย่างไร ข้อ A และ B ผู้เขียนปฏิเสธโดยตรง"},
     {t:"vocab",q:["La expresión «costes que rara vez figuran en el recibo» se refiere a…","สำนวน “ต้นทุนที่แทบไม่ปรากฏในใบเสร็จ” หมายถึงอะไร"],o:["errores en la factura.","consecuencias sociales y ambientales que el cliente no paga directamente.","impuestos ocultos.","propinas para el repartidor."],a:1,x:"ย่อหน้าเดียวกันอธิบายต่อว่าคือภาระของคนส่งของ และผลกระทบต่อเมือง/สิ่งแวดล้อม ซึ่งลูกค้าไม่ได้จ่ายตรง"},
     {t:"not",q:["¿Qué afirmación NO puede extraerse del texto?","ข้อใดสรุปจากบทความไม่ได้"],o:["Muchos repartidores carecen de protección social.","Los embalajes generan residuos.","Los consumidores usan estos servicios principalmente por capricho.","A los pequeños comercios les cuesta competir."],a:2,x:"ผู้เขียนบอกว่าผู้บริโภคใช้บริการ “por falta de tiempo más que por capricho” ข้อ C จึงกลับด้าน"},
     {t:"purpose",q:["¿Qué función cumple el tercer párrafo en la argumentación?","ย่อหน้าที่สามมีบทบาทอย่างไรในการให้เหตุผล"],o:["Introduce un contraargumento para matizar la crítica y reorientar el debate.","Repite la crítica del párrafo anterior.","Presenta datos estadísticos.","Concluye que no hay ningún problema."],a:0,x:"เริ่มด้วย “Sería injusto, no obstante…” เป็นการยอมรับมุมฝั่งผู้บริโภค เพื่อลดความแรงของคำวิจารณ์ แล้วพาไปสู่คำถามเชิงโครงสร้างว่าใครควรรับภาระ"},
     {t:"infer",q:["¿Qué tipo de solución parece preferir el autor?","ผู้เขียนน่าจะชอบแนวทางแก้ไขแบบใด"],o:["Una solución individual: que cada uno deje de pedir comida.","Una solución colectiva basada en normas que distribuyan mejor los costes.","Ninguna, porque el problema no existe.","Aumentar la velocidad de las entregas."],a:1,x:"คำว่า “aceptar unas reglas que repartan esa carga” ชี้ไปที่กฎกติการ่วมกัน (ระดับสังคม) ไม่ใช่โยนให้ปัจเจก"}]}

novel: [
{ id:"es-n1", genre:"horror", lvl:"B2", title:["La niña del pozo","The girl in the well","เด็กหญิงในบ่อน้ำ"], blurb:"บ้านไร่ที่เพิ่งซื้อมามีบ่อน้ำเก่าที่ไม่ควรมีใครตอบเสียงเรียก",
  p:[[["Compramos la casa en septiembre, cuando el pueblo ya se había vaciado de veraneantes y las tardes empezaban a oler a leña.","We bought the house in September, when the village had already emptied of summer visitors and the afternoons were beginning to smell of firewood.","เราซื้อบ้านหลังนั้นในเดือนกันยายน ตอนที่นักท่องเที่ยวหน้าร้อนกลับไปหมดแล้ว และยามบ่ายเริ่มมีกลิ่นฟืน"],
      ["El agente inmobiliario no mencionó el pozo.","The estate agent didn't mention the well.","นายหน้าขายบ้านไม่ได้พูดถึงบ่อน้ำเลย"],
      ["Lo encontró mi hija Alba, escondido bajo una maraña de zarzas al fondo del huerto, con una tapa de madera tan podrida que se deshacía al tocarla.","My daughter Alba found it, hidden under a tangle of brambles at the back of the vegetable garden, with a wooden lid so rotten that it crumbled when touched.","อัลบา ลูกสาวของฉันเป็นคนเจอมัน ซ่อนอยู่ใต้พงหนามท้ายสวนผัก ฝาไม้ผุจนแตกร่วนเมื่อสัมผัส"]],
     [["—Mamá, ahí abajo hay alguien —me dijo aquella noche, mientras le apagaba la luz.","'Mum, there's someone down there,' she told me that night, while I was turning off her light.","“แม่ ข้างล่างนั่นมีคนอยู่” เธอบอกฉันคืนนั้น ขณะที่ฉันกำลังปิดไฟให้"],
      ["Sonreí, como se sonríe ante las fantasías de una niña de siete años, y le di un beso en la frente.","I smiled, the way one smiles at the fantasies of a seven-year-old girl, and kissed her on the forehead.","ฉันยิ้ม อย่างที่คนเราจะยิ้มให้จินตนาการของเด็กเจ็ดขวบ แล้วจูบหน้าผากเธอ"],
      ["—Me ha preguntado cómo me llamo —añadió, ya medio dormida—. Le he dicho que mañana se lo digo.","'She asked me what my name is,' she added, already half asleep. 'I told her I'll tell her tomorrow.'","“เขาถามหนูว่าหนูชื่ออะไร” เธอพูดต่อทั้งที่ครึ่งหลับ “หนูบอกว่าพรุ่งนี้จะบอก”"]],
     [["Al día siguiente, la vecina más anciana del pueblo se detuvo frente a nuestra verja.","The next day, the oldest neighbour in the village stopped in front of our gate.","วันรุ่งขึ้น หญิงชราที่อายุมากที่สุดในหมู่บ้านหยุดยืนหน้ารั้วบ้านเรา"],
      ["Miró el huerto durante un largo rato, santiguándose despacio, y luego me hizo una sola pregunta.","She looked at the garden for a long while, slowly crossing herself, and then asked me a single question.","นางจ้องมองสวนอยู่นาน ค่อยๆ ทำเครื่องหมายกางเขน แล้วถามฉันเพียงคำถามเดียว"],
      ["—¿La niña ya le ha dicho su nombre?","'Has the girl told her her name yet?'","“เด็กคนนั้นบอกชื่อให้มันรู้หรือยัง?”"]],
     [["Le expliqué, con una risa nerviosa, que Alba tenía mucha imaginación.","I explained, with a nervous laugh, that Alba had a lot of imagination.","ฉันอธิบายพร้อมหัวเราะอย่างประหม่าว่าอัลบาเป็นเด็กช่างจินตนาการ"],
      ["La anciana negó con la cabeza.","The old woman shook her head.","หญิงชราส่ายหน้า"],
      ["—En 1952 se cayó una cría a ese pozo y nadie la sacó a tiempo —murmuró—. Desde entonces pregunta nombres. Y a quien se lo dice, se lo queda.","'In 1952 a little girl fell into that well and nobody got her out in time,' she murmured. 'Since then she asks for names. And whoever tells her, she keeps.'","“ปี 1952 มีเด็กหญิงคนหนึ่งตกลงไปในบ่อนั้น ไม่มีใครช่วยขึ้นมาทัน” นางพึมพำ “ตั้งแต่นั้นมันก็ถามชื่อ และใครที่บอกชื่อให้มัน มันจะเอาตัวไป”"]],
     "* * *",

{ id:"es-n2", genre:"comedy", lvl:"B1", title:["El loro de mi suegra","My mother-in-law's parrot","นกแก้วของแม่ยาย"], blurb:"รับฝากนกแก้วแค่สุดสัปดาห์เดียว แต่มันพูดมากเกินกว่าที่ใครควรได้ยิน",
  p:[[["Cuando mi suegra se fue de crucero, nos dejó a cargo de Paco, su loro, con una lista de instrucciones de cuatro páginas.","When my mother-in-law went on a cruise, she left us in charge of Paco, her parrot, with a four-page list of instructions.","ตอนแม่ยายไปล่องเรือสำราญ ท่านฝากพาโก นกแก้วของท่าน ไว้กับเรา พร้อมรายการคำสั่งยาวสี่หน้า"],
      ["La primera decía, en mayúsculas: «NO HABLÉIS DE POLÍTICA DELANTE DE ÉL».","The first one said, in capital letters: 'DO NOT TALK ABOUT POLITICS IN FRONT OF HIM'.","ข้อแรกเขียนตัวใหญ่ว่า “ห้ามคุยเรื่องการเมืองต่อหน้ามัน”"],
      ["Nos pareció una broma.","We thought it was a joke.","เราคิดว่าเป็นเรื่องตลก"],
      ["No lo era.","It wasn't.","แต่มันไม่ใช่"]],
     [["Paco sabía unas trescientas palabras y las usaba con una precisión inquietante.","Paco knew about three hundred words and used them with unsettling precision.","พาโกรู้คำศัพท์ราวสามร้อยคำ และใช้มันอย่างแม่นยำจนน่าขนลุก"],
      ["Cuando mi marido abrió la nevera a medianoche, Paco gritó: «¡Otra vez, Manolo! ¡Otra vez!».","When my husband opened the fridge at midnight, Paco shouted: 'Again, Manolo! Again!'","พอสามีฉันเปิดตู้เย็นตอนเที่ยงคืน พาโกก็ตะโกนว่า “อีกแล้วนะ มาโนโล! อีกแล้ว!”"],
      ["Manolo es el nombre de mi suegro, que lleva quince años a dieta sin perder un solo kilo.","Manolo is my father-in-law's name, who has been on a diet for fifteen years without losing a single kilo.","มาโนโลคือชื่อพ่อตา ผู้ซึ่งลดน้ำหนักมาสิบห้าปีโดยไม่ลดลงเลยสักกิโล"]],
     [["El sábado vinieron a cenar nuestros vecinos, una pareja encantadora y muy formal.","On Saturday our neighbours came for dinner, a charming and very proper couple.","วันเสาร์ เพื่อนบ้านมาทานข้าวเย็นด้วย เป็นคู่รักที่น่ารักและเรียบร้อยมาก"],
      ["Todo iba de maravilla hasta que, en pleno postre, Paco carraspeó como un presentador de televisión y anunció con la voz exacta de mi suegra: «Esa vecina se ha operado la nariz».","Everything was going wonderfully until, in the middle of dessert, Paco cleared his throat like a TV presenter and announced in exactly my mother-in-law's voice: 'That neighbour has had a nose job.'","ทุกอย่างราบรื่นดี จนกระทั่งระหว่างกินของหวาน พาโกกระแอมเหมือนพิธีกรรายการทีวี แล้วประกาศด้วยเสียงเหมือนแม่ยายเป๊ะว่า “ยัยเพื่อนบ้านนั่นไปทำจมูกมา”"]],
     [["Se hizo un silencio tan espeso que se podía cortar con cuchillo.","A silence fell so thick you could cut it with a knife.","ความเงียบเกิดขึ้นหนาทึบจนเอามีดตัดได้"],
      ["La vecina se llevó la mano a la cara.","The neighbour put her hand to her face.","คุณเพื่อนบ้านยกมือขึ้นแตะหน้า"],
      ["Mi marido, en un intento desesperado por salvar la noche, tosió muy fuerte y dijo: «¡Qué loro tan gracioso! Repite cualquier tontería que oye en la tele».","My husband, in a desperate attempt to save the evening, coughed very loudly and said: 'What a funny parrot! He repeats any nonsense he hears on TV.'","สามีฉันพยายามกู้สถานการณ์อย่างสิ้นหวัง ไอเสียงดังแล้วพูดว่า “นกแก้วตลกจัง! มันชอบพูดตามเรื่องไร้สาระที่ได้ยินในทีวี”"],
      ["Paco lo miró con lástima, ladeó la cabeza y respondió: «Mentiroso, como tu padre».","Paco looked at him with pity, tilted his head and replied: 'Liar, just like your father.'","พาโกมองเขาอย่างสมเพช เอียงคอ แล้วตอบว่า “ขี้โกหก เหมือนพ่อแกเลย”"]],
     "* * *",
     [["Cuando mi suegra volvió, morena y feliz, le preguntamos si Paco había dado mucha guerra.","When my mother-in-law came back, tanned and happy, she asked us if Paco had given us much trouble.","พอแม่ยายกลับมา ผิวแทนและอารมณ์ดี ท่านถามว่าพาโกสร้างปัญหาเยอะไหม"],

     ["Los técnicos forestales nos explicaron que muchas especies mediterráneas están adaptadas al fuego: el alcornoque, por ejemplo, rebrota gracias a su corteza gruesa.","Forestry experts explained to us that many Mediterranean species are adapted to fire: the cork oak, for example, resprouts thanks to its thick bark.","เจ้าหน้าที่ป่าไม้อธิบายว่าพืชเมดิเตอร์เรเนียนหลายชนิดปรับตัวให้อยู่กับไฟได้ เช่น ต้นโอ๊กคอร์กที่แตกยอดใหม่ได้เพราะเปลือกหนา"],

{ id:"es-f12", cat:"culture", lvl:"B2", user:"Rocío Montoya", handle:"rocio_baila", time:"5 วัน", likes:980,

     ["Mucha gente cree que el flamenco es solo baile y faldas de lunares, pero en realidad nació del cante, de la pena y de la mezcla de culturas en Andalucía.","Many people think flamenco is just dancing and polka-dot skirts, but in reality it was born from song, from sorrow and from the mix of cultures in Andalusia.","หลายคนคิดว่าฟลาเมงโกคือการเต้นและกระโปรงลายจุด แต่จริงๆ แล้วมันเกิดจากการร้องเพลง ความเศร้าโศก และการผสมผสานวัฒนธรรมในแคว้นอันดาลูเซีย"],
