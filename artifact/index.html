      ["Maar de tulp komt oorspronkelijk niet uit Nederland.","But the tulip doesn't originally come from the Netherlands.","แต่ทิวลิปไม่ได้มีถิ่นกำเนิดในเนเธอร์แลนด์"],
      ["Wilde tulpen groeien in de bergen van Centraal-Azië.","Wild tulips grow in the mountains of Central Asia.","ทิวลิปป่าเติบโตในเทือกเขาของเอเชียกลาง"]],
     [["Via het Ottomaanse Rijk, het huidige Turkije, kwam de bloem in de zestiende eeuw naar Europa.","Via the Ottoman Empire, today's Turkey, the flower came to Europe in the sixteenth century.","ดอกไม้นี้เดินทางผ่านจักรวรรดิออตโตมัน หรือตุรกีในปัจจุบัน มาถึงยุโรปในศตวรรษที่สิบหก"],
      ["In Nederland waren de grond en het klimaat perfect voor tulpenbollen.","In the Netherlands the soil and the climate were perfect for tulip bulbs.","ที่เนเธอร์แลนด์ ดินและสภาพอากาศเหมาะมากสำหรับหัวทิวลิป"],
      ["Nu is Nederland de grootste exporteur van bloembollen ter wereld.","Now the Netherlands is the biggest exporter of flower bulbs in the world.","ปัจจุบันเนเธอร์แลนด์เป็นผู้ส่งออกหัวดอกไม้รายใหญ่ที่สุดในโลก"]],
     [["In het voorjaar zie je bij Lisse enorme velden in rood, geel en paars.","In spring you can see enormous fields in red, yellow and purple near Lisse.","ในฤดูใบไม้ผลิ ใกล้เมืองลิสเซอจะเห็นทุ่งดอกไม้กว้างใหญ่สีแดง เหลือง และม่วง"],
      ["Daar ligt ook de Keukenhof, een park met ongeveer zeven miljoen bloembollen.","The Keukenhof is also there, a park with about seven million flower bulbs.","ที่นั่นยังมีสวนเคอเคนฮอฟ ซึ่งมีหัวดอกไม้ประมาณเจ็ดล้านหัว"],
      ["Het park is maar ongeveer acht weken per jaar open, want tulpen bloeien niet lang.","The park is only open for about eight weeks a year, because tulips don't bloom for long.","สวนเปิดเพียงประมาณแปดสัปดาห์ต่อปี เพราะทิวลิปบานไม่นาน"]]],

  q:[{t:"main",q:["Wat is de belangrijkste boodschap van de tekst?","สาระสำคัญของบทความคืออะไร"],o:["Tulpen zijn alleen rood en geel.","De tulp komt uit het oosten, maar werd in Nederland groot.","De Keukenhof is altijd open.","Tulpen groeien niet in Azië."],a:1,x:"บทความเล่าว่าทิวลิปมาจากเอเชียกลาง แต่กลายเป็นสินค้าใหญ่ของเนเธอร์แลนด์"},

     {t:"not",q:["Wat staat NIET in de tekst?","ข้อใดไม่ได้กล่าวไว้ในบทความ"],o:["Nederland exporteert veel bloembollen.","De Keukenhof heeft miljoenen bollen.","Tulpen zijn in Nederland ontdekt.","De grond in Nederland is goed voor tulpen."],a:2,x:"บทความบอกว่าทิวลิปไม่ได้มาจากเนเธอร์แลนด์ จึงไม่ได้ถูกค้นพบที่นั่น"}]},

{ id:"nl-r14", cat:"history", lvl:"B1", src:"ประวัติศาสตร์/วิศวกรรม", title:["De molens van Kinderdijk","The windmills of Kinderdijk","กังหันลมแห่งคินเดอร์ไดค์"],
  p:[[["Bij het dorp Kinderdijk, niet ver van Rotterdam, staan negentien windmolens op een rij langs het water.","Near the village of Kinderdijk, not far from Rotterdam, nineteen windmills stand in a row along the water.","ใกล้หมู่บ้านคินเดอร์ไดค์ ไม่ไกลจากร็อตเทอร์ดัม มีกังหันลมสิบเก้าตัวตั้งเรียงรายริมน้ำ"],
      ["De meeste werden rond 1740 gebouwd.","Most were built around 1740.","ส่วนใหญ่สร้างขึ้นราวปี 1740"],
      ["Ze maalden geen graan, zoals veel mensen denken, maar water.","They didn't grind grain, as many people think, but pumped water.","กังหันเหล่านี้ไม่ได้ใช้บดเมล็ดพืชอย่างที่หลายคนคิด แต่ใช้สูบน้ำ"]],
     [["Het land rond Kinderdijk ligt lager dan de rivieren ernaast.","The land around Kinderdijk lies lower than the rivers next to it.","พื้นดินรอบคินเดอร์ไดค์อยู่ต่ำกว่าแม่น้ำที่อยู่ติดกัน"],
      ["Regenwater blijft daardoor in de polder staan en moet weg, anders overstroomt het land.","Rainwater therefore stays in the polder and has to be removed, otherwise the land floods.","น้ำฝนจึงขังอยู่ในพื้นที่พอลเดอร์และต้องถูกระบายออก ไม่เช่นนั้นพื้นดินจะถูกน้ำท่วม"],
      ["De molens pompten het water omhoog naar een hoger kanaal, en van daar stroomde het naar de rivier.","The mills pumped the water up to a higher canal, and from there it flowed to the river.","กังหันลมจะสูบน้ำขึ้นไปยังคลองที่สูงกว่า แล้วจากที่นั่นน้ำจะไหลลงแม่น้ำ"]],
     [["Tegenwoordig doen elektrische gemalen dat werk.","Nowadays electric pumping stations do that work.","ปัจจุบันสถานีสูบน้ำไฟฟ้าทำหน้าที่นั้นแทน"],
      ["Toch worden de molens nog steeds onderhouden, en in sommige wonen zelfs molenaars.","Still the mills are still maintained, and millers even live in some of them.","ถึงอย่างนั้นกังหันลมก็ยังได้รับการดูแลรักษา และในบางตัวก็ยังมีคนดูแลกังหันอาศัยอยู่"],
      ["Sinds 1997 staat Kinderdijk op de Werelderfgoedlijst van UNESCO, als bewijs van de eeuwenlange Nederlandse strijd tegen het water.","Since 1997 Kinderdijk has been on UNESCO's World Heritage List, as evidence of the centuries-long Dutch struggle against water.","ตั้งแต่ปี 1997 คินเดอร์ไดค์อยู่ในรายชื่อมรดกโลกของยูเนสโก เป็นหลักฐานของการต่อสู้กับน้ำของชาวดัตช์ที่ยาวนานหลายศตวรรษ"]]],
  v:{"dorp":"A2|n|village|หมู่บ้าน","windmolens":"A2|n|windmills|กังหันลม|windmolen","rij":"A2|n|row|แถว","maalden":"B2|v|ground; pumped (mills)|บด; สูบน้ำ|malen","graan":"B1|n|grain|ธัญพืช","rivieren":"A2|n|rivers|แม่น้ำ|rivier","ernaast":"B1|adv|next to it|ข้างๆ","regenwater":"B1|n|rainwater|น้ำฝน","daardoor":"B1|adv|therefore, because of that|ด้วยเหตุนี้","polder":"B1|n|polder (reclaimed low land)|พื้นที่ลุ่มที่ถมจากน้ำ","overstroomt":"B2|v|floods|น้ำท่วม|overstromen","pompten":"B1|v|pumped|สูบ|pompen","omhoog":"A2|adv|up, upwards|ขึ้นไป","kanaal":"B1|n|canal|คลอง","stroomde":"B1|v|flowed|ไหล|stromen","tegenwoordig":"B1|adv|nowadays|ปัจจุบัน","gemalen":"C1|n|pumping stations|สถานีสูบน้ำ|gemaal","onderhouden":"B2|v|maintained|บำรุงรักษา","molenaars":"B2|n|millers|คนดูแลกังหัน|molenaar","werelderfgoedlijst":"B2|n|World Heritage List|รายชื่อมรดกโลก","bewijs":"B1|n|evidence, proof|หลักฐาน","eeuwenlange":"B2|adj|centuries-long|ยาวนานหลายศตวรรษ|eeuwenlang","strijd":"B2|n|struggle, fight|การต่อสู้"},
  q:[{t:"main",q:["Wat is de belangrijkste informatie?","ข้อมูลสำคัญที่สุดคืออะไร"],o:["De molens van Kinderdijk maalden graan voor brood.","De molens van Kinderdijk hielden de polder droog en zijn nu werelderfgoed.","In Kinderdijk wonen veel toeristen.","Rotterdam heeft negentien molens."],a:1,x:"บทความอธิบายหน้าที่สูบน้ำของกังหันลม และสถานะมรดกโลก"},
     {t:"detail",q:["Wat deden de molens eigenlijk?","จริงๆ แล้วกังหันลมทำหน้าที่อะไร"],o:["Ze maakten elektriciteit.","Ze maalden graan.","Ze pompten water uit de polder.","Ze lieten schepen varen."],a:2,x:"“Ze maalden geen graan… maar water.” และ “De molens pompten het water omhoog”"},
     {t:"infer",q:["Waarom moest het water omhoog worden gepompt?","ทำไมต้องสูบน้ำขึ้นที่สูง"],o:["Omdat de polder lager ligt dan de rivieren.","Omdat het water te koud was.","Omdat de molens te klein waren.","Omdat boeren het water wilden drinken."],a:0,x:"พื้นที่ต่ำกว่าแม่น้ำ น้ำจึงไหลออกเองไม่ได้ ต้องสูบขึ้นสู่คลองที่สูงกว่า"},
     {t:"vocab",q:["Wat betekent 'tegenwoordig' in de tekst?","‘tegenwoordig’ ในบทความหมายถึงอะไร"],o:["vroeger","nu, in deze tijd","nooit","morgen"],a:1,x:"tegenwoordig = ปัจจุบัน ตรงข้ามกับอดีตเมื่อปี 1740"},
     {t:"not",q:["Wat is NIET waar volgens de tekst?","ข้อใดไม่จริงตามบทความ"],o:["Er staan negentien molens.","Er wonen nog mensen in sommige molens.","De molens zijn het belangrijkste gemaal van Nederland van vandaag.","Kinderdijk staat sinds 1997 op de UNESCO-lijst."],a:2,x:"ปัจจุบันสถานีสูบน้ำไฟฟ้า (elektrische gemalen) ทำงานแทน กังหันลมจึงไม่ใช่ระบบหลักอีกแล้ว"}]},

{ id:"nl-r15", cat:"history", lvl:"B1", src:"ศิลปะ/ชีวประวัติ", title:["Vincent van Gogh: tien jaar schilderen","Vincent van Gogh: ten years of painting","วินเซนต์ ฟาน ก็อกฮ์: สิบปีแห่งการวาดภาพ"],
  p:[[["Vincent van Gogh werd in 1853 geboren in Zundert, een dorp in Brabant.","Vincent van Gogh was born in 1853 in Zundert, a village in Brabant.","วินเซนต์ ฟาน ก็อกฮ์ เกิดเมื่อปี 1853 ที่ซุนเดิร์ต หมู่บ้านในแคว้นบราบันต์"],
      ["Voordat hij kunstenaar werd, werkte hij onder andere als kunsthandelaar, leraar en predikant.","Before he became an artist, he worked as, among other things, an art dealer, a teacher and a preacher.","ก่อนจะเป็นศิลปิน เขาเคยทำงานเป็นพ่อค้างานศิลปะ ครู และนักเทศน์"],
      ["Pas toen hij zevenentwintig was, besloot hij schilder te worden.","Only when he was twenty-seven did he decide to become a painter.","เมื่ออายุยี่สิบเจ็ดปีเขาจึงตัดสินใจเป็นจิตรกร"]],
     [["Zijn vroege werk, zoals 'De aardappeleters' uit 1885, is donker en somber.","His early work, such as 'The Potato Eaters' from 1885, is dark and gloomy.","ผลงานยุคแรกของเขา เช่น ‘คนกินมันฝรั่ง’ ปี 1885 มีโทนมืดและหม่นหมอง"],
      ["In Parijs en later in het zonnige Zuid-Frankrijk werden zijn kleuren veel feller.","In Paris and later in sunny southern France his colours became much brighter.","ที่ปารีส และต่อมาที่ฝรั่งเศสตอนใต้ที่มีแดดจ้า สีในภาพของเขาสดขึ้นมาก"],
      ["Daar schilderde hij onder meer zijn beroemde zonnebloemen.","There he painted, among other things, his famous sunflowers.","ที่นั่นเขาวาดภาพดอกทานตะวันอันโด่งดังของเขา"]],
     [["Van Gogh leed aan ernstige psychische problemen en werd een tijd opgenomen in een inrichting in Saint-Rémy.","Van Gogh suffered from serious mental health problems and was admitted to an asylum in Saint-Rémy for a time.","ฟาน ก็อกฮ์ป่วยด้วยปัญหาสุขภาพจิตร้ายแรง และเคยเข้ารับการรักษาในสถานพยาบาลที่แซ็ง-เรมีช่วงหนึ่ง"],
      ["Hij stierf in 1890, op zevenendertigjarige leeftijd.","He died in 1890, at the age of thirty-seven.","เขาเสียชีวิตในปี 1890 ด้วยวัยสามสิบเจ็ดปี"],
      ["In slechts tien jaar maakte hij ongeveer achthonderdzestig olieverfschilderijen, maar tijdens zijn leven verkocht hij er bijna geen.","In only ten years he made about eight hundred and sixty oil paintings, but during his life he sold almost none of them.","ในเวลาเพียงสิบปี เขาวาดภาพสีน้ำมันราวแปดร้อยหกสิบภาพ แต่ตลอดชีวิตแทบขายไม่ได้เลย"],
      ["Zijn broer Theo steunde hem al die jaren met geld en met honderden brieven.","His brother Theo supported him all those years with money and with hundreds of letters.","ธีโอน้องชายของเขาช่วยเหลือเขาตลอดหลายปีนั้น ทั้งด้วยเงินและจดหมายหลายร้อยฉบับ"]]],
  v:{"geboren":"A1|v|born|เกิด|baren","kunstenaar":"A2|n|artist|ศิลปิน","onder andere":"B1|expr|among other things|รวมถึง","kunsthandelaar":"B2|n|art dealer|พ่อค้างานศิลปะ","predikant":"C1|n|preacher, minister|นักเทศน์","pas":"B1|adv|only (then), not until|เพิ่งจะ","besloot":"B1|v|decided|ตัดสินใจ|besluiten","schilder":"A2|n|painter|จิตรกร","vroege":"B1|adj|early|ยุคแรก|vroeg","aardappeleters":"B1|n|potato eaters|คนกินมันฝรั่ง","somber":"B2|adj|gloomy|หม่นหมอง","zonnige":"A2|adj|sunny|มีแดด|zonnig","feller":"B2|adj|brighter, more vivid|สดกว่า|fel","onder meer":"B2|expr|among other things|รวมถึง","beroemde":"A2|adj|famous|มีชื่อเสียง|beroemd","zonnebloemen":"A2|n|sunflowers|ดอกทานตะวัน|zonnebloem","leed":"B2|v|suffered|ทนทุกข์|lijden","ernstige":"B1|adj|serious|ร้ายแรง|ernstig","psychische":"B2|adj|mental, psychological|ทางจิตใจ|psychisch","opgenomen":"B2|v|admitted (to hospital)|รับเข้ารักษา|opnemen","inrichting":"C1|n|institution, asylum|สถานพยาบาล","stierf":"B1|v|died|เสียชีวิต|sterven","leeftijd":"A2|n|age|อายุ","olieverfschilderijen":"B2|n|oil paintings|ภาพสีน้ำมัน|olieverfschilderij","steunde":"B1|v|supported|สนับสนุน|steunen","brieven":"A2|n|letters|จดหมาย|brief"},
  q:[{t:"main",q:["Wat is de kern van de tekst?","แก่นของบทความคืออะไร"],o:["Van Gogh was een rijke kunstenaar.","Van Gogh maakte in korte tijd enorm veel werk, ondanks armoede en ziekte.","Van Gogh schilderde alleen zonnebloemen.","Theo van Gogh was een bekende schilder."],a:1,x:"บทความเน้นว่าในสิบปีเขาสร้างงานจำนวนมาก แม้จะป่วยและแทบขายงานไม่ได้"},
     {t:"detail",q:["Hoe oud was Van Gogh toen hij besloot schilder te worden?","ฟาน ก็อกฮ์อายุเท่าไรตอนตัดสินใจเป็นจิตรกร"],o:["Zeventien.","Zevenentwintig.","Zevenendertig.","Drieënvijftig."],a:1,x:"“Pas toen hij zevenentwintig was, besloot hij schilder te worden.” ส่วน 37 คืออายุตอนเสียชีวิต"},
     {t:"detail",q:["Hoe veranderden zijn schilderijen in Frankrijk?","ภาพของเขาเปลี่ยนไปอย่างไรเมื่ออยู่ฝรั่งเศส"],o:["Ze werden kleiner.","Ze werden donkerder.","De kleuren werden veel feller.","Hij schilderde alleen nog mensen."],a:2,x:"“werden zijn kleuren veel feller” ตรงข้ามกับงานยุคแรกที่มืด"},
     {t:"vocab",q:["Wat betekent 'steunde' in de laatste zin?","‘steunde’ ในประโยคสุดท้ายหมายถึงอะไร"],o:["hielp","vergat","schilderde","verkocht"],a:0,x:"steunen = สนับสนุน ช่วยเหลือ ธีโอช่วยด้วยเงินและจดหมาย"},
     {t:"infer",q:["Waarom was de hulp van Theo waarschijnlijk zo belangrijk?","เหตุใดความช่วยเหลือของธีโอจึงน่าจะสำคัญมาก"],o:["Omdat Vincent bijna niets verdiende met zijn schilderijen.","Omdat Theo zijn leraar was.","Omdat Vincent in Brabant bleef wonen.","Omdat Theo de schilderijen zelf maakte."],a:0,x:"ฟาน ก็อกฮ์แทบขายภาพไม่ได้ จึงต้องพึ่งเงินจากธีโอ"}]}
]

{ id:"nl-r16", cat:"science", lvl:"B2", src:"วิทยาศาสตร์/ประวัติศาสตร์", title:["Antoni van Leeuwenhoek en de onzichtbare wereld","Antoni van Leeuwenhoek and the invisible world","อันโตนี ฟาน เลเวนฮุก กับโลกที่มองไม่เห็น"],
  p:[[["Antoni van Leeuwenhoek (1632–1723) was geen professor, maar een lakenhandelaar uit Delft.","Antoni van Leeuwenhoek (1632–1723) was not a professor, but a cloth merchant from Delft.","อันโตนี ฟาน เลเวนฮุก (1632–1723) ไม่ใช่ศาสตราจารย์ แต่เป็นพ่อค้าผ้าจากเมืองเดลฟต์"],
      ["Hij had geen universitaire opleiding en sprak geen Latijn, de taal van de wetenschap in die tijd.","He had no university education and spoke no Latin, the language of science at the time.","เขาไม่ได้เรียนมหาวิทยาลัยและพูดภาษาละตินไม่ได้ ซึ่งเป็นภาษาของวิทยาศาสตร์ในสมัยนั้น"],

     [["Van Leeuwenhoek sleep zelf piepkleine lensjes, waarmee hij voorwerpen tot ongeveer tweehonderdzeventig keer kon vergroten.","Van Leeuwenhoek ground tiny lenses himself, with which he could magnify objects up to about two hundred and seventy times.","ฟาน เลเวนฮุกฝนเลนส์ขนาดจิ๋วด้วยตัวเอง ซึ่งขยายวัตถุได้ถึงราวสองร้อยเจ็ดสิบเท่า"],
      ["Zijn microscopen waren eenvoudig, maar beter dan alles wat er destijds bestond.","His microscopes were simple, but better than anything that existed at the time.","กล้องจุลทรรศน์ของเขาเรียบง่าย แต่ดีกว่าทุกอย่างที่มีอยู่ในยุคนั้น"],
      ["In de jaren 1670 zag hij in een druppel water krioelende 'diertjes': hij was een van de eersten die eencellige organismen en bacteriën beschreef.","In the 1670s he saw teeming 'little animals' in a drop of water: he was one of the first to describe single-celled organisms and bacteria.","ในทศวรรษ 1670 เขาเห็น ‘สัตว์ตัวจิ๋ว’ ยั้วเยี้ยในหยดน้ำ เขาเป็นหนึ่งในคนแรกที่บรรยายถึงสิ่งมีชีวิตเซลล์เดียวและแบคทีเรีย"]],
     [["Hij schreef zijn waarnemingen in het Nederlands op, in brieven aan de Royal Society in Londen.","He wrote down his observations in Dutch, in letters to the Royal Society in London.","เขาบันทึกสิ่งที่สังเกตเห็นเป็นภาษาดัตช์ ในจดหมายถึงราชสมาคมแห่งลอนดอน"],

      ["Zijn verhaal laat zien dat nieuwsgierigheid en nauwkeurigheid soms zwaarder wegen dan diploma's.","His story shows that curiosity and precision sometimes count for more than diplomas.","เรื่องราวของเขาแสดงให้เห็นว่าความอยากรู้และความแม่นยำบางครั้งมีน้ำหนักมากกว่าปริญญาบัตร"]]],

  q:[{t:"main",q:["Wat is de centrale gedachte van de tekst?","แนวคิดหลักของบทความคืออะไร"],o:["Alleen professoren kunnen grote ontdekkingen doen.","Een handelaar zonder academische opleiding legde met zelfgemaakte lenzen de basis voor de microbiologie.","De Royal Society wilde niets met Van Leeuwenhoek te maken hebben.","Delft was in de zeventiende eeuw de hoofdstad van de wetenschap."],a:1,x:"บทความเน้นว่าพ่อค้าที่ไม่มีวุฒิการศึกษาสามารถวางรากฐานจุลชีววิทยาได้ ข้อ C ขัดกับที่เขาได้เป็นสมาชิกในภายหลัง"},
     {t:"detail",q:["Waarom was het opmerkelijk dat hij in het Nederlands schreef?","ทำไมการที่เขาเขียนเป็นภาษาดัตช์จึงน่าสนใจ"],o:["Omdat Latijn toen de taal van de wetenschap was.","Omdat Nederlands toen verboden was.","Omdat de Royal Society alleen Frans las.","Omdat hij geen Nederlands sprak."],a:0,x:"“sprak geen Latijn, de taal van de wetenschap in die tijd” นักวิทยาศาสตร์ทั่วไปจึงเขียนเป็นภาษาละติน"},
     {t:"vocab",q:["Wat betekent 'aanvankelijk' in de derde alinea?","‘aanvankelijk’ ในย่อหน้าที่สามหมายถึงอะไร"],o:["uiteindelijk","in het begin","nooit","gelukkig"],a:1,x:"aanvankelijk = ในตอนแรก ก่อนที่จะมีการตรวจสอบแล้วจึงยอมรับ"},
     {t:"infer",q:["Wat kun je afleiden uit het feit dat de Royal Society zijn werk liet controleren?","อนุมานอะไรได้จากการที่ราชสมาคมส่งคนตรวจสอบงานของเขา"],o:["Ze wilden zijn lenzen stelen.","Ze namen nieuwe beweringen pas aan na eigen verificatie.","Ze vonden Delft te ver weg.","Ze hadden zelf betere microscopen."],a:1,x:"พวกเขาไม่เชื่อทันที (sceptisch) แต่ยอมรับเมื่อตรวจสอบได้เอง แสดงถึงหลักการตรวจซ้ำทางวิทยาศาสตร์ ข้อ D ขัดกับบทความที่ว่าเลนส์ของเขาดีที่สุด"},
     {t:"purpose",q:["Waarom eindigt de auteur met de zin over diploma's?","ผู้เขียนปิดท้ายด้วยประโยคเรื่องปริญญาบัตรเพื่ออะไร"],o:["Om te zeggen dat studeren zinloos is.","Om een bredere les te trekken uit het verhaal van Van Leeuwenhoek.","Om Van Leeuwenhoek te bekritiseren.","Om reclame te maken voor de Universiteit van Delft."],a:1,x:"ผู้เขียนสรุปบทเรียนทั่วไปจากเรื่องราว คำว่า ‘soms’ แสดงว่าไม่ได้บอกว่าการเรียนไร้ประโยชน์ (ข้อ A เกินจริง)"}]},

{ id:"nl-r17", cat:"env", lvl:"B2", src:"วิศวกรรม/สิ่งแวดล้อม", title:["De Deltawerken: lessen uit de ramp van 1953","The Delta Works: lessons from the 1953 disaster","เดลตาเวิร์กส์: บทเรียนจากภัยพิบัติปี 1953"],
  p:[[["In de nacht van 31 januari op 1 februari 1953 viel een zware noordwesterstorm samen met springtij.","On the night of 31 January to 1 February 1953, a severe north-westerly storm coincided with a spring tide.","คืนวันที่ 31 มกราคมต่อเนื่องถึง 1 กุมภาพันธ์ 1953 พายุรุนแรงจากทิศตะวันตกเฉียงเหนือเกิดขึ้นพร้อมกับน้ำขึ้นสูงสุด"],
      ["Het water steeg zo hoog dat dijken in Zeeland, Zuid-Holland en West-Brabant op tientallen plaatsen bezweken.","The water rose so high that dikes in Zeeland, South Holland and West Brabant gave way in dozens of places.","น้ำสูงขึ้นจนเขื่อนกั้นน้ำในเซแลนด์ เซาท์ฮอลแลนด์ และเวสต์บราบันต์พังลงหลายสิบจุด"],
      ["In Nederland kwamen 1836 mensen om, en tienduizenden verloren hun huis.","In the Netherlands 1,836 people died, and tens of thousands lost their homes.","ในเนเธอร์แลนด์มีผู้เสียชีวิต 1,836 คน และอีกหลายหมื่นคนสูญเสียบ้าน"]],
     [["Kort na de ramp besloot de regering tot het Deltaplan: de zeegaten in het zuidwesten zouden grotendeels worden afgesloten.","Shortly after the disaster the government decided on the Delta Plan: the sea inlets in the south-west would largely be closed off.","ไม่นานหลังภัยพิบัติ รัฐบาลตัดสินใจทำแผนเดลตา โดยจะปิดปากอ่าวทางตะวันตกเฉียงใต้เกือบทั้งหมด"],
      ["Bij de Oosterschelde ontstond echter verzet van vissers en natuurbeschermers, omdat een dichte dam het unieke getijdengebied zou vernietigen.","At the Eastern Scheldt, however, fishermen and conservationists objected, because a closed dam would destroy the unique tidal area.","แต่ที่ปากอ่าวโอสเตอร์สเกลเดอ ชาวประมงและนักอนุรักษ์ต่อต้าน เพราะเขื่อนปิดตายจะทำลายพื้นที่น้ำขึ้นน้ำลงอันมีเอกลักษณ์"],
      ["Daarom werd een stormvloedkering gebouwd met beweegbare schuiven, die alleen bij gevaarlijk hoog water dichtgaan; hij werd in 1986 geopend.","So a storm surge barrier was built with movable gates that only close when the water is dangerously high; it was opened in 1986.","จึงมีการสร้างประตูกั้นคลื่นพายุซัดฝั่งที่มีบานเลื่อนได้ ซึ่งจะปิดเฉพาะเมื่อระดับน้ำสูงจนเป็นอันตราย และเปิดใช้ในปี 1986"]],
     [["Het sluitstuk was de Maeslantkering bij Rotterdam (1997): twee drijvende armen van elk ongeveer 210 meter lang, die de Nieuwe Waterweg kunnen afsluiten.","The final piece was the Maeslant Barrier near Rotterdam (1997): two floating arms, each about 210 metres long, that can close off the New Waterway.","ชิ้นสุดท้ายคือประตูกั้นน้ำเมสลันต์ใกล้ร็อตเทอร์ดัม (1997) มีแขนลอยน้ำสองข้าง แต่ละข้างยาวราว 210 เมตร ซึ่งสามารถปิดทางน้ำนิวเวอวอเตอร์เวกได้"],
      ["Zo blijft de haven bereikbaar voor schepen, terwijl het achterland toch beschermd is.","This way the port stays accessible to ships, while the hinterland is still protected.","ด้วยวิธีนี้ท่าเรือยังเข้าออกได้สำหรับเรือ ขณะที่พื้นที่ด้านในก็ได้รับการปกป้อง"],
      ["Door de stijgende zeespiegel wordt nu al onderzocht hoe lang deze werken nog volstaan.","Because of rising sea levels, research is already being done into how long these works will remain sufficient.","เพราะระดับน้ำทะเลที่สูงขึ้น ขณะนี้จึงมีการศึกษาแล้วว่าสิ่งก่อสร้างเหล่านี้จะยังเพียงพอได้อีกนานเท่าไร"]]],
  v:{"noordwesterstorm":"C1|n|north-westerly storm|พายุจากตะวันตกเฉียงเหนือ","viel samen met":"B2|expr|coincided with|เกิดพร้อมกับ|samenvallen","springtij":"C1|n|spring tide|น้ำเกิด (น้ำขึ้นสูงสุด)","steeg":"B1|v|rose|สูงขึ้น|stijgen","dijken":"B1|n|dikes|เขื่อนกั้นน้ำ|dijk","tientallen":"B1|num|dozens|หลายสิบ","bezweken":"C1|v|gave way, collapsed|พังลง|bezwijken","kwamen om":"B2|v|died, perished|เสียชีวิต|omkomen","ramp":"B1|n|disaster|ภัยพิบัติ","regering":"B1|n|government|รัฐบาล","zeegaten":"C1|n|sea inlets|ปากอ่าว|zeegat","grotendeels":"B2|adv|largely|ส่วนใหญ่","afgesloten":"B1|v|closed off|ปิดกั้น|afsluiten","verzet":"B2|n|resistance, opposition|การต่อต้าน","vissers":"A2|n|fishermen|ชาวประมง|visser","natuurbeschermers":"C1|n|conservationists|นักอนุรักษ์ธรรมชาติ|natuurbeschermer","getijdengebied":"C1|n|tidal area|พื้นที่น้ำขึ้นน้ำลง","vernietigen":"B2|v|to destroy|ทำลาย","stormvloedkering":"C1|n|storm surge barrier|ประตูกั้นคลื่นพายุซัดฝั่ง","beweegbare":"B2|adj|movable|เคลื่อนที่ได้|beweegbaar","schuiven":"B2|n|sliding gates|บานเลื่อน|schuif","sluitstuk":"C1|n|final piece|ชิ้นปิดท้าย","drijvende":"B2|adj|floating|ลอยน้ำ|drijvend","bereikbaar":"B2|adj|accessible, reachable|เข้าถึงได้","achterland":"C1|n|hinterland|พื้นที่ด้านใน","beschermd":"B1|adj|protected|ได้รับการปกป้อง","stijgende":"B1|adj|rising|ที่สูงขึ้น|stijgend","zeespiegel":"B1|n|sea level|ระดับน้ำทะเล","volstaan":"C1|v|to suffice|เพียงพอ"},
  q:[{t:"main",q:["Wat beschrijft de tekst vooral?","บทความนี้บรรยายเรื่องใดเป็นหลัก"],o:["Hoe Nederland na een ramp een systeem van waterkeringen bouwde en daarbij natuur en economie afwoog.","Waarom stormen in Nederland steeds vaker voorkomen.","Hoe vissers de Oosterschelde hebben drooggelegd.","Hoe de Eiffeltoren naar Rotterdam kwam."],a:0,x:"บทความเล่าจากภัยพิบัติ → แผนเดลตา → การหาทางประนีประนอมกับธรรมชาติ (โอสเตอร์สเกลเดอ) และเศรษฐกิจ (ท่าเรือ)"},
     {t:"detail",q:["Waarom werd de Oosterschelde niet volledig afgesloten?","ทำไมโอสเตอร์สเกลเดอจึงไม่ถูกปิดทั้งหมด"],o:["Omdat het te duur was.","Omdat een dichte dam het getijdengebied zou vernietigen.","Omdat daar nooit overstromingen waren.","Omdat Rotterdam daartegen was."],a:1,x:"ชาวประมงและนักอนุรักษ์คัดค้าน “omdat een dichte dam het unieke getijdengebied zou vernietigen”"},
     {t:"not",q:["Welke uitspraak klopt NIET volgens de tekst?","ข้อความใดไม่ถูกต้องตามบทความ"],o:["De ramp van 1953 werd mede veroorzaakt door springtij.","De Oosterscheldekering gaat alleen bij gevaarlijk hoog water dicht.","De Maeslantkering sluit de haven van Rotterdam permanent af.","In 1953 verloren tienduizenden mensen hun huis."],a:2,x:"ประตูเมสลันต์ปิดเมื่อจำเป็นเท่านั้น “Zo blijft de haven bereikbaar voor schepen” ไม่ได้ปิดถาวร"},
     {t:"vocab",q:["Wat betekent 'bezweken' in de eerste alinea?","‘bezweken’ ในย่อหน้าแรกหมายถึงอะไร"],o:["werden gebouwd","braken door / gaven het op","werden hoger","werden geschilderd"],a:1,x:"bezwijken = พัง ทนไม่ไหว เขื่อนพังเพราะน้ำสูงเกินไป"},
     {t:"infer",q:["Wat suggereert de laatste zin over de toekomst?","ประโยคสุดท้ายบอกเป็นนัยอะไรเกี่ยวกับอนาคต"],o:["Dat de Deltawerken voor altijd volstaan.","Dat er in de toekomst mogelijk extra maatregelen nodig zijn.","Dat de Deltawerken worden afgebroken.","Dat de zeespiegel daalt."],a:1,x:"การศึกษาว่า ‘จะยังเพียงพออีกนานเท่าไร’ แปลว่าวันหนึ่งอาจต้องมีมาตรการเพิ่มเติม"}]},

{ id:"nl-r18", cat:"society", lvl:"B2", src:"ภาษา/สังคม", title:["Het Nederlands: kleiner dan je denkt, groter dan je denkt","Dutch: smaller than you think, bigger than you think","ภาษาดัตช์: เล็กกว่าที่คิด และใหญ่กว่าที่คิด"],
  p:[[["Het Nederlands wordt vaak een 'kleine taal' genoemd, maar dat is betrekkelijk.","Dutch is often called a 'small language', but that is relative.","ภาษาดัตช์มักถูกเรียกว่า ‘ภาษาเล็ก’ แต่นั่นเป็นเรื่องสัมพัทธ์"],
      ["Het is de moedertaal van zo'n vierentwintig miljoen mensen, vooral in Nederland en in Vlaanderen, het noordelijke deel van België.","It is the mother tongue of some twenty-four million people, mainly in the Netherlands and in Flanders, the northern part of Belgium.","เป็นภาษาแม่ของคนราวยี่สิบสี่ล้านคน ส่วนใหญ่อยู่ในเนเธอร์แลนด์และแฟลนเดอร์ส ซึ่งเป็นภาคเหนือของเบลเยียม"],
      ["Daarmee heeft het meer moedertaalsprekers dan bijvoorbeeld het Zweeds, het Deens en het Noors samen.","That gives it more native speakers than, for example, Swedish, Danish and Norwegian combined.","จึงมีผู้พูดเป็นภาษาแม่มากกว่าภาษาสวีเดน เดนมาร์ก และนอร์เวย์รวมกันเสียอีก"]],
     [["Ook buiten Europa speelt de taal een rol.","The language also plays a role outside Europe.","นอกยุโรป ภาษานี้ก็มีบทบาทเช่นกัน"],
      ["In Suriname, een voormalige kolonie in Zuid-Amerika, is het Nederlands de officiële taal, en ook op Aruba, Curaçao en Sint-Maarten is het een officiële taal.","In Suriname, a former colony in South America, Dutch is the official language, and on Aruba, Curaçao and Sint Maarten it is also an official language.","ในซูรินาม อดีตอาณานิคมในอเมริกาใต้ ภาษาดัตช์เป็นภาษาราชการ และบนเกาะอารูบา กือราเซา และซินต์มาร์เตินก็เป็นภาษาราชการเช่นกัน"],
      ["Het Afrikaans in Zuid-Afrika is bovendien grotendeels uit het zeventiende-eeuwse Nederlands ontstaan, waardoor sprekers van beide talen elkaar redelijk kunnen volgen.","Afrikaans in South Africa, moreover, developed largely from seventeenth-century Dutch, so speakers of both languages can follow each other reasonably well.","นอกจากนี้ ภาษาอาฟรีกานส์ในแอฟริกาใต้ยังพัฒนามาจากภาษาดัตช์ในศตวรรษที่สิบเจ็ดเป็นส่วนใหญ่ ผู้พูดทั้งสองภาษาจึงพอเข้าใจกันได้"]],
     [["Sinds 1980 werken Nederland en België samen in de Nederlandse Taalunie, die onder meer de officiële spelling vastlegt; Suriname sloot zich in 2004 aan.","Since 1980 the Netherlands and Belgium have worked together in the Dutch Language Union, which among other things sets the official spelling; Suriname joined in 2004.","ตั้งแต่ปี 1980 เนเธอร์แลนด์และเบลเยียมร่วมมือกันในสหภาพภาษาดัตช์ ซึ่งมีหน้าที่หนึ่งคือกำหนดการสะกดคำอย่างเป็นทางการ ซูรินามเข้าร่วมในปี 2004"],
      ["Die gezamenlijke spelling staat in het 'Groene Boekje'.","That shared spelling is in the 'Green Booklet'.","การสะกดร่วมนี้รวบรวมไว้ใน ‘สมุดปกเขียว’"],
      ["Een uitdaging voor de taal is dat steeds meer hoger onderwijs in het Engels wordt gegeven, wat in Nederland tot felle debatten leidt.","A challenge for the language is that more and more higher education is taught in English, which leads to fierce debates in the Netherlands.","ความท้าทายของภาษานี้คือ การศึกษาระดับอุดมศึกษาสอนเป็นภาษาอังกฤษมากขึ้นเรื่อยๆ ซึ่งนำไปสู่การถกเถียงอย่างดุเดือดในเนเธอร์แลนด์"]]],

  q:[{t:"title",q:["Waarom heeft de auteur deze titel gekozen?","ทำไมผู้เขียนจึงเลือกชื่อเรื่องนี้"],o:["Omdat het Nederlands steeds kleiner wordt.","Omdat de taal tegelijk als klein wordt gezien, maar meer sprekers en verspreiding heeft dan verwacht.","Omdat de Taalunie dat heeft besloten.","Omdat Nederlanders lang zijn."],a:1,x:"ชื่อเรื่องเล่นกับความขัดแย้ง ถูกมองว่าเล็ก แต่มีผู้พูดมากกว่าภาษาสแกนดิเนเวียรวมกัน และแพร่กระจายนอกยุโรป"},
     {t:"detail",q:["Waar is het Nederlands GEEN officiële taal volgens de tekst?","ตามบทความ ที่ใดที่ภาษาดัตช์ไม่ใช่ภาษาราชการ"],o:["Suriname","Curaçao","Zuid-Afrika","Aruba"],a:2,x:"ในแอฟริกาใต้ใช้ภาษาอาฟรีกานส์ ซึ่งพัฒนามาจากภาษาดัตช์ แต่ไม่ใช่ภาษาดัตช์เอง"},
     {t:"vocab",q:["Wat betekent 'betrekkelijk' in de eerste zin?","‘betrekkelijk’ ในประโยคแรกหมายถึงอะไร"],o:["absoluut waar","afhankelijk van waarmee je vergelijkt","onbelangrijk","modern"],a:1,x:"betrekkelijk = สัมพัทธ์ ขึ้นอยู่กับว่าเปรียบเทียบกับอะไร ผู้เขียนจึงเทียบกับภาษาสแกนดิเนเวีย"},
     {t:"infer",q:["Waarom kunnen sprekers van het Afrikaans en het Nederlands elkaar redelijk volgen?","ทำไมผู้พูดอาฟรีกานส์และดัตช์จึงพอเข้าใจกัน"],o:["Omdat ze dezelfde spelling gebruiken.","Omdat het Afrikaans uit het oudere Nederlands is ontstaan.","Omdat ze allebei in Suriname wonen.","Omdat beide talen uit het Engels komen."],a:1,x:"อาฟรีกานส์ ‘grotendeels uit het zeventiende-eeuwse Nederlands ontstaan’ ทั้งสองภาษาจึงมีรากร่วมกัน"},
     {t:"tone",q:["Hoe beschrijft de auteur de opkomst van het Engels in het hoger onderwijs?","ผู้เขียนพูดถึงการใช้ภาษาอังกฤษในมหาวิทยาลัยด้วยน้ำเสียงแบบใด"],o:["Als een uitdaging waarover discussie bestaat.","Als een groot succes zonder nadelen.","Als iets wat verboden moet worden.","Als een grap."],a:0,x:"ผู้เขียนเรียกว่า ‘een uitdaging’ และกล่าวถึง ‘felle debatten’ โดยไม่ได้เลือกข้าง จึงเป็นน้ำเสียงที่เป็นกลางและให้ข้อมูล"}]},

{ id:"nl-r19", cat:"economy", lvl:"C1", src:"เศรษฐกิจ/สังคม", title:["Het poldermodel: overleg als nationale eigenschap","The polder model: consultation as a national trait","โมเดลพอลเดอร์: การเจรจาในฐานะลักษณะประจำชาติ"],
  p:[[["Met 'het poldermodel' wordt de Nederlandse neiging bedoeld om beleid tot stand te brengen via overleg tussen overheid, werkgevers en vakbonden.","'The polder model' refers to the Dutch tendency to shape policy through consultation between government, employers and trade unions.","‘โมเดลพอลเดอร์’ หมายถึงแนวโน้มของชาวดัตช์ที่จะกำหนดนโยบายผ่านการเจรจาระหว่างรัฐบาล นายจ้าง และสหภาพแรงงาน"],
      ["De term wordt vaak verklaard met een historische beeldspraak: wie samen in een polder woont, moet ondanks onderlinge onenigheid samenwerken om de dijken in stand te houden.","The term is often explained with a historical metaphor: those who live together in a polder must cooperate despite mutual disagreements in order to maintain the dikes.","คำนี้มักอธิบายด้วยอุปมาทางประวัติศาสตร์ ใครที่อาศัยในพอลเดอร์เดียวกัน แม้จะไม่ลงรอยกันก็ต้องร่วมมือกันรักษาเขื่อนกั้นน้ำ"],
      ["Of die verklaring historisch houdbaar is, betwijfelen sommige historici; als zelfbeeld is ze in elk geval hardnekkig.","Some historians doubt whether that explanation holds up historically; as a self-image it is persistent in any case.","นักประวัติศาสตร์บางคนสงสัยว่าคำอธิบายนี้มีหลักฐานรองรับทางประวัติศาสตร์หรือไม่ แต่ในฐานะภาพลักษณ์ที่คนดัตช์มองตัวเอง มันยังฝังแน่นอยู่"]],
     [["Het bekendste voorbeeld is het Akkoord van Wassenaar uit 1982.","The best-known example is the Wassenaar Agreement of 1982.","ตัวอย่างที่รู้จักกันดีที่สุดคือข้อตกลงวาสเซอนาร์ปี 1982"],
      ["Midden in een diepe economische crisis, met snel oplopende werkloosheid, spraken werkgevers en vakbonden af dat de lonen gematigd zouden stijgen.","In the middle of a deep economic crisis, with rapidly rising unemployment, employers and unions agreed that wages would rise only moderately.","ท่ามกลางวิกฤตเศรษฐกิจรุนแรงและการว่างงานที่พุ่งสูงอย่างรวดเร็ว นายจ้างและสหภาพแรงงานตกลงกันว่าค่าจ้างจะขึ้นอย่างจำกัด"],
      ["In ruil daarvoor zou er worden gewerkt aan arbeidstijdverkorting en meer werkgelegenheid.","In return, there would be efforts towards shorter working hours and more employment.","เพื่อแลกเปลี่ยน จะมีการลดชั่วโมงทำงานและสร้างการจ้างงานเพิ่มขึ้น"],
      ["In de jaren negentig werd het model internationaal geprezen, toen de Nederlandse werkloosheid opvallend daalde.","In the nineties the model was praised internationally, when Dutch unemployment fell remarkably.","ในทศวรรษ 1990 โมเดลนี้ได้รับคำชมในระดับนานาชาติ เมื่ออัตราการว่างงานของเนเธอร์แลนด์ลดลงอย่างเห็นได้ชัด"]],
     [["Critici wijzen er echter op dat dezelfde consensuscultuur ook tot stroperige besluitvorming kan leiden: als iedereen moet instemmen, worden lastige keuzes soms eindeloos uitgesteld.","Critics point out, however, that the same consensus culture can also lead to sluggish decision-making: if everyone has to agree, difficult choices are sometimes postponed endlessly.","อย่างไรก็ตาม ผู้วิจารณ์ชี้ว่าวัฒนธรรมฉันทามติแบบเดียวกันนี้อาจทำให้การตัดสินใจล่าช้าอืดอาด เมื่อทุกคนต้องเห็นชอบ ทางเลือกที่ยากจึงบางครั้งถูกเลื่อนออกไปไม่สิ้นสุด"],
      ["Bovendien zitten niet alle belangengroepen even prominent aan tafel; jongeren en flexwerkers voelen zich er bijvoorbeeld minder door vertegenwoordigd.","Moreover, not all interest groups sit equally prominently at the table; young people and flexible workers, for example, feel less represented by it.","นอกจากนี้ ไม่ใช่ทุกกลุ่มผลประโยชน์จะได้นั่งโต๊ะเจรจาอย่างเท่าเทียม คนรุ่นใหม่และแรงงานสัญญาจ้างชั่วคราว เป็นต้น รู้สึกว่าไม่ค่อยมีใครเป็นตัวแทนของพวกเขา"],
      ["Het poldermodel is dus minder een recept dan een gewoonte, met zowel kracht als beperkingen.","The polder model is therefore less a recipe than a habit, with both strengths and limitations.","ดังนั้นโมเดลพอลเดอร์จึงไม่ใช่สูตรสำเร็จ แต่เป็นธรรมเนียมที่มีทั้งจุดแข็งและข้อจำกัด"]]],
  v:{"poldermodel":"C1|n|polder model (consensus policy)|โมเดลพอลเดอร์ (การเจรจาหาฉันทามติ)","neiging":"C1|n|tendency|แนวโน้ม","beleid":"B2|n|policy|นโยบาย","tot stand brengen":"C1|expr|to bring about|ทำให้เกิดขึ้น","overleg":"B2|n|consultation|การปรึกษาหารือ","overheid":"B2|n|government, authorities|รัฐ","werkgevers":"B1|n|employers|นายจ้าง|werkgever","vakbonden":"B2|n|trade unions|สหภาพแรงงาน|vakbond","beeldspraak":"C1|n|metaphor, imagery|อุปมา","onderlinge":"C1|adj|mutual|ระหว่างกัน|onderling","onenigheid":"C1|n|disagreement|ความไม่ลงรอย","in stand houden":"C1|expr|to maintain|รักษาไว้","houdbaar":"C1|adj|tenable|ยืนยันได้, มีน้ำหนัก","betwijfelen":"C1|v|to doubt|สงสัย","historici":"B2|n|historians|นักประวัติศาสตร์|historicus","zelfbeeld":"C1|n|self-image|ภาพลักษณ์ของตัวเอง","hardnekkig":"C1|adj|persistent|ฝังแน่น","akkoord":"B2|n|agreement|ข้อตกลง","oplopende":"B2|adj|rising|เพิ่มขึ้น|oplopend","werkloosheid":"B2|n|unemployment|การว่างงาน","spraken af":"B1|v|agreed|ตกลงกัน|afspreken","lonen":"B2|n|wages|ค่าจ้าง|loon","gematigd":"C1|adv|moderately|อย่างพอประมาณ","in ruil daarvoor":"B2|expr|in return for that|เพื่อแลกกับสิ่งนั้น","arbeidstijdverkorting":"C2|n|reduction of working hours|การลดชั่วโมงทำงาน","werkgelegenheid":"B2|n|employment|การจ้างงาน","geprezen":"B2|v|praised|ได้รับคำชม|prijzen","opvallend":"B2|adv|remarkably|อย่างเห็นได้ชัด","critici":"B2|n|critics|ผู้วิจารณ์|criticus","consensuscultuur":"C1|n|consensus culture|วัฒนธรรมฉันทามติ","stroperige":"C2|adj|sluggish, syrupy|อืดอาด|stroperig","besluitvorming":"C1|n|decision-making|การตัดสินใจ","instemmen":"C1|v|to agree, consent|เห็นชอบ","uitgesteld":"B2|v|postponed|เลื่อนออกไป|uitstellen","belangengroepen":"C1|n|interest groups|กลุ่มผลประโยชน์|belangengroep","prominent":"C1|adv|prominently|อย่างโดดเด่น","flexwerkers":"C1|n|flexible/temporary workers|แรงงานสัญญาจ้างชั่วคราว|flexwerker","vertegenwoordigd":"C1|adj|represented|มีตัวแทน","beperkingen":"B2|n|limitations|ข้อจำกัด|beperking"},
  q:[{t:"main",q:["Wat is de hoofdgedachte van de tekst?","ความคิดหลักของบทความคืออะไร"],o:["Het poldermodel heeft de Nederlandse economie in 1982 volledig gered.","Het poldermodel is een overlegcultuur met aantoonbare successen, maar ook duidelijke nadelen.","Het poldermodel is uitgevonden door boeren in een polder.","Vakbonden zijn in Nederland machteloos."],a:1,x:"บทความนำเสนอทั้งความสำเร็จ (ปี 1990) และข้อจำกัด (ตัดสินใจช้า ตัวแทนไม่ครบ) ข้อ A เกินจริง ข้อ C ขัดกับที่นักประวัติศาสตร์สงสัยคำอธิบายนี้"},
     {t:"detail",q:["Wat werd in het Akkoord van Wassenaar afgesproken?","ข้อตกลงวาสเซอนาร์ตกลงกันว่าอย่างไร"],o:["Hogere lonen in ruil voor langere werkweken.","Gematigde loonstijging in ruil voor arbeidstijdverkorting en banen.","De afschaffing van vakbonden.","Een verbod op werkloosheid."],a:1,x:"“de lonen gematigd zouden stijgen. In ruil daarvoor… arbeidstijdverkorting en meer werkgelegenheid”"},
     {t:"infer",q:["Wat kan worden afgeleid uit de zin 'Of die verklaring historisch houdbaar is, betwijfelen sommige historici'?","อนุมานอะไรได้จากประโยค ‘Of die verklaring historisch houdbaar is…’"],o:["Dat de polder-verklaring wetenschappelijk bewezen is.","Dat het verband tussen dijkonderhoud en overlegcultuur mogelijk meer mythe dan feit is.","Dat historici het poldermodel hebben uitgevonden.","Dat er nooit polders zijn geweest."],a:1,x:"นักประวัติศาสตร์สงสัยว่าเรื่องเล่านี้จริงหรือไม่ แต่มัน ‘hardnekkig als zelfbeeld’ แปลว่าอาจเป็นตำนานมากกว่าข้อเท็จจริง"},
     {t:"vocab",q:["Wat betekent 'stroperige besluitvorming'?","‘stroperige besluitvorming’ หมายถึงอะไร"],o:["snelle en efficiënte beslissingen","trage, moeizame besluitvorming","zoete beloftes","geheime afspraken"],a:1,x:"stroop = น้ำเชื่อม ‘stroperig’ คือหนืด จึงหมายถึงการตัดสินใจที่ช้าและยืดเยื้อ ประโยคต่อมายืนยัน: ‘eindeloos uitgesteld’"},
     {t:"purpose",q:["Wat is de functie van de laatste zin?","ประโยคสุดท้ายมีหน้าที่อะไร"],o:["Een nieuw argument introduceren.","Een genuanceerde conclusie trekken uit de voor- en nadelen.","De lezer oproepen het poldermodel af te schaffen.","Een historisch feit corrigeren."],a:1,x:"‘minder een recept dan een gewoonte, met zowel kracht als beperkingen’ เป็นบทสรุปที่ชั่งน้ำหนักทั้งสองด้าน"}]},

{ id:"nl-r20", cat:"economy", lvl:"C1", src:"ประวัติศาสตร์เศรษฐกิจ", title:["De tulpenmanie: de eerste zeepbel, of een mythe?","Tulip mania: the first bubble, or a myth?","ความคลั่งทิวลิป: ฟองสบู่ครั้งแรก หรือแค่ตำนาน?"],
  p:[[["In de winter van 1636 op 1637 werden in de Republiek bollen van zeldzame tulpen verhandeld voor bedragen die tot de verbeelding spreken.","In the winter of 1636 to 1637, bulbs of rare tulips were traded in the Dutch Republic for sums that capture the imagination.","ในฤดูหนาวปี 1636 ต่อ 1637 ในสาธารณรัฐดัตช์ มีการซื้อขายหัวทิวลิปพันธุ์หายากในราคาที่ชวนตะลึง"],
      ["Gewilde soorten, met grillige vlammen in hun bloembladen, waren zeldzaam; men wist toen niet dat dat patroon door een virus werd veroorzaakt.","Sought-after varieties, with irregular flames in their petals, were rare; people didn't know then that the pattern was caused by a virus.","พันธุ์ที่เป็นที่ต้องการซึ่งมีลายเปลวไฟบนกลีบดอกนั้นหายาก ตอนนั้นยังไม่มีใครรู้ว่าลวดลายนี้เกิดจากไวรัส"],
      ["Er werd vooral gehandeld in herbergen, op papier, in bollen die nog in de grond zaten.","Trading took place mainly in inns, on paper, in bulbs that were still in the ground.","การซื้อขายส่วนใหญ่เกิดในโรงเตี๊ยม ทำบนกระดาษ โดยซื้อขายหัวทิวลิปที่ยังอยู่ใต้ดิน"]],
     [["Begin februari 1637 stortte de markt plotseling in: kopers kwamen niet meer opdagen, en veel contracten werden nooit nagekomen.","In early February 1637 the market suddenly collapsed: buyers no longer turned up, and many contracts were never honoured.","ต้นเดือนกุมภาพันธ์ 1637 ตลาดก็ล่มลงอย่างกะทันหัน ผู้ซื้อไม่มาปรากฏตัวอีก และสัญญาจำนวนมากไม่ได้รับการปฏิบัติตาม"],
      ["Het beeld van een hele natie die zich ruïneerde, ontleent zijn bekendheid grotendeels aan het boek van de Schotse journalist Charles Mackay uit 1841.","The image of a whole nation ruining itself owes its fame largely to the 1841 book by the Scottish journalist Charles Mackay.","ภาพของชาติทั้งชาติที่ทำลายตัวเองนั้นโด่งดังส่วนใหญ่เพราะหนังสือของชาร์ลส์ แม็กเคย์ นักข่าวชาวสก็อต ในปี 1841"],
      ["Mackay baseerde zich echter op moraliserende pamfletten uit die tijd, die de speculanten juist belachelijk wilden maken.","Mackay, however, relied on moralising pamphlets from that time, which precisely aimed to ridicule the speculators.","แต่แม็กเคย์อ้างอิงจากใบปลิวสั่งสอนศีลธรรมในยุคนั้น ซึ่งตั้งใจเยาะเย้ยนักเก็งกำไรอยู่แล้ว"]],
     [["Recent archiefonderzoek, onder anderen door de historica Anne Goldgar, schetst een genuanceerder beeld.","Recent archival research, by among others the historian Anne Goldgar, paints a more nuanced picture.","งานวิจัยจากเอกสารจดหมายเหตุในช่วงหลัง รวมถึงงานของนักประวัติศาสตร์แอนน์ โกลด์การ์ ให้ภาพที่ซับซ้อนกว่านั้น"],
      ["Zij vond nauwelijks bewijs van massale faillissementen of zelfmoorden; de handel bleef beperkt tot een vrij kleine kring van welgestelde kooplieden en ambachtslieden.","She found hardly any evidence of mass bankruptcies or suicides; the trade remained limited to a fairly small circle of well-to-do merchants and craftsmen.","เธอแทบไม่พบหลักฐานของการล้มละลายหรือการฆ่าตัวตายจำนวนมาก การค้าจำกัดอยู่ในกลุ่มพ่อค้าและช่างฝีมือที่มีฐานะไม่กี่กลุ่ม"],
      ["De schade was dus vooral een kwestie van geschonden vertrouwen, niet van economische ondergang.","The damage was therefore mainly a matter of broken trust, not of economic ruin.","ดังนั้นความเสียหายจึงเป็นเรื่องของความเชื่อใจที่ถูกทำลายเป็นหลัก ไม่ใช่ความล่มสลายทางเศรษฐกิจ"],
      ["Paradoxaal genoeg leert de tulpenmanie ons zo misschien minder over zeepbellen dan over de manier waarop een sterk verhaal een eigen leven gaat leiden.","Paradoxically, tulip mania may thus teach us less about bubbles than about how a strong story takes on a life of its own.","ที่น่าย้อนแย้งคือ ความคลั่งทิวลิปอาจสอนเราเรื่องฟองสบู่น้อยกว่าเรื่องที่ว่าเรื่องเล่าที่ทรงพลังสามารถมีชีวิตเป็นของตัวเองได้อย่างไร"]]],

 its own|มีชีวิตเป็นของตัวเอง"},
  q:[{t:"main",q:["Welke stelling vat de tekst het best samen?","ข้อใดสรุปบทความได้ดีที่สุด"],o:["De tulpenmanie verwoestte de Nederlandse economie in 1637.","De bekende versie van de tulpenmanie is grotendeels overdreven; de werkelijke schade was beperkter.","Tulpen werden in 1637 verboden.","Charles Mackay deed als eerste archiefonderzoek naar de tulpenhandel."],a:1,x:"ส่วนที่สามแย้งเรื่องเล่ายอดนิยม: แทบไม่มีการล้มละลายจำนวนมาก ความเสียหายคือความเชื่อใจ ไม่ใช่การล่มสลายของเศรษฐกิจ"},
     {t:"detail",q:["Waarom waren de 'gevlamde' tulpen zo zeldzaam?","ทำไมทิวลิป ‘ลายเปลวไฟ’ จึงหายาก"],o:["Omdat ze alleen in Turkije groeiden.","Omdat het patroon door een virus werd veroorzaakt, wat men toen niet begreep.","Omdat ze verboden waren.","Omdat ze alleen 's winters bloeiden."],a:1,x:"“men wist toen niet dat dat patroon door een virus werd veroorzaakt” ลวดลายจึงเกิดขึ้นอย่างคาดเดาไม่ได้"},
     {t:"infer",q:["Waarom is Mackays boek volgens de tekst een onbetrouwbare bron?","ทำไมหนังสือของแม็กเคย์จึงเป็นแหล่งข้อมูลที่ไม่น่าเชื่อถือตามบทความ"],o:["Omdat hij geen Nederlands sprak.","Omdat hij steunde op bevooroordeelde pamfletten die speculanten wilden bespotten.","Omdat hij zelf tulpen verkocht.","Omdat het boek in 1637 verscheen."],a:1,x:"แม็กเคย์อ้างอิงใบปลิวที่ ‘de speculanten juist belachelijk wilden maken’ ซึ่งเป็นแหล่งที่มีอคติ"},
     {t:"vocab",q:["Wat betekent 'nagekomen' in 'veel contracten werden nooit nagekomen'?","‘nagekomen’ ในประโยคนี้หมายถึงอะไร"],o:["getekend","uitgevoerd zoals afgesproken","vertaald","later gevonden"],a:1,x:"een contract nakomen = ปฏิบัติตามสัญญา สัญญาจำนวนมากจึงไม่มีใครทำตาม"},
     {t:"purpose",q:["Wat wil de auteur met de laatste zin duidelijk maken?","ผู้เขียนต้องการสื่ออะไรด้วยประโยคสุดท้าย"],o:["Dat zeepbellen niet bestaan.","Dat de tulpenmanie vooral illustreert hoe een overtuigend verhaal de geschiedschrijving kan domineren.","Dat de lezer tulpen moet kopen.","Dat Anne Goldgar zich vergist."],a:1,x:"เรื่องนี้สอนเราเรื่อง ‘hoe een sterk verhaal een eigen leven gaat leiden’ คือเรื่องเล่าที่ทรงพลังกลบข้อเท็จจริง ข้อ A เกินกว่าที่ผู้เขียนพูด (‘misschien minder’)"}]}

{ id:"nl-n8", genre:"horror", lvl:"A2", title:["De lift naar de dertiende verdieping","The lift to the thirteenth floor","ลิฟต์ไปชั้นที่สิบสาม"], blurb:"ในตึกที่ไม่มีชั้นสิบสาม ลิฟต์กลับหยุดที่ชั้นนั้น และมีคนรออยู่",
  p:[[["Ruben werkt 's nachts als bewaker in een groot kantoorgebouw in Rotterdam.","Ruben works nights as a security guard in a big office building in Rotterdam.","รูเบินทำงานกะกลางคืนเป็นยามในตึกสำนักงานใหญ่แห่งหนึ่งในร็อตเทอร์ดัม"],
      ["Het gebouw heeft vierentwintig verdiepingen, maar geen dertiende.","The building has twenty-four floors, but no thirteenth.","ตึกนี้มียี่สิบสี่ชั้น แต่ไม่มีชั้นสิบสาม"],
      ["Na twaalf komt veertien. Dat is in veel gebouwen zo, voor mensen die bijgelovig zijn.","After twelve comes fourteen. That's how it is in many buildings, for people who are superstitious.","ต่อจากสิบสองคือสิบสี่ ตึกหลายแห่งก็เป็นแบบนี้ เพื่อคนที่ถือโชคลาง"]],
     [["Om twee uur 's nachts maakt Ruben zijn ronde.","At two in the morning Ruben does his round.","ตีสอง รูเบินเดินตรวจรอบตึก"],

      ["De lift gaat omhoog. Tien, elf, twaalf…","The lift goes up. Ten, eleven, twelve…","ลิฟต์ขึ้นไป สิบ สิบเอ็ด สิบสอง…"],
      ["Dan stopt hij. Op het schermpje staat een getal dat er niet kan zijn: 13.","Then it stops. On the little screen there's a number that can't be there: 13.","แล้วลิฟต์ก็หยุด บนจอเล็กๆ ขึ้นตัวเลขที่ไม่น่าจะมีอยู่: 13"]],
     "* * *",
     [["De deuren gaan langzaam open.","The doors open slowly.","ประตูค่อยๆ เปิดออก"],
      ["Buiten is een gang met oude groene vloerbedekking. Het ruikt naar stof en sigaretten.","Outside there's a corridor with old green carpet. It smells of dust and cigarettes.","ข้างนอกเป็นทางเดินปูพรมสีเขียวเก่าๆ มีกลิ่นฝุ่นและบุหรี่"],
      ["Aan het einde van de gang staat een vrouw in een ouderwetse jurk. Ze heeft haar rug naar hem toe.","At the end of the corridor stands a woman in an old-fashioned dress. She has her back to him.","ที่ปลายทางเดินมีผู้หญิงคนหนึ่งสวมชุดแบบโบราณยืนหันหลังให้เขา"],
      ["'Eindelijk,' zegt ze, zonder zich om te draaien. 'Ik wacht al sinds 1962.'","'Finally,' she says, without turning around. 'I've been waiting since 1962.'","‘ในที่สุด’ เธอพูดโดยไม่หันมา ‘ฉันรอมาตั้งแต่ปี 1962’"]],
     [["Ruben drukt op alle knoppen tegelijk. De deuren gaan niet dicht.","Ruben presses all the buttons at once. The doors don't close.","รูเบินกดทุกปุ่มพร้อมกัน แต่ประตูไม่ยอมปิด"],

      ["Op het laatste moment gaan de deuren dicht en zakt de lift met een schok naar beneden.","At the last moment the doors close and the lift drops down with a jolt.","ในวินาทีสุดท้าย ประตูก็ปิดลง และลิฟต์ก็ทิ้งตัวลงอย่างกระตุก"]],

      ["Op een oude bouwtekening van 1961 vindt hij iets vreemds.","On an old building plan from 1961 he finds something strange.","ในแบบแปลนอาคารเก่าปี 1961 เขาพบบางอย่างที่แปลก"],
      ["Tussen de twaalfde en de veertiende verdieping staat één woord, met potlood geschreven: 'Dichtgemetseld.'","Between the twelfth and fourteenth floors there is one word, written in pencil: 'Bricked up.'","ระหว่างชั้นสิบสองกับชั้นสิบสี่ มีคำหนึ่งเขียนด้วยดินสอว่า ‘ก่ออิฐปิดตาย’"],
      ["Die nacht neemt Ruben de trap. Maar om twee uur hoort hij de lift. Hij gaat omhoog, en hij stopt.","That night Ruben takes the stairs. But at two o'clock he hears the lift. It goes up, and it stops.","คืนนั้นรูเบินเดินขึ้นบันได แต่ตอนตีสองเขาได้ยินเสียงลิฟต์ มันขึ้นไป แล้วก็หยุด"]]],

{ id:"nl-n9", genre:"romance", lvl:"B1", title:["Het boek met de verkeerde naam","The book with the wrong name","หนังสือที่มีชื่อผิด"], blurb:"หนังสือมือสองเล่มหนึ่งมีข้อความเขียนถึง ‘ยาน’ คนแปลกหน้า และพาเอฟาออกตามหาคนเขียน",
  p:[[["Eva kocht het boek op een rommelmarkt in Utrecht, voor één euro.","Eva bought the book at a flea market in Utrecht, for one euro.","เอฟาซื้อหนังสือเล่มนี้ที่ตลาดนัดของเก่าในอูเทรคต์ ราคาหนึ่งยูโร"],
      ["Het was een oude dichtbundel met een gescheurde kaft.","It was an old poetry collection with a torn cover.","มันเป็นรวมบทกวีเก่าที่ปกขาด"],
      ["Pas thuis zag ze dat er op de eerste bladzijde iets was geschreven, in een sierlijk handschrift:","Only at home did she see that something had been written on the first page, in elegant handwriting:","กลับถึงบ้านเธอจึงเห็นว่ามีข้อความเขียนไว้ในหน้าแรก ด้วยลายมือที่สวยงาม"],
      ["'Voor Jan, die nooit op tijd komt, maar altijd komt. – M.'","'For Jan, who is never on time, but always comes. – M.'","‘ถึงยาน ผู้ไม่เคยมาตรงเวลา แต่มาเสมอ – M.’"]],
     [["In de marge stonden overal kleine aantekeningen, in twee verschillende handschriften.","In the margins there were small notes everywhere, in two different handwritings.","ตามขอบหน้ามีโน้ตเล็กๆ อยู่ทั่วไป เขียนด้วยลายมือสองแบบ"],
      ["Bij het ene gedicht stond 'Dit ben jij', en daaronder, in het andere handschrift: 'Nee, dit zijn wij.'","Next to one poem it said 'This is you', and below it, in the other handwriting: 'No, this is us.'","ข้างบทกวีบทหนึ่งเขียนว่า ‘นี่คือเธอ’ และข้างใต้ด้วยลายมืออีกแบบว่า ‘ไม่ใช่ นี่คือเรา’"],
      ["Eva las het hele boek die avond. Ze kon niet ophouden.","Eva read the whole book that evening. She couldn't stop.","คืนนั้นเอฟาอ่านจนจบทั้งเล่ม เธอหยุดไม่ได้เลย"]],
     "* * *",
     [["Op de laatste bladzijde vond ze een adres in Amersfoort en een datum: 1974.","On the last page she found an address in Amersfoort and a date: 1974.","ในหน้าสุดท้าย เธอพบที่อยู่แห่งหนึ่งในอาเมอร์สฟอร์ตและปี 1974"],
      ["Het was een gek idee, wist ze, maar op zondag stapte ze toch op de trein.","It was a crazy idea, she knew, but on Sunday she got on the train anyway.","เธอรู้ว่ามันเป็นความคิดที่บ้า แต่วันอาทิตย์เธอก็ขึ้นรถไฟไปอยู่ดี"],
      ["Het adres bleek een klein huis met een rommelige voortuin te zijn.","The address turned out to be a small house with a messy front garden.","ที่อยู่นั้นกลายเป็นบ้านหลังเล็กที่มีสวนหน้าบ้านรกๆ"],
      ["De deur werd geopend door een man van haar eigen leeftijd, met verf op zijn handen.","The door was opened by a man of her own age, with paint on his hands.","คนที่เปิดประตูเป็นผู้ชายอายุราวเดียวกับเธอ มือเปื้อนสี"]],
     [["'Ik zoek iemand die Jan heet,' zei Eva, en ze voelde zich meteen belachelijk.","'I'm looking for someone called Jan,' said Eva, and she immediately felt ridiculous.","‘ฉันกำลังตามหาคนชื่อยานค่ะ’ เอฟาพูด แล้วก็รู้สึกเขินทันที"],
      ["De man keek naar het boek in haar handen en werd stil.","The man looked at the book in her hands and fell silent.","ผู้ชายคนนั้นมองหนังสือในมือเธอ แล้วก็นิ่งไป"],
      ["'Dat was van mijn grootouders,' zei hij zacht. 'Jan en Marieke. Mijn opa is vorig jaar overleden, en mijn tante heeft al zijn boeken weggegeven. Dit was het enige dat ik terug wilde.'","'That belonged to my grandparents,' he said softly. 'Jan and Marieke. My grandpa died last year, and my aunt gave away all his books. This was the only one I wanted back.'","‘นั่นเป็นของปู่กับย่าผม’ เขาพูดเบาๆ ‘ยานกับมาไรเกอ ปู่ผมเสียไปเมื่อปีที่แล้ว และป้าผมก็เอาหนังสือทั้งหมดของปู่ไปให้คนอื่น นี่เป็นเล่มเดียวที่ผมอยากได้คืน’"]],
     "* * *",
     [["Hij heette Daan. Hij zette koffie, en ze bladerden samen door het boek.","His name was Daan. He made coffee, and they leafed through the book together.","เขาชื่อดาน เขาชงกาแฟ แล้วทั้งคู่ก็พลิกดูหนังสือด้วยกัน"],
      ["Bij elk briefje in de marge vertelde hij een verhaal over zijn grootouders.","For every note in the margin he told a story about his grandparents.","ทุกโน้ตตรงขอบหน้า เขาจะเล่าเรื่องปู่ย่าของเขาให้ฟัง"],
      ["Toen Eva weg moest, gaf ze hem het boek terug.","When Eva had to leave, she gave him the book back.","เมื่อเอฟาต้องกลับ เธอคืนหนังสือให้เขา"],
      ["Een week later lag er een pakketje in haar brievenbus: dezelfde dichtbundel, nieuw, met op de eerste bladzijde: 'Voor Eva, die op tijd kwam. – D.'","A week later there was a small parcel in her letterbox: the same poetry collection, new, with on the first page: 'For Eva, who came on time. – D.'","หนึ่งสัปดาห์ต่อมา มีพัสดุเล็กๆ อยู่ในตู้จดหมายของเธอ เป็นรวมบทกวีเล่มเดียวกัน เล่มใหม่ หน้าแรกเขียนว่า ‘ถึงเอฟา ผู้มาทันเวลา – D.’"]]],
  v:{"rommelmarkt":"B1|n|flea market|ตลาดนัดของเก่า","dichtbundel":"B2|n|poetry collection|รวมบทกวี","gescheurde":"B1|adj|torn|ขาด|gescheurd","kaft":"B2|n|book cover|ปกหนังสือ","pas":"B1|adv|only (then)|เพิ่งจะ","bladzijde":"A2|n|page|หน้า","sierlijk":"C1|adj|elegant, graceful|งดงาม","handschrift":"B1|n|handwriting|ลายมือ","op tijd":"A2|expr|on time|ตรงเวลา","marge":"B2|n|margin|ขอบหน้า","aantekeningen":"B1|n|notes|บันทึก|aantekening","daaronder":"B1|adv|below it|ข้างใต้นั้น","ophouden":"B1|v|to stop|หยุด","adres":"A1|n|address|ที่อยู่","gek":"A2|adj|crazy|บ้า","stapte op":"A2|v|got on|ขึ้น (รถ)|opstappen","bleek":"B1|v|turned out|ปรากฏว่า|blijken","rommelige":"B1|adj|messy|รก|rommelig","voortuin":"A2|n|front garden|สวนหน้าบ้าน","verf":"A2|n|paint|สี","leeftijd":"A2|n|age|อายุ","belachelijk":"B1|adj|ridiculous|น่าขัน","werd stil":"A2|expr|fell silent|เงียบไป","grootouders":"A2|n|grandparents|ปู่ย่าตายาย","overleden":"B1|v|died, passed away|เสียชีวิต|overlijden","tante":"A1|n|aunt|ป้า, น้า","weggegeven":"B1|v|given away|ยกให้|weggeven","bladerden":"B2|v|leafed through|พลิกดู|bladeren","briefje":"A2|n|note|โน้ต","pakketje":"A2|n|small parcel|พัสดุเล็ก","brievenbus":"A2|n|letterbox|ตู้จดหมาย"}}

{ id:"nl-n10", genre:"comedy", lvl:"B2", title:["De verjaardagskring","The birthday circle","วงนั่งวันเกิด"], blurb:"หนุ่มอังกฤษไปงานวันเกิดแบบดัตช์ครั้งแรก และพบว่าการนั่งเป็นวงกลมมีกฎที่ไม่มีใครบอก",
  p:[[["Toen Oliver uit Manchester voor het eerst werd uitgenodigd voor de verjaardag van de oom van zijn vriendin, verwachtte hij een feest.","When Oliver from Manchester was invited for the first time to the birthday of his girlfriend's uncle, he expected a party.","ตอนที่โอลิเวอร์จากแมนเชสเตอร์ได้รับเชิญไปงานวันเกิดของลุงแฟนสาวเป็นครั้งแรก เขาคาดว่าจะเป็นปาร์ตี้"],
      ["Wat hij aantrof, was een woonkamer met negentien stoelen, opgesteld in een perfecte cirkel.","What he found was a living room with nineteen chairs, arranged in a perfect circle.","สิ่งที่เขาพบคือห้องนั่งเล่นที่มีเก้าอี้สิบเก้าตัวจัดเป็นวงกลมเป๊ะ"],
      ["Op zeventien ervan zat al iemand, met een kop koffie op schoot en een gezicht alsof men op de uitslag van een examen wachtte.","On seventeen of them someone was already sitting, with a cup of coffee on their lap and a face as if waiting for the result of an exam.","สิบเจ็ดตัวมีคนนั่งแล้ว แต่ละคนถือถ้วยกาแฟไว้บนตัก ด้วยสีหน้าเหมือนรอผลสอบ"]],
     [["'Je moet iedereen feliciteren,' fluisterde Sanne.","'You have to congratulate everyone,' whispered Sanne.","‘เธอต้องแสดงความยินดีกับทุกคนนะ’ ซานเนอกระซิบ"],
      ["'Iedereen? Ze zijn toch niet allemaal jarig?'","'Everyone? Surely they don't all have a birthday?'","‘ทุกคนเลยเหรอ? ไม่ได้เกิดวันนี้กันทุกคนสักหน่อย’"],
      ["'Nee. Je zegt: gefeliciteerd met je oom, gefeliciteerd met je broer, gefeliciteerd met je buurman. En je geeft iedereen een hand.'","'No. You say: congratulations on your uncle, congratulations on your brother, congratulations on your neighbour. And you shake everyone's hand.'","‘ไม่ใช่ เธอพูดว่า ยินดีด้วยกับวันเกิดของลุงนะ ยินดีด้วยกับวันเกิดของพี่ชายนะ ยินดีด้วยกับวันเกิดของเพื่อนบ้านนะ แล้วก็จับมือทุกคน’"]],
     [["Oliver begon dapper aan de ronde.","Oliver bravely began the round.","โอลิเวอร์เริ่มเดินวนอย่างกล้าหาญ"],
      ["Bij persoon vier was hij de tel kwijt, bij persoon negen feliciteerde hij per ongeluk de jarige zelf met diens eigen neef, en bij persoon dertien gaf hij een tante drie zoenen, terwijl zij na de tweede al was gestopt.","By person four he had lost count, by person nine he accidentally congratulated the birthday boy himself on his own nephew, and by person thirteen he gave an aunt three kisses, whereas she had already stopped after the second.","ถึงคนที่สี่เขาก็นับไม่ถูกแล้ว ถึงคนที่เก้าเขาเผลอแสดงความยินดีกับเจ้าของวันเกิดเองเรื่องหลานชายของเขา และพอถึงคนที่สิบสาม เขาก็หอมแก้มคุณป้าสามที ทั้งที่เธอหยุดไปตั้งแต่ทีที่สองแล้ว"],
      ["De derde zoen belandde ergens in de buurt van haar oor. Niemand zei er iets van. Dat was erger.","The third kiss landed somewhere near her ear. Nobody said anything about it. That was worse.","ทีที่สามไปตกอยู่แถวๆ หูของเธอ ไม่มีใครพูดอะไรเลย ซึ่งแย่กว่าเดิม"]],
     "* * *",
     [["Toen hij eindelijk zat, op stoel achttien, kwam er een schaal met kaasblokjes en worst langs, elk blokje voorzien van een vlaggetje.","When he finally sat down, on chair eighteen, a dish of cheese cubes and sausage came round, each cube provided with a little flag.","เมื่อเขาได้นั่งลงในที่สุด บนเก้าอี้ตัวที่สิบแปด ก็มีจานชีสหั่นเต๋ากับไส้กรอกเวียนมา แต่ละชิ้นปักธงเล็กๆ"],
      ["Oliver nam er, uit beleefdheid, vijf.","Oliver took five, out of politeness.","โอลิเวอร์หยิบไปห้าชิ้น ด้วยความเกรงใจ"],
      ["Tegenover hem trok een neef een wenkbrauw op, zo subtiel dat het bijna een geologisch proces leek.","Opposite him a cousin raised an eyebrow, so subtly that it almost seemed like a geological process.","ลูกพี่ลูกน้องคนหนึ่งที่นั่งตรงข้ามยักคิ้วขึ้น ช้าและแนบเนียนจนเกือบเหมือนกระบวนการทางธรณีวิทยา"],
      ["'Eén,' fluisterde Sanne zonder haar lippen te bewegen. 'Je neemt er één. Daarna wacht je op de volgende ronde.'","'One,' whispered Sanne without moving her lips. 'You take one. Then you wait for the next round.'","‘หนึ่งชิ้น’ ซานเนอกระซิบโดยไม่ขยับปาก ‘หยิบแค่ชิ้นเดียว แล้วรอรอบต่อไป’"]],
     [["Het gesprek ging vervolgens drie kwartier over de beste route van Zwolle naar Apeldoorn, de hoogte van de hypotheekrente en de vraag of het dit jaar een natte zomer was geweest.","The conversation then went on for three quarters of an hour about the best route from Zwolle to Apeldoorn, the level of mortgage interest rates and the question of whether it had been a wet summer this year.","จากนั้นบทสนทนาก็ยาวสี่สิบห้านาที ว่าด้วยเส้นทางที่ดีที่สุดจากซโวลเลอไปอาเพลโดร์น อัตราดอกเบี้ยเงินกู้บ้าน และคำถามว่าปีนี้หน้าร้อนฝนชุกหรือไม่"],
      ["Oliver, die niets van routes, rente of Nederlandse zomers wist, besloot iets bij te dragen.","Oliver, who knew nothing about routes, interest or Dutch summers, decided to contribute something.","โอลิเวอร์ซึ่งไม่รู้อะไรเลยเกี่ยวกับเส้นทาง ดอกเบี้ย หรือหน้าร้อนของเนเธอร์แลนด์ ตัดสินใจร่วมวงคุยบ้าง"],
      ["'In Engeland,' zei hij, 'regent het eigenlijk minder dan hier.'","'In England,' he said, 'it actually rains less than here.'","‘ที่อังกฤษ’ เขาพูด ‘จริงๆ แล้วฝนตกน้อยกว่าที่นี่นะ’"],
      ["Negentien hoofden draaiden zich naar hem toe. Hij was, zo bleek later, de eerste in de familiegeschiedenis die een discussie over het weer had gewonnen.","Nineteen heads turned towards him. He was, as it later turned out, the first in the family's history to have won a discussion about the weather.","สิบเก้าหัวหันมามองเขา ภายหลังจึงรู้ว่าเขาเป็นคนแรกในประวัติศาสตร์ของครอบครัวที่เถียงเรื่องอากาศชนะ"]],
     "* * *",
     [["Bij het afscheid gaf de oom hem een stevige hand.","On leaving, the uncle gave him a firm handshake.","ตอนลากลับ คุณลุงจับมือเขาแน่น"],
      ["'Je bent welkom,' zei hij. 'Volgend jaar mag je op stoel vijf.'","'You're welcome here,' he said. 'Next year you may sit on chair five.'","‘มาได้เสมอนะ’ เขาพูด ‘ปีหน้าเธอได้นั่งเก้าอี้ตัวที่ห้า’"],
      ["In de auto vroeg Oliver wat dat betekende.","In the car Oliver asked what that meant.","ในรถ โอลิเวอร์ถามว่านั่นหมายความว่าอะไร"],
      ["Sanne keek hem lang aan. 'Dat,' zei ze, 'is het mooiste wat mijn oom ooit tegen iemand heeft gezegd.'","Sanne looked at him for a long time. 'That,' she said, 'is the nicest thing my uncle has ever said to anyone.'","ซานเนอมองหน้าเขานาน ‘นั่น’ เธอพูด ‘คือคำพูดที่ดีที่สุดที่ลุงฉันเคยพูดกับใครมา’"]]],

{ id:"nl-n11", genre:"mystery", lvl:"C1", title:["Het ontbrekende vak","The missing square","ช่องที่หายไป"], blurb:"ภาพเขียนในพิพิธภัณฑ์เดลฟต์ถูกเปลี่ยนเป็นของปลอม แต่ไม่มีใครขโมยอะไรไป",
  p:[[["Conservator Ingrid Wolters had het schilderij duizenden keren gezien, en daarom zag ze het meteen.","Conservator Ingrid Wolters had seen the painting thousands of times, and that's why she saw it immediately.","อิงกริด โวลเทอร์ส ผู้อนุรักษ์ภาพ เคยเห็นภาพนี้มาแล้วนับพันครั้ง เธอจึงสังเกตเห็นทันที"],
      ["Het binnenhuis van een onbekende Delftse meester, rond 1660: een vrouw bij een raam, een kaart aan de wand, een tegelvloer met zwarte en witte vakken.","The interior by an unknown Delft master, around 1660: a woman by a window, a map on the wall, a tiled floor with black and white squares.","ภาพภายในบ้านโดยปรมาจารย์นิรนามแห่งเดลฟต์ ราวปี 1660 มีผู้หญิงยืนริมหน้าต่าง แผนที่บนผนัง และพื้นกระเบื้องลายตารางขาวดำ"],
      ["Op de vloer, links van de stoel, telde ze nu zeven witte vakken op een rij.","On the floor, to the left of the chair, she now counted seven white squares in a row.","บนพื้นทางซ้ายของเก้าอี้ ตอนนี้เธอนับได้ช่องสีขาวเจ็ดช่องติดกัน"],
      ["Het waren er altijd zes geweest.","There had always been six.","แต่เดิมมีแค่หกช่องมาตลอด"]],
     [["De beveiligingsbeelden toonden niets ongewoons. Het alarm was niet afgegaan, de lijst was onaangeroerd, het vernis vertoonde de juiste craquelé.","The security footage showed nothing unusual. The alarm hadn't gone off, the frame was untouched, the varnish showed the right craquelure.","ภาพจากกล้องวงจรปิดไม่มีอะไรผิดปกติ สัญญาณกันขโมยไม่ดัง กรอบรูปไม่ถูกแตะต้อง และวานิชก็มีรอยแตกลายงาตามที่ควรเป็น"],
      ["Volgens de directeur was er dus niets aan de hand: Ingrid was overwerkt, of had zich zes jaar lang vergist.","According to the director, then, nothing was wrong: Ingrid was overworked, or had been mistaken for six years.","ผู้อำนวยการจึงเห็นว่าไม่มีอะไรผิดปกติ อิงกริดคงทำงานหนักเกินไป หรือไม่ก็เข้าใจผิดมาหกปี"],
      ["Maar Ingrid vergiste zich niet. Ze had haar eigen foto's, met tijdstempel, van elke restauratiefase.","But Ingrid wasn't mistaken. She had her own photos, time-stamped, of every restoration phase.","แต่อิงกริดไม่ได้เข้าใจผิด เธอมีรูปถ่ายของตัวเองพร้อมเวลาบันทึกในทุกขั้นตอนของการบูรณะ"]],
     "* * *",
     [["Ze nam een monster van de witte verf, zo klein dat het met het blote oog onzichtbaar was.","She took a sample of the white paint, so small that it was invisible to the naked eye.","เธอเก็บตัวอย่างสีขาว ซึ่งเล็กจนมองด้วยตาเปล่าไม่เห็น"],
      ["Het laboratorium bevestigde wat ze vreesde: in het zevende vak zat titaniumwit, een pigment dat pas in de twintigste eeuw in de handel kwam.","The laboratory confirmed what she feared: the seventh square contained titanium white, a pigment that only came onto the market in the twentieth century.","ห้องแล็บยืนยันสิ่งที่เธอกลัว ในช่องที่เจ็ดมีสีขาวไทเทเนียม ซึ่งเป็นสีที่เพิ่งวางขายในศตวรรษที่ยี่สิบ"],
      ["De rest van het doek bevatte loodwit, zoals het hoorde.","The rest of the canvas contained lead white, as it should.","ส่วนที่เหลือของผืนผ้าใบเป็นสีขาวตะกั่วตามที่ควรจะเป็น"],
      ["Iemand had het origineel dus niet gestolen, maar er één klein vak aan toegevoegd. Waarom?","So someone hadn't stolen the original, but had added one small square to it. Why?","ดังนั้นไม่มีใครขโมยภาพต้นฉบับไป แต่มีคนเพิ่มช่องเล็กๆ ลงไปหนึ่งช่อง ทำไมกัน?"]],
     [["Onder infraroodlicht kwam het antwoord tevoorschijn.","Under infrared light the answer emerged.","ภายใต้แสงอินฟราเรด คำตอบก็ปรากฏขึ้น"],
      ["Onder het nieuwe vak was een minuscule ondertekening zichtbaar: een monogram, en een getal.","Beneath the new square a minuscule underdrawing was visible: a monogram, and a number.","ใต้ช่องใหม่นั้นมีภาพร่างเล็กจิ๋วปรากฏให้เห็น เป็นอักษรย่อและตัวเลข"],
      ["Het monogram was dat van Hendrik Wolters, restaurateur aan ditzelfde museum tot 1979. Haar grootvader.","The monogram was that of Hendrik Wolters, restorer at this very museum until 1979. Her grandfather.","อักษรย่อนั้นเป็นของเฮนดริก โวลเทอร์ส ผู้บูรณะภาพของพิพิธภัณฑ์แห่งนี้จนถึงปี 1979 ปู่ของเธอเอง"]],
     "* * *",
     [["In het museumarchief vond ze het restauratieverslag van 1978, door haar grootvader zelf geschreven.","In the museum archive she found the restoration report of 1978, written by her grandfather himself.","ในหอจดหมายเหตุของพิพิธภัณฑ์ เธอพบรายงานการบูรณะปี 1978 ที่ปู่ของเธอเขียนเอง"],
      ["Het getal onder de verf bleek een inventarisnummer: dat van een tweede schilderij, dat volgens de administratie in 1944 'verloren was gegaan'.","The number under the paint turned out to be an inventory number: that of a second painting which, according to the records, had been 'lost' in 1944.","ตัวเลขใต้สีปรากฏว่าเป็นหมายเลขทะเบียนของภาพอีกภาพหนึ่ง ซึ่งตามบันทึกระบุว่า ‘สูญหาย’ ไปในปี 1944"],
      ["Grootvader Hendrik had geweten waar het was. Hij had het niet aan een papier durven toevertrouwen, en daarom had hij het verborgen op de enige plek waar alleen een Wolters het ooit zou zoeken.","Grandfather Hendrik had known where it was. He hadn't dared to entrust it to paper, and so he had hidden it in the only place where only a Wolters would ever look for it.","ปู่เฮนดริกรู้ว่ามันอยู่ที่ไหน เขาไม่กล้าเขียนไว้บนกระดาษ จึงซ่อนมันไว้ในที่เดียวที่มีแค่คนตระกูลโวลเทอร์สเท่านั้นที่จะค้นหา"],
      ["Maar iemand had het zevende vak recent opnieuw geschilderd. Iemand anders wist het dus ook.","But someone had recently repainted the seventh square. So someone else knew too.","แต่มีคนทาสีช่องที่เจ็ดใหม่เมื่อไม่นานมานี้ แปลว่ามีอีกคนที่รู้เรื่องนี้เช่นกัน"]],
     [["Ingrid keek naar de bezoekerslijst van de afgelopen maand en stopte bij één naam.","Ingrid looked at the visitors' list for the past month and stopped at one name.","อิงกริดดูรายชื่อผู้เข้าชมของเดือนที่ผ่านมา และหยุดที่ชื่อหนึ่ง"],
      ["E. Wolters. Haar vader. Die volgens iedereen al vijfentwintig jaar in Canada woonde, en die ze nooit had gekend.","E. Wolters. Her father. Who, according to everyone, had been living in Canada for twenty-five years, and whom she had never known.","อี. โวลเทอร์ส พ่อของเธอ คนที่ใครๆ ก็บอกว่าอยู่แคนาดามายี่สิบห้าปีแล้ว และเป็นคนที่เธอไม่เคยรู้จักเลย"]]],

นทึกทางการ","verloren was gegaan":"B2|expr|had been lost|สูญหาย|verloren gaan","durven":"B1|v|to dare|กล้า","toevertrouwen":"C1|v|to entrust|ฝากไว้","verborgen":"B2|v|hidden|ซ่อน|verbergen","bezoekerslijst":"B2|n|visitors' list|รายชื่อผู้เข้าชม","gekend":"B1|v|known|รู้จัก|kennen"}},

{ id:"nl-n12", genre:"fantasy", lvl:"C1", title:["De stad die zichzelf droogpompte","The city that pumped itself dry","เมืองที่สูบตัวเองจนแห้ง"], blurb:"ในเมืองที่กังหันลมทุกตัวมีวิญญาณ เด็กฝึกงานคนหนึ่งได้ยินกังหันตัวเก่าที่สุดขอให้หยุดหมุน",
  p:[[["In Ooievaarsdam had elke molen een stem, en elke stem een naam.","In Ooievaarsdam every windmill had a voice, and every voice a name.","ในเมืองโอยวาร์สดัม กังหันลมทุกตัวมีเสียง และทุกเสียงมีชื่อ"],
      ["De molenaars noemden het het Gezang: een onophoudelijk, laag gebrom dat je pas hoorde als het ophield.","The millers called it the Chant: an incessant, low hum that you only heard when it stopped.","คนดูแลกังหันเรียกมันว่า ‘บทสวด’ เสียงหึ่งต่ำๆ ไม่หยุดหย่อน ที่คนจะได้ยินก็ต่อเมื่อมันเงียบไปแล้ว"],
      ["Zolang de molens zongen, bleef het water buiten de dijken en bleef de stad droog.","As long as the mills sang, the water stayed outside the dikes and the city stayed dry.","ตราบใดที่กังหันยังร้องเพลง น้ำก็จะอยู่นอกเขื่อน และเมืองก็ยังแห้ง"],
      ["Dat was de afspraak, al zo lang dat niemand zich herinnerde met wie die was gemaakt.","That was the agreement, for so long already that nobody remembered with whom it had been made.","นั่นคือข้อตกลง ที่มีมานานจนไม่มีใครจำได้แล้วว่าทำไว้กับใคร"]],
     [["Wietske was vijftien en sinds een half jaar leerling-molenaar bij De Oude Aagje, de oudste molen van de stad.","Wietske was fifteen and for half a year had been an apprentice miller at Old Aagje, the oldest mill in the city.","วีตสเกออายุสิบห้า และเป็นเด็กฝึกงานดูแลกังหันมาครึ่งปีที่กังหัน ‘ยายอาคเยอ’ กังหันที่เก่าแก่ที่สุดของเมือง"],
      ["Op een windstille nacht, terwijl de wieken toch draaiden, hoorde ze voor het eerst woorden in het Gezang.","On a windless night, while the sails turned nonetheless, she heard words in the Chant for the first time.","ในคืนที่ไร้ลม ทั้งที่ใบพัดยังหมุนอยู่ เธอได้ยินคำพูดในบทสวดเป็นครั้งแรก"],
      ["'Laat me rusten,' zei Aagje. 'Driehonderd jaar heb ik gepompt. Kijk eens wat jullie ervan hebben gemaakt.'","'Let me rest,' said Aagje. 'Three hundred years I have pumped. Just look what you have made of it.'","‘ปล่อยให้ข้าได้พัก’ อาคเยอพูด ‘ข้าสูบน้ำมาสามร้อยปี ดูสิว่าพวกเจ้าทำอะไรกับมันบ้าง’"]],
     "* * *",
     [["Wietske keek, voor het eerst echt, naar de stad.","Wietske looked, for the first time really, at the city.","วีตสเกอมองดูเมืองอย่างแท้จริงเป็นครั้งแรก"],
      ["Elke eeuw hadden de molens het land iets droger gemaakt, en elke eeuw was het land daardoor iets verder gezakt.","Every century the mills had made the land a little drier, and every century the land had sunk a little further because of it.","ทุกศตวรรษ กังหันทำให้พื้นดินแห้งขึ้นอีกนิด และทุกศตวรรษพื้นดินก็ทรุดลงอีกนิดเพราะเหตุนั้น"],
      ["De straten lagen inmiddels zes meter onder de zee, die achter de dijken als een geduldige schuldeiser wachtte.","The streets now lay six metres below the sea, which waited behind the dikes like a patient creditor.","ตอนนี้ถนนอยู่ต่ำกว่าระดับน้ำทะเลหกเมตร และทะเลก็รออยู่หลังเขื่อนเหมือนเจ้าหนี้ที่อดทน"],
      ["Hoe harder de molens zongen, hoe dieper de stad zonk. Ze pompten haar niet droog; ze pompten haar weg.","The harder the mills sang, the deeper the city sank. They weren't pumping it dry; they were pumping it away.","ยิ่งกังหันร้องดังเท่าไร เมืองก็ยิ่งจมลึกลงเท่านั้น พวกมันไม่ได้สูบเมืองให้แห้ง แต่กำลังสูบเมืองให้หายไป"]],
     [["Toen ze het de gilde van molenaars vertelde, werd ze uitgelachen en vervolgens geschorst.","When she told the millers' guild, she was laughed at and then suspended.","เมื่อเธอเล่าเรื่องนี้ให้สมาคมคนดูแลกังหันฟัง เธอถูกหัวเราะเยาะ แล้วก็ถูกพักงาน"],
      ["'Molens die willen stoppen,' snoof de gildemeester. 'Straks wil de zee ook nog met ons onderhandelen.'","'Mills that want to stop,' sniffed the guildmaster. 'Next the sea will want to negotiate with us too.'","‘กังหันที่อยากหยุดหมุนงั้นเหรอ’ หัวหน้าสมาคมแค่นเสียง ‘เดี๋ยวทะเลก็คงอยากมาต่อรองกับเราด้วยล่ะสิ’"],
      ["Wietske dacht daar lang over na. Want misschien, besefte ze, was dat precies wat er moest gebeuren.","Wietske thought about that for a long time. Because perhaps, she realised, that was exactly what had to happen.","วีตสเกอครุ่นคิดเรื่องนั้นอยู่นาน เพราะเธอเพิ่งตระหนักว่า บางทีนั่นอาจเป็นสิ่งที่ต้องเกิดขึ้นพอดี"]],
     "* * *",
     [["In de nacht van de grote springvloed klom ze over de buitendijk en liep het wad op, tot het water haar knieën raakte.","On the night of the great spring flood she climbed over the outer dike and walked onto the mudflats, until the water touched her knees.","ในคืนน้ำเกิดครั้งใหญ่ เธอปีนข้ามเขื่อนชั้นนอกและเดินลงไปบนหาดเลน จนน้ำสูงถึงเข่า"],
      ["'Ik kom niet om een nieuwe afspraak,' zei ze tegen de duisternis, 'maar om de oude te begrijpen.'","'I don't come for a new agreement,' she said to the darkness, 'but to understand the old one.'","‘ข้าไม่ได้มาเพื่อทำข้อตกลงใหม่’ เธอพูดกับความมืด ‘แต่มาเพื่อเข้าใจข้อตกลงเดิม’"],
      ["De zee antwoordde niet in woorden, maar in een beeld: een land dat niet tegen het water vocht, maar ermee ademde, dat ruimte gaf waar het kon en vasthield waar het moest.","The sea didn't answer in words, but in an image: a land that didn't fight the water, but breathed with it, that gave room where it could and held fast where it had to.","ทะเลไม่ได้ตอบเป็นคำพูด แต่ตอบเป็นภาพ ภาพของแผ่นดินที่ไม่ได้ต่อสู้กับน้ำ แต่หายใจไปพร้อมกับมัน ให้พื้นที่ในที่ที่ให้ได้ และยึดมั่นในที่ที่จำเป็น"]],
     [["Het duurde twintig jaar voordat de gilde haar geloofde, en nog eens dertig voordat de eerste polder werd teruggegeven aan het getij.","It took twenty years before the guild believed her, and another thirty before the first polder was given back to the tide.","ต้องใช้เวลายี่สิบปีกว่าสมาคมจะเชื่อเธอ และอีกสามสิบปีกว่าพอลเดอร์แห่งแรกจะถูกคืนให้กับน้ำขึ้นน้ำลง"],
      ["De Oude Aagje staat er nog. Haar wieken staan stil, in de stand die molenaars de rouw noemen, of, als je het Wietske vraagt, de rust.","Old Aagje still stands there. Her sails are still, in the position millers call mourning, or, if you ask Wietske, rest.","ยายอาคเยอยังตั้งอยู่ที่นั่น ใบพัดของนางหยุดนิ่งในท่าที่คนดูแลกังหันเรียกว่า ‘ไว้ทุกข์’ หรือถ้าถามวีตสเกอ ก็คือ ‘การพักผ่อน’"],
      ["En op stille nachten, zeggen de kinderen, kun je haar horen neuriën: niet om het water te verdrijven, maar om het welkom te heten.","And on quiet nights, the children say, you can hear her humming: not to drive the water away, but to welcome it.","และในคืนที่เงียบสงัด เด็กๆ บอกว่าจะได้ยินนางฮัมเพลง ไม่ใช่เพื่อขับไล่น้ำ แต่เพื่อต้อนรับมัน"]]],

/* ---------- 3.1 FEED ----------

   - its last line has been on screen, and

  mean: { fr: w => `Dans le texte, que signifie « ${w} » ?`, es: w => `En el texto, ¿qué significa «${w}»?`, nl: w => `Wat betekent ‘${w}’ in de tekst?` },
  not: { fr: 'Laquelle de ces phrases N’APPARAÎT PAS dans le texte ?', es: '¿Cuál de estas frases NO aparece en el texto?', nl: 'Welke zin staat NIET in de tekst?' }
};
const clip = (s, n = 150) => s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : s;
function autoQuiz(item) {
  const L = item.lang, qs = [], used = new Set();
  const sents = item.p.flat().map(sentText);
  const words = Object.keys(item.v || {}).map(w => ({ w, ...parseEntry(item.v[w]) })).sort((a, b) => rank(b.lvl) - rank(a.lvl));
  const pool = [...DICT[L].values()].filter(e => e.th && e.pos);
  const mk = (isEN() || st().trLang === 'en') ? 'en' : 'th';
  const distract = (e, key) => shuffle(pool.filter(d => d.pos === e.pos && (d.lemma || d.w) !== (e.lemma || e.w) && Math.abs(rank(d.lvl) - rank(e.lvl)) <= 1 && d[key] !== e[key])).slice(0, 3);
  // 1–3: fill in the blank
  for (const e of words) {
    if (qs.length >= 3) break;
    const hw = e.lemma || e.w; if (used.has(hw)) continue;
    const re = new RegExp('(^|[^\\p{L}])' + e.w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\p{L}])', 'u');
    const sent = sents.find(s => re.test(s) && s.length < 260); if (!sent) continue;
    const ds = distract(e, 'w'); if (ds.length < 3) continue;
    used.add(hw);
    qs.push({ t: 'vocab', raw: 1, q: [sent.replace(re, '$1_____'), QT.fill[L] + ' · เลือกคำที่เหมาะสมเติมในช่องว่าง'], en: QT.fill[L] + ' · Choose the word that fits the gap.', o: [e.w, ...ds.map(d => d.w)], a: 0,
      xen: `“${e.w}” = ${e.en || e.th} · the other options mean ${ds.map(d => d.w + ' = ' + (d.en || d.th)).join(', ')}`,
      x: `“${e.w}” = ${e.th}${e.en ? ' (' + e.en + ')' : ''} · ตัวเลือกอื่นแปลว่า ${ds.map(d => d.w + ' = ' + d.th).join(', ')}` });
  }
  // 4: meaning in context
  const me = words.find(e => !used.has(e.lemma || e.w));
  if (me) { const ds = distract(me, mk); if (ds.length >= 3) { used.add(me.lemma || me.w); const sent = sents.find(s => s.includes(me.w)) || '';
    qs.push({ t: 'vocab', raw: 1, q: [QT.mean[L](me.w), 'คำนี้ในบทความหมายถึงอะไร'], en: 'What does this word mean here?', o: [me[mk], ...ds.map(d => d[mk])], a: 0, xen: `${me.w} = ${me.en} · in the sentence: “${clip(sent, 180)}”`, x: `${me.w} = ${me.th} (${me.en}) · ในประโยค: “${clip(sent, 180)}”` }); } }
  // 5: which sentence is NOT in the text
  const foreign = shuffle([...DB[L].read, ...DB[L].novel].flatMap(a => (a.p || []).filter(Array.isArray).flat().map(sentText))).find(s => s.length > 50 && s.length < 200);
  const mine = shuffle(sents.filter(s => s.length > 50 && s.length < 220)).slice(0, 3);
  if (foreign && mine.length === 3) qs.push({ t: 'not', raw: 1, q: [QT.not[L], 'ประโยคใดไม่ได้อยู่ในบทความนี้'], en: 'Which sentence is NOT in this text?', xen: 'This sentence comes from another text in the app; the other three appear in this one. Try finding which paragraph they are in.', o: [clip(foreign), ...mine.map(s => clip(s))], a: 0, x: 'ประโยคนี้มาจากบทความอื่นในแอป ส่วนอีกสามข้อปรากฏในบทความนี้ ลองย้อนกลับไปหาดูว่าอยู่ย่อหน้าไหน' });
  return qs;
}
function buildWebItem(o) {
  const p = o.paras.map(t => splitSentences(t).map(s => [s, '', ''])).filter(x => x.length);
  const item = { id: o.id || ('web:' + hashStr(o.lang + '|' + o.title + '|' + (o.url || ''))), lang: o.lang, kind: 'web', src: o.src, url: o.url || '', cat: 'news', title: [o.title, '', ''], p, t: Date.now() };
  item.v = autoVocab(item); item.lvl = estimateLevel(item); item.q = autoQuiz(item);
  return item;
}

async function mtAll(btn, item) {

function onScroll() {

let dictQ = '', dictAll = false;
function dictSearch(q, lang) {
  q = q.trim().toLowerCase(); if (!q) return [];

  const qd = deacc(q);
  for (const l of langs) {
    const cands = new Set(candidates(l, q));
    for (const [k, e] of DICT[l]) {
      let sc = 0; const kd = deacc(k);
      if (k === q) sc = 100; else if (cands.has(k)) sc = 90; else if (kd === qd) sc = 85; else if (kd.startsWith(qd)) sc = 60 - Math.min(20, k.length - q.length);
      else if ((e.th || '').split(/[,،]\s*/).some(x => x.trim() === q)) sc = 70; else if ((e.th || '').includes(q)) sc = 50; else if ((' ' + (e.en || '').toLowerCase() + ' ').match(new RegExp('[^a-z]' + q.replace(/[^a-z ]/g, '') + '[^a-z]')) && /[a-z]/.test(q)) sc = 45;
      else if (q.length > 2 && kd.includes(qd)) sc = 25;
      if (sc) out.push({ l, e, sc });
    }

  return out.sort((a, b) => b.sc - a.sc || a.e.w.length - b.e.w.length).slice(0, 30);
}

  for (const it of items) { for (const s of allSentences(it)) { if (re.test(sentText(s))) { out.push({ s, it }); break; } } if (out.length >= 3) break; }

}

/* ---------- account & cross-device sync (Firebase Auth + Firestore) ----------
   Spliced into app.js at build time (shares its scope). Login is optional: without it the app stays fully local.
   One Firestore document per user (users/{uid}) holds the whole progress as JSON; devices merge field by field. */
const FB_CFG = window.TRIADA_FIREBASE && window.TRIADA_FIREBASE.apiKey ? window.TRIADA_FIREBASE : null;
const FB_VER = '10.12.2';
const CLIENT_ID = (() => { try { let c = localStorage.getItem('triada.client'); if (!c) { c = Math.random().toString(36).slice(2, 10); localStorage.setItem('triada.client', c); } return c; } catch (e) { return 'x' + Math.random().toString(36).slice(2, 8); } })();
const SYNC_KEYS = ['cards', 'read', 'quiz', 'likes', 'history', 'novelPos', 'web', 'deleted', 'settings', 'settingsAt'];
const sync = { fb: null, user: null, unsub: null, status: 'off', last: 0, err: '', pushT: null, applying: false, loading: null };

function stableJSON(o) { return JSON.stringify(o, (k, v) => v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((r, x) => (r[x] = v[x], r), {}) : v); }

    if (!firebase.apps.length) firebase.initializeApp(FB_CFG);

    sync.fb.auth.onAuthStateChanged(u => { sync.user = u; if (u) startSync(); else stopSync(); accountChanged(); });
    sync.fb.auth.getRedirectResult().catch(e => { sync.err = e.code || e.message; accountChanged(); });
    return sync.fb;

function userDoc() { return sync.fb.db.collection('users').doc(sync.user.uid); }
function cloudPayload() { const o = {}; for (const k of SYNC_KEYS) o[k] = S[k]; return o; }
function startSync() {

  sync.unsub = userDoc().onSnapshot(snap => {
    if (snap.metadata && snap.metadata.hasPendingWrites) return;
    const d = snap.exists ? snap.data() : null;
    let remote = null; try { remote = d && d.data ? JSON.parse(d.data) : null; } catch (e) { remote = null; }
    if (remote) sync.cloud = stableJSON(remote);
    if (remote && d.client !== CLIENT_ID) {
      const before = stableJSON(cloudPayload());
      Object.assign(S, mergeState(cloudPayload(), remote));
      lastSettingsJSON = JSON.stringify(S.settings);
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }

function stopSync() { if (sync.unsub) { sync.unsub(); sync.unsub = null; } clearTimeout(sync.pushT); sync.status = 'off'; }
